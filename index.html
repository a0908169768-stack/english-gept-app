ike to, should, can 等情態助動詞","語氣有禮貌","拼字與標點沒有明顯錯誤"]},{"title":"我的看法：手機使用","prompt":"有些人認為學生在學校不該使用手機。你同意嗎？請寫出你的看法，並給出兩個理由。（約 70 到 90 字）","model":"In my opinion, students should not use their phones during class. First, phones can make students lose focus, because they may check messages or play games instead of listening to the teacher. Second, using phones too much is bad for their eyes and their grades. However, I think students can use them during lunch breaks or in an emergency. In conclusion, schools should have clear rules for using phones.","list":["有清楚的立場句 (In my opinion ...)","至少兩個理由，用 First, Second 等連接","有使用 because / however 等連接詞","有簡短結論","句型有變化，不全是簡單句","拼字與標點沒有明顯錯誤","字數 70 到 90 字"]},{"title":"描述一次難忘的經驗","prompt":"請寫一段話，描述一次讓你印象深刻的旅行或活動。請包含：(1) 何時、去哪裡 (2) 發生了什麼事 (3) 你的感覺。（約 70 到 90 字，使用過去式）","model":"Last summer, I went to Hualien with my family. On the second day, we rode bikes along the coast. The sea was bright blue, and the wind was cool. Suddenly, it started to rain, so we ran into a small shop and had hot tea. The shop owner was very kind and gave us some cookies. Although we got wet, I felt very happy. It was one of the most wonderful trips I have ever taken.","list":["交代時間與地點","主要使用過去簡單式","有一件事情發生的經過","有表達自己的感受","使用連接詞 so, although, and 等","結尾有總結感想","拼字與標點沒有明顯錯誤"]}],"speaking":[{"type":"read","text":"Good morning, everyone. Welcome to our English club. Today we are going to learn how to introduce ourselves and ask questions politely.","tips":["注意 morning, welcome 的重音","introduce 重音在第三音節 (in-tro-DUCE)","politely 結尾 -ly 要清楚","句子中間的逗號與句號要有停頓"]},{"type":"read","text":"Since the typhoon is coming, all flights to Okinawa have been cancelled. Passengers can change their tickets at the service desk.","tips":["typhoon 重音在第二音節 (ty-PHOON)","flights 結尾的 ts 要發出","cancelled 結尾 /d/ 要輕輕發出","passengers 重音在第一音節"]},{"type":"read","text":"Recycling is one of the easiest ways to protect the environment. If we reduce waste and use less plastic, our planet will be cleaner and healthier.","tips":["recycling 重音在第二音節","environment 的 n 不要漏掉","plastic 重音在第一音節","if 子句後面要有短暫停頓"]},{"type":"read","text":"I have been learning English for three years. Although it is not easy, I enjoy talking with foreign friends and watching English movies.","tips":["have been 通常連讀輕唸","learning English 之間連音","Although 重音在第二音節","enjoy talking 之間停頓不要太長"]},{"type":"qa","q":"What do you usually do after work or school?","model":"After school, I usually go home and have dinner with my family. Then I do my homework or review my lessons. On some days, I go to the gym to exercise. I like to relax by watching videos before I go to bed.","tips":["先直接回答問題","再補上 1 到 2 個細節","使用 usually, then 等連接詞","說話速度不要太快，自然停頓"]},{"type":"qa","q":"Which do you prefer, living in the city or living in the countryside? Why?","model":"I prefer living in the city because it is more convenient. There are many shops, restaurants and public transportation nearby. However, the countryside is quieter and has fresh air, so I like to visit it on weekends.","tips":["I prefer ... because ... 表達偏好與理由","使用 however 表示對比","比較級 more convenient, quieter","理由要具體"]},{"type":"qa","q":"Tell me about a person who has influenced you.","model":"My mother has influenced me a lot. She works very hard, but she is always kind to others. When I have problems, she listens to me patiently and gives me useful advice. Because of her, I have learned to be responsible and to never give up.","tips":["現在完成式 has influenced","用形容詞描述個性","舉出具體行為","用 because of 總結"]},{"type":"qa","q":"If you could travel anywhere in the world, where would you go?","model":"If I could travel anywhere, I would go to Iceland. I have always wanted to see the northern lights. I would also visit the hot springs and take a lot of photos. I think it would be an unforgettable experience.","tips":["第二條件句：If I could, I would","說明想做的兩三件事","使用 I would also 補充","結尾說明感受"]},{"type":"qa","q":"How do you deal with stress?","model":"When I feel stressed, I try to take a short walk outside. Listening to music also helps me calm down. If the stress is too big, I talk to a friend or my family. Sharing my feelings usually makes me feel better.","tips":["When I ... 引出習慣","列舉 2 到 3 種方法","動名詞當主詞 Listening to music","結尾說明效果"]}]};

const KEY = "geptMidV2", OLDKEY = "geptMidV1";

function blank(){return {days:[],cards:{},quiz:{},gram:{},sec:{},tot:{c:0,t:0},wrong:[],prod:{},drafts:{},exams:[],goal:20,daily:{date:"",n:0,bonus:0}};}
function load(){

    const r=localStorage.getItem(KEY); if(r){return Object.assign(blank(),JSON.parse(r));}
    const o=localStorage.getItem(OLDKEY); // 舊版 (單字編號已改變): 保留成績與文法紀錄, 單字卡進度重新開始
    if(o){const x=JSON.parse(o); const n=Object.assign(blank(),x); n.cards={}; n.wrong=(x.wrong||[]).filter(q=>!/^(ez|ze|li|cl):/.test(q.id)); return n;}
  }catch(e){ if(memStore) return memStore; }
  return blank();
}
let S = load();
function save(){ memStore=S; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function touch(){const t=ymd(new Date()); if(S.days.indexOf(t)<0){S.days.push(t);} save();}
function streak(){
  const set=new Set(S.days); let d=new Date(), n=0;
  if(!set.has(ymd(d))) d.setDate(d.getDate()-1);
  while(set.has(ymd(d))){n++; d.setDate(d.getDate()-1);}
  return n;
}
const DAY=86400000, GAPS=[0,1,3,7,14,30];
function card(id){const c=S.cards[id]; return c?{b:c[0],d:c[1]*60000}:{b:0,d:0};} // 儲存格式 [階段, 到期分鐘]，節省空間
function setCard(id,b,d){S.cards[id]=[b,Math.round(d/60000)];}
function isNew(id){return !S.cards[id];}

function isDue(id){return card(id).d<=Date.now();}

/* ============================ 工具 ============================ */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function nl2p(t){return t.split(/\n\s*\n|\n/).filter(Boolean).map(x=>"<p>"+esc(x)+"</p>").join("");}

/* ============================ 語音 ============================ */
const hasSpeech = typeof window!=="undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";
let vF=null, vM=null, vDefault=null;
function pickVoices(){
  if(!hasSpeech) return;
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^en[-_]US$/i.test(v.lang));
  const all=vs.length?vs:(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang));
  vDefault = all.find(v=>/female|samantha|google us|aria|jenny|zira/i.test(v.name)) || all[0] || null;
  vF = all.find(v=>/female|samantha|aria|jenny|zira|karen|victoria/i.test(v.name)) || vDefault;
  vM = all.find(v=>v!==vF && /(^|\W)male|david|mark|guy|alex|daniel|fred|tom|james/i.test(v.name)) || all.find(v=>v!==vF) || null;
}
if(hasSpeech){pickVoices(); try{speechSynthesis.addEventListener("voiceschanged",pickVoices);}catch(e){}}
function stopSpeech(){ audioGen++; if(hasSpeech){try{speechSynthesis.cancel();}catch(e){}} }
function speak(text){
  if(!hasSpeech){toast("這個瀏覽器不支援語音播放");return;}
  try{
    stopSpeech();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=0.85; u.pitch=1;
    if(vDefault) u.voice=vDefault;
    speechSynthesis.speak(u);
  }catch(e){toast("語音播放失敗");}
}
let audioGen=0, audioTimer=null;
function splitSeg(t){ const m=t.match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g); return (m||[t]).map(s=>s.trim()).filter(Boolean); }
// lines: [[說話者(A女/B男/N旁白), 文字], ...]。播放結束時呼叫 done(true)；不支援語音時 done(false)
function playLines(lines,done){
  if(!hasSpeech){ if(done) done(false); return; }
  stopSpeech(); const gen=audioGen; clearTimeout(audioTimer);
  const utts=[]; lines.forEach(l=>splitSeg(l[1]).forEach(seg=>utts.push([l[0],seg])));
  let words=0; utts.forEach(u=>words+=u[1].split(/\s+/).length);
  let finished=false; const fin=ok=>{ if(finished||gen!==audioGen) return; finished=true; clearTimeout(audioTimer); if(done) done(ok); };
  utts.forEach((u,idx)=>{
    try{
      const ut=new SpeechSynthesisUtterance(u[1]); ut.lang="en-US"; ut.rate=0.85;
      const v = u[0]==="A"? vF : u[0]==="B"? vM : vDefault;
      if(v) ut.voice=v;
      ut.pitch = u[0]==="A"? 1.15 : u[0]==="B"? 0.8 : 1;
      if(idx===utts.length-1){ ut.onend=()=>fin(true); ut.onerror=()=>fin(true); }
      speechSynthesis.speak(ut);
    }catch(e){ fin(false); }
  });
  audioTimer=setTimeout(()=>fin(true), Math.max(2500, words*520+utts.length*300+1500)); // 保險: 某些瀏覽器不會觸發 onend
}
function spk(text,cls){return `<button class="spk ${cls||""}" data-act="say" data-t="${esc(text)}" aria-label="播放發音">🔊</button>`;}

/* ============================ 單字測驗產生 ============================ */
function mainZh(zh){return zh.replace(/（[^）]*）/g,"").replace(/\([^)]*\)/g,"").trim();}
function coreOf(en){return en.replace(/[.?!]+$/,"");}
function overlap(a,b){ // 中文意思有重疊 2 字以上，可能造成混淆
  for(let i=0;i+2<=a.length;i++){ if(b.indexOf(a.substr(i,2))>=0 && !/[，、；]/.test(a.substr(i,2))) return true; }
  return false;
}
function pickDistractors(w,n,key){ // key: 'zh' 或 'en'
  const u=UNIT[w.unit], mz=mainZh(w.zh), core=coreOf(w.en).toLowerCase();
  let pool=u.words.filter(x=>x.id!==w.id && mainZh(x.zh)!==mz && coreOf(x.en).toLowerCase()!==core);
  const good=pool.filter(x=>!overlap(mz,mainZh(x.zh)));
  const samePos=good.filter(x=>x.pos===w.pos);
  const out=[], seen=new Set();
  const add=x=>{const t=key==="zh"?mainZh(x.zh):coreOf(x.en); if(!seen.has(t)&&out.length<n){seen.add(t);out.push(x);}};
  shuffle(samePos).forEach(add); shuffle(good).forEach(add); shuffle(pool).forEach(add);
  return out;
}
function shuffledWith(correct,ds){return shuffle([correct].concat(ds));}
function mkEZ(w){
  const ds=pickDistractors(w,3,"zh"), mz=mainZh(w.zh), info={};
  ds.concat([w]).forEach(x=>info[mainZh(x.zh)]=`${coreOf(x.en)} 的意思是「${mainZh(x.zh)}」`);
  return {id:"ez:"+w.id,type:"ez",sec:"vocabq",kind:"英文選中文",prompt:w.en,promptLang:"en",say:w.en,opts:shuffledWith(mz,ds.map(x=>mainZh(x.zh))),a:mz,optLang:"zh",
    exp:`「${w.en}」${w.pos?"（"+w.pos+"）":""}的意思是「${w.zh}」。\n例句：${w.ex}\n${w.exZh}`,info};
}
function mkZE(w){
  const ds=pickDistractors(w,3,"en"), core=coreOf(w.en), info={};
  ds.concat([w]).forEach(x=>info[coreOf(x.en)]=`${x.en} 的意思是「${mainZh(x.zh)}」`);
  return {id:"ze:"+w.id,type:"ze",sec:"vocabq",kind:"中文選英文",prompt:mainZh(w.zh)+(w.pos?"　（"+w.pos+"）":""),promptLang:"zh",say:w.en,opts:shuffledWith(core,ds.map(x=>coreOf(x.en))),a:core,optLang:"en",
    exp:`「${mainZh(w.zh)}」的英文是 ${w.en}。\n例句：${w.ex}\n${w.exZh}`,info};
}
function mkListen(w){
  const ds=pickDistractors(w,3,"en"), core=coreOf(w.en), info={};
  ds.concat([w]).forEach(x=>info[coreOf(x.en)]=`${x.en} 的意思是「${mainZh(x.zh)}」`);
  return {id:"li:"+w.id,type:"listen",sec:"vocabq",kind:"聽力：聽單字",prompt:"請聽發音，選出你聽到的是哪一個",promptLang:"zh",speak:w.en,say:w.en,opts:shuffledWith(core,ds.map(x=>coreOf(x.en))),a:core,optLang:"en",
    exp:`你聽到的是 ${w.en}，意思是「${mainZh(w.zh)}」。\n例句：${w.ex}\n${w.exZh}`,info};
}
function mkCloze(w){
  const core=coreOf(w.en);
  if(core.length<3) return null;
  const re=new RegExp("(^|[^A-Za-z'])("+reEsc(core)+")(?![A-Za-z'])","i");
  const m=re.exec(w.ex); if(!m) return null;
  const idx=m.index+m[1].length, matched=m[2];
  const ds=pickDistractors(w,3,"en"); if(ds.length<3) return null;
  const upper=/^[A-Z]/.test(matched);
  const form=t=>{t=coreOf(t); return upper? t.charAt(0).toUpperCase()+t.slice(1) : t.charAt(0).toLowerCase()+t.slice(1);};
  const info={}; ds.forEach(x=>info[form(x.en)]=`${x.en} 的意思是「${mainZh(x.zh)}」`);
  return {id:"cl:"+w.id,type:"cloze",sec:"vocabq",kind:"單字填空",prompt:w.ex.slice(0,idx)+"_____"+w.ex.slice(idx+matched.length),promptLang:"en",sub:"中文提示："+w.exZh,say:w.ex,

function mixPool(sc){
  if(sc==="all") return MID_WORDS;
  if(sc==="learned") return MID_WORDS.filter(w=>wordStatus(w.id)==="learned");
  if(sc==="learning") return MID_WORDS.filter(w=>wordStatus(w.id)==="learning");
  if(sc==="due") return MID_WORDS.filter(w=>S.cards[w.id]&&isDue(w.id));
  const m=/^g(\d+)$/.exec(sc); if(m&&GROUPS[+m[1]]) return groupWords(GROUPS[+m[1]]);
  return [];
}

/* ============================ 題目畫面 (練習與模考共用) ============================ */
function clozeHtml(q){
  const n=q.passage.n, s=sess;
  const others={}; if(s) s.qs.forEach((x,i)=>{ if(x.passId===q.passId && x.passage) others[x.passage.n]={q:x,a:s.ans[i]}; });
  const parts=esc(q.passage.text).replace(/\((\d)\) ___/g,(m,d)=>{
    const k=+d;
    if(k===n){
      const cur=s&&s.ans[s.i];
      if(s&&s.mode==="practice"&&cur!==undefined&&cur!==null) return `<mark class="${cur===q.a?"ok":"bad"}">(${k}) ${esc(cur===q.a?q.a:q.a)}</mark>`;
      return `<mark>(${k}) ______</mark>`;
    }
    const o=others[k];
    if(o&&o.a!==undefined&&o.a!==null) return `<span class="fill">(${k}) ${esc(o.a)}</span>`;
    return `(${k}) ______`;
  });
  return `<div class="passage" lang="en"><h4>${esc(q.passage.title)}</h4>${parts.split(/\n\n/).map(x=>"<p>"+x+"</p>").join("")}</div>`;
}
function audioHtml(q,heard){
  return `<div class="aud"><button class="spk big" data-act="playq" aria-label="播放音檔">${heard?"🔁":"▶️"}</button><div class="st">${hasSpeech?(heard?"可再次播放（允許重聽）":"請先按 ▶ 播放，播完後才會顯示題目"):"此瀏覽器不支援語音，已直接顯示文字稿"}</div></div>`;
}
function transcriptHtml(q){
  const nm={A:"女",B:"男",N:""};
  return `<details><summary>顯示文字稿</summary><div class="passage" lang="en">${q.audio.map(l=>`<p>${nm[l[0]]?`<b>${nm[l[0]]}：</b>`:""}${esc(l[1])}</p>`).join("")}</div></details>`;
}
function optionsHtml(q,st){
  return q.opts.map((o,i)=>{
    let cls="";
    if(st.feedback){ if(o===q.a) cls="ok"; else if(o===st.picked) cls="bad"; }
    else if(st.picked===o) cls="sel";
    return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${st.feedback?"disabled":""} lang="${q.optLang==="zh"?"zh-Hant-TW":"en"}">${esc(o)}</button>`;
  }).join("");
}
function questionHtml(q,st){
  const heardOk = !q.audio || !hasSpeech || st.heard;
  let h=`<div class="kind"><span class="tag b">${esc(q.kind)}</span></div>`;
  if(q.passage) h+= q.passage.type==="cloze"? clozeHtml(q) : `<div class="passage" lang="en"><h4>${esc(q.passage.title)}</h4>${nl2p(q.passage.text)}</div>`;
  if(q.audio){
    h+=audioHtml(q,st.heard);
    if(!heardOk) return h;
  }
  if(q.type==="listen"){
    h+=`<div class="center"><button class="spk big" data-act="say" data-t="${esc(q.speak)}" aria-label="播放">🔊</button><div class="sub" style="margin-top:8px">${esc(q.prompt)}</div></div>`;
  } else {
    h+=`<div class="pr" ${q.promptLang==="en"?'lang="en"':""}>${esc(q.prompt)}${q.type==="ez"?spk(q.say,"s"):""}</div>${q.sub?`<div class="sub">${esc(q.sub)}</div>`:""}`;
  }
  h+=`<div class="opts">${optionsHtml(q,st)}</div>`;
  if(st.feedback){
    const ok=st.picked===q.a;
    const extra=(!ok&&q.info&&q.info[st.picked])?`\n你選的：${q.info[st.picked]}`:"";
    h+=`<div class="fb ${ok?"ok":"bad"}"><b class="t">${ok?"✅ 答對了！":"❌ 再接再厲"}</b>${esc("正確答案："+q.a+"\n"+q.exp+extra)} ${q.say?spk(q.say,"s"):""}</div>`;
    if(q.audio) h+=transcriptHtml(q);
  }
  return h;
}
function quizStateFor(s){
  const q=s.qs[s.i], picked=s.ans[s.i];
  const heard = q.audio? !!s.heard[q.audioKey||q.id] : true;
  return {picked:(picked===undefined?null:picked),feedback:s.mode==="practice"&&picked!==undefined&&picked!==null,heard};
}
function viewQuiz(){
  setNav("gept",true);
  const s=sess;
  if(s.mode==="exam") return viewExamQ();
  if(s.done) return viewResult();
  const q=s.qs[s.i], n=s.qs.length, st=quizStateFor(s);
  $app.innerHTML=`<div class="top"><button class="x" data-act="quit" aria-label="離開">✕</button><div class="bar"><i style="width:${(s.i+(st.feedback?1:0))*100/n}%"></i></div><span class="cnt">${s.i+1}/${n}</span></div>
  <div class="card q">${questionHtml(q,st)}</div>
  ${st.feedback?`<button class="btn block" data-act="next">${s.i+1>=n?"看結果":"下一題"}</button>`:""}`;
  if(q.type==="listen" && !st.feedback && s.autoSpoken!==s.i){ s.autoSpoken=s.i; const me=s; setTimeout(()=>{ if(sess===me&&me.i===me.qs.indexOf(q)) speak(q.speak); },250); }
}
function recordAnswer(q,choice){
  const ok=choice===q.a;
  S.tot.t++; if(ok) S.tot.c++;
  recSec(q.sec,ok);
  if(q.cat) recSec("sent_"+q.cat,ok);
  if(ok){ if(sess&&sess.kind==="review") S.wrong=S.wrong.filter(x=>x.id!==q.id); }
  else { S.wrong=S.wrong.filter(x=>x.id!==q.id); S.wrong.unshift(q); S.wrong=S.wrong.slice(0,200); }
  return ok;
}
function pick(i){
  const s=sess, q=s.qs[s.i], choice=q.opts[i];
  if(s.mode==="exam"){ s.ans[s.i]=choice; return viewExamQ(); }
  if(s.ans[s.i]!==undefined&&s.ans[s.i]!==null) return;
  s.ans[s.i]=choice;
  const ok=recordAnswer(q,choice);
  if(ok) s.c++; else s.wrongIds.push(q.id);
  touch(); viewQuiz();
}
function nextQ(){
  const s=sess; s.i++;
  if(s.i>=s.qs.length){ s.done=true; finish(); }
  viewQuiz();
}
function finish(){
  const s=sess, p=pct(s.c,s.qs.length); s.pct=p;
  if(s.kind==="unit"||s.kind==="gram"||s.kind==="mix"){
    const store=s.kind==="gram"?S.gram:S.quiz, o=store[s.key]||{best:0,last:0,n:0};
    o.best=Math.max(o.best,p); o.last=p; o.n++; store[s.key]=o;
  }
  if(s.kind==="gept"){ const o=S.quiz["gept:"+s.key]||{best:0,last:0,n:0}; o.best=Math.max(o.best,p); o.last=p; o.n++; S.quiz["gept:"+s.key]=o; }
  touch();
}
function viewResult(){
  const s=sess, n=s.qs.length, p=s.pct;
  const em=p>=90?"🏆":p>=70?"🌟":p>=50?"💪":"🌱";
  const msg=p>=90?"太厲害了！":p>=70?"很不錯，繼續加油！":p>=50?"有進步，再練習一下會更好。":"沒關係，錯的題目會收進錯題本，慢慢來。";
  $app.innerHTML=`<div class="card center"><div class="big-em">${em}</div><div class="score">${s.c} / ${n}</div><p><b>${p}%</b> ${msg}</p>
  ${s.kind==="review"?`<p class="mut">錯題本還剩 ${S.wrong.length} 題</p>`:""}
  <div class="row mt"><button class="btn" data-act="nav" data-h="${s.retry}">再來一次</button>${(s.kind!=="review"&&s.wrongIds.length)?`<button class="btn warn" data-act="nav" data-h="#/rq">複習錯題</button>`:""}</div>
  <div class="row mt"><button class="btn sec" data-act="nav" data-h="${s.back}">返回</button><button class="btn sec" data-act="nav" data-h="#/home">回首頁</button></div></div>`;
}

function qWord(w){
  const q=(Math.random()<0.5&&mkCloze(w))||(Math.random()<0.5?mkEZ(w):mkZE(w));
  q.sec="sent"; q.cat="vocab"; q.kind="詞彙與文法 · 單字庫"; q.id="w:"+q.id; return q;
}
function buildExam(){
  let qs=[];
  shuffle(idxRange(DATA.sentences.length)).slice(0,5).forEach(i=>qs.push(qSent(i)));
  shuffle(MID_WORDS).slice(0,3).forEach(w=>qs.push(qWord(w)));
  const pi=Math.floor(Math.random()*DATA.cloze.length); DATA.cloze[pi].qs.forEach((_,k)=>qs.push(qCloze(pi,k)));
  const ri=Math.floor(Math.random()*DATA.reading.length); DATA.reading[ri].qs.forEach((_,k)=>qs.push(qRead(ri,k)));
  const pick=(t,n)=>shuffle(DATA.listening.map((it,i)=>[it,i]).filter(x=>x[0].type===t)).slice(0,n);
  pick("pic",1).concat(pick("qa",2),pick("dlg",1),pick("talk",1)).forEach(x=>{qs=qs.concat(listenQs(x[1]));});
  return qs;
}
function startExam(){
  sess={mode:"exam",kind:"exam",key:"exam",title:"模擬考",qs:buildExam(),i:0,ans:[],heard:{},done:false,endAt:Date.now()+EXAM_MIN*60000,back:"#/gept",retry:"#/exam/run"};
  tmr=setInterval(tick,1000);
  viewExamQ();
}
function fmtT(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function tick(){
  if(!sess||sess.mode!=="exam"||sess.done){clearInterval(tmr);return;}
  const left=sess.endAt-Date.now(), el=document.getElementById("tm");
  if(el){el.textContent=fmtT(left); el.classList.toggle("low",left<120000);}
  if(left<=0){ clearInterval(tmr); toast("時間到，自動交卷"); submitExam(); }
}
function viewExamQ(){

function submitExam(){
  const s=sess; if(!s||s.done) return;
  clearInterval(tmr); stopSpeech(); s.done=true;
  s.usedMs=Math.min(EXAM_MIN*60000, EXAM_MIN*60000-(s.endAt-Date.now()));
  const bySec={}; let c=0;
  s.qs.forEach((q,i)=>{
    const a=s.ans[i], ok=a===q.a;
    const key=q.sec; bySec[key]=bySec[key]||{c:0,t:0}; bySec[key].t++; if(ok){bySec[key].c++; c++;}
    if(q.cat){ const k="sent_"+q.cat; bySec[k]=bySec[k]||{c:0,t:0}; bySec[k].t++; if(ok)bySec[k].c++; }
    S.tot.t++; if(ok) S.tot.c++; recSec(q.sec,ok); if(q.cat) recSec("sent_"+q.cat,ok);
    if(!ok){ S.wrong=S.wrong.filter(x=>x.id!==q.id); S.wrong.unshift(q); }
  });
  S.wrong=S.wrong.slice(0,200);
  s.c=c; s.bySec=bySec; s.pct=pct(c,s.qs.length);
  const d=new Date(); const date=ymd(d)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+" (台北時間)";
  S.exams.push({date,c,t:s.qs.length,pct:s.pct,sec:bySec}); S.exams=S.exams.slice(-20);
  touch(); viewExamReport();
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="chk") return;
  if(a==="say"){ e.stopPropagation(); speak(el.dataset.t); return; }
  if(a==="nav"){ go(el.dataset.h); return; }
  if(a==="flip"){ if(cs){cs.flip=!cs.flip; viewCards();} return; }
  if(a==="know"){ rate(true); return; }
  if(a==="learning"){ rate(false); return; }
  if(a==="cardsAll"){ startCards(cs.u,true); viewCards(); return; }
  if(a==="pick"){ pick(+el.dataset.i); return; }
  if(a==="next"){ nextQ(); return; }
  if(a==="quit"){ if(sess&&sess.mode==="exam"&&!sess.done&&!confirm("確定要離開模擬考嗎？目前的作答不會保留。")) return; go(sess.back); return; }
  if(a==="playq"){
    const s=sess, q=s.qs[s.i], key=q.audioKey||q.id, btn=el;
    if(!hasSpeech){ s.heard[key]=true; viewQuiz(); return; }
    btn.disabled=true; btn.textContent="🔊";
    const me=s, idx=s.i;
    playLines(q.audio,()=>{ me.heard[key]=true; if(sess===me&&me.i===idx&&!me.done){ (me.mode==="exam"?viewExamQ:viewQuiz)(); } });
    return;
  }
  if(a==="eprev"){ if(sess.i>0){sess.i--; viewExamQ();} return; }
  if(a==="enext"){ if(sess.i<sess.qs.length-1){sess.i++; viewExamQ();} return; }
  if(a==="egoto"){ sess.i=+el.dataset.i; viewExamQ(); return; }
  if(a==="esubmit"){
    const un=sess.qs.length-sess.ans.filter(x=>x!==undefined&&x!==null).length;
    if(confirm(un?`還有 ${un} 題沒作答，確定要交卷嗎？`:"確定要交卷嗎？")) submitExam();
    return;
  }
  if(a==="showModel"){ showModel(); return; }
  if(a==="showSp"){ document.getElementById("modelbox").innerHTML=`<h3>範例回答</h3><div class="model" lang="en">${esc(spCtx.model)}</div><button class="btn sec sm" data-act="say" data-t="${esc(spCtx.model)}">🔊 聽範例回答</button>`; el.style.display="none"; return; }
  if(a==="markDone"){ S.prod[writeCtx.id]=true; touch(); toast("已標記完成"); go("#/write"); return; }
  if(a==="markSp"){ S.prod["s"+el.dataset.i]=true; touch(); toast("已標記完成"); go("#/speak"); return; }
  if(a==="reset"){ if(confirm("確定要清除所有學習進度嗎？")){ S=blank(); memStore=null; try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY);}catch(x){} viewHome(); } return; }
  if(a==="goal"){ S.goal=+el.dataset.n; save(); viewHome(); return; }
  if(a==="bonus"){ dailyState().bonus=(dailyState().bonus||0)+10; save(); startToday(); return; }
  if(a==="wmore"){ wf.n+=60; document.getElementById("wlist").innerHTML=wordRowsHtml(); return; }
  if(a==="clearWrong"){ if(confirm("確定要清空錯題本嗎？")){ S.wrong=[]; save(); viewReview(); } return; }
});
if(hasSpeech){ window.addEventListener("pagehide",stopSpeech); }
window.__app={get S(){return S;},get sess(){return sess;},DATA,route,buildExam,buildQuiz};
route();
</script>
