<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b82f6">
<title>全民英檢中級 備考 App</title>
<style>
:root{--pri:#3b82f6;--pri-d:#2563eb;--pri-l:#e6efff;--acc:#ff9f43;--acc-l:#fff1de;--ok:#22a06b;--ok-l:#dff6ea;--bad:#e5484d;--bad-l:#fde8e8;--bg:#f4f7ff;--card:#fff;--tx:#1f2a44;--mut:#6b7794;--bd:#e3e9f6;--sh:0 4px 16px rgba(40,70,140,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
[lang=en]{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans TC",sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
#app.immersive{padding-bottom:32px}
h1{font-size:1.5rem;margin:.2rem 0 .6rem}
h2{font-size:1.2rem;margin:1.2rem 0 .5rem}
h3{font-size:1.05rem;margin:1rem 0 .4rem}
p{margin:.4rem 0}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;margin:12px 0;border:1px solid var(--bd)}
.hero{background:linear-gradient(135deg,#2563eb,#6aa5ff);color:#fff;border:0}
.hero .mut{color:#e3edff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--card);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh);border:1px solid var(--bd)}
.stat b{display:block;font-size:1.45rem;line-height:1.2}
.stat span{font-size:.78rem;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;text-decoration:none;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--pri-l);color:var(--pri-d)}
.btn.warn{background:var(--acc-l);color:#b45f06}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.bar{height:10px;background:#e3e9f6;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#6aa5ff);border-radius:99px;transition:width .3s}
.bar.g>i{background:linear-gradient(90deg,#22a06b,#5cc99a)}
.bar.o>i{background:linear-gradient(90deg,#ff9f43,#ffc078)}
.unit{display:flex;gap:12px;align-items:center;cursor:pointer}
.unit .ic{font-size:1.7rem;width:52px;height:52px;border-radius:16px;background:var(--pri-l);display:flex;align-items:center;justify-content:center;flex:none}
.unit .mid{flex:1;min-width:0}
.unit .mid b{display:block}
.unit .go{color:var(--mut);font-size:1.3rem}
.tag{display:inline-block;background:var(--acc-l);color:#b45f06;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:600}
.tag.b{background:var(--pri-l);color:var(--pri-d)}
.tag.g{background:var(--ok-l);color:var(--ok)}
.tag.r{background:var(--bad-l);color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:680px;width:100%}
nav a{flex:1;text-align:center;padding:8px 2px 6px;color:var(--mut);text-decoration:none;font-size:.72rem;position:relative}
nav a .e{display:block;font-size:1.35rem;line-height:1.2}
nav a.on{color:var(--pri-d);font-weight:700}
nav a .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:.65rem;padding:0 6px;min-width:18px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.top .x{border:0;background:#fff;border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;box-shadow:var(--sh);color:var(--mut);flex:none}
.top .bar{flex:1}
.top .cnt{font-size:.85rem;color:var(--mut);min-width:44px;text-align:right}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:var(--pri-l);color:var(--pri-d);border-radius:10px;padding:4px 10px}
.timer.low{background:var(--bad-l);color:var(--bad)}
.fc{min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:24px 18px;user-select:none}
.fc .en{font-size:1.9rem;font-weight:800;line-height:1.25;word-break:break-word}
.fc .pos{margin-top:6px}
.fc .zh{font-size:1.5rem;font-weight:700;color:var(--pri-d);margin-top:10px}
.fc .hint{margin-top:16px;color:var(--mut);font-size:.85rem}
.fc .exb{margin-top:16px;background:var(--bg);border-radius:14px;padding:10px 14px;width:100%;text-align:left}
.fc .exb .e1{font-size:1.02rem}
.spk{border:0;background:var(--pri-l);color:var(--pri-d);width:48px;height:48px;border-radius:50%;font-size:1.3rem;cursor:pointer;flex:none;margin-top:12px}
.spk.s{width:34px;height:34px;font-size:1rem;margin:0 0 0 6px;vertical-align:middle}
.spk.big{width:84px;height:84px;font-size:2.4rem;margin-top:0}
.q .pr{font-size:1.25rem;font-weight:700;line-height:1.45;margin:6px 0 4px;word-break:break-word}
.q .sub{color:var(--mut);margin-bottom:6px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:2px solid var(--bd);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-size:1.02rem;text-align:left;cursor:pointer;color:var(--tx);min-height:50px}
.opt:active{background:var(--pri-l)}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--bad);background:var(--bad-l)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 14px;margin-top:14px;white-space:pre-line}
.fb.ok{background:var(--ok-l);border:1px solid #b5e6cf}
.fb.bad{background:var(--bad-l);border:1px solid #f5c2c4}
.fb b.t{display:block;font-size:1.05rem;margin-bottom:2px}
.passage{background:#fffdf5;border:1px solid #f1e6c4;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:1rem;line-height:1.7}
.passage h4{margin:0 0 6px;font-size:1rem}
.passage p{margin:.5em 0}
.passage mark{background:#ffe9a8;border-radius:6px;padding:0 4px;font-weight:700}
.passage mark.ok{background:var(--ok-l);color:var(--ok)}
.passage mark.bad{background:var(--bad-l);color:var(--bad)}
.passage .fill{color:var(--pri-d);font-weight:700;text-decoration:underline}
.aud{text-align:center;background:var(--pri-l);border-radius:16px;padding:14px;margin:6px 0}
.aud .st{color:var(--pri-d);font-size:.9rem;margin-top:6px}
.big-em{font-size:3.4rem;text-align:center}
.score{font-size:3rem;font-weight:800;text-align:center;color:var(--pri-d)}
table{border-collapse:collapse;width:100%;font-size:.93rem;margin:8px 0}
.tw{overflow-x:auto}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}
th{background:var(--pri-l)}
.exl{list-style:none;margin:6px 0;padding:0}
.exl li{padding:8px 10px;background:var(--bg);border-radius:12px;margin:6px 0}
.exl .z{color:var(--mut);font-size:.9rem;display:block}
.wl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.wl:last-child{border:0}
.wl .w{flex:1;min-width:0}
.wl .w b{display:block}
.wl .w small{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:10px 18px;border-radius:99px;font-size:.9rem;z-index:20;max-width:90%}
.back{color:var(--pri-d);text-decoration:none;font-weight:600;display:inline-block;margin-bottom:4px}
.center{text-align:center}
.mt{margin-top:14px}
textarea{width:100%;min-height:150px;border:2px solid var(--bd);border-radius:14px;padding:10px 12px;font:inherit;font-size:1rem;resize:vertical;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans TC",sans-serif}
textarea:focus{outline:0;border-color:var(--pri)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.chk input{width:20px;height:20px;margin-top:3px;flex:none}
.model{background:var(--ok-l);border:1px solid #b5e6cf;border-radius:14px;padding:12px 14px;margin:10px 0;white-space:pre-line}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:10px 0}
.pal button{border:2px solid var(--bd);background:#fff;border-radius:10px;height:38px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}
.pal button.done{background:var(--pri-l);color:var(--pri-d);border-color:#b8d0ff}
.pal button.cur{border-color:var(--pri);color:var(--pri-d)}
details{margin:8px 0}
summary{cursor:pointer;color:var(--pri-d);font-weight:600}
.secrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.secrow .n{width:110px;flex:none;font-size:.9rem}
.secrow .bar{flex:1}
.secrow .p{width:86px;text-align:right;font-size:.85rem;color:var(--mut);flex:none}
.rv{border-top:1px solid var(--bd);padding:8px 0;font-size:.95rem}
@media (min-width:600px){.fc .en{font-size:2.3rem}}
.grp>summary{list-style:none;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);font-weight:700;color:var(--tx)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .gi{font-size:1.4rem}
.grp>summary .gn{flex:1}
.grp>summary .gc{font-size:.85rem;color:var(--mut);font-weight:600}
.grp[open]>summary{background:var(--pri-l)}
.grp .gb{padding-top:4px}
.fbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.fbar input,.fbar select{width:100%;border:2px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;color:var(--tx);min-height:44px}
.fbar input{grid-column:1/-1}
.fbar input:focus,.fbar select:focus{outline:0;border-color:var(--pri)}
.wl .ex{color:var(--mut);font-size:.85rem;display:block;margin-top:2px}
.step h3{margin:0 0 6px;color:var(--pri-d)}
.step p{line-height:1.85}
.pitbox{background:var(--bad-l);border:1px solid #f5c2c4}
.pitbox h3{margin:0 0 6px;color:var(--bad)}
.pitbox p{line-height:1.85}
.keybox{background:var(--ok-l);border:1px solid #b5e6cf}
.keybox h3{margin:0 0 6px;color:var(--ok)}
.keybox ul{margin:4px 0;padding-left:20px}
.keybox li{margin:4px 0;line-height:1.6}
.lead{background:var(--pri-l);border:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:2px solid var(--bd);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;min-height:38px}
.chip.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"><div class="in"></div></nav>
<script>
"use strict";
/*
  全民英檢 (GEPT) 中級備考 App
  內容資料 DATA 由建置腳本檢查後嵌入 (單字 / 文法 / 模擬試題 / 聽力 / 寫作 / 口說)。
*/
const DATA = {"units":[{"id":"w1","icon":"💼","zh":"工作與職場","en":"Work & Career","basic":false,"words":[["employer","n.","雇主","The employer offered him a full-time position.","雇主提供他一份全職工作。"],["employee","n.","員工","Every employee must wear an ID card in the building.","每位員工在大樓內都必須佩戴識別證。"],["colleague","n.","同事","My colleague helped me finish the report.","我的同事幫我完成了報告。"],["manager","n.","經理","The manager called a meeting for Monday morning.","經理召集了星期一早上的會議。"],["salary","n.","薪水","Her salary went up after the promotion.","她升職後薪水增加了。"],["promotion","n.","升遷","He worked hard to get a promotion.","他努力工作以爭取升遷。"],["interview","n.","面試","I have a job interview tomorrow morning.","我明天早上有一場工作面試。"],["apply for","phr. v.","申請","She decided to apply for a job at the bank.","她決定去申請銀行的一份工作。"],["qualification","n.","資格，資歷","A university degree is the main qualification for this job.","大學學位是這份工作的主要資格。"],["experience","n.","經驗","We are looking for someone with experience in sales.","我們在找有銷售經驗的人。"],["deadline","n.","截止期限","The deadline for the project is next Friday.","這個專案的截止日是下週五。"],["schedule","n.","時間表，行程","My schedule is full this week.","我這週的行程排滿了。"],["overtime","n.","加班；加班時間","He worked overtime every day this month.","他這個月每天都加班。"],["resign","v.","辭職","She decided to resign because she wanted to study abroad.","她因為想出國讀書而決定辭職。"],["retire","v.","退休","My father will retire at the age of sixty-five.","我父親將在六十五歲退休。"],["profession","n.","（專門）職業","Teaching is a respected profession.","教書是一個受人尊敬的職業。"],["career","n.","職涯，事業","She started her career as a nurse.","她以護理師的身分展開了她的職涯。"],["income","n.","收入","Their monthly income is not very high.","他們的月收入不是很高。"],["task","n.","任務，工作項目","This task requires a lot of patience.","這項任務需要很大的耐心。"],["responsible","adj.","負責的","Who is responsible for this project?","誰負責這個專案？"],["efficient","adj.","有效率的","An efficient worker saves the company a lot of time.","有效率的員工能替公司節省很多時間。"],["cooperate","v.","合作","The two teams need to cooperate on the design.","這兩個團隊需要在設計上合作。"],["supervisor","n.","主管，監督者","My supervisor gave me some useful advice.","我的主管給了我一些有用的建議。"],["workload","n.","工作量","The heavy workload makes him tired all the time.","繁重的工作量讓他總是很累。"],["part-time","adj.","兼職的","She has a part-time job at a cafe.","她在咖啡店有一份兼職工作。"],["full-time","adj.","全職的","He is looking for a full-time job.","他正在找一份全職工作。"],["hire","v.","僱用","The company plans to hire ten new workers.","公司計畫僱用十名新員工。"],["fire","v.","解僱","The boss may fire him if he is late again.","如果他再遲到，老闆可能會解僱他。"],["training","n.","訓練，培訓","All new staff receive two weeks of training.","所有新進員工都會接受兩週的培訓。"],["skill","n.","技能","Good communication is an important skill.","良好的溝通是一項重要的技能。"],["achieve","v.","達成，實現","She worked hard to achieve her goal.","她努力工作以達成目標。"]]},{"id":"w2","icon":"🩺","zh":"健康與醫療","en":"Health & Medicine","basic":false,"words":[["symptom","n.","症狀","A cough is a common symptom of a cold.","咳嗽是感冒常見的症狀。"],["fever","n.","發燒","The child has a high fever and needs to see a doctor.","這個孩子發高燒，需要看醫生。"],["cough","v.","咳嗽","He began to cough loudly during the meeting.","他在會議中開始大聲咳嗽。"],["headache","n.","頭痛","I have a terrible headache after staring at the screen all day.","我整天盯著螢幕，現在頭痛得厲害。"],["infection","n.","感染","The wound became red because of an infection.","傷口因為感染而變紅。"],["injury","n.","受傷，傷害","The player missed the game because of a knee injury.","這名球員因為膝蓋受傷而缺席比賽。"],["recover","v.","康復，恢復","It took her a month to recover from the flu.","她花了一個月才從流感中康復。"],["prescription","n.","處方（箋）","You need a prescription to buy this medicine.","你需要處方箋才能買這種藥。"],["medicine","n.","藥；醫學","Take this medicine three times a day.","這種藥一天吃三次。"],["treatment","n.","治療","The treatment for this disease takes several months.","這種疾病的治療需要好幾個月。"],["diet","n.","飲食；節食","A balanced diet includes vegetables, fruit and protein.","均衡的飲食包括蔬菜、水果和蛋白質。"],["exercise","n.","運動","Regular exercise keeps your heart strong.","規律的運動能讓你的心臟強健。"],["nutrition","n.","營養","Good nutrition is important for growing children.","良好的營養對成長中的孩子很重要。"],["vitamin","n.","維他命","Oranges are full of vitamin C.","柳橙富含維他命 C。"],["allergy","n.","過敏","He has an allergy to peanuts.","他對花生過敏。"],["blood pressure","n.","血壓","The nurse checked my blood pressure first.","護理師先量了我的血壓。"],["surgery","n.","外科手術","My grandfather had surgery on his heart last year.","我爺爺去年做了心臟手術。"],["pain","n.","疼痛","She felt a sharp pain in her back.","她感到背部一陣劇痛。"],["bleed","v.","流血","His finger began to bleed after he cut it.","他的手指被割到後開始流血。"],["swollen","adj.","腫脹的","Her ankle is swollen, so she can't walk well.","她的腳踝腫起來了，所以走路不方便。"],["dizzy","adj.","頭暈的","I felt dizzy when I stood up too fast.","我站起來太快時感到頭暈。"],["overweight","adj.","過重的","Doctors say that being overweight can cause health problems.","醫生說過重可能造成健康問題。"],["stress","n.","壓力","Too much stress can make you sick.","過大的壓力可能讓你生病。"],["insomnia","n.","失眠","Coffee at night may cause insomnia.","晚上喝咖啡可能造成失眠。"],["ambulance","n.","救護車","Someone called an ambulance right after the accident.","事故發生後立刻有人叫了救護車。"],["patient","n.","病人","The doctor spent an hour talking with the patient.","醫生花了一個小時和病人談話。"],["vaccine","n.","疫苗","The new vaccine protects people from the virus.","這種新疫苗能保護人們不受病毒感染。"],["habit","n.","習慣","Drinking water in the morning is a good habit.","早上喝水是個好習慣。"],["cure","v.","治癒","No medicine can cure a cold quickly.","沒有任何藥能很快治好感冒。"],["disease","n.","疾病","Heart disease is one of the main causes of death.","心臟病是主要的死因之一。"],["pharmacy","n.","藥局","The pharmacy near my house closes at ten.","我家附近的藥局十點打烊。"],["check-up","n.","健康檢查","I go to the hospital for a check-up once a year.","我一年去一次醫院做健康檢查。"]]},{"id":"w3","icon":"🌍","zh":"環境與自然","en":"Environment & Nature","basic":false,"words":[["pollution","n.","污染","Air pollution is a serious problem in big cities.","空氣污染在大城市是嚴重的問題。"],["recycle","v.","回收再利用","We should recycle paper, glass and plastic bottles.","我們應該回收紙、玻璃和塑膠瓶。"],["waste","n.","廢棄物；浪費","Factories must deal with their waste in a safe way.","工廠必須以安全的方式處理廢棄物。"],[" ng.","不要盯著螢幕看太久。"],["battery","n.","電池","My phone battery runs out very quickly.","我手機的電池很快就沒電了。"],["charge","v.","充電；收費","I need to charge my phone before we leave.","出發前我需要幫手機充電。"],["application","n.","應用程式；申請","This application helps you learn new words every day.","這個應用程式幫助你每天學新單字。"],["artificial intelligence","n.","人工智慧","Artificial intelligence is changing the way we work.","人工智慧正在改變我們工作的方式。"],["robot","n.","機器人","A robot cleans the floor in our house every morning.","我們家每天早上都有一台機器人在打掃地板。"],["data","n.","資料，數據","The company collects data about how customers shop.","這家公司蒐集顧客購物方式的資料。"],["digital","adj.","數位的","She took a lot of pictures with her digital camera.","她用數位相機拍了很多照片。"],["invent","v.","發明","Who invented the telephone?","是誰發明了電話？"],["virus","n.","病毒","A computer virus can delete your files.","電腦病毒可能刪除你的檔案。"],["delete","v.","刪除","Be careful not to delete important files.","小心不要刪除重要的檔案。"],["backup","n.","備份","Always make a backup of your work.","一定要替你的作品做備份。"],["file","n.","檔案；文件","I sent you the file by email.","我用電子郵件把檔案寄給你了。"],["social media","n.","社群媒體","Many teenagers spend hours on social media every day.","許多青少年每天花好幾個小時在社群媒體上。"],["streaming","n.","串流播放","Streaming has changed the way people watch TV shows.","串流播放改變了人們看電視節目的方式。"],["privacy","n.","隱私","Some apps ask for too much of your personal privacy.","有些應用程式索取太多你的個人隱私。"]]},{"id":"w5","icon":"🎓","zh":"教育與學習","en":"Education & Learning","basic":false,"words":[["subject","n.","科目；主題","Math is my favorite subject at school.","數學是我在學校最喜歡的科目。"],["semester","n.","學期","The new semester begins in September.","新學期在九月開始。"],["scholarship","n.","獎學金","She won a scholarship to study in Canada.","她獲得了去加拿大讀書的獎學金。"],["degree","n.","學位；程度","He has a degree in computer science.","他擁有資訊工程的學位。"],["graduate","v.","畢業","My sister will graduate from college next June.","我姊姊明年六月將從大學畢業。"],["campus","n.","校園","The campus is quiet during the summer holiday.","暑假期間校園很安靜。"],["lecture","n.","演講；大學課堂講課","The professor gave a lecture on climate change.","教授做了一場關於氣候變遷的演講。"],["assignment","n.","作業，指派的任務","The assignment is due on Wednesday.","這份作業的繳交期限是星期三。"],["essay","n.","作文，論文","We have to write an essay about our hometown.","我們必須寫一篇關於家鄉的作文。"],["grade","n.","成績；年級","She got a good grade on the final exam.","她在期末考拿到很好的成績。"],["memorize","v.","背誦，記住","It is hard to memorize so many new words at once.","一次要背這麼多新單字很難。"],["concentrate","v.","專心","I can't concentrate when the TV is on.","電視開著的時候我沒辦法專心。"],["attend","v.","出席，參加","All students must attend the opening ceremony.","所有學生都必須參加開學典禮。"],["absent","adj.","缺席的","Tom was absent from class because he was sick.","湯姆因為生病沒來上課。"],["tutor","n.","家教，輔導老師","My parents hired a tutor to help me with English.","我的父母請了一位家教來幫我學英文。"],["dormitory","n.","宿舍","Two students share each room in the dormitory.","宿舍裡每個房間由兩位學生共用。"],["major","n.","主修科系","Her major is international business.","她的主修是國際商務。"],["curriculum","n.","課程（總稱）","The school added more art classes to its curriculum.","學校在課程中增加了更多藝術課。"],["knowledge","n.","知識","Reading books is a good way to gain knowledge.","閱讀是獲得知識的好方法。"],["research","n.","研究，調查","The research shows that sleep helps memory.","這項研究顯示睡眠有助於記憶。"],["education","n.","教育","Education is the key to a better future.","教育是通往更美好未來的關鍵。"],["encourage","v.","鼓勵","Our teacher always encourages us to ask questions.","我們的老師總是鼓勵我們發問。"],["textbook","n.","教科書","Please open your textbook to page thirty.","請把你的課本翻到第三十頁。"],["cheat","v.","作弊","Students who cheat on exams may fail the course.","考試作弊的學生可能會被當掉。"],["score","n.","分數","What was your score on the English test?","你的英文考試考了幾分？"],["register","v.","註冊，登記","You need to register for the course before Friday.","你必須在星期五之前註冊這門課。"],["tuition","n.","學費","The university raised its tuition this year.","這所大學今年調漲了學費。"],["improve","v.","改善，進步","Listening to English songs can improve your listening skills.","聽英文歌可以增進你的聽力。"],["review","v.","複習；審查","I will review all the lessons before the exam.","我會在考試前複習所有的課程。"]
