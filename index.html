nket.","很冷，所以我需要再一條毯子。"],["air conditioner","n.","冷氣機","The air conditioner in my room isn't working.","我房間的冷氣壞了。"],["key card","n.","房卡","Don't forget to return your key card.","別忘了歸還你的房卡。"],["view","n.","景觀","Our room has a wonderful sea view.","我們的房間有很棒的海景。"],["complimentary","adj.","免費贈送的","Breakfast is complimentary for hotel guests.","早餐對房客是免費的。"],["vacancy","n.","空房","The hotel has no vacancies this weekend.","這間飯店這個週末沒有空房。"],["fully booked","adj.","客滿的","The restaurant is fully booked tonight.","這家餐廳今晚客滿。"],["hostel","n.","青年旅館","Backpackers often stay in hostels.","背包客常常住青年旅館。"],["guest","n.","客人","The hotel has three hundred guests this week.","這間飯店這週有三百位客人。"],["host","n.","主人；主持人","Our host welcomed us with tea.","主人用茶招待我們。"],["appetizer","n.","開胃菜","We shared an appetizer before the main dish.","主餐前我們分著吃了一份開胃菜。"],["main course","n.","主菜","The main course is steak with vegetables.","主菜是牛排配蔬菜。"],["side dish","n.","配菜","Would you like a side dish with that?","你想要搭配一份配菜嗎？"],["beverage","n.","飲料","Beverages are not included in the set meal.","套餐不含飲料。"],["set meal","n.","套餐","I ordered the lunch set meal.","我點了午間套餐。"],["buffet","n.","自助餐","The hotel serves a buffet breakfast.","這家飯店提供自助式早餐。"],["specialty","n.","招牌菜，特色","The fish soup is the specialty of this restaurant.","魚湯是這家餐廳的招牌菜。"],["reserve","v.","預訂","I'd like to reserve a table for six.","我想預訂六人的位子。"],["serve","v.","供應；端上","This restaurant serves breakfast all day.","這家餐廳全天供應早餐。"],["refill","v.","續杯","Could you refill my glass of water?","可以幫我的水杯續水嗎？"],["pay the bill","phr.","付帳","Let me pay the bill this time.","這次讓我來付帳。"],["split the bill","phr.","平分帳單","Let's split the bill between the four of us.","我們四個人平分帳單吧。"],["service charge","n.","服務費","A ten percent service charge is added to the bill.","帳單上加收百分之十的服務費。"],["allergic","adj.","過敏的","I am allergic to seafood.","我對海鮮過敏。"],["medium","adj.","五分熟的；中等的","I'd like my steak medium, please.","我的牛排要五分熟，麻煩了。"],["well-done","adj.","全熟的","He always orders well-done steak.","他總是點全熟的牛排。"],["overcooked","adj.","煮過頭的","The vegetables were overcooked.","蔬菜煮過頭了。"],["undercooked","adj.","未煮熟的","Don't eat undercooked chicken.","不要吃沒煮熟的雞肉。"],["atmosphere","n.","氣氛","The restaurant has a romantic atmosphere.","這家餐廳有浪漫的氣氛。"],["napkin","n.","餐巾","He wiped his mouth with a napkin.","他用餐巾擦嘴。"],["straw","n.","吸管","Can I have a straw for my drink?","我的飲料可以給我一根吸管嗎？"],["tray","n.","托盤","The waiter carried a tray of drinks.","服務生端著一托盤的飲料。"],["queue","n.","排隊人龍","There was a long queue outside the restaurant.","餐廳外排了很長的隊伍。"],["waiting list","n.","候補名單","Please put us on the waiting list.","請把我們列入候補名單。"],["souvenir shop","n.","紀念品店","We bought postcards at the souvenir shop.","我們在紀念品店買了明信片。"],["wake-up call","n.","晨喚服務","Please give me a wake-up call at six.","請在六點打電話叫醒我。"],["luggage cart","n.","行李推車","Take a luggage cart from the lobby.","請從大廳拿一台行李推車。"],["laundry service","n.","洗衣服務","The hotel offers a laundry service.","這間飯店提供洗衣服務。"],["room service","n.","客房餐飲服務","We ordered breakfast from room service.","我們向客房服務點了早餐。"],["shuttle bus","n.","接駁車","A free shuttle bus runs to the airport.","有免費接駁車開往機場。"],["safe","n.","保險箱","Keep your passport in the room safe.","把護照放在房間的保險箱裡。"]]},{"id":"w30","icon":"🏫","zh":"校園與考試","en":"School & Exams","basic":false,"words":[["kindergarten","n.","幼稚園","My little sister goes to kindergarten.","我妹妹上幼稚園。"],["elementary school","n.","小學","He walks to elementary school every day.","他每天走路去上小學。"],["junior high school","n.","國中","She is in her second year of junior high school.","她國中二年級。"],["senior high school","n.","高中","Most students take an entrance exam for senior high school.","大部分學生要參加高中入學考試。"],["university","n.","大學","She was accepted by a famous university.","她被一所知名大學錄取了。"],["classroom","n.","教室","The classroom is on the third floor.","教室在三樓。"],["blackboard","n.","黑板","The teacher wrote the date on the blackboard.","老師把日期寫在黑板上。"],["professor","n.","教授","The professor is an expert on ancient history.","這位教授是古代史專家。"],["classmate","n.","同班同學","My classmates and I go to lunch together.","我和我的同學們一起去吃午餐。"],["schoolmate","n.","校友，同校同學","She met an old schoolmate on the train.","她在火車上遇到了一位老同學。"],["freshman","n.","大一新生","As a freshman, he lived in the dormitory.","身為大一新生，他住在宿舍。"],["senior","n.","高年級生","The seniors are preparing for graduation.","高年級生正在準備畢業。"],["term","n.","學期；術語","The first term ends in January.","第一學期在一月結束。"],["homework","n.","回家作業","I finished my homework before dinner.","我在晚餐前寫完了功課。"],["quiz","n.","小考","We have a short quiz every Friday.","我們每週五都有小考。"],["midterm","n.","期中考","The midterm exam covers the first five chapters.","期中考涵蓋前五章。"],["final exam","n.","期末考","I studied hard for the final exam.","我為期末考用功讀書。"],["pass","v.","通過；及格","She passed the driving test on her first try.","她第一次就通過了駕照考試。"],["fail","v.","不及格；失敗","He failed the math exam and had to retake it.","他數學考試不及格，必須重考。"],["retake","v.","重考；重修","She decided to retake the test next month.","她決定下個月重考。"],["cram","v.","臨時抱佛腳","Many students cram the night before the exam.","許多學生考前一晚臨時抱佛腳。"],["revise","v.","複習；修改","I need to revise for the history test.","我需要為歷史考試複習。"],["guess","v.","猜","If you don't know the answer, take a guess.","如果你不知道答案，就猜一個吧。"],["solve","v.","解決；解答","Can you solve this math problem?","你能解這道數學題嗎？"],["calculate","v.","計算","Use a calculator to calculate the total.","用計算機算出總數。"],["correct","v.","訂正，改正","The teacher corrected our mistakes.","老師訂正了我們的錯誤。"],["underline","v.","畫底線","Underline the key words in the passage.","在文章中把關鍵字畫上底線。"],["highlight","v.","強調；用螢光筆標記","She highlighted the important sentences.","她用螢光筆標出重要的句子。"],["copy","v.","抄寫；複製","Don't copy your friend's homework.","不要抄朋友的作業。"],["translate","v.","翻譯","Please translate this sentence into English.","請把這個句子翻成英文。"],["spell","v.","拼寫","How do you spell your last name?","你的姓怎麼拼？"],["pronounce","v.","發音","How do you pronounce this word?","這個字怎麼發音？"],["grammar","n.","文法","Good grammar is important for writing.","良好的文法對寫作很重要。"],["sentence","n.","句子","Make a sentence with each new word.","用每個新單字造一個句子。"],["paragraph","n.","段落","Each paragraph should have a main idea.","每個段落都應該有一個主旨。"],["chapter","n.","章節","Please read the first chapter tonight.","今晚請讀第一章。"],["topic","n.","主題","What topic did you choose for your report?","你的報告選了什麼主題？"],["theme","n.","主題，題材","The theme of the story is friendship.","這個故事的主題是友誼。"],["thesis","n.","論文","She is writing her master's thesis.","她正在寫她的碩士論文。"],["diploma","n.","畢業證書","He received his diploma at the ceremony.","他在典禮上領到了畢業證書。"],["certificate","n.","證書","She got a certificate for finishing the course.","她因修完課程而拿到證書。"],["academic","adj.","學術的","Her academic record is excellent.","她的學業成績很優秀。"],["compulsory","adj.","必修的，義務的","English is a compulsory subject in schools.","英文是學校的必修科目。"],["optional","adj.","選修的，可選擇的","Attending the workshop is optional.","參加工作坊是自由選擇的。"],["elective","n.","選修課","I chose music as my elective.","我選了音樂當選修課。"],["club","n.","社團","She joined the photography club at school.","她加入了學校的攝影社。"],["field trip","n.","校外教學","The class went on a field trip to the museum.","全班去博物館校外教學。"],["graduation","n.","畢業","The graduation ceremony will be held in June.","畢業典禮將在六月舉行。"],["detention","n.","留校察看","He got detention for being late three times.","他因為遲到三次而被留校。"],["punish","v.","處罰","Teachers should not punish students unfairly.","老師不該不公平地處罰學生。"],["praise","v.","稱讚","The teacher praised her for her hard work.","老師稱讚她的努力。"],["scold","v.","責罵","His mother scolded him for lying.","他媽媽因為他說謊而責罵他。"],["bully","v.","霸凌","It is wrong to bully younger students.","霸凌低年級同學是不對的。"],["lecture hall","n.","大講堂","The lecture hall holds three hundred students.","這間大講堂可容納三百名學生。"],["notebook","n.","筆記本","I wrote down the new words in my notebook.","我把新單字寫在筆記本上。"],["dictionary","n.","字典","Look up the word in a dictionary.","去字典裡查這個字。"],["eraser","n.","橡皮擦","Can I borrow your eraser?","我可以借你的橡皮擦嗎？"],["ruler","n.","尺","Use a ruler to draw a straight line.","用尺畫一條直線。"]]},{"id":"w31","icon":"🗂️","zh":"辦公室與職場用語","en":"Office & Workplace","basic":false,"words":[["department","n.","部門","She works in the marketing department.","她在行銷部門工作。"],["headquarters","n.","總部","The company's headquarters is in Taipei.","這家公司的總部在台北。"],["staff","n.","全體員工","All staff must attend the safety training.","全體員工都必須參加安全訓練。"],["boss","n.","老闆","My boss is out of the office today.","我老闆今天不在辦公室。"],["secretary","n.","秘書","The secretary booked a meeting room.","秘書預訂了一間會議室。"],["assistant","n.","助理","I am an assistant to the sales manager.","我是業務經理的助理。"],["intern","n.","實習生","The company hired two interns for the summer.","公司為暑期聘用了兩名實習生。"],["applicant","n.","應徵者","There were fifty applicants for the position.","這個職位有五十位應徵者。"],["candidate","n.","候選人","The best candidate will get the job.","最佳人選將得到這份工作。"],["resume","n.","履歷表","Please send your resume by email.","請用電子郵件寄出你的履歷。"],["position","n.","職位","She applied for the position of editor.","她應徵編輯這個職位。"],["agenda","n.","議程","What's on the agenda for today's meeting?","今天會議的議程有什麼？"],["minutes","n.","會議記錄","She took the minutes of the meeting.","她做了會議記錄。"],["conference","n.","會議，研討會","He attended an international conference in Tokyo.","他參加了在東京舉行的國際研討會。"],["memo","n.","備忘錄","The manager sent a memo to all staff.","經理向全體員工發了一份備忘錄。"],["proposal","n.","提案","Our proposal was accepted by the board.","我們的提案被董事會接受了。"],["draft","n.","草稿","Send me the first draft by tomorrow.","明天以前把初稿寄給我。"],["copy machine","n.","影印機","The copy machine is out of paper.","影印機沒紙了。"],["photocopy","v.","影印","Could you photocopy these pages for me?","你可以幫我影印這幾頁嗎？"],["printer","n.","印表機","The printer is jammed again.","印表機又卡紙了。"],["stapler","n.","釘書機","Do you have a stapler I can use?","你有釘書機可以借我用嗎？"],["folder","n.","資料夾","Put the documents in the blue folder.","把文件放進藍色資料夾。"],["document","n.","文件","Please sign these documents.","請在這些文件上簽名。"],["attachment","n.","附件","I sent the report as an attachment.","我把報告當附件寄出去了。"],["forward","v.","轉寄","Could you forward the email to everyone?","你可以把這封信轉寄給大家嗎？"],["reply","v.","回覆","Please reply to my email as soon as possible.","請儘快回覆我的電子郵件。"],["confirm","v.","確認","I'll call the hotel to confirm our booking.","我會打電話給飯店確認我們的訂房。"],["reschedule","v.","重新安排時間","Can we reschedule the meeting for Friday?","我們可以把會議改到星期五嗎？"],["postpone","v.","延期","The launch was postponed until next month.","產品發表延到了下個月。"],["arrange","v.","安排","She arranged an interview with the manager.","她安排了與經理的面談。"],["assign","v.","指派","The teacher assigned a project to each group.","老師指派了一個專題給每一組。"],["delegate","v.","委派","A good boss knows how to delegate work.","好老闆懂得如何分派工作。"],["supervise","v.","監督，指導","She supervises a team of ten people.","她管理一個十人的團隊。"],["organize","v.","組織，籌劃","He organized a farewell party for his colleague.","他為同事籌辦了歡送會。"],["approve","v.","批准","The manager approved my leave request.","經理批准了我的請假申請。"],["reject","v.","拒絕，駁回","The bank rejected his loan application.","銀行駁回了他的貸款申請。"],["submit","v.","提交","Submit your report before five o'clock.","請在五點前提交你的報告。"],["evaluate","v.","評估","The committee will evaluate all the proposals.","委員會將評估所有的提案。"],["feedback","n.","回饋","Thank you for your useful feedback.","謝謝你有用的回饋。"],["priority","n.","優先事項","Safety is our first priority.","安全是我們的首要之務。"],["target","n.","目標","We reached our sales target this month.","我們這個月達成了銷售目標。"],["goal","n.","目標","Our goal is to increase sales by ten percent.","我們的目標是提升百分之十的銷售額。"],["strategy","n.","策略","The company has a new marketing strategy.","公司有一個新的行銷策略。"],["project","n.","專案","She is in charge of a big project.","她負責一個大型專案。"],["teamwork","n.","團隊合作","Good teamwork is important to our success.","良好的團隊合作對我們的成功很重要。"],["leadership","n.","領導力","He shows strong leadership in a crisis.","他在危機中展現出強大的領導力。"],["resignation","n.","辭職","He handed in his resignation this morning.","他今天早上提出了辭呈。"],["leave","n.","假期","She took a week of paid leave.","她請了一個星期的有薪假。"],["sick leave","n.","病假","He took two days of sick leave.","他請了兩天病假。"],["mat 打包了嗎？"],["participate","v.","參與","Everyone is encouraged to participate.","鼓勵每個人參與。"],["plan","v.","計畫","We plan to travel to Kyoto in May.","我們計畫五月去京都旅行。"],["pray","v.","祈禱","People pray for peace.","人們為和平祈禱。"],["predict","v.","預測","No one can predict the future.","沒有人能預測未來。"],["prefer","v.","偏好","I prefer tea to coffee.","比起咖啡，我比較喜歡茶。"],["prepare","v.","準備","She prepared a speech for the ceremony.","她為典禮準備了一份演講稿。"],["prevent","v.","預防，阻止","Washing your hands helps prevent illness.","洗手有助於預防疾病。"],["produce","v.","生產","Taiwan produces many electronic parts.","台灣生產許多電子零件。"],["promote","v.","促進；晉升","The government promotes healthy eating.","政府推廣健康飲食。"],["provide","v.","提供","The company provides free lunch for staff.","公司提供員工免費午餐。"],["pull","v.","拉","Pull the door, don't push it.","要拉門，不要推。"],["push","v.","推","He pushed the cart to the checkout.","他把推車推到結帳處。"],["realize","v.","了解；意識到","I realized that I had left my keys at home.","我意識到自己把鑰匙忘在家裡了。"],["receive","v.","收到","I received a letter from my old friend.","我收到了老朋友的來信。"],["recognize","v.","認出","I didn't recognize him with his new haircut.","他換了新髮型，我沒認出他。"],["reduce","v.","減少","We need to reduce the amount of plastic we use.","我們需要減少塑膠的使用量。"],["refer","v.","提到；參考","Refer to page ten for more information.","更多資訊請參考第十頁。"],["reflect","v.","反射；反映","The lake reflected the mountains.","湖面倒映著群山。"],["refuse","v.","拒絕","She refused to answer the question.","她拒絕回答這個問題。"],["regret","v.","後悔","I regret not studying harder.","我後悔沒有更用功讀書。"],["relate","v.","與…有關","The two events are closely related.","這兩件事密切相關。"],["release","v.","釋放；發行","The band will release a new album in May.","這個樂團將在五月發行新專輯。"],["remain","v.","保持；留下","Please remain seated until the plane stops.","請在飛機停妥前坐在座位上。"],["remember","v.","記得","Remember to turn off the lights.","記得關燈。"],["remind","v.","提醒","Please remind me to call her.","請提醒我打電話給她。"],["remove","v.","移除","Remove your shoes at the door.","在門口脫掉鞋子。"],["repeat","v.","重複","Could you repeat the question, please?","可以請你重複一次問題嗎？"],["replace","v.","取代，更換","The old machine was replaced by a new one.","舊機器被一台新的取代了。"],["represent","v.","代表","She represents our school in the contest.","她代表我們學校參加比賽。"],["require","v.","需要，要求","This job requires good communication skills.","這份工作需要良好的溝通技巧。"],["rescue","v.","救援","Firefighters rescued the child from the fire.","消防員從火場中救出了孩子。"],["respond","v.","回應","He didn't respond to my message.","他沒有回應我的訊息。"],["restore","v.","恢復；修復","The old temple was restored last year.","那座古廟去年修復了。"],["result","v.","導致；結果是","The accident resulted in a long delay.","這起事故導致了長時間的延誤。"],["reveal","v.","揭露","The report revealed a serious problem.","報告揭露了一個嚴重的問題。"],["satisfy","v.","使滿意","Nothing seems to satisfy him.","好像沒有什麼事能讓他滿意。"],["search","v.","搜尋","The police searched the house for clues.","警方搜查了這棟房子尋找線索。"],["select","v.","挑選","Please select one of the following options.","請從下列選項中選擇一個。"],["separate","v.","分開","Separate the white clothes from the colored ones.","把白色衣物和有色衣物分開。"]]},{"id":"w41","icon":"🧗","zh":"常用動詞（三）","en":"Essential Verbs III","basic":false,"words":[["settle","v.","定居；解決","They settled in Canada after the war.","戰後他們定居在加拿大。"],["shift","v.","移動；轉變","He shifted the box to the corner.","他把箱子移到角落。"],["shock","v.","使震驚","The news shocked everyone.","這個消息讓每個人都很震驚。"],["shout","v.","大叫","Don't shout at the children.","不要對孩子們大吼大叫。"],["signal","v.","示意","The driver signaled left before turning.","司機在轉彎前打了左轉燈。"],["smell","v.","聞起來","Something smells delicious in the kitchen.","廚房裡有東西聞起來很香。"],["sort","v.","分類","Please sort the papers by date.","請按日期把文件分類。"],["spread","v.","散播；擴散","The fire spread quickly through the building.","火勢在大樓中迅速蔓延。"],["starve","v.","挨餓","Many people starve in poor countries.","貧窮國家有許多人在挨餓。"],["stay","v.","停留；住宿","We stayed at a small hotel by the sea.","我們住在海邊的一家小旅館。"],["steal","v.","偷","Someone stole my bike last night.","昨晚有人偷了我的腳踏車。"],["stick","v.","黏貼；堅持","Stick the stamp on the envelope.","把郵票貼在信封上。"],["stop","v.","停止","Please stop making so much noise.","請不要再製造這麼大的噪音。"],["store","v.","儲存","You can store the files on a USB drive.","你可以把檔案存在隨身碟裡。"],["struggle","v.","奮鬥，掙扎","She struggled to pay the rent.","她很辛苦地想付房租。"],["suffer","v.","受苦","Many people suffer from back pain.","許多人飽受背痛之苦。"],["supply","v.","供應","The farm supplies fresh eggs to local shops.","這座農場供應新鮮雞蛋給當地商店。"],["suppose","v.","認為；假設","I suppose you are right.","我想你是對的。"],["surprise","v.","使驚訝","The news surprised everybody.","這個消息讓每個人都很驚訝。"],["surround","v.","環繞","Mountains surround the small town.","群山環繞著這個小鎮。"],["survive","v.","生存，倖存","Only two people survived the crash.","只有兩個人在這次墜機中倖存。"],["tend","v.","傾向於","Young people tend to stay up late.","年輕人傾向於熬夜。"],["tempt","v.","引誘","The smell of fresh bread tempted me.","新鮮麵包的香味誘惑了我。"],["tear","v.","撕","She tore the letter into pieces.","她把信撕成碎片。"],["threaten","v.","威脅","The storm threatened the small boats.","暴風雨威脅著那些小船。"],["touch","v.","觸碰","Please don't touch the paintings.","請不要碰這些畫。"],["trace","v.","追蹤，追溯","Police traced the call to a public phone.","警方追查出這通電話來自一支公共電話。"],["transport","v.","運輸","Trucks transport goods across the island.","卡車把貨物運送到全島各地。"],["trap","v.","困住，誘捕","Rescue workers found the workers trapped in the tunnel.","救援人員發現工人被困在隧道裡。"],["twist","v.","扭轉；扭傷","He twisted his ankle playing soccer.","他踢足球時扭傷了腳踝。"],["unite","v.","團結","The disaster united the whole nation.","這場災難讓全國團結一致。"],["upset","v.","使不安","The bad news upset her.","壞消息讓她心煩意亂。"],["urge","v.","力勸，敦促","The doctor urged him to stop smoking.","醫生極力勸他戒菸。"],["use","v.","使用","Can I use your phone for a moment?","我可以用一下你的電話嗎？"],["value","v.","重視","She values her friends more than money.","她重視朋友勝過金錢。"],["vary","v.","變化，不同","Prices vary from shop to shop.","各家商店的價格不同。"],["visit","v.","拜訪","We visited our grandparents last weekend.","我們上週末去看了祖父母。"],["wander","v.","漫步，閒逛","We wandered through the old streets.","我們在老街上閒逛。"],["weigh","v.","重達；權衡","The baby weighs three kilograms.","這個寶寶重三公斤。"],["welcome","v.","歡迎","The mayor welcomed the visitors to the city.","市長歡迎訪客來到這座城市。"],["whisper","v.","低聲說","He whispered something in her ear.","他在她耳邊低聲說了些話。"],["wish","v.","希望","I wish you a happy new year.","我祝你新年快樂。"],["wonder","v.","想知道","I wonder what time it is.","我想知道現在幾點。"],["worry","v.","擔心","Don't worry, everything will be fine.","別擔心，一切都會沒事的。"],["wrap","v.","包裝","She wrapped the gift in blue paper.","她用藍色紙包裝禮物。"],["yield","v.","產出；讓步","The farm yields a large harvest each year.","這座農場每年都有大豐收。"],["accompany","v.","陪伴","My sister accompanied me to the hospital.","我姊姊陪我去了醫院。"],["apologise","v.","道歉（英式）","He apologised for the mistake.","他為這個錯誤道歉。"],["approach","v.","接近","The train is approaching the station.","火車正在進站。"],["assist","v.","協助","Volunteers assisted the elderly across the street.","志工協助長者過馬路。"],["assume","v.","假定","Don't assume that everyone agrees.","不要假定每個人都同意。"]]},{"id":"w42","icon":"🌟","zh":"常用形容詞（一）","en":"Essential Adjectives I","basic":false,"words":[["able","adj.","能夠的","She is able to speak three languages.","她會說三種語言。"],["absolute","adj.","絕對的","I have absolute trust in her.","我絕對信任她。"],["active","adj.","活躍的","My grandfather is still very active.","我爺爺仍然很活躍。"],["actual","adj.","實際的","The actual cost was higher than expected.","實際成本比預期的高。"],["additional","adj.","額外的","There is an additional charge for delivery.","送貨要額外收費。"],["ancient","adj.","古老的","We visited an ancient temple in Kyoto.","我們參觀了京都一座古老的寺廟。"],["annual","adj.","每年的","The annual meeting is held in March.","年度會議在三月舉行。"],["basic","adj.","基本的","You need basic computer skills for this job.","這份工作需要基本的電腦技能。"],["brave","adj.","勇敢的","The brave boy saved his little sister.","那個勇敢的男孩救了他的妹妹。"],["brilliant","adj.","傑出的；明亮的","She had a brilliant idea for the project.","她為這個專案想出了一個絕妙的點子。"],["capable","adj.","有能力的","He is a capable and honest manager.","他是個有能力又誠實的經理。"],["certain","adj.","確定的","I am certain that I locked the door.","我確定我有鎖門。"],["clever","adj.","聰明的","The clever dog opened the door by itself.","這隻聰明的狗自己打開了門。"],["common","adj.","常見的","Colds are very common in winter.","感冒在冬天很常見。"],["complex","adj.","複雜的","The rules of the game are too complex.","這個遊戲的規則太複雜了。"],["complicated","adj.","複雜難懂的","Life is not as complicated as you think.","生活沒有你想的那麼複雜。"],["concerned","adj.","擔心的","Parents are concerned about school safety.","家長們擔心校園安全。"],["critical","adj.","關鍵的；批評的","Water is critical to all life.","水對所有生命都至關重要。"],["current","adj.","目前的","What is your current address?","你目前的地址是什麼？"],["daily","adj.","每日的","Daily exercise is good for your health.","每天運動對健康有益。"],["decent","adj.","像樣的，體面的","He earns a decent salary.","他領一份不錯的薪水。"],["definite","adj.","明確的","We need a definite answer by Friday.","我們需要在星期五前得到明確的答覆。"],["delicate","adj.","精緻的；易碎的","Be careful with the delicate glasses.","小心這些易碎的玻璃杯。"],["dense","adj.","濃密的；密集的","A dense fog covered the road.","濃霧籠罩著道路。"],["desperate","adj.","絕望的，迫切的","The desperate man asked for help.","絕望的男人尋求協助。"],["detailed","adj.","詳細的","She gave us a detailed report.","她給了我們一份詳細的報告。"],["difficult","adj.","困難的","The exam was more difficult than I expected.","這次考試比我預期的難。"],["direct","adj.","直接的","There is a direct flight to Osaka.","有直飛大阪的班機。"],["distant","adj.","遙遠的","The sound of thunder came from a distant hill.","雷聲從遠處的山丘傳來。"],["eager","adj.","渴望的","The students are eager to learn.","學生們渴望學習。"],["easy-going","adj.","隨和的","My boss is an easy-going person.","我老闆是個隨和的人。"],["effective","adj.","有效的","This is an effective way to learn words.","這是學單字的有效方法。"],["empty","adj.","空的","The refrigerator is empty.","冰箱是空的。"],["enormous","adj.","巨大的","An enormous crowd gathered outside.","一大群人聚集在外面。"],["entire","adj.","整個的","She spent the entire day reading.","她讀了一整天的書。"],["equal","adj.","平等的","All citizens are equal before the law.","所有公民在法律面前一律平等。"],["essential","adj.","必要的","Water is essential for life.","水是生命必需的。"],["exact","adj.","確切的","What is the exact time?","確切的時間是幾點？"],["excellent","adj.","優秀的","She got excellent grades this term.","她這學期成績優異。"],["exciting","adj.","令人興奮的","It was an exciting football match.","那是一場令人興奮的足球賽。"],["familiar","adj.","熟悉的","His face looks familiar to me.","他的臉看起來很眼熟。"],["famous","adj.","著名的","Taipei 101 is a famous building.","台北一零一是一棟著名的建築。"],["fancy","adj.","高級的；花俏的","They had dinner at a fancy restaurant.","他們在一家高級餐廳用餐。"],["fair","adj.","公平的","It is not fair to give him all the credit.","把所有功勞都給他並不公平。"],["fantastic","adj.","極好的","We had a fantastic holiday.","我們度過了一個很棒的假期。"],["flat","adj.","平坦的","The road is flat and easy to cycle.","這條路很平坦，很好騎車。"],["foolish","adj.","愚蠢的","It was foolish of me to trust him.","我相信他真是愚蠢。"],["foreign","adj.","外國的","She wants to work for a foreign company.","她想為外商公司工作。"],["former","adj.","以前的","The former president gave a speech.","前總統發表了演說。"],["fortunate","adj.","幸運的","We were fortunate to have good weather.","我們很幸運遇到好天氣。"],["frequent","adj.","頻繁的","He is a frequent visitor to Japan.","他是日本的常客。"],["friendly","adj.","友善的","The people here are very friendly.","這裡的人非常友善。"],["general","adj.","一般的，普遍的","The general opinion is in favor of the plan.","一般的意見是贊成這個計畫。"],["genuine","adj.","真正的","This is a genuine leather bag.","這是真皮包包。"],["gentle","adj.","溫和的","She spoke in a gentle voice.","她用溫柔的聲音說話。"],["giant","adj.","巨大的","A giant tree stood in the middle of the field.","一棵巨大的樹立在田野中間。"],["global","adj.","全球的","Global warming is a serious problem.","全球暖化是嚴重的問題。"]]},{"id":"w43","icon":"✨","zh":"常用形容詞（二）","en":"Essential Adjectives II","basic":false,"words":[["glad","adj.","高興的","I'm glad to hear that you passed the exam.","聽到你通過考試，我很高興。"],["harmful","adj.","有害的","Too much sugar is harmful to your teeth.","過多的糖對牙齒有害。"],["helpful","adj.","有幫助的","The staff at the hotel were very helpful.","飯店的員工非常樂於幫忙。"],["hopeful","adj.","懷抱希望的","We are hopeful that the weather will improve.","我們希望天氣會好轉。"],["huge","adj.","巨大的","A huge wave hit the beach.","一個巨浪襲向海灘。"],["ideal","adj.","理想的","This is an ideal place for a picnic.","這裡是野餐的理想地點。"],["immediate","adj.","立即的","We need an immediate answer.","我們需要立即的答覆。"],["important","adj.","重要的","It is important to drink enough water.","喝足夠的水很重要。"],["impressive","adj.","令人印象深刻的","Her speech was very impressive.","她的演說令人印象深刻。"],["independent","adj.","獨立的","She became independent after moving out.","她搬出去後變得獨立了。"],["individual","adj.","個別的","Each student has an individual desk.","每位學生都有各自的書桌。"],["informal","adj.","非正式的","We had an informal meeting over lunch.","我們在午餐時開了一個非正式的會議。"],["intelligent","adj.","聰明的","Dolphins are intelligent animals.","海豚是聰明的動物。"],["internal","adj.","內部的","The company has an internal training program.","公司有一套內部訓練計畫。"],["junior","adj.","資淺的；年少的","He is a junior member of the team.","他是團隊中資淺的成員。"],["keen","adj.","熱衷的","She is keen on learning French.","她熱衷於學法文。"],["late","adj.","遲到的；晚的","Sorry, I'm late for the meeting.","抱歉，我開會遲到了。"],["latest","adj.","最新的","Have you seen the latest movie?","你看過最新的電影嗎？"],["likely","adj.","可能的","It is likely to rain this afternoon.","今天下午很可能會下雨。"],["limited","adj.","有限的","We have limited time, so let's begin.","我們時間有限，開始吧。"],["literal","adj.","字面上的","What is the literal meaning of this word?","這個字的字面意思是什麼？"],["local","adj.","當地的","We tried some local food at the market.","我們在市場嘗了一些當地的食物。"],["lovely","adj.","可愛的，美好的","What a lovely garden you have!","你的花園真漂亮！"],["lucky","adj.","幸運的","She was lucky to win the first prize.","她很幸運得了頭獎。"],["main","adj.","主要的","The main problem is the lack of money.","主要的問題是缺錢。"],["massive","adj.","巨大的","A massive storm is coming.","一場巨大的暴風雨正在逼近。"],["mature","adj.","成熟的","She is very mature for her age.","以她的年紀來說，她非常成熟。"],["maximum","adj.","最大的","The maximum speed here is 60 km/h.","這裡的最高速限是每小時六十公里。"],["minimum","adj.","最小的","The minimum age to join is sixteen.","加入的最低年齡是十六歲。"],["minor","adj.","次要的，較小的","It's only a minor problem.","這只是個小問題。"],["modest","adj.","謙虛的","The winner was modest about his success.","得獎者對自己的成功很謙虛。"],["mysterious","adj.","神祕的","A mysterious letter arrived this morning.","今天早上收到一封神祕的信。"],["narrow","adj.","狹窄的","The street is too narrow for large trucks.","這條街太窄，大卡車進不去。"],["natural","adj.","自然的","The park is full of natural beauty.","這座公園充滿了自然之美。"],["necessary","adj.","必要的","It is necessary to book a table in advance.","事先訂位是必要的。"],["negative","adj.","負面的","Try not to have negative thoughts.","盡量不要有負面的想法。"],["neutral","adj.","中立的","He stayed neutral in the argument.","他在爭論中保持中立。"],["occasional","adj.","偶爾的","We had occasional showers this week.","這週偶爾有陣雨。"],["official","adj.","官方的","English is the official language of the meeting.","英文是這場會議的官方語言。"],["ordinary","adj.","普通的","It was an ordinary day at work.","那是工作中平凡的一天。"],["original","adj.","原本的；獨創的","The original plan was much better.","原本的計畫好多了。"],["outdoor","adj.","戶外的","We love outdoor activities like hiking.","我們喜愛健行之類的戶外活動。"],["overall","adj.","整體的","The overall result is good.","整體的結果很好。"],["particular","adj.","特別的","Is there any particular reason for this?","這有什麼特別的原因嗎？"],["permanent","adj.","永久的","He is looking for a permanent job.","他在找一份固定的工作。"],["personal","adj.","個人的","Please keep your personal things with you.","請隨身攜帶您的個人物品。"],["physical","adj.","身體的","Physical exercise helps reduce stress.","身體運動有助於減輕壓力。"],["pleasant","adj.","愉快的","We had a pleasant evening together.","我們一起度過了愉快的夜晚。"],["positive","adj.","正面的","A positive attitude helps a lot.","正面的態度很有幫助。"],["possible","adj.","可能的","Is it possible to change my seat?","可以換座位嗎？"],["powerful","adj.","強而有力的","A powerful engine drives the ship.","強大的引擎驅動著這艘船。"],["practical","adj.","實用的","This is a practical way to save time.","這是節省時間的實用方法。"],["precious","adj.","珍貴的","Time is more precious than money.","時間比金錢更珍貴。"],["previous","adj.","先前的","In my previous job, I worked in a bank.","我之前的工作是在銀行上班。"],["private","adj.","私人的","This is a private area, so please keep out.","這是私人區域，請勿進入。"],["probable","adj.","很可能的","It is probable that he will be late.","他很可能會遲到。"],["proper","adj.","適當的","Use the proper tool for the job.","用適當的工具來做這項工作。"],["public","adj.","公共的","Smoking is banned in public places.","公共場所禁止吸菸。"],["pure","adj.","純的","The bottle contains pure water.","這個瓶子裡裝的是純水。"],["rare","adj.","稀有的","This is a rare kind of bird.","這是一種稀有的鳥。"],["ready","adj.","準備好的","Dinner is ready, come and eat.","晚飯準備好了，來吃吧。"],["real","adj.","真實的","Is the story based on real events?","這個故事是以真實事件為基礎的嗎？"],["recent","adj.","最近的","She has made recent changes to the plan.","她最近對計畫做了修改。"],["regular","adj.","規律的","He goes to the gym on a regular basis.","他定期去健身房。"],["relevant","adj.","相關的","Only bring the relevant documents.","只帶相關的文件。"],["remote","adj.","偏遠的","They live in a remote mountain village.","他們住在偏遠的山村。"],["rough","adj.","粗糙的；粗略的","The sea was rough that night.","那晚的海面波濤洶湧。"]]},{"id":"w44","icon":"🧠","zh":"抽象名詞","en":"Abstract Nouns","basic":false,"words":[["ability","n.","能力","He has the ability to solve difficult problems.","他有解決困難問題的能力。"],["advantage","n.","優點，優勢","Speaking English is a big advantage in this job.","會說英文在這份工作上是很大的優勢。"],["disadvantage","n.","缺點","The main disadvantage is the high price.","主要的缺點是價格太高。"],["aim","n.","目標","The aim of the project is to help children.","這個計畫的目標是幫助孩子。"],["attempt","n.","嘗試","His first attempt to swim across failed.","他第一次游泳橫渡的嘗試失敗了。"],["belief","n.","信念","He has a strong belief in honesty.","他對誠實有堅定的信念。"],["chance","n.","機會","This is your chance to win a prize.","這是你贏得獎品的機會。"],["choice","n.","選擇","You have a choice between tea and coffee.","你可以在茶和咖啡之間選擇。"],["concern","n.","擔憂；關心的事","Safety is a major concern for parents.","安全是家長主要的關切。"],["condition","n.","狀況；條件","The old car is in good condition.","這輛舊車狀況良好。"],["confidence","n.","自信","She lacks confidence when speaking English.","她說英文時缺乏自信。"],["consequence","n.","後果","You must accept the consequences of your actions.","你必須接受自己行為的後果。"],["courage","n.","勇氣","It takes courage to say sorry.","說對不起需要勇氣。"],["custom","n.","習俗","It is a local custom to give red envelopes.","送紅包是當地的習俗。"],["danger","n.","危險","The sign warns of danger ahead.","標誌警告前方有危險。"],["demand","n.","需求","The demand for electric cars is growing.","對電動車的需求正在增加。"],["difference","n.","差異","What's the difference between these two words?","這兩個字有什麼差別？"],["difficulty","n.","困難","She had difficulty finding a job.","她很難找到工作。"],["effort","n.","努力","He made a great effort to learn Chinese.","他為學中文付出了很大的努力。"],["emergency","n.","緊急情況","Call 119 in an emergency.","緊急情況時請撥一一九。"],["error","n.","錯誤","The computer showed an error message.","電腦顯示了一則錯誤訊息。"],["excuse","n.","藉口","He made an excuse for being late.","他為遲到編了個藉口。"],["expectation","n.","期望","The result was better than our expectations.","結果比我們的預期還好。"],["failure","n.","失敗","Failure is the mother of success.","失敗為成功之母。"],["fear","n.","恐懼","She has a fear of heights.","她有懼高症。"],["future","n.","未來","What are your plans for the future?","你對未來有什麼計畫？"],["honor","n.","榮譽","It is an honor to meet you.","很榮幸認識你。"],["hope","n.","希望","There is still hope for a better future.","對更好的未來仍有希望。"],["idea","n.","點子，想法","That's a great idea!","這個想法太棒了！"],["importance","n.","重要性","Parents understand the importance of sleep.","父母了解睡眠的重要性。"],["intention","n.","意圖","I had no intention of hurting you.","我無意傷害你。"],["lack","n.","缺乏","The lack of sleep made him sick.","睡眠不足讓他生病了。"],["level","n.","程度；水準","What is your level of English?","你的英文程度如何？"],["luck","n.","運氣","Good luck with your interview!","祝你面試好運！"],["manner","n.","方式；禮貌","He has good manners.","他很有禮貌。"],["memory","n.","記憶","She has a good memory for faces.","她很會記人的臉。"],["method","n.","方法","This is an easy method to learn words.","這是學單字的簡單方法。"],["mistake","n.","錯誤","Everyone makes mistakes.","每個人都會犯錯。"],["motivation","n.","動機","He lacks motivation to study.","他缺乏讀書的動力。"],["necessity","n.","必需品","Water is a necessity of life.","水是生活必需品。"],["need","n.","需要","There is a need for more teachers.","需要更多的老師。"],["obstacle","n.","障礙","Lack of money is the biggest obstacle.","缺乏資金是最大的障礙。"],["occasion","n.","場合","Wear a suit for such an occasion.","這種場合要穿西裝。"],["opportunity","n.","機會","She took the opportunity to study abroad.","她把握機會出國留學。"],["option","n.","選項","You have three options to choose from.","你有三個選項可以選擇。"],["origin","n.","起源","The origin of this custom is unknown.","這個習俗的起源不明。"],["passion","n.","熱情","He has a passion for music.","他對音樂充滿熱情。"],["patience","n.","耐心","Teaching children requires a lot of patience.","教導孩子需要很多耐心。"],["pleasure","n.","樂趣；榮幸","It was a pleasure to work with you.","與你共事是我的榮幸。"],["possibility","n.","可能性","There is a possibility of rain tomorrow.","明天有可能會下雨。"],["power","n.","力量；權力","The president has great power.","總統擁有很大的權力。"],["pressure","n.","壓力","He works well under pressure.","他在壓力下工作表現良好。"],["problem","n.","問題","We have a problem with the computer.","我們的電腦有問題。"],["process","n.","過程","Learning a language is a long process.","學語言是一個漫長的過程。"],["progress","n.","進步","He is making good progress in English.","他的英文有很好的進步。"],["purpose","n.","目的","What is the purpose of your visit?","你來訪的目的是什麼？"],["quality","n.","品質","This shop sells good quality clothes.","這家店賣品質很好的衣服。"],["quantity","n.","數量","Buy in large quantities to save money.","大量購買可以省錢。"],["reaction","n.","反應","What was his reaction to the news?","他對這個消息有什麼反應？"],["reason","n.","理由","Do you know the reason for the delay?","你知道延誤的原因嗎？"],["responsibility","n.","責任","Taking care of a pet is a big responsibility.","照顧寵物是一項重大責任。"],["risk","n.","風險","Smoking increases the risk of heart disease.","吸菸增加罹患心臟病的風險。"],["role","n.","角色","Teachers play an important role in education.","老師在教育中扮演重要的角色。"],["rule","n.","規則","You must follow the rules of the game.","你必須遵守比賽規則。"],["solution","n.","解決辦法","We need to find a solution quickly.","我們需要快點找出解決辦法。"],["standard","n.","標準","The hotel meets international standards.","這間飯店符合國際標準。"]]},{"id":"w45","icon":"🔀","zh":"連接詞與轉折用語","en":"Linking Words & Adverbs","basic":false,"words":[["although","conj.","雖然","Although he was tired, he kept working.","雖然他很累，他還是繼續工作。"],["because","conj.","因為","I stayed home because I was sick.","我因為生病待在家。"],["since","conj.","自從；既然","Since it's raining, let's stay inside.","既然在下雨，我們就待在室內吧。"],["while","conj.","當…時；然而","While I was cooking, he set the table.","我煮飯時，他擺好了餐桌。"],["whereas","conj.","然而（對比）","He likes tea, whereas I prefer coffee.","他喜歡茶，而我比較喜歡咖啡。"],["unless","conj.","除非","You will fail unless you study harder.","除非你更用功，否則會不及格。"],["until","conj.","直到","Wait here until I come back.","在這裡等到我回來。"],["as soon as","conj.","一…就","Call me as soon as you arrive.","你一到就打電話給我。"],["as long as","conj.","只要","You can stay as long as you like.","只要你喜歡，可以一直待著。"],["even though","conj.","即使","Even though it was raining, we went out.","即使下著雨，我們還是出門了。"],["so that","conj.","以便","Speak slowly so that everyone can understand.","說慢一點，好讓大家都聽得懂。"],["in case","conj.","以防萬一","Take an umbrella in case it rains.","帶把傘以防下雨。"],["however","adv.","然而","He was tired. However, he kept walking.","他累了。然而，他繼續往前走。"],["therefore","adv.","因此","It rained; therefore, the match was cancelled.","下雨了，因此比賽取消了。"],["moreover","adv.","此外","The room is cheap. Moreover, it is very clean.","這房間便宜，而且非常乾淨。"],["furthermore","adv.","再者","It is too far. Furthermore, it is expensive.","那裡太遠了，而且很貴。"],["nevertheless","adv.","儘管如此","It was hard; nevertheless, we finished it.","這很難，儘管如此我們還是完成了。"],["otherwise","adv.","否則","Hurry up, otherwise we'll miss the train.","快點，否則我們會錯過火車。"],["instead","adv.","反而","She didn't go out; instead, she stayed home.","她沒有出門，反而留在家裡。"],["meanwhile","adv.","同時","Cook the rice. Meanwhile, I'll cut the vegetables.","你煮飯，同時我來切菜。"],["afterwards","adv.","之後","We had dinner and went for a walk afterwards.","我們吃了晚餐，之後去散步。"],["eventually","adv.","最終","He eventually found a job in Taipei.","他最後在台北找到了工作。"],["firstly","adv.","首先","Firstly, I'd like to thank everyone.","首先，我想感謝大家。"],["secondly","adv.","其次","Secondly, we need more time.","其次，我們需要更多時間。"],["in addition","adv.","此外","In addition, the hotel provides free breakfast.","此外，飯店還提供免費早餐。"],["in fact","adv.","事實上","In fact, I have never been to Japan.","事實上，我從來沒去過日本。"],["in conclusion","adv.","總結來說","In conclusion, exercise is good for health.","總結來說，運動有益健康。"],["in other words","adv.","換句話說","He is a vegetarian. In other words, he doesn't eat meat.","他是素食者，換句話說，他不吃肉。"],["for example","adv.","舉例來說","Many fruits, for example, apples, are healthy.","許多水果，例如蘋果，都很健康。"],["for instance","adv.","例如","Some animals, for instance, bats, sleep upside down.","有些動物，例如蝙蝠，會倒掛睡覺。"],["on the contrary","adv.","正好相反","I'm not tired. On the contrary, I feel great.","我不累，正好相反，我覺得精神很好。"],["by contrast","adv.","相比之下","By contrast, the south is warm all year.","相比之下，南部全年溫暖。"],["similarly","adv.","同樣地","Similarly, the second plan has some risks.","同樣地，第二個計畫也有一些風險。"],["certainly","adv.","當然","I will certainly be there.","我當然會到場。"],["definitely","adv.","肯定地","I will definitely visit you next year.","我明年一定會去看你。"],["probably","adv.","可能","It will probably rain tomorrow.","明天很可能會下雨。"],["perhaps","adv.","也許","Perhaps we should leave earlier.","也許我們該早點出發。"],["apparently","adv.","顯然地，據說","Apparently, the store closed last week.","據說那家店上週關門了。"],["obviously","adv.","明顯地","He was obviously nervous.","他顯然很緊張。"],["fortunately","adv.","幸運地","Fortunately, no one was hurt.","幸運的是，沒有人受傷。"],["unfortunately","adv.","不幸地","Unfortunately, the flight was cancelled.","不幸的是，班機被取消了。"],["surprisingly","adv.","令人驚訝地","Surprisingly, the test was easy.","令人驚訝的是，考試很簡單。"],["hardly","adv.","幾乎不","I could hardly hear the speaker.","我幾乎聽不到演講者說話。"],["nearly","adv.","幾乎","The bus was nearly full.","公車幾乎客滿了。"],["almost","adv.","幾乎","I almost forgot my keys.","我差點忘了帶鑰匙。"],["rather","adv.","相當，頗","It's rather cold today.","今天相當冷。"],["fairly","adv.","還算，相當","The test was fairly easy.","考試還算簡單。"],["extremely","adv.","極其","The soup was extremely hot.","這碗湯燙得不得了。"],["totally","adv.","完全地","I totally agree with you.","我完全同意你。"],["exactly","adv.","確切地","That's exactly what I meant.","那正是我的意思。"],["recently","adv.","最近","I have been busy recently.","我最近一直很忙。"],["lately","adv.","近來","Have you seen him lately?","你最近有見到他嗎？"],["already","adv.","已經","I have already finished my lunch.","我已經吃完午餐了。"],["yet","adv.","還（沒）","She hasn't called me yet.","她還沒打電話給我。"],["still","adv.","仍然","He is still sleeping.","他還在睡覺。"],["suddenly","adv.","突然","Suddenly, the lights went out.","突然間，燈都熄了。"],["immediately","adv.","立即","Call the police immediately.","立刻報警。"],["gradually","adv.","逐漸地","The weather gradually became warmer.","天氣逐漸變暖。"]]},{"id":"w46","icon":"🔧","zh":"片語動詞（三）","en":"Phrasal Verbs III","basic":false,"words":[["back up","phr. v.","備份；支持","Remember to back up your files every week.","記得每週備份你的檔案。"],["blow up","phr. v.","爆炸；吹脹","The balloon blew up with a loud bang.","氣球砰的一聲爆了。"],["build up","phr. v.","逐漸增強","You need to build up your strength slowly.","你需要慢慢增強體力。"],["burn down","phr. v.","燒毀","The old house burned down last night.","那棟老房子昨晚燒毀了。"],["calm down","phr. v.","冷靜下來","Calm down and tell me what happened.","冷靜下來，告訴我發生了什麼事。"],["catch up","phr. v.","趕上","Run faster, and you'll catch up with them.","跑快一點，你就能趕上他們。"],["cheer up","phr. v.","振作起來","Cheer up! Things will get better.","振作起來！事情會好轉的。"],["clean up","phr. v.","清理乾淨","Let's clean up the classroom after the party.","派對後我們把教室打掃乾淨吧。"],["come across","phr. v.","偶然遇到","I came across an old photo in a drawer.","我在抽屜裡偶然發現一張舊照片。"],["come back","phr. v.","回來","When will you come back from Japan?","你什麼時候從日本回來？"],["come down with","phr. v.","染上（病）","She came down with the flu last week.","她上週得了流感。"],["count on","phr. v.","依賴，指望","You can count on me to help.","你可以指望我幫忙。"],["cut off","phr. v.","切斷","The storm cut off the power in the village.","暴風雨切斷了村莊的電力。"],["deal with","phr. v.","處理","How do you deal with angry customers?","你如何處理生氣的顧客？"],["die out","phr. v.","滅絕","Many kinds of animals are dying out.","許多種動物正在絕種。"],["dress up","phr. v.","盛裝打扮","Everyone dressed up for the party.","每個人都為派對盛裝打扮。"],["drop by","phr. v.","順道拜訪","Drop by my house when you have time.","你有空時順道來我家坐坐。"],["eat out","phr. v.","外出用餐","We eat out once a week.","我們一週外出用餐一次。"],["fall apart","phr. v.","散掉，崩潰","The old chair fell apart when he sat on it.","他一坐上去，那張舊椅子就散了。"],["get away","phr. v.","逃離；度假","We need to get away from the city this weekend.","這個週末我們需要離開城市透透氣。"],["get by","phr. v.","勉強過活","She can get by with a little English.","她靠一點點英文也能應付過去。"],["get in","phr. v.","進入；上（車）","Get in the car, and I'll drive you home.","上車吧，我載你回家。"],["get into","phr. v.","進入；考上","She got into a top university.","她考上了一所頂尖大學。"],["get through","phr. v.","度過；打通","We got through the hard times together.","我們一起度過了艱難的時期。"],["give away","phr. v.","贈送；洩漏","They gave away free tickets to the first hundred customers.","他們把免費入場券送給前一百位顧客。"],["give back","phr. v.","歸還","Please give back the book by Friday.","請在星期五前歸還這本書。"],["give in","phr. v.","屈服","He finally gave in and let them go.","他終於讓步，讓他們去了。"],["go ahead","phr. v.","請便；進行","Go ahead and start the meeting.","請開始會議吧。"],["go out","phr. v.","外出；熄滅","The lights went out during the storm.","暴風雨中燈熄了。"],["go through","phr. v.","經歷；仔細檢查","She went through a difficult time last year.","她去年經歷了一段艱難的時期。"],["hang out","phr. v.","閒晃，和朋友出去玩","We hang out at the mall after school.","我們放學後在購物中心閒逛。"],["hang up","phr. v.","掛斷電話","She hung up before I could say goodbye.","她在我說再見之前就掛斷了。"],["hold up","phr. v.","耽擱；搶劫","The traffic held us up for an hour.","交通耽擱了我們一個小時。"],["join in","phr. v.","加入","Please join in the game.","請一起加入遊戲。"],["keep on","phr. v.","持續","Keep on trying and you'll succeed.","繼續努力，你會成功的。"],["knock down","phr. v.","撞倒；拆除","They will knock down the old building.","他們將拆除那棟舊大樓。"],["lay off","phr. v.","資遣","The company laid off fifty workers.","公司資遣了五十名員工。"],["leave out","phr. v.","遺漏","Don't leave out any details.","不要遺漏任何細節。"],["let in","phr. v.","讓…進入","Please let the cat in.","請讓貓進來。"],["line up","phr. v.","排隊","Students lined up at the gate.","學生們在門口排隊。"],["log in","phr. v.","登入","Log in with your username and password.","請用帳號和密碼登入。"],["log out","phr. v.","登出","Don't forget to log out when you finish.","用完別忘了登出。"],["look into","phr. v.","調查","The police are looking into the case.","警方正在調查這個案件。"],["look out","phr. v.","當心","Look out! There's a car coming.","小心！有車來了。"],["make up for","phr. v.","彌補","I'll make up for the lost time.","我會彌補失去的時間。"],["move in","phr. v.","搬入","We moved in last month.","我們上個月搬進來的。"],["move on","phr. v.","向前走；繼續","It's time to move on to the next topic.","該進入下一個主題了。"],["move out","phr. v.","搬出","He moved out of his parents' house at twenty.","他二十歲時搬出父母家。"],["pass out","phr. v.","昏倒；發放","He passed out in the heat.","他在高溫中昏倒了。"],["pay for","phr. v.","付款","Who paid for the dinner?","誰付了晚餐的錢？"],["pick out","phr. v.","挑選出","Pick out a gift for your mother.","挑一份禮物給你媽媽。"],["plug in","phr. v.","插上插頭","Plug in the charger.","把充電器插上。"],["point to","phr. v.","指向","He pointed to the map.","他指向地圖。"],["pull over","phr. v.","靠邊停車","The police officer told him to pull over.","警察要他靠邊停車。"],["put away","phr. v.","收好","Put your toys away before dinner.","晚餐前把你的玩具收好。"],["put down","phr. v.","放下；記下","Put down your pens and listen.","放下你的筆，聽好。"],["put together","phr. v.","組裝；整理","He put together a bookshelf by himself.","他自己組裝了一個書架。"],["run away","phr. v.","逃跑","The boy ran away from the dog.","男孩從狗身邊跑開。"],["run down","phr. v.","撞倒；耗盡電力","My phone battery has run down.","我手機的電池沒電了。"],["sell out","phr. v.","賣完","The concert tickets sold out in minutes.","演唱會門票幾分鐘內就賣完了。"],["send off","phr. v.","寄出；送別","I sent off the parcel this morning.","我今天早上寄出了包裹。"],["settle down","phr. v.","安頓下來；安靜","The children settled down and began to read.","孩子們安靜下來開始閱讀。"],["shut down","phr. v.","關閉","The factory shut down last year.","那間工廠去年關閉了。"],["sign up","phr. v.","報名","I signed up for a cooking class.","我報名了烹飪課。"],["sit down","phr. v.","坐下","Please sit down and relax.","請坐下來放鬆一下。"],["slow down","phr. v.","減速","Slow down. The road is wet.","慢一點，路面很濕。"],["stand for","phr. v.","代表；容忍","What does this sign stand for?","這個標誌代表什麼？"],["stand out","phr. v.","突出","Her red coat stood out in the crowd.","她的紅外套在人群中很顯眼。"],["stay up","phr. v.","熬夜","I stayed up late to finish the report.","我熬夜完成了報告。"],["take away","phr. v.","拿走；外帶","Two hamburgers to take away, please.","請給我兩個漢堡外帶。"],["take over","phr. v.","接管","She took over the business from her father.","她從父親手中接管了生意。"],["take up","phr. v.","開始從事；佔用","He took up jogging last year.","他去年開始慢跑。"],["talk over","phr. v.","商討","Let's talk it over tonight.","我們今晚商量一下吧。"],["tell off","phr. v.","責罵","The teacher told him off for being late.","老師因為他遲到而責罵他。"],["think over","phr. v.","仔細考慮","Think it over before you decide.","決定之前先仔細考慮。"],["throw up","phr. v.","嘔吐","The baby threw up after drinking the milk.","寶寶喝完奶後吐了。"],["turn around","phr. v.","轉身","He turned around and waved.","他轉過身揮了揮手。"],["turn up","phr. v.","出現；調大","Please turn up the volume.","請把音量調大。"],["use up","phr. v.","用完","We used up all the paper.","我們把紙都用完了。"],["watch out","phr. v.","小心","Watch out for the hole in the road.","小心路上的洞。"]]},{"id":"w47","icon":"📎","zh":"動詞加介系詞搭配","en":"Verb + Preposition Patterns","basic":false,"words":[["agree with","phr.","同意（某人）","I agree with you completely.","我完全同意你。"],["agree to","phr.","同意（提議）","He agreed to our plan.","他同意了我們的計畫。"],["argue with","phr.","與…爭論","Don't argue with your brother.","不要跟你哥哥爭吵。"],["arrive at","phr.","抵達（小地點）","We arrived at the station at noon.","我們中午抵達車站。"],["arrive in","phr.","抵達（大地點）","They arrived in Tokyo last night.","他們昨晚抵達東京。"],["ask for","phr.","要求","He asked for a glass of water.","他要了一杯水。"],["believe in","phr.","相信（存在）","Do you believe in ghosts?","你相信有鬼嗎？"],["belong to","phr.","屬於","This bag belongs to my sister.","這個包包屬於我姊姊。"],["care for","phr.","照顧；喜歡","She cares for her sick mother.","她照顧生病的母親。"],["complain about","phr.","抱怨","He complained about the noise.","他抱怨噪音。"],["concentrate on","phr.","專心於","Concentrate on your work.","專心做你的工作。"],["consist of","phr.","由…組成","The team consists of six members.","這個團隊由六名成員組成。"],["dream of","phr.","夢想","She dreams of being a singer.","她夢想成為歌手。"],["escape from","phr.","從…逃出","The prisoner escaped from jail.","囚犯從監獄逃脫。"],["happen to","phr.","發生在…身上","What happened to your car?","你的車怎麼了？"],["hear about","phr.","聽說","Did you hear about the accident?","你聽說那場意外了嗎？"],["hear from","phr.","收到…的消息","I haven't heard from him for weeks.","我好幾個星期沒收到他的消息了。"],["insist on","phr.","堅持","She insisted on paying the bill.","她堅持付帳。"],["laugh at","phr.","嘲笑","Don't laugh at other people's mistakes.","不要嘲笑別人的錯誤。"],["listen to","phr.","聽","I like to listen to music while I work.","我喜歡邊工作邊聽音樂。"],["look at","phr.","看","Look at the sky. It's so blue.","看看天空，好藍。"],["object to","phr.","反對","Many people object to the new tax.","許多人反對新稅。"],["prevent from","phr.","阻止","Nothing can prevent me from going.","沒有什麼能阻止我去。"],["protect from","phr.","保護免於","Sunscreen protects your skin from the sun.","防曬乳保護你的皮膚不受陽光傷害。"],["recover from","phr.","從…恢復","He is recovering from an operation.","他正從手術中康復。"],["search for","phr.","尋找","They searched for the missing child.","他們尋找失蹤的孩子。"],["shout at","phr.","對…大吼","Don't shout at the children.","不要對孩子大吼。"],["smile at","phr.","對…微笑","She smiled at the baby.","她對寶寶微笑。"],["specialize in","phr.","專精於","The doctor specializes in children's diseases.","這位醫生專攻兒童疾病。"],["succeed in","phr.","在…成功","She succeeded in passing the test.","她成功通過了考試。"],["suffer from","phr.","受…之苦","He suffers from headaches.","他飽受頭痛之苦。"],["talk about","phr.","談論","What are you talking about?","你在說什麼？"],["think of","phr.","想到；認為","What do you think of this idea?","你覺得這個點子如何？"],["wait for","phr.","等待","I'm waiting for the bus.","我在等公車。"],["worry about","phr.","擔心","Don't worry about the exam.","不要擔心考試。"],["write to","phr.","寫信給","I wrote to my aunt yesterday.","我昨天寫信給我阿姨。"],["afraid of","phr.","害怕","He is afraid of spiders.","他怕蜘蛛。"],["angry with","phr.","對（人）生氣","She was angry with her brother.","她對哥哥很生氣。"],["angry about","phr.","對（事）生氣","He was angry about the delay.","他對延誤感到生氣。"],["aware of","phr.","知道，察覺","Are you aware of the risks?","你知道有這些風險嗎？"],["bored with","phr.","對…感到厭倦","I'm bored with this game.","我對這個遊戲感到厭倦。"],["capable of","phr.","有能力做","She is capable of doing better.","她有能力做得更好。"],["certain of","phr.","確信","I'm certain of his honesty.","我確信他的誠實。"],["crowded with","phr.","擠滿","The street was crowded with tourists.","街上擠滿了觀光客。"],["different from","phr.","與…不同","This phone is different from that one.","這支手機和那支不同。"],["disappointed with","phr.","對…失望","He was disappointed with the result.","他對結果感到失望。"],["excited about","phr.","對…興奮","The kids are excited about the trip.","孩子們對旅行感到興奮。"],["famous for","phr.","以…聞名","Tainan is famous for its food.","台南以美食聞名。"],["fond of","phr.","喜愛","She is fond of animals.","她喜愛動物。"],["full of","phr.","充滿","The box is full of old photos.","盒子裡裝滿舊照片。"],["good at","phr.","擅長","He is good at math.","他很擅長數學。"],["interested in","phr.","對…有興趣","I'm interested in photography.","我對攝影有興趣。"],["jealous of","phr.","嫉妒","She was jealous of her friend's success.","她嫉妒朋友的成功。"],["kind to","phr.","對…友善","The nurse was kind to all patients.","護理師對所有病人都很親切。"],["late for","phr.","遲到","Don't be late for the meeting.","開會不要遲到。"],["pleased with","phr.","對…滿意","I'm pleased with your progress.","我對你的進步很滿意。"],["proud of","phr.","以…為榮","Parents are proud of their children.","父母以孩子為榮。"],["responsible for","phr.","對…負責","He is responsible for the sales team.","他負責業務團隊。"],["satisfied with","phr.","對…滿意","Customers were satisfied with the service.","顧客對服務很滿意。"],["scared of","phr.","害怕","The boy is scared of the dark.","男孩怕黑。"],["similar to","phr.","與…相似","Your bag is similar to mine.","你的包包和我的很像。"],["sorry for","phr.","對…抱歉","I'm sorry for the trouble.","對於造成的麻煩我很抱歉。"],["surprised at","phr.","對…驚訝","She was surprised at the news.","她對這個消息感到驚訝。"],["tired of","phr.","厭煩","I'm tired of eating the same food.","我吃膩了同樣的食物。"],["worried about","phr.","擔心","He is worried about his exam.","他擔心他的考試。"]]},{"id":"u1","icon":"👋 have lunch","","吃午餐","We have lunch at noon.","我們中午吃午餐。"],["go home","","回家","Let's go home.","我們回家吧。"],["watch TV","","看電視","I watch TV after dinner.","我晚餐後看電視。"],["do homework","","寫功課","I do homework in the evening.","我晚上寫功課。"],["go to bed","","上床睡覺","I go to bed at eleven.","我十一點上床睡覺。"]]},{"id":"u7","icon":"⏰","zh":"時間與星期","en":"Time & Days","basic":true,"words":[["today","","今天","Today is a sunny day.","今天是晴天。"],["tomorrow","","明天","See you tomorrow!","明天見！"],["yesterday","","昨天","I was tired yesterday.","我昨天很累。"],["morning","","早上","I run in the morning.","我早上跑步。"],["evening","","晚上，傍晚","We eat dinner in the evening.","我們晚上吃晚餐。"],["week","","週，星期","I have English class every week.","我每週都有英文課。"],["weekend","","週末","What do you do on the weekend?","你週末做什麼？"],["Monday","","星期一","I have a test on Monday.","我星期一有考試。"],["What time is it?","","現在幾點？","Excuse me, what time is it?","不好意思，現在幾點？"],["o'clock","","…點鐘","The movie starts at eight o'clock.","電影八點開始。"]]},{"id":"u8","icon":"🏃","zh":"常用動詞","en":"Common Verbs","basic":true,"words":[["eat","","吃","We eat dinner at six.","我們六點吃晚餐。"],["drink","","喝","I drink water every day.","我每天喝水。"],["go","","去","I go to the park on Sundays.","我星期日去公園。"],["come","","來","Please come here.","請過來這裡。"],["want","","想要","I want a new phone.","我想要一支新手機。"],["need","","需要","I need some sleep.","我需要睡一下。"],["see","","看見","I see a bird.","我看到一隻鳥。"],["know","","知道，認識","I don't know his name.","我不知道他的名字。"],["speak","","說（語言）","Do you speak English?","你會說英文嗎？"],["help","","幫忙，幫助","Can you help me?","你可以幫我嗎？"]]},{"id":"u9","icon":"😊","zh":"心情與感受","en":"Feelings","basic":true,"words":[["happy","","開心的","I'm so happy to see you.","見到你我好開心。"],["sad","","難過的，悲傷的","The movie is very sad.","這部電影很悲傷。"],["tired","","累的","I'm tired after work.","下班後我很累。"],["angry","","生氣的","Why are you angry?","你為什麼生氣？"],["hungry","","餓的","I'm hungry. Let's eat!","我餓了。我們吃飯吧！"],["thirsty","","口渴的","I'm thirsty. I need water.","我口渴了。我需要水。"],["scared","","害怕的","I'm scared of dogs.","我怕狗。"],["excited","","興奮的，很期待的","We are excited about the trip.","我們對這趟旅行很興奮。"],["bored","","無聊的","I'm bored. Let's watch a movie.","我好無聊。我們來看電影吧。"],["worried","","擔心的","My mom is worried about me.","我媽媽很擔心我。"]]},{"id":"u10","icon":"🛍️","zh":"購物與旅行","en":"Shopping & Travel","basic":true,"words":[["How much is this?","","這個多少錢？","Excuse me, how much is this?","不好意思，這個多少錢？"],["too expensive","","太貴了","This bag is too expensive.","這個包包太貴了。"],["I'll take it","","我要買這個","It looks great. I'll take it.","看起來很棒，我要買了。"],["Can I pay by card?","","我可以刷卡嗎？","Sorry, can I pay by card?","不好意思，我可以刷卡嗎？"],["ticket","","票","I need a ticket to Kaohsiung.","我需要一張去高雄的票。"],["airport","","機場","The airport is far from here.","機場離這裡很遠。"],["hotel","","飯店","Our hotel is near the station.","我們的飯店靠近車站。"],["passport","","護照","Don't forget your passport.","別忘了你的護照。"],["Where is the bathroom?","","洗手間在哪裡？","Excuse me, where is the bathroom?","不好意思，洗手間在哪裡？"],["I'm lost","","我迷路了","I'm lost. Can you help me?","我迷路了。你可以幫我嗎？"]]},{"id":"u11","icon":"📺","zh":"影集常聽到的話","en":"TV Show Phrases","basic":true,"words":[["I'm kidding.","","我開玩笑的。","Relax, I'm kidding!","放輕鬆，我開玩笑的！"],["No way!","","不會吧！怎麼可能！","You won the prize? No way!","你中獎了？不會吧！"],["Are you serious?","","你是認真的嗎？","You quit your job? Are you serious?","你辭職了？你是認真的嗎？"],["What's up?","","最近怎麼樣？怎麼了？","Hey, what's up?","嘿，最近怎麼樣？"],["Take it easy.","","放輕鬆，別緊張。","Take it easy. Everything will be fine.","別緊張，一切都會沒事的。"],["Calm down","","冷靜下來","Calm down and tell me what happened.","冷靜下來，告訴我發生了什麼事。"],["Never mind.","","算了，沒關係。","Never mind, I'll do it myself.","算了，我自己來。"],["I got it.","","我懂了。我知道了。","I got it. Thanks!","我懂了。謝謝！"],["Come on!","","拜託！快點啦！","Come on, we're going to be late!","快點啦，我們要遲到了！"],["I can't believe it!","","我不敢相信！","I can't believe it! We won!","我不敢相信！我們贏了！"]]}],"lessons":[{"id":"m1","icon":"⏱️","zh":"現在簡單式與現在進行式","intro":"現在簡單式說「習慣、事實、時刻表」；現在進行式說「此刻正在發生」或「最近暫時的狀況」。有些動詞表示狀態或想法（know, like, want, understand, believe），通常不用進行式。","steps":[{"h":"第一步：先分清楚「常態」和「此刻」","p":"中文說「我吃早餐」，可能是每天的習慣，也可能是現在正在吃，動詞完全一樣。英文一定要用動詞的形態分清楚。現在簡單式（V 或 V-s）說的是習慣、事實、時刻表，例如 I get up at six. / The sun rises in the east.。現在進行式（am / is / are + V-ing）說的是「說話當下正在進行」或「最近一段時間暫時的狀況」，例如 I am eating breakfast now. / She is studying for the GEPT this month.。"},{"h":"第二步：現在簡單式的形式","p":"第三人稱單數 (he, she, it, 單一個名字) 的動詞要加 s 或 es：like 變 likes，watch 變 watches，study 變 studies，have 變 has。否定用 don't / doesn't + 原形動詞，問句用 Do / Does 開頭。請注意 does 或 doesn't 之後，動詞已經回到原形，所以不能再加 s。"},{"h":"第三步：現在進行式的形式與拼字","p":"be 動詞要隨主詞變化 (I am, he is, they are)，動詞加 -ing。去掉不發音的 e 再加 ing (make 變 making)；短母音加單子音要重複字母 (run 變 running, sit 變 sitting)。否定是 be + not + V-ing，問句是把 be 動詞移到主詞前面。"},{"h":"第四步：不能用進行式的狀態動詞","p":"know, understand, believe, like, love, hate, want, need, prefer, own, belong, seem 等動詞表示「狀態」或「想法」，不是動作，所以即使是「現在」也用簡單式。要說「我現在懂了」，是 I understand now.，不是 I am understanding now.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 忘了加 s：He like coffee. 應改成 He likes coffee.。2. does 之後又加 s：Does she likes tea? 應改成 Does she like tea?。3. 缺 be 動詞：She studying now. 應改成 She is studying now.，中文沒有這個 be 動詞，所以特別容易漏。4. 頻率副詞 (always, usually, never) 放在一般動詞前、be 動詞後：He always is late 應改成 He is always late.。"},"table":{"t":"兩個時態一次比較","h":["時態","形式","用法","時間詞"],"r":[["現在簡單式","V / V-s","習慣、事實、時刻表","usually, often, every day, on Sundays"],["現在進行式","am / is / are + V-ing","正在進行、暫時狀況","now, at the moment, today, Look!, Listen!"]]},"examples":[["My mother goes to the market every morning.","我媽媽每天早上都去市場。"],["The train leaves at seven thirty.","火車七點半開。"],["Look! It is raining outside.","你看，外面正在下雨。"],["He is staying with his uncle this week.","他這週暫住在叔叔家。"],["I don't know the answer.","我不知道答案。"],["What are you reading now?","你現在在讀什麼？"],["Cats sleep for about fourteen hours a day.","貓一天大約睡十四個小時。"],["My sister is learning to drive these days.","我妹妹最近在學開車。"]],"key":["現在簡單式：習慣、事實、時刻表；第三人稱單數動詞加 s / es。","現在進行式：am / is / are + V-ing，說正在發生的事或暫時的狀況。","know, like, want, need, understand 等狀態動詞不用進行式。","does / doesn't 之後動詞用原形。"],"basic":false,"ex":[{"q":"He ___ his teeth twice a day.","o":["brush","brushes","is brush","brushing"],"a":"brushes","e":"he 是第三人稱單數，習慣用簡單式，brush 以 sh 結尾要加 es。"},{"q":"Be quiet! The baby ___ .","o":["sleeps","sleep","is sleeping","slept"],"a":"is sleeping","e":"Be quiet 表示此刻，用現在進行式 is sleeping。"},{"q":"I ___ what you are saying.","o":["am understanding","understands","understood","understand"],"a":"understand","e":"understand 是狀態動詞，不用進行式；主詞 I 用原形。"},{"q":"She ___ to work by bus every day.","o":["goes","is going","go","going"],"a":"goes","e":"every day 表示習慣，she 搭配 goes。"},{"q":"Listen! The baby ___ in the next room.","o":["cries","cry","is crying","cried"],"a":"is crying","e":"Listen! 表示此刻正在發生的事，用現在進行式 is crying。"},{"q":"My father usually ___ the newspaper after breakfast.","o":["is reading","read","reading","reads"],"a":"reads","e":"usually 表示習慣，用現在簡單式；father 是第三人稱單數，所以 reads。"},{"q":"Water ___ at 100 degrees Celsius.","o":["boils","is boiling","boiled","boil"],"a":"boils","e":"科學事實用現在簡單式；water 是單數，所以 boils。"},{"q":"I can't talk now. I ___ dinner.","o":["cook","am cooking","cooks","have cook"],"a":"am cooking","e":"now 表示正在做的事，用現在進行式 am cooking。"},{"q":"She ___ TV very often.","o":["doesn't watch","isn't watching","don't watch","doesn't watches"],"a":"doesn't watch","e":"very often 表示習慣，用現在簡單式否定；she 用 doesn't，後面接原形動詞。"},{"q":"___ you usually walk to school?","o":["Are","Does","Do","Have"],"a":"Do","e":"一般動詞的習慣問句，主詞是 you，用 Do 開頭。"}]},{"id":"m2","icon":"⏪","zh":"過去簡單式與過去進行式","intro":"過去簡單式說「過去某時已經完成的事」；過去進行式說「過去某個時間點正在進行的動作」。兩個動作同時出現時，長的、背景的動作用過去進行式，短的、打斷的動作用過去簡單式。","steps":[{"h":"第一步：過去簡單式說「已完成的過去事件」","p":"過去簡單式用來說明「在過去某個明確的時間發生、已經結束」的事。常搭配 yesterday, last week, in 2019, two days ago 等時間詞。規則動詞加 -ed (played, watched)；以 e 結尾只加 d (lived)；子音加 y 去 y 加 ied (studied)；不規則動詞要背，例如 go 變 went，eat 變 ate，see 變 saw，buy 變 bought。"},{"h":"第二步：過去進行式說「當時正在做」","p":"過去進行式 (was / were + V-ing) 描述過去某個時間點「正在進行」的動作，強調過程，不強調結果。例如 At eight last night, I was doing my homework.。單數主詞 (I, he, she, it) 用 was，you / we / they 和複數用 were。"},{"h":"第三步：兩個動作一起出現","p":"長的、背景的動作用過去進行式，短的、突然打斷的動作用過去簡單式。While I was walking home, it started to rain.（走路是持續的，下雨是突然的）。當兩個動作接連發生時，都用過去簡單式：When he arrived, we started dinner.（先到才開始，是先後順序）。"},{"h":"第四步：否定句與問句","p":"過去簡單式的否定與問句用 did / didn't，動詞回到原形：Did you see him? / I didn't see him.。但 be 動詞不需要 did：Were you at home? / He wasn't there.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. did 之後又用過去式：Did you went there? 應改成 Did you go there?。2. 忘記不規則動詞：I buyed a bag. 應改成 I bought a bag.。3. 用現在完成式搭配 yesterday：I have seen him yesterday. 應改成 I saw him yesterday.。4. 進行式漏掉 be 動詞：I watching TV when he came. 應改成 I was watching TV when he came.。"},"table":{"t":"過去簡單式與過去進行式","h":["時態","形式","重點","例句"],"r":[["過去簡單式","V-ed / 不規則","已完成的事件","I cleaned my room yesterday."],["過去進行式","was / were + V-ing","過去某時正在進行","I was cleaning my room at nine."]]},"examples":[["We visited the museum last Sunday.","我們上週日參觀了博物館。"],["She was cooking dinner when the phone rang.","電話響時她正在煮晚餐。"],["It rained heavily all night.","雨下了一整夜。"],["Were you sleeping at midnight?","午夜時你在睡覺嗎？"],["They didn't go to school yesterday.","他們昨天沒有去上學。"],["While I was taking a bath, someone knocked on the door.","我在洗澡時，有人敲了門。"],["He lost his keys and called his wife.","他弄丟了鑰匙，打電話給他太太。"],["The children were playing in the yard all afternoon.","孩子們整個下午都在院子裡玩。"]],"key":["過去簡單式：過去已完成的事，搭配 yesterday, ago, last…。","過去進行式：was / were + V-ing，說過去某時「正在」做的事。","while + 進行式（背景動作），when + 簡單式（打斷的動作）。","did / didn't 之後動詞用原形。"],"basic":false,"ex":[{"q":"He ___ his key when he was running to the station.","o":["loses","lost","was lose","has lost"],"a":"lost","e":"running to the station 是背景，弄丟鑰匙是一次性事件，且是過去發生，用 lost。"},{"q":"My parents ___ dinner at seven o'clock last night.","o":["is having","have","has had","were having"],"a":"were having","e":"last night seven o'clock 是過去某個時間點正在做的事，parents 是複數，用 were having。"},{"q":"She ___ the news, so she was very happy.","o":["hears","heard","was hear","has hear"],"a":"heard","e":"so 之後是過去的心情，前面的動作也是過去，用 heard。"},{"q":"Did you ___ my message yesterday?","o":["got","getting","get","gets"],"a":"get","e":"Did 之後動詞用原形 get。"},{"q":"I ___ TV when the power went out.","o":["was watching","watched","watch","am watching"],"a":"was watching","e":"停電的當時正在看電視，用過去進行式。"},{"q":"When I opened the door, the cat ___ out.","o":["was running","runs","has run","ran"],"a":"ran","e":"接連發生的動作，兩個都用過去簡單式。"},{"q":"At nine last night, she ___ a shower, so she didn't answer my call.","o":["takes","has taken","will take","was taking"],"a":"was taking","e":"昨晚九點這個時間點她正在洗澡，用過去進行式 was taking。"},{"q":"While we ___ dinner, the phone rang.","o":["were having","had","have","are having"],"a":"were having","e":"while 帶出持續中的背景動作，用過去進行式 were having。"},{"q":"He ___ his leg while he was playing basketball.","o":["was breaking","broke","breaks","has broken"],"a":"broke","e":"打球是持續的背景動作，摔斷腿是短暫的事件，用過去簡單式 broke。"},{"q":"They ___ to Japan last summer.","o":["have gone","go","went","going"],"a":"went","e":"last summer 是明確的過去時間，用過去簡單式 went。"}]},{"id":"m3","icon":"🔄","zh":"現在完成式","intro":"現在完成式 (have / has + 過去分詞) 連結「過去」與「現在」：說明經驗、持續到現在的狀態，或剛完成而與現在有關的事。句子中不能出現明確的過去時間 (yesterday, in 2019, ago)。","steps":[{"h":"第一步：現在完成式連結「過去」與「現在」","p":"中文沒有明確的時態，容易把「我去過京都」和「我去年去京都」看成同一種說法。英文區分得很清楚：現在完成式 (have / has + 過去分詞) 說的是「與現在有關」的事，可以是經驗、持續到現在的狀態，或剛完成而結果還在的事。過去簡單式則是「過去某個明確時間的事」，與現在無關。"},{"h":"第二步：三種主要用法","p":"1. 經驗：I have visited Kyoto twice.（曾經去過，常搭 ever, never, before, once, twice）。2. 持續：She has lived here for ten years.（十年前開始住，現在還住在這裡，常搭 for, since）。3. 完成且與現在有關：I have just finished my report.（剛完成，所以現在可以休息了，常搭 just, already, yet）。"},{"h":"第三步：不能與明確的過去時間並用","p":"yesterday, last week, in 2019, two days ago, when I was young 都是明確的過去時間，句子有這些字就不能用現在完成式，要用過去簡單式。但 already, yet, ever, never, recently, so far 可以。問「什麼時候」的 When did you...? 也要用過去簡單式。"},{"h":"第四步：for、since、have been、have gone","p":"for 後面接一段時間 (for three years)；since 後面接起點 (since 2020 / since I was ten)。have been to 表示去過並已回來；have gone to 表示去了但還沒回來。過去分詞規則動詞加 ed，不規則要背：go 變 gone，see 變 seen，eat 變 eaten，write 變 written。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. I have seen him yesterday. 應改成 I saw him yesterday.。2. I am living here for five years. 應改成 I have lived here for five years.，中文說「住了五年」，英文要用完成式。3. He has went to Japan. 應改成 He has gone to Japan.，has 之後要用過去分詞。4. Did you finish it yet? 應改成 Have you finished it yet?。"},"table":{"t":"現在完成式的用法","h":["用法","例句","常見詞"],"r":[["經驗","I have never eaten durian.","ever, never, before, twice"],["持續","We have known each other since 2015.","for, since, how long"],["剛完成","She has just left.","just, already, yet, recently"]]},"examples":[["I have lost my wallet, so I can't pay.","我把皮夾弄丟了，所以沒辦法付錢。"],["Have you ever been to Europe?","你去過歐洲嗎？"],["She has taught English for twenty years.","她教英文教了二十年。"],["They haven't arrived yet.","他們還沒到。"],["He has already finished his homework.","他已經寫完功課了。"],["How long have you lived in Taipei?","你住在台北多久了？"],["It has rained a lot recently.","最近下了很多雨。"],["My brother has gone to the airport. He will be back tonight.","我哥哥去機場了，今晚會回來。"]],"key":["have / has + 過去分詞，連結過去與現在。","經驗、持續、剛完成，三種用法。","句中有 yesterday, ago, last…, in + 過去年份就要用過去簡單式。","for + 一段時間，since + 起點。"],"basic":false,"ex":[{"q":"I ___ my homework yet.","o":["didn't finished","don't finish","hasn't finish","haven't finished"],"a":"haven't finished","e":"yet 用在否定句表示「還沒」，主詞 I 搭配 have not，後面用過去分詞。"},{"q":"___ you ever tried Thai food?","o":["Have","Did","Are","Do"],"a":"Have","e":"ever 搭配現在完成式，主詞 you 用 Have。"},{"q":"He ___ in this company since 2018.","o":["worked","has worked","works","is working"],"a":"has worked","e":"since 2018 表示從過去持續到現在，用現在完成式。"},{"q":"She ___ a cold for three days.","o":["had","has","has had","is having"],"a":"has had","e":"for three days 表示持續到現在，用 has had。"},{"q":"I ___ in Taipei since 2015.","o":["lived","live","am living","have lived"],"a":"have lived","e":"since 2015 表示從過去持續到現在，用現在完成式 have lived。"},{"q":"She has worked here ___ five years.","o":["for","since","during","ago"],"a":"for","e":"five years 是一段時間，用 for；since 後面要接起點。"},{"q":"I have ___ seen such a beautiful sunset.","o":["ago","never","yesterday","last year"],"a":"never","e":"have 之後可用 never 表示從來沒有的經驗；ago、yesterday、last year 是明確的過去時間，不能與現在完成式並用。"},{"q":"We ___ the report yet.","o":["hasn't finished","haven't finish","haven't finished","not finished"],"a":"haven't finished","e":"yet 用在否定句表示「還沒」，現在完成式否定為 haven't + 過去分詞；we 用 have，不是 has。"},{"q":"He ___ to Paris in 2019.","o":["has gone","has been","went","goes"],"a":"went","e":"in 2019 是明確的過去時間，用過去簡單式 went。"},{"q":"How long have you ___ this phone?","o":["have","had","having","has"],"a":"had","e":"have you 後面接過去分詞，「擁有」的過去分詞是 had。"}]},{"id":"m4","icon":"⏮️","zh":"過去完成式","intro":"過去完成式 (had + 過去分詞) 用來說「在過去某個時間點之前就已經發生或完成的事」，也就是「過去的過去」。","steps":[{"h":"第一步：過去完成式是「過去的過去」","p":"當你講述過去的故事時，如果需要說明「在那之前就已發生」的事，就用過去完成式 (had + 過去分詞)。它需要一個「過去的參考時間點」。例如 When I got home, my mother had already cooked dinner.，「我到家」是過去時間點，「媽媽煮好晚餐」發生得更早。"},{"h":"第二步：如何判斷該用過去完成式","p":"先找出句子中兩件事的先後。先發生的用 had + p.p.，後發生的用過去簡單式。如果兩件事的順序已經由 before 或 after 清楚說明，兩者都用過去簡單式也可以，但 by the time, already, just 等詞出現時，過去完成式更自然。"},{"h":"第三步：否定句、問句與常見時間詞","p":"否定為 had not (hadn't) + p.p.，問句為 Had + 主詞 + p.p.。常搭配 already, just, never…before, by the time, before, after, until。例如 I had never seen snow before I visited Hokkaido.。"},{"h":"第四步：與間接引述、條件句的關聯","p":"過去完成式常出現在兩種考題中：一是間接引述時，現在完成式或過去簡單式要退成過去完成式 (He said he had finished.)；二是第三條件句 If I had studied, I would have passed.。這兩個用法在後面的課程會再練習。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 兩個動作都用過去簡單式，讓先後順序不清楚：When I arrived, the train left. 意思是「我到了，火車才開」，應改成 the train had left 表示「我到之前火車已經開了」。2. 搭配錯誤的過去分詞：I had ate 應改成 I had eaten。3. 用 have 代替 had：She said she has finished 應改成 had finished。"},"table":{"t":"三個時態的位置","h":["時態","時間軸","例句"],"r":[["過去完成式","過去某時之前","I had finished before he came."],["過去簡單式","過去某個時間","He came at six."],["現在完成式","過去到現在","I have finished now."]]},"examples":[["When we arrived, the show had already started.","我們到的時候，表演已經開始了。"],["She was tired because she had worked all night.","她很累，因為她整晚都在工作。"],["I had never met him before that day.","在那天之前我從來沒見過他。"],["By the time the police came, the thief had run away.","警察到達時，小偷已經逃走了。"],["After he had finished dinner, he watched TV.","他吃完晚餐後看了電視。"],["Had you heard the news before I told you?","在我告訴你之前你聽過這個消息嗎？"],["He told me that he had lost his phone.","他告訴我他把手機弄丟了。"],["They hadn't eaten anything, so they were very hungry.","他們什麼都沒吃，所以非常餓。"]],"key":["had + 過去分詞，表示「過去的過去」。","先發生的用過去完成式，後發生的用過去簡單式。","by the time, already, before 常一起出現。","間接引述中，過去簡單式或現在完成式退為過去完成式。"],"basic":false,"ex":[{"q":"I ___ my key, so I couldn't open the door.","o":["have lost","lose","was losing","had lost"],"a":"had lost","e":"打不開門是過去的結果，遺失鑰匙發生得更早，用 had lost。"},{"q":"He ___ his lunch before the class began.","o":["had eaten","has eaten","eats","was eating"],"a":"had eaten","e":"before the class began 是過去的時間點，在那之前吃完午餐用 had eaten。"},{"q":"By the time I got there, everyone ___ .","o":["has left","leaves","was leaving","had left"],"a":"had left","e":"by the time + 過去簡單式，主要子句用過去完成式。"},{"q":"She said she ___ the movie before.","o":["had seen","has seen","sees","was seeing"],"a":"had seen","e":"間接引述後，過去經驗用過去完成式 had seen。"},{"q":"When I arrived at the station, the train ___ .","o":["has already left","had already left","would already leave","is already leaving"],"a":"had already left","e":"到車站是過去的時間點，火車在那之前就開走了，用過去完成式 had already left。"},{"q":"She failed the test because she ___ enough.","o":["hasn't studied","won't study","hadn't studied","isn't studying"],"a":"hadn't studied","e":"不及格是過去的結果，原因（沒有讀書）發生得更早，用過去完成式 hadn't studied。"},{"q":"By the time we got to the cinema, the movie ___ .","o":["has started","had started","starts","will start"],"a":"had started","e":"by the time + 過去簡單式 (got)，主要子句用過去完成式表示更早的動作。"},{"q":"He said he ___ the book before.","o":["had read","has read","reads","will read"],"a":"had read","e":"間接引述中，說話之前就讀過，用過去完成式 had read。"},{"q":"After she ___ lunch, she went back to work.","o":["has eaten","eats","is eating","had eaten"],"a":"had eaten","e":"after 之後的動作發生得比 went back 早，用過去完成式 had eaten。"},{"q":"I didn't recognize him because he ___ a lot.","o":["has changed","changes","had changed","changing"],"a":"had changed","e":"沒認出他是過去發生的事，變了很多發生得更早，用 had changed。"}]},{"id":"m5","icon":"🔮","zh":"未來式","intro":"英文沒有單一的未來式，會依語氣選擇：will（臨時決定、預測、承諾）、be going to（已有計畫、有證據的預測）、現在進行式（已安排好的近期行程）、現在簡單式（時刻表）。","steps":[{"h":"第一步：未來不只有 will","p":"很多學習者以為英文的未來式就是 will。其實英文有四種常用說法，各有語氣：will + 原形（臨時決定、預測、承諾）；be going to + 原形（已有計畫，或看到跡象的預測）；現在進行式（已經安排好的近期行程）；現在簡單式（時刻表）。"},{"h":"第二步：will 與 be going to 的差別","p":"說話當下才決定的事用 will：The phone is ringing. I'll get it.。事前已經決定或計畫好的事用 be going to：I'm going to visit my grandparents this weekend.。根據眼前的證據預測，用 be going to：Look at the sky. It's going to rain.。單純的預測或意見，兩者皆可，用 will 更常見於「我認為…」：I think he will pass.。"},{"h":"第三步：現在進行式與現在簡單式表示未來","p":"已經安排好時間地點的行程，可以用現在進行式：We are meeting at seven.。公車、火車、電影、課程等固定時刻表，用現在簡單式：The film starts at eight.。"},{"h":"第四步：時間與條件子句不用 will","p":"在 if, when, before, after, as soon as, until, unless 帶出的子句中，即使指未來也用現在式：If it rains tomorrow, we will stay home.，不能寫成 If it will rain。另外，未來完成式 (will have + p.p.) 表示到未來某時為止已經完成：By June, I will have finished the course.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. If it will rain tomorrow, I will stay home. 應改成 If it rains tomorrow, I will stay home.。2. 事先決定的計畫也一律用 will：Next week I will go to Japan.（其實已買好機票），較自然的說法是 I'm going to Japan next week.。3. 時刻表用 will：The train will leave at nine.（時刻表）較自然的說法是 The train leaves at nine.。"},"table":{"t":"未來的四種說法","h":["形式","語氣","例句"],"r":[["will + V","臨時決定、預測、承諾","I will call you later."],["be going to + V","計畫、依跡象預測","I am going to buy a car."],["am / is / are + V-ing","已安排好的行程","I am seeing the dentist tomorrow."],["現在簡單式","時刻表","The bus leaves at 6:30."]]},"examples":[["I'll carry that bag for you.","我來幫你提那個袋子。"],["We are going to have a picnic on Sunday.","我們星期天要去野餐。"],["Watch out! You are going to fall.","小心！你要跌倒了。"],["My sister is getting married next month.","我姊姊下個月要結婚。"],["The shop opens at ten tomorrow.","這家店明天十點開門。"],["I think it will be sunny tomorrow.","我想明天會是晴天。"],["As soon as I get home, I will call you.","我一到家就會打電話給你。"],["By next year, he will have lived here for ten years.","到明年，他就在這裡住滿十年了。"]],"key":["will：臨時決定、承諾、單純預測。","be going to：事前的計畫，或有跡象的預測。","已安排的行程可用現在進行式，時刻表用現在簡單式。","if / when / before / after / until 之後不用 will。"],"basic":false,"ex":[{"q":"A: I don't have a pen.  B: Wait, I ___ you one.","o":["am lending","will lend","lend","lent"],"a":"will lend","e":"當下才決定幫忙，用 will + 原形動詞。"},{"q":"I ___ my friends tonight. We bought the tickets last week.","o":["am meeting","will meet","meet","met"],"a":"am meeting","e":"已經買票、安排好的行程，可用現在進行式表示未來。"},{"q":"Wait here until I ___ back.","o":["will come","came","am coming","come"],"a":"come","e":"until 帶出的時間子句用現在式代替未來。"},{"q":"The next train ___ at 10:45.","o":["will leave","leave","leaves","left"],"a":"leaves","e":"時刻表用現在簡單式。"},{"q":"Look at those dark clouds. It ___ rain.","o":["are going to","was going","goes to","is going to"],"a":"is going to","e":"根據眼前的跡象（烏雲）做預測，用 be going to；it 搭配 is。"},{"q":"A: The phone is ringing.  B: I ___ it.","o":["answered","would answered","will answer","answering"],"a":"will answer","e":"說話當下臨時決定，用 will + 原形動詞。"},{"q":"The train ___ at 9:15 tomorrow morning.","o":["left","leaves","leaving","has left"],"a":"leaves","e":"火車時刻表用現在簡單式表示未來，leaves。"},{"q":"I ___ my grandparents this weekend. We've already bought the tickets.","o":["am visiting","visiting","visited","have visited"],"a":"am visiting","e":"已經安排好、買好票的近期計畫，可用現在進行式 am visiting 表示未來。"},{"q":"If it rains tomorrow, we ___ at home.","o":["stay","will stay","stayed","would stay"],"a":"will stay","e":"if 子句用現在式 (rains)，主要子句用 will + 原形動詞。"},{"q":"By next year, she ___ here for ten years.","o":["will work","works","has worked","will have worked"],"a":"will have worked","e":"by next year 表示到未來某時為止已經達成，用未來完成式 will have worked。"}]},{"id":"m6","icon":"🔀","zh":"被動語態","intro":"當重點是「動作的接受者」，或不知道、不需要說出做動作的人時，用被動語態：be 動詞 + 過去分詞。動作的執行者可用 by 帶出。","steps":[{"h":"第一步：什麼時候用被動語態","p":"主動語態強調「誰做了什麼」，被動語態強調「什麼被怎麼樣了」。適合用被動的情況有三種：不知道是誰做的 (My bike was stolen.)、不重要或很明顯 (English is spoken in many countries.)、想強調接受者 (The bridge was built in 1998.)。中文常用「被」「受到」「由」，但英文被動的使用範圍其實比中文更廣，尤其在正式文章、新聞和公告裡。"},{"h":"第二步：形式是 be + 過去分詞","p":"無論哪個時態，被動語態都是「be 動詞 + 過去分詞」，時態由 be 動詞決定：現在簡單式 is done、過去簡單式 was done、現在完成式 has been done、未來式 will be done、現在進行式 is being done、情態助動詞 can be done。原本的受詞變成主詞，原本的主詞若要保留，用 by 帶出。"},{"h":"第三步：只有及物動詞能改被動","p":"被動語態只能用在及物動詞（後面需要受詞的動詞）。happen, arrive, die, sleep, rise, appear 等不及物動詞沒有被動語態。所以說 The accident happened.，不能說 The accident was happened.。"},{"h":"第四步：雙受詞動詞與使役","p":"give, send, show, teach 等後面接兩個受詞的動詞，有兩種被動：I was given a gift. / A gift was given to me.。另外，感官動詞與 make 改被動時，原形動詞要補上 to：He was made to wait for an hour.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 用不及物動詞做被動：The concert was taken place. 應改成 The concert took place.。2. 忘了 be 動詞：The window broken. 應改成 The window was broken.。3. 把過去分詞寫錯：The letter was wrote 應改成 was written。4. 主動被動搞混：The film is very interested 應改成 interesting（電影令人感興趣）。"},"table":{"t":"被動語態的各時態","h":["時態","被動形式","例句"],"r":[["現在簡單式","am / is / are + p.p.","Rice is grown here."],["過去簡單式","was / were + p.p.","The letter was sent yesterday."],["現在完成式","has / have been + p.p.","The room has been cleaned."],["未來式","will be + p.p.","The result will be announced."],["現在進行式","is / are being + p.p.","The road is being repaired."],["情態助動詞","can / must be + p.p.","The door must be locked."]]},"examples":[["This song was written by a famous singer.","這首歌是一位知名歌手寫的。"],["Many trees were cut down for the new road.","許多樹被砍掉以開闢新路。"],["The meeting has been postponed until Friday.","會議已被延到星期五。"],["Dinner will be served at seven.","晚餐七點供應。"],["The old bridge is being repaired now.","那座舊橋現在正在修理。"],["Smoking is not allowed in the building.","大樓內禁止吸菸。"],["I was given a free ticket by my boss.","老闆給了我一張免費的票。"],["The thief was arrested by the police last night.","小偷昨晚被警察逮捕了。"]],"key":["被動語態 = be + 過去分詞，時態看 be 動詞。","受詞變主詞，原主詞用 by 帶出（不重要時可省略）。","不及物動詞 (happen, arrive, die) 沒有被動。","感官動詞與 make 改被動時，原形動詞要補 to。"],"basic":false,"ex":[{"q":"This kind of tea ___ in the mountains of Taiwan.","o":["grows","is growing","is grown","grew"],"a":"is grown","e":"茶是被種植的，習慣事實用現在簡單式被動。"},{"q":"The accident ___ at 8 a.m. yesterday.","o":["happened","was happened","has happened","happens"],"a":"happened","e":"happen 是不及物動詞，不能用被動，且 yesterday 表示過去。"},{"q":"The results ___ next week.","o":["will announce","will be announced","announced","are announcing"],"a":"will be announced","e":"結果是被公布的，且 next week 是未來，用 will be announced。"},{"q":"English ___ all over the world.","o":["is spoken","speaks","is speaking","speaked"],"a":"is spoken","e":"英文是被使用的語言，用被動語態。"},{"q":"English ___ in many countries.","o":["speaks","spoke","is spoken","is speaking"],"a":"is spoken","e":"English 是被使用的語言，用被動語態 is spoken。"},{"q":"The bridge ___ in 1998.","o":["built","is built","has built","was built"],"a":"was built","e":"橋是「被建造」的，且 1998 是過去時間，用 was built。"},{"q":"The cake ___ by my mother yesterday.","o":["made","was made","is made","makes"],"a":"was made","e":"蛋糕是被媽媽做的，yesterday 是過去，用 was made。"},{"q":"A new hospital ___ next year.","o":["will build","is building","will be built","built"],"a":"will be built","e":"醫院是「被建造」，且 next year 表示未來，用 will be built。"},{"q":"The problem ___ right now.","o":["discusses","has discussed","was discuss","is being discussed"],"a":"is being discussed","e":"right now 表示正在進行，問題是被討論的，用現在進行式被動 is being discussed。"},{"q":"My wallet ___ on the bus.","o":["was stolen","stole","was steal","is stealing"],"a":"was stolen","e":"錢包是被偷走的，過去發生，用 was stolen。"}]},{"id":"m7","icon":"🌦️","zh":"條件句 (0、1、2)","intro":"條件句用 if 說明「假如…就…」。依可能性分成三種：零條件句（一定的事實）、第一條件句（真的可能發生）、第二條件句（與現在事實相反或不太可能）。","steps":[{"h":"第一步：條件句由 if 子句和主要子句組成","p":"條件句表示「如果…就…」。if 子句說條件，主要子句說結果。兩個子句可以互換位置：if 子句在前面要加逗號 (If it rains, we will stay home.)，在後面就不加 (We will stay home if it rains.)。依可能性分為三種，關鍵在 if 子句的時態。"},{"h":"第二步：零條件句與第一條件句","p":"零條件句說「一定成立的事實或規律」，兩邊都用現在簡單式：If you heat ice, it melts.。第一條件句說「真的有可能發生」的未來情況，if 子句用現在簡單式，主要子句用 will + 原形：If it rains tomorrow, we will cancel the trip.。請記得：if 子句中不能用 will。"},{"h":"第三步：第二條件句","p":"第二條件句說「與現在事實相反」或「不太可能發生」的假設，if 子句用過去簡單式，主要子句用 would (could, might) + 原形：If I had a million dollars, I would buy a house.（事實上我沒有）。if 子句的 be 動詞不論主詞是誰，正式寫法用 were：If I were you, I would apologize.。"},{"h":"第四步：unless 與 if only","p":"unless 相當於 if … not：Unless you hurry, you will be late. = If you don't hurry, you will be late.。unless 之後不再加否定詞。另外，as long as 和 provided that 也可表示「只要」。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. If it will rain tomorrow, I will stay home. 應改成 If it rains tomorrow, ...。2. If I have time, I would go. 時態不一致，應改成 If I had time, I would go.（第二條件句）。3. Unless you don't study, you will fail. 應改成 Unless you study, you will fail.（unless 已含否定）。4. 中文說「如果我是你」直接翻成 If I am you 應改成 If I were you。"},"table":{"t":"條件句一覽","h":["類型","if 子句","主要子句","意思"],"r":[["零條件句","現在簡單式","現在簡單式","事實、規律"],["第一條件句","現在簡單式","will + 原形","可能發生"],["第二條件句","過去簡單式","would + 原形","與現在事實相反"]]},"examples":[["If you mix red and yellow, you get orange.","把紅色和黃色混合，就會得到橘色。"],["If I finish early, I will call you.","如果我提早做完，我會打給你。"],["You will get lost if you don't take a map.","你如果不帶地圖會迷路。"],["If I were you, I would talk to the teacher.","如果我是你，我會去跟老師談談。"],["If she had more time, she would learn the piano.","如果她有更多時間，她會學鋼琴。"],["What would you do if you won the lottery?","如果你中了樂透，你會怎麼做？"],["Unless it stops raining, we will stay inside.","除非雨停，否則我們會待在室內。"],["If it were sunny today, we could go to the beach.","如果今天是晴天，我們就可以去海邊了。"]],"key":["零條件：現在 + 現在；第一條件：現在 + will；第二條件：過去 + would。","if 子句不用 will；be 動詞一律用 were。","unless = if … not，之後不再加 not。","if 子句在前用逗號，在後不用。"],"basic":false,"ex":[{"q":"If you ___ water to 100 degrees, it boils.","o":["will heat","heat","heated","would heat"],"a":"heat","e":"自然規律用零條件句，if 子句是現在簡單式。"},{"q":"If I ___ enough money, I would travel around the world.","o":["have","will have","would have","had"],"a":"had","e":"與現在事實相反的假設，if 子句用過去簡單式 had。"},{"q":"If he ___ hard, he will pass the test.","o":["studied","will study","studies","would study"],"a":"studies","e":"第一條件句，if 子句用現在簡單式，he 搭配 studies。"},{"q":"What would you say if he ___ you to dinner?","o":["invited","invites","will invite","would invite"],"a":"invited","e":"主要子句是 would，if 子句用過去簡單式 invited。"},{"q":"If you heat ice, it ___ .","o":["would melt","has melt","melts","melting"],"a":"melts","e":"加熱冰塊就融化是自然規律，零條件句兩邊都用現在簡單式，it melts。"},{"q":"If it ___ tomorrow, we will cancel the picnic.","o":["will rain","rains","rained","would rain"],"a":"rains","e":"第一條件句：if 子句用現在簡單式 rains 代替未來。"},{"q":"If I ___ you, I would take the job.","o":["were","am","will be","being"],"a":"were","e":"第二條件句的 if 子句用 were（與事實相反的假設）。"},{"q":"If I won the lottery, I ___ a big house.","o":["will buy","bought","buy","would buy"],"a":"would buy","e":"if 子句是過去式 won，主要子句用 would + 原形動詞。"},{"q":"She would travel more if she ___ more time.","o":["has","will have","would have","had"],"a":"had","e":"主要子句是 would travel，if 子句用過去簡單式 had。"},{"q":"Unless you hurry, you ___ the bus.","o":["would miss","missed","will miss","are missing"],"a":"will miss","e":"Unless you hurry（現在式）是第一條件句，主要子句用 will + 原形動詞。"}]},{"id":"m8","icon":"🧷","zh":"關係子句","intro":"關係子句是用來修飾前面名詞的子句，由關係代名詞 (who, which, that, whose) 或關係副詞 (where, when, why) 帶出。","steps":[{"h":"第一步：關係子句是「修飾名詞的子句」","p":"當你想對一個名詞多加說明，可以在後面接關係子句。例如 The man who lives next door is a doctor.，who lives next door 是在說明 the man。被修飾的名詞叫做先行詞，關係代名詞 (who, which, that, whose) 就是連接先行詞與子句的橋樑，同時在子句中擔任主詞、受詞或所有格。"},{"h":"第二步：選對關係代名詞","p":"先行詞是人，用 who (that)；是事物，用 which (that)；表示「…的」的所有關係，用 whose；先行詞是地點，用 where；是時間，用 when；是原因 the reason，用 why。判斷方法：把關係詞當作原來句子的一部分，看它缺少的是主詞、受詞還是所有格。"},{"h":"第三步：受格可省略，主格不可省略","p":"關係代名詞在子句中當受詞時可以省略：The book (that) I bought is great.。當主詞時不能省略：The girl who is singing is my sister.。當
