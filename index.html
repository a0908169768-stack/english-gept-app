"a":"tell","e":"demand 表示要求，that 子句用 (should) + 原形動詞，主詞是 he 也不加 s。"},{"q":"It is important that everyone ___ on time.","o":["is","are","being","be"],"a":"be","e":"表示「重要、必要」的形容詞之後，that 子句用 (should) + 原形動詞，所以用 be。"},{"q":"He isn't the boss, but he talks as if he ___ the boss.","o":["is","were","be","has been"],"a":"were","e":"與事實相反，as if 之後用過去式，be 動詞用 were。"},{"q":"It's time we ___ home.","o":["went","have gone","will go","going"],"a":"went","e":"It's time + 過去式，表示早該回家。"},{"q":"I'd rather you ___ here.","o":["staying","stays","stayed","to stay"],"a":"stayed","e":"would rather + 過去式，表示希望對方留下。"},{"q":"The manager demanded that the report ___ finished by Friday.","o":["was","is","being","be"],"a":"be","e":"demand 之後用 (should) + 原形，被動 be finished。"},{"q":"She looked as if she ___ a ghost.","o":["has seen","had seen","saw","sees"],"a":"had seen","e":"過去看起來像是「曾經見過」，as if 之後用過去完成式。"}]},{"id":"m32","icon":"🛠️","zh":"使役動詞與感官動詞","intro":"","steps":[{"h":"第一步：什麼是使役動詞","p":"使役動詞表示「使、讓、叫某人做某事」，最常見的是 make, let, have, get, help。它們的句型很像，但後面動詞的形態不同，這是考試常見的陷阱。"},{"h":"第二步：make, let, have 後面接原形動詞","p":"make + 受詞 + 原形：強迫、使得，The teacher made us repeat the sentence.。let + 受詞 + 原形：允許，My mother let me stay up late.。have + 受詞 + 原形：請某人做，I had the mechanic fix my car.。這三個字後面都不加 to。被動時，make 變成 be made to V：We were made to repeat the sentence.（加上 to）；let 沒有被動，改用 be allowed to。"},{"h":"第三步：get 與 help","p":"get + 受詞 + to V：get him to help us（說服他幫忙）。help + 受詞 + 原形 / to V：He helped me (to) carry the box.（兩者皆可）。have / get + 受詞 + 過去分詞，表示東西「被別人做」，受詞不是主動做，而是被動接受：I had my hair cut.（我請人剪頭髮）、She got her bike repaired.。也可表示不幸的遭遇：He had his wallet stolen.。"},{"h":"第四步：感官動詞","p":"感官動詞 (see, hear, watch, notice, feel, smell) 的句型是：感官動詞 + 受詞 + 原形（看到整個過程）或 V-ing（正在進行）：I saw him cross the road.（看到他過完馬路）、I saw him crossing the road.（看到他正在過馬路）。被動時原形要加 to：He was seen to cross the road.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. make 之後加 to：She made me to cry. 應改成 She made me cry.。2. let 之後加 to：Let me to go. 應改成 Let me go.。3. have 之後用 to V：I had him to fix it. 應改成 I had him fix it.。4. get 之後漏了 to：I got him help me. 應改成 I got him to help me.。5. 應該用過去分詞卻用了原形：I had my car wash. 應改成 washed。6. 受詞是事物時，用了原形：I had my hair cut，不能寫成 cutting。"},"table":{"t":"使役動詞比較","h":["動詞","句型","例句"],"r":[["make","make + O + 原形","He made me laugh."],["let","let + O + 原形","Let me help you."],["have","have + O + 原形 / p.p.","I had him wait. / I had my hair cut."],["get","get + O + to V / p.p.","I got him to come."],["help","help + O + (to) 原形","She helped me (to) study."]]},"examples":[["The joke made everyone laugh.","這個笑話讓每個人都笑了。"],["My parents let me go to the concert.","我的父母讓我去看演唱會。"],["I had my brother fix the computer.","我請我哥哥修電腦。"],["She got her friend to lend her some money.","她說服朋友借她一些錢。"],["I had my hair cut yesterday.","我昨天去剪了頭髮。"],["He got his passport stolen on the train.","他的護照在火車上被偷了。"],["I heard someone singing in the next room.","我聽到有人在隔壁房間唱歌。"],["We watched the sun rise over the sea.","我們看著太陽從海面升起。"]],"key":["make / let / have + O + 原形，不加 to。","get + O + to V；help + O + (to) 原形。","have / get + O + p.p.：讓別人做某事，或遭遇不幸。","感官動詞 + O + 原形（整個過程）或 V-ing（進行中）。"],"basic":false,"ex":[{"q":"The boss made us ___ overtime.","o":["to work","worked","working","work"],"a":"work","e":"make + 受詞 + 原形，不加 to。"},{"q":"My mother won't let me ___ out late.","o":["stay","to stay","staying","stayed"],"a":"stay","e":"let + 受詞 + 原形。"},{"q":"I got my brother ___ me with my homework.","o":["help","helping","to help","helped"],"a":"to help","e":"get + 受詞 + to V。"},{"q":"She had her car ___ yesterday.","o":["repair","repaired","repairing","to repair"],"a":"repaired","e":"have + 受詞 + p.p.，車子是被修理。"},{"q":"I heard the phone ___ , but I didn't answer it.","o":["to ring","rung","ring","is ringing"],"a":"ring","e":"hear + 受詞 + 原形。"},{"q":"We were made ___ hard.","o":["study","to study","studying","studied"],"a":"to study","e":"make 的被動語態要加 to，be made to study。"},{"q":"He had his wallet ___ on the bus.","o":["stolen","steal","stealing","to steal"],"a":"stolen","e":"遭遇不幸，have + 受詞 + p.p.。"},{"q":"I saw them ___ the street when the accident happened.","o":["crossed","to cross","crosses","crossing"],"a":"crossing","e":"強調事情發生時他們正在過馬路，感官動詞後接 V-ing 表示動作正在進行。"}]},{"id":"m33","icon":"🕰️","zh":"used to 與 be used to","intro":"","steps":[{"h":"第一步：三個長得很像的片語","p":"used to V、be used to V-ing、get used to V-ing 長得非常像，意思卻完全不同，這是 GEPT 中級的高頻考點。要分辨它們，最重要的是看 to 的性質：used to 的 to 是不定詞 to，之後接原形動詞；be used to 的 to 是介系詞，之後接名詞或 V-ing。"},{"h":"第二步：used to + 原形動詞","p":"表示「過去經常做，或過去存在的狀態，現在已不再」：I used to live in Taipei.（以前住台北，現在不住了）。He used to smoke, but he quit last year.。否定與疑問常用 didn't use to / Did you use to...?（去掉 d）。可以與 would 比較：表示過去的習慣時兩者皆可，但過去的「狀態」（住在哪裡、擁有什麼）只能用 used to，不能用 would：I used to have a dog.。"},{"h":"第三步：be used to + V-ing / 名詞","p":"表示「習慣了」（現在的狀態）：I am used to getting up early.。She is used to the noise.。這裡的 used 是形容詞「習慣的」，時態變化由 be 動詞決定：I was used to cold weather.。get used to 強調「逐漸習慣的過程」：I'm getting used to the new job. / You will get used to it soon.。"},{"h":"第四步：還有一個 be used to V","p":"be used to + 原形動詞是被動語態，表示「被用來做…」：This knife is used to cut bread.。與 be used for + V-ing 意思相同：This knife is used for cutting bread.。四種結構的比較，可以透過翻譯來判斷：以前常常 (used to V)、習慣於 (be used to V-ing)、逐漸習慣 (get used to V-ing)、被用來 (be used to V)。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. I am used to get up early. 應改成 getting up。2. I used to going to the park. 應改成 used to go。3. Did you used to...? 應改成 Did you use to...?。4. 把 used to 用在現在習慣：I used to drink coffee every day.（表示現在已經不喝了），如果現在仍然如此，應用 I usually / am used to。5. 用 would 表示過去狀態：I would have a dog. 應改成 used to have。"},"table":{"t":"四種結構","h":["結構","意思","例句"],"r":[["used to + V","過去常常（現在不再）","I used to swim every day."],["be used to + V-ing","習慣於","I am used to swimming every day."],["get used to + V-ing","逐漸習慣","I'm getting used to swimming daily."],["be used to + V","被用來","The pool is used to train athletes."]]},"examples":[["I used to play the piano when I was a child.","我小時候常彈鋼琴。"],["There used to be a park here.","這裡以前有一座公園。"],["She didn't use to eat vegetables.","她以前不吃蔬菜。"],["I'm used to drinking coffee in the morning.","我習慣早上喝咖啡。"],["He isn't used to the cold weather yet.","他還不習慣寒冷的天氣。"],["You'll soon get used to living alone.","你很快就會習慣獨居。"],["This tool is used to open bottles.","這個工具是用來開瓶子的。"],["My grandfather used to tell us stories every night.","我爺爺以前每晚都會說故事給我們聽。"]],"key":["used to + 原形：過去常常，現在不再。","be / get used to + V-ing 或名詞：習慣於 / 逐漸習慣。","be used to + 原形：被用來。","否定與疑問用 didn't use to、Did...use to。"],"basic":false,"ex":[{"q":"I ___ live in a small town, but now I live in Taipei.","o":["used to","am used to","get used to","was used to"],"a":"used to","e":"過去住在小鎮，現在不住，用 used to。"},{"q":"She is used to ___ up early.","o":["get","got","getting","to get"],"a":"getting","e":"be used to 之後接 V-ing。"},{"q":"It took me a month to get used to ___ in a big city.","o":["live","lived","to live","living"],"a":"living","e":"get used to + V-ing。"},{"q":"We ___ have a dog when I was a child.","o":["are used to","used to","would be","get used to"],"a":"used to","e":"過去的狀態，用 used to。"},{"q":"Did you ___ play tennis in high school?","o":["use to","used to","using to","be used to"],"a":"use to","e":"疑問句 Did + 主詞 + use to。"},{"q":"This machine is used ___ make paper.","o":["for","by","to","with"],"a":"to","e":"be used to + 原形，表示「被用來」。"},{"q":"He is not used ___ the noise.","o":["for","at","with","to"],"a":"to","e":"be used to + 名詞，to 是介系詞。"},{"q":"She ___ smoke, but she quit two years ago.","o":["is used to","used to","gets used to","use to"],"a":"used to","e":"過去抽菸，現在戒了，用 used to。"}]},{"id":"m34","icon":"🕳️","zh":"進階條件句：第三類與混合","intro":"","steps":[{"h":"第一步：條件句的完整架構","p":"前面我們學了零、第一、第二條件句。這一課學習第三類條件句，以及混合條件句。核心概念是「時間」和「真假」：第一類是可能發生的未來；第二類是與現在事實相反；第三類是與過去事實相反，表示後悔或推測「如果當時…就會…」。"},{"h":"第二步：第三類條件句（過去的假設）","p":"形式：If + 主詞 + had + p.p., 主詞 + would / could / might + have + p.p.。If I had studied harder, I would have passed the exam.（事實：我沒有用功，所以沒過。）。If it hadn't rained, we could have gone to the beach.。這種句子用於後悔、責怪、推測歷史：What would you have done if you had been there?。"},{"h":"第三步：混合條件句","p":"當條件與結果的時間不同，就使用混合型。最常見有兩種：一、過去的條件影響現在的結果：If + had p.p., would + 原形。If I had taken the medicine, I would be well now.（過去沒吃藥，現在還沒好）。二、現在的事實影響過去的結果：If + 過去式, would have + p.p.。If I were a better swimmer, I would have saved him.（我不是好泳者，所以當時沒救成）。"},{"h":"第四步：其他表示條件的說法","p":"unless = if...not：Unless you hurry, you will be late.。as long as / provided that = 只要：You can go out as long as you finish your homework.。in case = 萬一，以防：Take an umbrella in case it rains.。otherwise = 否則：Hurry up. Otherwise, you will miss the bus.。without + 名詞可代替 if 子句：Without your help, I couldn't have finished. (= If it hadn't been for your help...)。省略 if 可倒裝：Had I known, I would have come.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. If 子句與主要子句都用過去完成式：If I had known, I had told you. 應改成 would have told。2. 在 if 子句用 would：If I would have studied... 應改成 had studied。3. 中英文時間混淆：If I were you 是現在，If I had been you 是過去。4. unless 與否定並用：Unless you don't hurry 應改成 Unless you hurry。5. in case 之後用 will：in case it will rain 應改成 in case it rains。"},"table":{"t":"條件句總整理","h":["類型","if 子句","主要子句"],"r":[["零（事實）","現在式","現在式"],["第一類（可能）","現在式","will + 原形"],["第二類（與現在相反）","過去式","would + 原形"],["第三類（與過去相反）","had + p.p.","would have + p.p."],["混合","had + p.p.","would + 原形"]]},"examples":[["If I had left earlier, I wouldn't have missed the train.","如果我早點出門，就不會錯過火車了。"],["If she had known the truth, she would have been angry.","如果她知道真相，她就會生氣了。"],["If we hadn't lost the map, we could have found the hotel.","如果我們沒有弄丟地圖，就找得到旅館了。"],["If I had saved more money, I would be rich now.","如果我當時多存一點錢，現在就富有了。"],["Unless you study hard, you won't pass the test.","除非你用功讀書，否則你考不過。"],["You can borrow my car as long as you drive carefully.","只要你小心開，你就可以借我的車。"],["Take a coat in case it gets cold.","帶件外套，以防天氣變冷。"],["Without your help, I couldn't have finished the project.","沒有你的幫忙，我就無法完成這個專案。"]],"key":["第三類：If + had p.p., would have + p.p.，與過去事實相反。","混合條件句：過去的原因，現在的結果。","unless = if...not；in case 之後用現在式。","if 子句中不用 would。"],"basic":false,"ex":[{"q":"If I had studied harder, I ___ the exam.","o":["would have passed","would pass","had passed","will pass"],"a":"would have passed","e":"第三類條件句，主要子句用 would have + p.p.。"},{"q":"If she ___ the bus, she wouldn't have been late.","o":["caught","would catch","had caught","has caught"],"a":"had caught","e":"if 子句用過去完成式 had caught。"},{"q":"If it hadn't rained, we ___ to the park.","o":["would go","had gone","went","would have gone"],"a":"would have gone","e":"過去的假設，用 would have + p.p.。"},{"q":"If I had taken the medicine, I ___ better now.","o":["would have been","would be","will be","am"],"a":"would be","e":"過去的條件、現在的結果，用 would be。"},{"q":"___ you hurry, you will miss the train.","o":["If not","Although","Because","Unless"],"a":"Unless","e":"unless = if...not，之後不再加 not。"},{"q":"Take an umbrella ___ it rains.","o":["unless","although","in case","so"],"a":"in case","e":"in case 表示以防萬一，後面用現在式。"},{"q":"___ your help, I couldn't have done it.","o":["Without","Unless","If","Because"],"a":"Without","e":"Without + 名詞表示「沒有…的話」。"},{"q":"I'll lend you the book ___ you return it soon.","o":["unless","as long as","although","in case"],"a":"as long as","e":"as long as 表示「只要」。"}]},{"id":"m35","icon":"⚠️","zh":"台灣學習者常見錯誤總整理","intro":"","steps":[{"h":"第一步：為什麼會有「中式英文」","p":"中文和英文的句子結構、時態表達、詞類與詞序都不一樣。當我們用中文思考、逐字翻成英文時，就會出現 Chinglish。這一課整理 GEPT 中級最常見的錯誤，從動詞、時態、詞類、詞序、字彙搭配五個角度，帶你建立自我檢查的習慣。"},{"h":"第二步：動詞與時態的錯誤","p":"一、忘了 be 動詞：She very beautiful. 中文形容詞可以直接當謂語，英文一定要有動詞：She is very beautiful.。二、時態沒有變化：Yesterday I go to school. 中文靠「昨天」表示過去，英文動詞一定要變：went。三、一個句子兩個動詞：I am like music. 應改成 I like music.。四、第三人稱單數漏 s：He like pizza. 應改成 likes。五、完成式與過去式混淆：I have seen him yesterday. 應改成 I saw him yesterday.。"},{"h":"第三步：名詞、冠詞與代名詞的錯誤","p":"一、可數與不可數：many informations 應改成 much information。二、複數：two book 應改成 two books。三、冠詞漏用：I have car. 應改成 I have a car.。四、主詞漏用：Is raining. 應改成 It is raining.。五、代名詞的用法：He is my friend, he lives near here. 兩句之間需要連接詞，逗號不能連接兩個完整句子 (comma splice)，應改成 and 或句號。"},{"h":"第四步：詞序、搭配與字彙的錯誤","p":"一、詞序：中文「昨天在公園」是時間在前，地點在後；英文一般是地點在前，時間在後：I met him in the park yesterday.。二、常見搭配：do homework, make a mistake, take a photo, have a look, pay attention to, look forward to seeing。三、動詞後接 to 還是 V-ing：enjoy, finish, mind, avoid, practice + V-ing；want, hope, decide, plan + to V。四、直接翻譯：open the light 應改成 turn on the light；I am very boring 應改成 bored；people is 應改成 people are。"}],"pit":{"h":"自我檢查清單","p":"寫完英文句子，用四個問題檢查：一、每個子句都有主詞與動詞嗎？二、動詞的時態與單複數正確嗎？三、名詞是否需要冠詞或複數？四、有沒有用到中文才有的搭配？例如 discuss about、return back、very like、how to say it in English。"},"table":{"t":"常見錯誤對照","h":["錯誤","正確","原因"],"r":[["She very kind.","She is very kind.","缺少 be 動詞"],["I am like music.","I like music.","多了 be 動詞"],["I have seen him yesterday.","I saw him yesterday.","過去時間用過去式"],["many informations","much information","不可數名詞"],["discuss about it","discuss it","及物動詞"],["I am boring.","I am bored.","人的感受用 -ed"]]},"examples":[["She is very kind to everyone.","她對每個人都很好。"],["I like music, and I often listen to it.","我喜歡音樂，也常常聽。"],["I saw him in the park yesterday.","我昨天在公園看到他。"],["We need to discuss the plan.","我們需要討論這個計畫。"],["Please turn on the light.","請把燈打開。"],["I'm bored because the movie is boring.","我覺得無聊，因為這部電影很無聊。"],["Everyone knows that he is honest.","大家都知道他很誠實。"],["I'm looking forward to seeing you soon.","我期待很快見到你。"]],"key":["中文形容詞可以當謂語，英文一定要加 be 動詞。","一個簡單句只有一個主要動詞，不要 be 與一般動詞並用。","過去時間用過去式，不與 have + p.p. 並用。","discuss, enter, marry, answer 等及物動詞後不加介系詞。","人的感受用 -ed，事物的性質用 -ing。"],"basic":false,"ex":[{"q":"She ___ very tall.","o":["is","are","be","has"],"a":"is","e":"中文形容詞可直接當謂語，英文要有 be 動詞。"},{"q":"I ___ him yesterday.","o":["have seen","saw","see","am seeing"],"a":"saw","e":"yesterday 是明確過去時間，用過去式。"},{"q":"He ___ pizza very much.","o":["like","is like","likes","is liking"],"a":"likes","e":"第三人稱單數加 s，且不與 be 並用。"},{"q":"We must ___ the problem.","o":["discuss about","talk","talk about the","discuss"],"a":"discuss","e":"discuss 是及物動詞，不加 about。"},{"q":"I'm ___ because the class is boring.","o":["boring","bored","bore","boredom"],"a":"bored","e":"人的感受用 -ed。"},{"q":"Please ___ the TV. It's too loud.","o":["close","down","put down","turn down"],"a":"turn down","e":"turn down 是「調小聲」。"},{"q":"I am looking forward to ___ you.","o":["seeing","see","saw","be seen"],"a":"seeing","e":"look forward to 的 to 是介系詞，接 V-ing。"},{"q":"___ raining outside.","o":["Is","That is","It is","There is"],"a":"It is","e":"天氣句用 it 當主詞。"}]},{"id":"g1","icon":"🧍","zh":"be 動詞 (am / is / are)","intro":"中文說「我很高興」可以不用動詞，但英文的句子一定要有動詞。「是」和「在」就用 be 動詞，它會隨主詞變化。","blocks":[{"h":"三種形態","table":{"h":["主詞","be 動詞","縮寫"],"r":[["I","am","I'm"],["you / we / they","are","you're / we're / they're"],["he / she / it","is","he's / she's / it's"]]},"ex":[["I am a student.","我是學生。"],["You are my friend.","你是我的朋友。"],["She is a nurse.","她是護理師。"],["They are at home.","他們在家。"]]},{"h":"否定句：後面加 not","p":"be 動詞後面加 not 就變成「不是」。is not 可縮寫成 isn't，are not 可縮寫成 aren't。","ex":[["I am not tired.","我不累。"],["He isn't here.","他不在這裡。"],["We aren't late.","我們沒有遲到。"]]},{"h":"疑問句：把 be 動詞移到最前面","p":"You are happy. 變成 Are you happy? 回答用 Yes, I am. 或 No, I'm not.","ex":[["Are you hungry?","你餓了嗎？"],["Yes, I am.","是的，我餓了。"],["Is she your sister?","她是你姊姊嗎？"]]}],"basic":true,"ex":[{"q":"I ___ a student.","sub":"我是學生。","o":["is","am","are"],"a":"am","e":"主詞是 I 時，be 動詞用 am。"},{"q":"She ___ my sister.","sub":"她是我的姊姊。","o":["am","are","is"],"a":"is","e":"she 是第三人稱單數，用 is。"},{"q":"They ___ from Taiwan.","sub":"他們來自台灣。","o":["are","is","am"],"a":"are","e":"they 是複數，用 are。"},{"q":"___ you tired?","sub":"你累了嗎？","o":["Is","Are","Am"],"a":"Are","e":"疑問句把 be 動詞放前面，主詞是 you 用 Are。"},{"q":"He ___ not at home.","sub":"他不在家。","o":["are","am","is"],"a":"is","e":"he 搭配 is，否定就是 is not。"},{"q":"We ___ very happy today.","sub":"我們今天很開心。","o":["are","is","am"],"a":"are","e":"we 搭配 are。"}]},{"id":"g2","icon":"🍎","zh":"a 和 an","intro":"a 和 an 都表示「一個」，只放在「單數、可以數的名詞」前面。要用哪一個，看後面那個字的「發音」。","blocks":[{"h":"子音開頭用 a","ex":[["a book","一本書"],["a cat","一隻貓"],["a dog","一隻狗"]]},{"h":"母音發音開頭用 an","p":"母音的聲音是 a, e, i, o, u 這幾個音。","ex":[["an apple","一顆蘋果"],["an egg","一顆蛋"],["an umbrella","一把傘"]]},{"h":"看發音，不是看拼字","p":"hour 的 h 不發音，所以聽起來是母音開頭，用 an。university 的 u 唸成 yu（子音），所以用 a。","ex":[["an hour","一小時"],["a university","一所大學"]]},{"h":"不可數名詞不加 a / an","p":"water、rice、milk 這類不能數的東西，前面不加 a 或 an。","ex":[["I drink water.","我喝水。"],["I want a cup of tea.","我想要一杯茶。"]]}],"basic":true,"ex":[{"q":"I eat ___ apple every day.","sub":"我每天吃一顆蘋果。","o":["a","an"],"a":"an","e":"apple 以母音 a 開頭，用 an。"},{"q":"She has ___ book.","sub":"她有一本書。","o":["a","an"],"a":"a","e":"book 以子音 b 開頭，用 a。"},{"q":"He is ___ engineer.","sub":"他是工程師。","o":["an","a"],"a":"an","e":"engineer 以母音 e 開頭，用 an。"},{"q":"I wait for ___ hour.","sub":"我等了一個小時。","o":["a","an"],"a":"an","e":"hour 的 h 不發音，唸起來像母音，所以用 an。"},{"q":"She studies at ___ university.","sub":"她在一所大學讀書。","o":["an","a"],"a":"a","e":"university 唸成 yu 開頭（子音），所以用 a。"},{"q":"This is ___ umbrella.","sub":"這是一把傘。","o":["an","a"],"a":"an","e":"umbrella 以母音 u 開頭，用 an。"}]},{"id":"g3","icon":"📚","zh":"名詞複數","intro":"中文的「兩本書」，書不會變。英文的名詞只要超過一個，字尾就要變化，通常是加 s。","blocks":[{"h":"變化規則","table":{"h":["規則","單數","複數"],"r":[["一般直接加 s","book","books"],["s, x, ch, sh 結尾加 es","box / watch","boxes / watches"],["子音 + y：去 y 加 ies","baby / city","babies / cities"],["母音 + y：直接加 s","boy / day","boys / days"],["不規則變化","man / woman","men / women"],["不規則變化","child / foot","children / feet"],["不規則變化","person","people"]]},"ex":[["I have two brothers.","我有兩個兄弟。"],["There are three boxes.","有三個箱子。"],["Many people like music.","很多人喜歡音樂。"]]}],"basic":true,"ex":[{"q":"I have two ___.","sub":"我有兩本書。","o":["book","bookes","books"],"a":"books","e":"一般名詞直接加 s。"},{"q":"There are three ___ on the table.","sub":"桌上有三個箱子。","o":["boxs","boxes","boxies"],"a":"boxes","e":"字尾是 x，要加 es。"},{"q":"She has two ___.","sub":"她有兩個寶寶。","o":["babies","babys","babyes"],"a":"babies","e":"子音 + y 結尾，去 y 加 ies。"},{"q":"Five ___ are in the park.","sub":"公園裡有五個小孩。","o":["children","childs","childrens"],"a":"children","e":"child 的複數是不規則的 children。"},{"q":"There are two ___ in the room.","sub":"房間裡有兩位男士。","o":["mans","men","man"],"a":"men","e":"man 的複數是 men。"},{"q":"I have one dog and two ___.","sub":"我有一隻狗和兩隻貓。","o":["cat","cates","cats"],"a":"cats","e":"超過一個，cat 要加 s。"}]},{"id":"g4","icon":"👉","zh":"this / that / these / those","intro":"用來指東西的「指示詞」。看東西離你近還遠，是一個還是很多個。","blocks":[{"h":"四個字一次搞懂","table":{"h":["","近","遠"],"r":[["單數（一個）","this 這個","that 那個"],["複數（很多個）","these 這些","those 那些"]]},"ex":[["This is my phone.","這是我的手機。"],["That is my teacher.","那位是我的老師。"],["These are my shoes.","這些是我的鞋子。"],["Those are birds.","那些是鳥。"]]},{"h":"問答","p":"單數用 is，複數用 are。回答時常用 It's（單數）或 They're（複數）。","ex":[["What's this?","這是什麼？"],["It's a pen.","是一支筆。"],["What are those?","那些是什麼？"],["They're apples.","它們是蘋果。"]]}],"basic":true,"ex":[{"q":"___ is my phone. (在我手上)","sub":"這是我的手機。","o":["That","This","These"],"a":"This","e":"近的單數東西用 this。"},{"q":"___ is a tall building. (在遠處)","sub":"那是一棟高樓。","o":["This","Those","That"],"a":"That","e":"遠的單數東西用 that。"},{"q":"___ are my shoes. (穿在我腳上)","sub":"這些是我的鞋子。","o":["These","Those","This"],"a":"These","e":"近的複數東西用 these，後面接 are。"},{"q":"___ birds over there are beautiful.","sub":"那邊那些鳥很美。","o":["That","This","Those"],"a":"Those","e":"遠的複數東西用 those。"},{"q":"What are ___? (旁邊的幾樣東西)","sub":"這些是什麼？","o":["these","this","that"],"a":"these","e":"are 搭配複數，近的用 these。"}]},{"id":"g5","icon":"🔁","zh":"現在簡單式","intro":"用來說「習慣、常做的事、事實」。I / you / we / they 用動詞原形；he / she / it 的動詞要加 s 或 es。","blocks":[{"h":"基本用法","ex":[["I get up at seven.","我七點起床。"],["They play basketball on Sundays.","他們星期日打籃球。"],["She drinks coffee every morning.","她每天早上喝咖啡。"]]},{"h":"he / she / it 的動詞變化","table":{"h":["規則","原形","加 s / es"],"r":[["一般加 s","like / eat","likes / eats"],["s, sh, ch, x, o 結尾加 es","watch / go","watches / goes"],["子音 + y：去 y 加 ies","study","studies"],["不規則","have","has"]]}},{"h":"否定句：don't / doesn't","p":"I / you / we / they 用 don't，he / she / it 用 doesn't。注意 doesn't 後面的動詞要用原形，不加 s。","ex":[["I don't like coffee.","我不喜歡咖啡。"],["He doesn't like coffee.","他不喜歡咖啡。"]]},{"h":"常搭配的頻率詞","p":"always（總是）、usually（通常）、often（常常）、sometimes（有時候）、never（從不）。放在一般動詞前面。","ex":[["I always brush my teeth.","我總是刷牙。"],["He never eats breakfast.","他從不吃早餐。"]]}],"basic":true,"ex":[{"q":"She ___ coffee every morning.","sub":"她每天早上喝咖啡。","o":["drink","drinks","drinking"],"a":"drinks","e":"she 是第三人稱單數，動詞要加 s。"},{"q":"I ___ English on Mondays.","sub":"我星期一學英文。","o":["studies","studying","study"],"a":"study","e":"主詞是 I，用動詞原形。"},{"q":"He ___ to school by bus.","sub":"他搭公車上學。","o":["go","goes","gos"],"a":"goes","e":"go 是 o 結尾，第三人稱單數加 es。"},{"q":"My mom ___ TV at night.","sub":"我媽媽晚上看電視。","o":["watches","watch","watchs"],"a":"watches","e":"watch 是 ch 結尾，加 es。"},{"q":"Tom ___ a dog.","sub":"湯姆有一隻狗。","o":["has","haves","have"],"a":"has","e":"have 的第三人稱單數是不規則的 has。"},{"q":"She doesn't ___ milk.","sub":"她不喝牛奶。","o":["drinks","drinking","drink"],"a":"drink","e":"doesn't 後面的動詞用原形，不加 s。"}]},{"id":"g6","icon":"❓","zh":"用 do / does 問問題","intro":"一般動詞的問句，要在最前面加 Do 或 Does。Does 用在 he / she / it，其他主詞用 Do。","blocks":[{"h":"Yes / No 問句","p":"Do / Does 後面的動詞要用原形。回答時可以用 Yes, I do. 或 No, she doesn't.","ex":[["Do you like pizza?","你喜歡披薩嗎？"],["Yes, I do.","是的，我喜歡。"],["Does she speak English?","她會說英文嗎？"],["No, she doesn't.","不，她不會。"]]},{"h":"加上疑問詞","p":"疑問詞 (what, where, when, who, why) 放在最前面，後面再接 do / does 的問句。","ex":[["What do you eat for breakfast?","你早餐吃什麼？"],["Where does he live?","他住在哪裡？"],["When do you study?","你什麼時候讀書？"]]},{"h":"小提醒","p":"be 動詞 (am / is / are) 的問句不需要 do。例如：Are you a student? 不能說 Do you are a student?"}],"basic":true,"ex":[{"q":"___ you like pizza?","sub":"你喜歡披薩嗎？","o":["Does","Do","Are"],"a":"Do","e":"主詞是 you，用 Do。"},{"q":"___ she speak English?","sub":"她會說英文嗎？","o":["Do","Is","Does"],"a":"Does","e":"主詞是 she，用 Does。"},{"q":"Does he ___ TV every night?","sub":"他每天晚上都看電視嗎？","o":["watch","watches","watching"],"a":"watch","e":"Does 後面的動詞要用原形，所以是 watch。"},{"q":"What ___ you do on weekends?","sub":"你週末做什麼？","o":["does","do","are"],"a":"do","e":"主詞是 you，疑問詞後面接 do。"},{"q":"Does your mom work here? Yes, she ___.","sub":"你媽媽在這裡工作嗎？是的。","o":["does","do","is"],"a":"does","e":"問句用 Does，回答也用 does。"}]},{"id":"g7","icon":"💪","zh":"can（能夠，會）","intro":"can 表示「會、能夠」，也可以用來「請求」和「詢問許可」。can 後面的動詞永遠用原形，而且不管主詞是誰，can 都不變。","blocks":[{"h":"三種常見用法","table":{"h":["用法","例句"],"r":[["能力：會做某事","I can swim."],["請求：可以幫我嗎","Can you help me?"],["許可：我可以嗎","Can I sit here?"]]},"ex":[["She can play the piano.","她會彈鋼琴。"],["Can you help me?","你可以幫我嗎？"],["Can I open the window?","我可以開窗戶嗎？"]]},{"h":"否定與回答","p":"否定是 can't (cannot)。回答用 Yes, I can. 或 No, I can't.","ex":[["I can't swim.","我不會游泳。"],["Can he drive? No, he can't.","他會開車嗎？不會。"]]}],"basic":true,"ex":[{"q":"She can ___ very well.","sub":"她很會游泳。","o":["swims","swim","swimming"],"a":"swim","e":"can 後面的動詞用原形。"},{"q":"He ___ speak French.","sub":"他會說法文。","o":["cans","is can","can"],"a":"can","e":"can 不會隨主詞變化，he 也是用 can。"},{"q":"I ___ swim. I'm afraid of water.","sub":"我不會游泳。我怕水。","o":["can't","can","am"],"a":"can't","e":"「不會」是 can't。"},{"q":"___ I open the window?","sub":"我可以開窗戶嗎？","o":["Am","Can","Do"],"a":"Can","e":"詢問許可用 Can I ...?"},{"q":"Can you help me? Yes, I ___.","sub":"你可以幫我嗎？好的，可以。","o":["do","am","can"],"a":"can","e":"Can 開頭的問句，回答也用 can。"}]},{"id":"g8","icon":"⏮️","zh":"過去簡單式","intro":"用來說「已經發生、已經結束」的事，常搭配 yesterday, last night, last week 等時間詞。中文的動詞不變，英文的動詞要變成過去式。","blocks":[{"h":"be 動詞的過去式","p":"am / is 變 was，are 變 were。","ex":[["I was tired yesterday.","我昨天很累。"],["They were at school.","他們那時在學校。"]]},{"h":"規則動詞：加 ed","p":"一般動詞加 ed。e 結尾只加 d。","ex":[["I watched TV last night.","我昨晚看了電視。"],["She lived in Taipei.","她以前住在台北。"]]},{"h":"常見不規則動詞","table":{"h":["原形","過去式","中文"],"r":[["go","went","去"],["eat","ate","吃"],["see","saw","看見"],["have","had","有，吃"],["come","came","來"]]}},{"h":"否定句與問句：did","p":"否定用 didn't，問句用 Did 開頭。有了 did，動詞就回到原形。","ex":[["I didn't like the movie.","我不喜歡那部電影。"],["Did you eat dinner?","你吃晚餐了嗎？"],["Yes, I did.","是的，我吃了。"]]}],"basic":true,"ex":[{"q":"I ___ TV last night.","sub":"我昨晚看了電視。","o":["watch","watched","watching"],"a":"watched","e":"過去發生的事，規則動詞加 ed。"},{"q":"She ___ to Japan last year.","sub":"她去年去了日本。","o":["went","go","goed"],"a":"went","e":"go 的過去式是不規則的 went。"},{"q":"He ___ not at home yesterday.","sub":"他昨天不在家。","o":["is","were","was"],"a":"was","e":"he 的 be 動詞過去式是 was。"},{"q":"Did you ___ dinner?","sub":"你吃晚餐了嗎？","o":["eat","ate","eaten"],"a":"eat","e":"有 Did 之後，動詞回到原形 eat。"},{"q":"They ___ happy yesterday.","sub":"他們昨天很開心。","o":["was","were","are"],"a":"were","e":"they 的 be 動詞過去式是 were。"},{"q":"I didn't ___ the movie.","sub":"我不喜歡那部電影。","o":["liked","likes","like"],"a":"like","e":"didn't 後面的動詞用原形。"}]}],"sentences":[{"q":"The manager asked all employees to ___ the meeting on Monday morning.","o":["reach","attend","enter","go"],"a":"attend","e":"attend the meeting 表示「出席會議」。reach 是抵達；enter 是進入場所；go 後面要加 to。","cat":"vocab"},{"q":"Because of the heavy rain, the baseball game was ___ until next week.","o":["put on","put up","put out","put off"],"a":"put off","e":"put off 表示「延後」。put on 是穿上，put up 是張貼，put out 是撲滅。","cat":"vocab"},{"q":"My sister is very ___ about the trip to Japan. She can't wait to go.","o":["exciting","excite","excited","excitement"],"a":"excited","e":"主詞是人，表示「感到興奮」，用 -ed 形容詞 excited。","cat":"grammar"},{"q":"He is ___ of speaking in front of a large group of people.","o":["afraid","fear","fearful to","frightening"],"a":"afraid","e":"be afraid of + V-ing 表示「害怕做…」。fear 是名詞或動詞，不能直接接 is。","cat":"vocab"},{"q":"If you have any questions, please do not ___ to ask me.","o":["refuse","avoid","hesitate","doubt"],"a":"hesitate","e":"do not hesitate to V 是「請儘管…」的常用說法。","cat":"vocab"},{"q":"The doctor advised him ___ less sugar.","o":["eating","to eat","eat","ate"],"a":"to eat","e":"advise + 人 + to V，所以用 to eat。","cat":"grammar"},{"q":"This is the ___ film I have ever seen. I fell asleep halfway through it.","o":["more boring","boringest","bored","most boring"],"a":"most boring","e":"有 the 與 ever，用最高級 most boring。bored 用來形容人。","cat":"grammar"},{"q":"She has been studying English ___ she was ten years old.","o":["since","for","during","while"],"a":"since","e":"since + 過去某一時間點（子句）。for 後面要接一段時間。","cat":"grammar"},{"q":"I would have called you if I ___ your phone number.","o":["have","had had","would have","was having"],"a":"had had","e":"與過去事實相反的條件句：if + had + p.p.。「有」的過去分詞是 had，所以 had had。","cat":"grammar"},{"q":"The company decided to ___ a new marketing plan next month.","o":["lunch","lend","lose","launch"],"a":"launch","e":"launch a plan 是「推出計畫」。lunch 是午餐，形近字要小心。","cat":"vocab"},{"q":"Tom failed the test, ___ made his parents very disappointed.","o":["what","who","which","that"],"a":"which","e":"which 引導非限定關係子句，指前面整件事；what 與 that 不能這樣用；who 指人。","cat":"grammar"},{"q":"You look tired. You ___ get some rest.","o":["should","would","might not","used to"],"a":"should","e":"should 用來給建議。","cat":"grammar"},{"q":"The price of oil has ___ sharply since last month.","o":["risen","raised","rose","arisen"],"a":"risen","e":"rise 是不及物動詞，現在完成式用 risen。raise 需要受詞。","cat":"grammar"},{"q":"She was so ___ that she couldn't fall asleep last night.","o":["nervously","nerve","nervous","nerves"],"a":"nervous","e":"be so + 形容詞 + that。人「緊張的」用形容詞 nervous。","cat":"grammar"},{"q":"Please ___ the form and return it to the front desk.","o":["fill with","fill in with","fill on","fill out"],"a":"fill out","e":"fill out a form 是「填寫表格」。fill up 是裝滿。","cat":"vocab"},{"q":"I have never seen ___ a beautiful sunset before.","o":["so","such","too","very"],"a":"such","e":"such + a + 形容詞 + 名詞；so 後面不能直接接 a beautiful sunset。","cat":"grammar"},{"q":"The bus was late, so we ___ to take a taxi.","o":["had","must","should","might"],"a":"had","e":"過去的義務用 had to；must 沒有過去式。","cat":"grammar"},{"q":"He is ___ enough to lift that heavy box by himself.","o":["stronger","strongly","strong","strength"],"a":"strong","e":"形容詞 + enough + to V，用原級形容詞 strong。","cat":"grammar"},{"q":"My father was ___ to the hospital after the accident.","o":["took","taking","take","taken"],"a":"taken","e":"被送到醫院是被動語態，was taken。","cat":"grammar"},{"q":"The teacher asked the students to ___ their homework before the end of class.","o":["hand out","hand in","hand down","hand up"],"a":"hand in","e":"hand in 是「繳交」。hand out 是「發放」。","cat":"vocab"},{"q":"I'm not used to ___ up so early.","o":["get","got","gets","getting"],"a":"getting","e":"be used to 中的 to 是介系詞，後面接 V-ing。","cat":"grammar"},{"q":"A: Would you like some more tea?  B: No, thanks. I have had ___.","o":["enough","much","fully","many"],"a":"enough","e":"have had enough 表示「已經夠了」。","cat":"vocab"},{"q":"The two sisters look alike, but their personalities are quite ___.","o":["same","different","familiar","equal"],"a":"different","e":"but 表示轉折，前面說外表相像，後面應是個性不同。","cat":"vocab"},{"q":"Before you sign the contract, read it ___.","o":["careful","care","carefully","carefulness"],"a":"carefully","e":"修飾動詞 read 用副詞 carefully。","cat":"grammar"},{"q":"She apologized ___ being late for the meeting.","o":["about to","of","for","at"],"a":"for","e":"apologize for + V-ing 表示「為…道歉」。","cat":"grammar"},{"q":"We were ___ the mountain when it started to rain heavily.","o":["climbed","climbing","to climb","climb"],"a":"climbing","e":"when 之前是過去進行式，表示正在爬山時下起大雨，用 were climbing。","cat":"grammar"},{"q":"The concert was cancelled ___ the singer was sick.","o":["because","because of","although","despite"],"a":"because","e":"後面接完整子句 (the singer was sick)，用連接詞 because；because of 後面接名詞。","cat":"grammar"},{"q":"Neither my brother nor my parents ___ interested in football.","o":["is","was","has been","are"],"a":"are","e":"neither...nor 就近一致，靠近動詞的是複數 my parents，用 are。","cat":"grammar"},{"q":"I don't know how to ___ my thanks to you.","o":["explain","describe","speak","express"],"a":"express","e":"express one's thanks 是「表達感謝」的固定搭配。","cat":"vocab"},{"q":"I couldn't ___ how to fix the computer, so I asked my brother for help.","o":["run out","figure out","give out","look out"],"a":"figure out","e":"figure out 是「想出、弄懂」。run out 是用完，give out 是分發，look out 是小心。","cat":"vocab"},{"q":"The children were told ___ noise in the library.","o":["don't make","not making","not to make","do not to make"],"a":"not to make","e":"被動句 were told 之後接 not to + 原形動詞。","cat":"grammar"},{"q":"There ___ a lot of people at the party last night.","o":["were","was","are","is"],"a":"were","e":"last night 是過去，a lot of people 是複數，用 were。","cat":"grammar"},{"q":"He looked at me with a ___ smile on his face, as if he knew a secret.","o":["mysterious","mystery","mysteriously","mystify"],"a":"mysterious","e":"修飾名詞 smile 用形容詞 mysterious。","cat":"grammar"},{"q":"The road is closed, ___ we have to take another route.","o":["because","although","so","unless"],"a":"so","e":"前為原因，後為結果，用 so。","cat":"grammar"},{"q":"She's very ___ of her daughter, who won first prize in the contest.","o":["pride","proud","proudly","prouded"],"a":"proud","e":"be proud of 是「以…為榮」。","cat":"vocab"},{"q":"You'd better take an umbrella ___ it rains.","o":["unless","so that","even though","in case"],"a":"in case","e":"in case 表示「以防」。unless 語意不通。","cat":"grammar"},{"q":"I'm afraid I can't ___ his rude behavior any longer.","o":["put up with","put down","put off","put away"],"a":"put up with","e":"put up with 是「忍受」。","cat":"vocab"},{"q":"The new law will ___ into effect next January.","o":["get","turn","come","take"],"a":"come","e":"come into effect 是「生效」的固定用法。","cat":"vocab"},{"q":"When I was young, I ___ to swim in the river every summer.","o":["use to go","used to go","was used to go","am used to going"],"a":"used to go","e":"used to + 原形動詞 表示過去習慣，且 when I was young 是過去。","cat":"grammar"},{"q":"By the time we arrived, the concert ___ .","o":["has begun","begins","was beginning","had begun"],"a":"had begun","e":"到達是過去時間點，在這之前已開始，用過去完成式 had begun。","cat":"grammar"},{"q":"The more you exercise, the ___ you will feel.","o":["healthy","healthier","healthiest","more healthy"],"a":"healthier","e":"the + 比較級, the + 比較級。healthy 的比較級是 healthier。","cat":"grammar"},{"q":"My phone has run out of ___ . Can I use yours?","o":["battery","electric","power supply","charging"],"a":"battery","e":"run out of battery 表示「電池沒電」。","cat":"vocab"},{"q":"He didn't say a word. ___ of answering, he just smiled.","o":["Because","Besides","Instead","Except"],"a":"Instead","e":"Instead of + V-ing 表示「而不是…」。Besides 和 Except 語意不通。","cat":"vocab"},{"q":"I have a lot of work ___ this week.","o":["doing","did","do","to do"],"a":"to do","e":"名詞 work 後面用不定詞 to do 修飾，表示「要做的工作」。","cat":"grammar"},{"q":"She asked me ___ I had finished my homework.","o":["what","which","whether","that"],"a":"whether","e":"間接引述的 Yes/No 問句用 whether 或 if。","cat":"grammar"},{"q":"The store offers a 20 percent ___ on all winter clothes this week.","o":["price","discount","cost","charge"],"a":"discount","e":"offer a discount 是「提供折扣」。","cat":"vocab"},{"q":"Would you mind ___ me a hand with these bags?","o":["to give","give","gave","giving"],"a":"giving","e":"mind + V-ing，所以用 giving。","cat":"grammar"},{"q":"Yesterday, everyone in the class ___ the answer, so the teacher was pleased.","o":["knew","knows","know","were knowing"],"a":"knew","e":"主詞 everyone 是單數，且 so 之後的 was pleased 是過去，用 knew。","cat":"grammar"},{"q":"The bridge, ___ was built in 1990, is still in good condition.","o":["who","which","whose","where"],"a":"which","e":"先行詞是 bridge，非限定關係子句，主詞位置用 which。","cat":"grammar"},{"q":"I'm looking forward to ___ from you soon.","o":["hearing","hear","heard","be hearing"],"a":"hearing","e":"look forward to 的 to 是介系詞，後接 V-ing。","cat":"grammar"},{"q":"The airline lost my ___ , so I had to buy new clothes.","o":["luggages","baggages","luggage","suitcases of"],"a":"luggage","e":"luggage 是不可數名詞，不加 s。","cat":"grammar"},{"q":"Only ___ students passed the difficult exam.","o":["a little","few of","much","a few"],"a":"a few","e":"students 是可數複數名詞，a few 表示「少數幾個」。a little 用於不可數名詞。","cat":"grammar"},{"q":"He is ___ tall that he can touch the ceiling.","o":["such","too","so","very"],"a":"so","e":"so + 形容詞 + that；such 後面要接名詞。","cat":"grammar"},{"q":"I wish I ___ speak French as well as you.","o":["could","can","will","would"],"a":"could","e":"wish 表示與現在事實相反的願望，助動詞用 could。","cat":"grammar"},{"q":"The teacher made the students ___ the poem.","o":["to memorize","memorize","memorizing","memorized"],"a":"memorize","e":"make + 受詞 + 原形動詞（使役）。","cat":"grammar"},{"q":"This restaurant is famous ___ its seafood.","o":["of","by","with","for"],"a":"for","e":"be famous for 表示「以…聞名」。","cat":"vocab"},{"q":"We ran out of gas on the highway, ___ was very dangerous.","o":["what","which","it","that"],"a":"which","e":"which 可指前面整件事情，引導補充說明。","cat":"grammar"},{"q":"She is the ___ of the two sisters.","o":["taller","tallest","more tall","most tall"],"a":"taller","e":"兩者比較，且有 the 與 of the two，用 the + 比較級 taller。","cat":"grammar"},{"q":"Unless you ___ harder, you won't pass the exam.","o":["will study","studied","are studied","study"],"a":"study","e":"unless 子句中用現在式代替未來，主詞 you 用原形 study。","cat":"grammar"},{"q":"It is important for children ___ enough sleep.","o":["getting","get","to get","gets"],"a":"to get","e":"It is important for + 人 + to V 的句型。","cat":"grammar"},{"q":"I don't feel like ___ out tonight. Let's stay home.","o":["to go","going","go","went"],"a":"going","e":"feel like + V-ing 表示「想要…」。","cat":"grammar"},{"q":"The singer was ___ by thousands of fans when she arrived at the airport.","o":["surrounding","surround","surrounded","surrounds"],"a":"surrounded","e":"被成千上萬粉絲包圍，是被動語態 was surrounded。","cat":"grammar"},{"q":"The results of the survey were ___ to everyone. Nobody expected them.","o":["surprising","surprised","surprise","surprisingly"],"a":"surprising","e":"results 是事物，令人驚訝的，用 -ing 形容詞 surprising。","cat":"grammar"},{"q":"Please keep your voice ___ . People are trying to sleep.","o":["small","short","thin","down"],"a":"down","e":"keep one's voice down 是「小聲一點」。","cat":"vocab"},{"q":"She was late for work ___ she missed the bus.","o":["because of","because","so","although"],"a":"because","e":"後面是完整子句 (she missed the bus)，用 because；because of 後面接名詞。","cat":"grammar"},{"q":"My grandmother ___ in this village all her life, and she loves it.","o":["lives","lived","is living","has lived"],"a":"has lived","e":"all her life 表示到現在為止的一輩子，用現在完成式 has lived。","cat":"grammar"},{"q":"Could you tell me ___ the nearest bank is?","o":["where","where is","that","which"],"a":"where","e":"間接問句用直述句語序：where the nearest bank is。","cat":"grammar"},{"q":"The price of vegetables ___ because of the typhoon.","o":["went in","put up","went up","turned on"],"a":"went up","e":"went up 是「上漲」，主詞 price 為主動語態。put up 需要受詞。","cat":"vocab"},{"q":"He works as a ___ at a local hospital, helping doctors take care of patients.","o":["nursery","nourish","nurse","nurture"],"a":"nurse","e":"nurse 是護理師。其他都是形近字：nursery 是托兒所。","cat":"vocab"},{"q":"Please turn ___ your cell phone during the performance so that it won't disturb others.","o":["on","off","up","over"],"a":"off","e":"turn off 是「關掉」；為了不打擾別人，應該關機。","cat":"vocab"},{"q":"I would like to ___ a table for two at seven o'clock.","o":["reserve","reverse","resist","respect"],"a":"reserve","e":"reserve a table 是「訂位」。reverse 是倒轉。","cat":"vocab"},{"q":"It is ___ that he will win the race, because he has trained hard.","o":["like","likelihood","alike","likely"],"a":"likely","e":"It is likely that ... 是「很可能…」。","cat":"vocab"}],"cloze":[{"title":"A New Habit","text":"Last year, I decided to (1) ___ my life a little healthier. I used to eat fast food almost every day, (2) ___ I often felt tired. So I started cooking at home. At first, it was difficult (3) ___ I didn't know many recipes. However, I found some easy ones online, and soon I began to enjoy it. Now I cook dinner for my family three times (4) ___ . I have also lost three kilograms. I really feel that cooking has (5) ___ my life for the better.","qs":[{"o":["do","take","make","put"],"a":"make","e":"make + 受詞 + 形容詞 表示「使…變得…」；make my life healthier。"},{"o":["because","so","although","unless"],"a":"so","e":"前面是原因（每天吃速食），後面是結果（常覺得累），用 so。"},{"o":["so","but","if","because"],"a":"because","e":"困難的原因是不知道很多食譜，用 because。"},{"o":["a week","the week","in week","for week"],"a":"a week","e":"「每週三次」是 three times a week。"},{"o":["was changed","changing","changed","change"],"a":"changed","e":"現在完成式 has + p.p.，changed my life for the better。"}]},{"title":"The Night Market","text":"Night markets are very popular in Taiwan. They are places (1) ___ people can enjoy cheap food and play simple games. Many tourists visit them (2) ___ they want to experience local culture. The most famous food (3) ___ stinky tofu, which has a strong smell but tastes delicious. Some night markets are so crowded (4) ___ it is hard to walk through them. If you go there, you should (5) ___ your bag safe.","qs":[{"o":["which","where","who","what"],"a":"where","e":"先行詞 places 是地點，且子句完整，用關係副詞 where。"},{"o":["because","although","unless","so"],"a":"because","e":"觀光客造訪的原因是想體驗當地文化，用 because。"},{"o":["are","were","being","is"],"a":"is","e":"主詞 The most famous food 是單數，現在式用 is。"},{"o":["which","that","what","because"],"a":"that","e":"so ... that 句型，表示程度太擁擠以致於難以通過。"},{"o":["keep","hold","stay","turn"],"a":"keep","e":"keep + 受詞 + 形容詞，keep your bag safe 是「保管好你的包包」。"}]},{"title":"Working from Home","text":"More and more companies now allow their workers to work from home. This has several (1) ___ . First, employees do not have to spend time traveling to the office, so they can sleep longer. Second, companies can save money (2) ___ they need smaller offices. (3) ___ , working from home also has problems. Some people feel lonely because they cannot meet their colleagues. Others find it hard to (4) ___ on their work when their children are around. In the end, (5) ___ people prefer to work from home depends on their personality and family situation.","qs":[{"o":["adventures","adverbs","advantages","advices"],"a":"advantages","e":"several 之後接複數名詞，advantages 是「優點」，符合「首先...其次...」的敘述。"},{"o":["although","unless","until","because"],"a":"because","e":"公司能省錢的原因是需要較小的辦公室，用 because。"},{"o":["Therefore","For example","Moreover","However"],"a":"However","e":"前面說優點，後面說問題，用 However 表示轉折。"},{"o":["pay","focus in","concentrate","depend"],"a":"concentrate","e":"concentrate on 是「專注於」。"},{"o":["whether","that","which","what"],"a":"whether","e":"主詞子句 whether ... depends on 表示「是否…取決於」。"}]},{"title":"A Lost Wallet","text":"Last Saturday, Ben went shopping downtown. When he was about to pay for a shirt, he found that his wallet (1) ___ . He looked in all his pockets but could not find it. He (2) ___ that he had left it on the bus. He ran back to the bus stop and told the driver what had happened. Luckily, another passenger (3) ___ the wallet and handed it in to the driver. Ben was so (4) ___ that he thanked the driver again and again. He also learned a lesson: he should always (5) ___ his things.","qs":[{"o":["missed","was missing","has missed","is missing"],"a":"was missing","e":"發現當下是過去，錢包「不見了」用 was missing 表示狀態。"},{"o":["reminded","realized","told","spoke"],"a":"realized","e":"realize that ... 是「發覺、意識到」；remind 和 tell 需要接人當受詞，speak 不能直接接 that 子句。"},{"o":["finds","was finding","had found","will find"],"a":"had found","e":"乘客在 Ben 回來之前就找到並交給司機，用過去完成式 had found。"},{"o":["relieving","relief","relieve","relieved"],"a":"relieved","e":"人「鬆了一口氣」，用 -ed 形容詞 relieved；so ... that 句型。"},{"o":["take care of","take care","take off","take part in"],"a":"take care of","e":"take care of 是「照顧、保管」，後面接受詞；take care 不能直接接受詞。"}]},{"title":"Learning by Doing","text":"Many students think that (1) ___ a language means memorizing thousands of words. In fact, words are only one part of it. To speak well, you need to practice speaking as much as (2) ___ . Some students are afraid of making mistakes, so they do not speak in class. (3) ___ , mistakes are a natural part of learning. If you never make mistakes, you (4) ___ probably not learning anything new. A good way to improve is to (5) ___ with a language partner every week.","qs":[{"o":["learn","learning","learned","to learned"],"a":"learning","e":"動名詞 learning 當主詞補語的 that 子句主詞，learning a language 意思是「學習語言」。"},{"o":["possibly","possibility","impossible","possible"],"a":"possible","e":"as much as possible 是「盡可能多」。"},{"o":["So","Because","However","Unless"],"a":"However","e":"前面說學生怕犯錯，後面說犯錯是自然的，用 However 表示轉折。"},{"o":["are","do","will","have"],"a":"are","e":"you are probably not learning 是現在簡單式 be 動詞，與 probably not 搭配。"},{"o":["talking","talked","talk","talks"],"a":"talk","e":"句型是 is to + 原形動詞（to 已經在空格前），所以填原形 talk。"}]},{"title":"City Bikes","text":"In recent years, many cities have introduced public bike-sharing systems. With a smartphone, people can rent a bike at one station and (1) ___ it at another. This is a cheap and convenient way to travel short distances. Cities also hope that bikes will help (2) ___ traffic and pollution. However, there are some problems. Sometimes there are not enough bikes at busy stations, and some riders do not follow the traffic rules, (3) ___ can be dangerous. To make the system safer, the government is (4) ___ more bike lanes and asking riders to wear helmets. It is expected that the number of riders (5) ___ in the future.","qs":[{"o":["reserve","return","reply","remove"],"a":"return","e":"rent a bike at one station and return it at another 是「租借後歸還」。"},{"o":["produce","introduce","increase","reduce"],"a":"reduce","e":"reduce traffic and pollution 是「減少交通與污染」。"},{"o":["which","what","it","who"],"a":"which","e":"which 引導非限定關係子句，指前面整件事情 (riders do not follow the rules)。"},{"o":["built","to build","builds","building"],"a":"building","e":"the government is + V-ing，現在進行式，is building 表示正在興建。"},{"o":["grew","will grow","grows","has grown"],"a":"will grow","e":"in the future 表示未來，且 It is expected that 後面用未來式 will grow。"}]}],"reading":[{"title":"Notice: Library Opening Hours","text":"Attention all library users\n\nStarting on October 1, the Central Library will change its opening hours. From Monday to Friday, the library will open at 9:00 a.m. and close at 9:00 p.m., one hour later than before. On Saturdays and Sundays, it will be open from 10:00 a.m. to 6:00 p.m. The library will remain closed on national holidays.\n\nIn addition, the library will launch a new service called \"Book Express.\" Readers can order books online and pick them up at the front desk the next day. This service is free for members, but non-members must pay a fee of 30 dollars per book.\n\nTo become a member, please bring your ID card to the front desk and fill out a short form. The library card is free and will be ready in ten minutes. For more information, please visit our website or call 2345-6789.","qs":[{"q":"What is the main purpose of this notice?","o":["To ask readers to return their books","To advertise a bookstore sale","To announce changes and a new service at the library","To invite people to a reading contest"],"a":"To announce changes and a new service at the library","e":"公告內容主要是新的開放時間與「Book Express」新服務。"},{"q":"How long will the library be open on Saturdays?","o":["Eight hours","Ten hours","Twelve hours","Six hours"],"a":"Eight hours","e":"週六 10:00 a.m. 到 6:00 p.m.，共八小時。"},{"q":"How much does a non-member pay for the Book Express service?","o":["Nothing","30 dollars per month","10 dollars per book","30 dollars per book"],"a":"30 dollars per book","e":"文中寫 non-members must pay a fee of 30 dollars per book。"},{"q":"What should a person do to get a library card?","o":["Bring an ID card and fill out a form","Pay 30 dollars online","Call the library and wait a week","Order a book first"],"a":"Bring an ID card and fill out a form","e":"文中寫 bring your ID card ... and fill out a short form。"}]},{"title":"An Email to a Friend","text":"Hi Jenny,\n\nHow are you? I'm writing to tell you about my new job. Two weeks ago, I started working as an assistant at a travel agency in Taichung. My boss, Mr. Wang, is very kind, and my colleagues are friendly, too. They helped me a lot during my first week.\n\nMy work is not easy, though. I have to answer many phone calls and help customers choose trips. Yesterday, a man called and wanted to change his flight three times! I was quite tired after work. However, I love learning about different countries, and I hope I can travel to some of them one day.\n\nAre you free this weekend? I would like to invite you to my new apartment. It's small, but it's close to the train station. I can cook dinner for you. Let me know if you can come.\n\nBest wishes,\nLily","qs":[{"q":"Why did Lily write this email?","o":["To ask Jenny for a job","To share news about her job and invite Jenny","To cancel a trip","To complain about her boss"],"a":"To share news about her job and invite Jenny","e":"信中先說明新工作，最後邀請 Jenny 週末到她的新公寓。"},{"q":"What is Lily's job?","o":["She is a teacher.","She is a chef.","She is an assistant at a travel agency.","She is a flight attendant."],"a":"She is an assistant at a travel agency.","e":"文中寫 working as an assistant at a travel agency。"},{"q":"What made Lily tired yesterday?","o":["A long meeting with her boss","A customer who changed his flight many times","Cleaning her new apartment","A trip to Taichung"],"a":"A customer who changed his flight many times","e":"昨天有位男士打電話要求改三次班機，讓她很累。"},{"q":"What does Lily plan to do this weekend?","o":["Visit her boss","Take a train to Taipei","Look for a new apartment","Cook dinner for Jenny"],"a":"Cook dinner for Jenny","e":"she can cook dinner for you，表示她想煮晚餐給 Jenny。"}]},{"title":"Sleep and Students","text":"Many students stay up late to study or play games, but doctors say this is a bad habit. Teenagers need about eight to ten hours of sleep every night. However, a recent survey of 1,000 high school students found that more than half of them sleep for less than seven hours on school days.\n\nLack of sleep can cause several problems. First, tired students find it harder to concentrate in class, so their grades may drop. Second, they are more likely to feel angry or sad. Some may even get sick more often because their bodies cannot rest well.\n\nExperts suggest a few simple ways to sleep better. Students should go to bed at the same time every night, and they should not use their phones in bed, because the bright light from the screen makes it difficult to fall asleep. Drinking coffee or tea in the evening is also not a good idea. If students follow these tips, they will feel more energetic and do better at school.","qs":[{"q":"What did the survey find?","o":["More than half of the students sleep less than seven hours.","Most students sleep more than ten hours.","Half of the students play games at school.","Students sleep well on school days."],"a":"More than half of the students sleep less than seven hours.","e":"文中寫 more than half of them sleep for less than seven hours on school days。"},{"q":"Which is NOT mentioned as a problem caused by lack of sleep?","o":["Difficulty concentrating","Feeling angry or sad","Getting fat","Getting sick more often"],"a":"Getting fat","e":"文中提到難以專心、情緒不好、容易生病，沒有提到變胖。"},{"q":"Why should students avoid using phones in bed?","o":["The screen light makes it hard to fall asleep.","Phones are too expensive.","It costs a lot of electricity.","Their parents will be angry."],"a":"The screen light makes it hard to fall asleep.","e":"文中說 the bright light from the screen makes it difficult to fall asleep。"},{"q":"What is the best title for this passage?","o":["How to Choose a Good Phone","Get More Sleep for Better Health and Grades","Why Coffee Is Popular","The Best Way to Study Math"],"a":"Get More Sleep for Better Health and Grades","e":"全文主題是睡眠不足的問題與改善方法。"}]},{"title":"The Story of Bubble Tea","text":"Bubble tea is one of the most famous drinks from Taiwan. It was created in the 1980s, but people still argue about who invented it. Two tea shops, one in Taichung and one in Tainan, both say they were the first to make it.\n\nAccording to the Taichung shop, its owner once put sweet tapioca balls into her iced tea during a meeting, and everyone liked the taste. The Tainan shop says its owner made a similar drink after he saw white tapioca balls in a local market and thought they looked like pearls.\n\nNo matter who really invented it, bubble tea quickly became popular in Taiwan. In the 1990s, it spread to Japan, the United States and many other countries. Today, there are bubble tea shops all over the world, and some of them offer new flavors such as brown sugar and cheese foam. For many people, bubble tea is not only a drink but also a symbol of Taiwanese culture.","qs":[{"q":"What do people argue about?","o":["Where bubble tea is sold","How bubble tea tastes","Who invented bubble tea","When tea was first made"],"a":"Who invented bubble tea","e":"文章第一段指出 people still argue about who invented it。"},{"q":"According to the Tainan shop, why did its owner make the drink?","o":["He wanted to sell it in Japan.","He was asked to by his teacher.","He needed a new job.","He thought the tapioca balls looked like pearls."],"a":"He thought the tapioca balls looked like pearls.","e":"文中寫 he saw white tapioca balls ... and thought they looked like pearls。"},{"q":"What can we learn about bubble tea from the passage?","o":["It has spread to many countries.","It was invented in the 1960s.","It has only one flavor.","It is sold only in Taiwan."],"a":"It has spread to many countries.","e":"文中指出 1990 年代傳到日本、美國和其他國家，現在全世界都有。"},{"q":"The word 'symbol' in the last sentence is closest in meaning to ___ .","o":["price","habit","sign","rule"],"a":"sign","e":"symbol 是「象徵」，最接近 sign（標誌）。"}]},{"title":"A Day at the Airport","text":"Last month, my family flew to Okinawa for a five-day holiday. We got to the airport three hours before our flight because my mother always worries about being late. After we checked in, we found out that our flight was delayed for an hour because of bad weather.\n\nWhile we were waiting, my younger brother got bored, so we walked around the shops. I bought a small souvenir for my grandmother, and my father had a cup of coffee. Then we heard an announcement: \"Passengers to Okinawa, please go to Gate 15.\" We hurried there, but the gate had been changed to Gate 22, which was very far away. We ran as fast as we could, and we were the last ones to board the plane.\n\nAlthough the trip started with a lot of trouble, we had a wonderful time in Okinawa. Now, whenever we travel, my mother still arrives early, but this time, no one complains.","qs":[{"q":"Why did the family arrive so early at the airport?","o":["Their flight was earlier than usual.","They wanted to go shopping.","They needed to buy tickets.","Their mother always worries about being late."],"a":"Their mother always worries about being late.","e":"文中寫 my mother always worries about being late。"},{"q":"Why was the flight late?","o":["Because of a broken plane","Because of bad weather","Because the passengers were late","Because the gate was closed"],"a":"Because of bad weather","e":"文中寫 delayed for an hour because of bad weather。"},{"q":"What happened at the gate?","o":["The family missed the plane.","The airline lost their bags.","The gate was closed early.","The gate had been changed to a farther one."],"a":"The gate had been changed to a farther one.","e":"文中說登機門改到 Gate 22，離得很遠，他們跑過去才趕上。"},{"q":"What does the writer imply in the last sentence?","o":["The family now understands why the mother is careful.","The mother stopped traveling.","The father does not like travel.","The trip was a bad experience."],"a":"The family now understands why the mother is careful.","e":"最後說 no one complains，暗示大家現在理解媽媽早到的原因。"}]},{"title":"Online Shopping: Pros and Cons","text":"Online shopping has become part of daily life. According to a survey, about seven out of ten adults in Taiwan buy something online at least once a month. There are good reasons for this. First, shoppers can compare prices from different websites in a few minutes, so they often find better deals. Second, they can shop at any time, even at midnight, without leaving home. Third, the goods are delivered to their door.\n\nHowever, online shopping also has disadvantages. Buyers cannot touch or try on the products, so the items sometimes look different from the pictures. Some people also spend more than they planned because it is so easy to click \"buy.\" In addition, if a product is faulty, returning it can be troublesome and take a long time.\n\nTo shop safely online, experts advise readers to buy only from trusted websites, read reviews from other buyers, and check the return policy before paying. If the price looks too good to be true, it probably is.","qs":[{"q":"According to the survey, how many adults shop online at least once a month?","o":["About 30 percent","About 7 percent","About 70 percent","About half"],"a":"About 70 percent","e":"seven out of ten 即百分之七十。"},{"q":"Which of the following is an advantage of online shopping?","o":["Buyers can try on clothes.","Buyers can compare prices easily.","Products are always cheaper.","Returns are always quick."],"a":"Buyers can compare prices easily.","e":"第一個優點就是可以在幾分鐘內比價。"},{"q":"Why do some people spend more than they planned?","o":["Shipping is always free.","The prices are always high.","Clicking 'buy' is very easy.","They cannot read the reviews."],"a":"Clicking 'buy' is very easy.","e":"文中寫 it is so easy to click 'buy'。"},{"q":"What does the last sentence mean?","o":["A very cheap price may be a warning sign.","Cheap products are always good.","Buyers should look for higher prices.","Websites never lie about prices."],"a":"A very cheap price may be a warning sign.","e":"too good to be true 表示好得不真實，所以可能有問題。"}]},{"title":"Volunteering at an Animal Shelter","text":"Every Saturday morning, Emma gets up early and takes a bus to the Happy Paws Animal Shelter. She has been a volunteer there for two years. The shelter takes care of about eighty dogs and cats that have lost their homes. Some were found on the street, and others were left by owners who could no longer look after them.\n\nAt the shelter, Emma feeds the animals, cleans their cages and takes the dogs for a walk. Sometimes she helps take photos of the animals and puts them on the shelter's website so that more people can see them. \"The best moment is when someone decides to adopt a dog I have looked after,\" Emma says with a smile.\n\nEmma first joined the shelter because she was lonely after moving to a new city. Now she has made many friends there. She also learned to be more patient and responsible. \"I thought I was helping the animals,\" she said, \"but in fact, they have helped me even more.\"","qs":[{"q":"What does Emma NOT do at the shelter?","o":["Feed the animals","Clean the cages","Walk the dogs","Give the animals medical operations"],"a":"Give the animals medical operations","e":"文中提到餵食、清理籠子、遛狗和拍照，並沒有提到動手術。"},{"q":"Why does Emma put photos on the website?","o":["To sell the animals","So that more people can see the animals","To find a job","To show her camera"],"a":"So that more people can see the animals","e":"文中說 so that more people can see them。"},{"q":"Why did Emma start volunteering?","o":["She wanted to get a pet.","Her school required it.","She had free time on weekdays.","She felt lonely in a new city."],"a":"She felt lonely in a new city.","e":"文中寫 she was lonely after moving to a new city。"},{"q":"What does Emma mean by 'they have helped me even more'?","o":["The animals gave her money.","The animals cleaned the shelter.","She gained friends and learned new qualities.","The shelter paid her."],"a":"She gained friends and learned new qualities.","e":"她交到朋友，也學會耐心與責任感，代表動物們對她幫助更大。"}]},{"title":"Working Holiday in Australia","text":"A \"working holiday\" allows young people to live in another country for up to one year while working part-time to pay for their trip. Taiwan has signed working holiday agreements with several countries, and Australia is one of the most popular choices among young Taiwanese.\n\nKevin, 24, went to Australia last year after he graduated from university. He found a job picking fruit on a farm, where he earned around 25 dollars an hour. \"The work was tiring, and I got sunburned in the first week,\" he said. \"But I met people from all over the world and improved my English a lot.\"\n\nNot everything went smoothly, however. Kevin had trouble finding an apartment in the beginning because the rent in big cities was very high. In the end, he shared a house with three other travelers, which reduced his cost. After ten months, he returned to Taiwan with new friends, some savings, and much more confidence. He advises others to prepare enough money before leaving and to learn some basic English.","qs":[{"q":"What is a 'working holiday'?","o":["A chance to live abroad and work part-time","A long paid vacation","A school exchange program","A business trip for managers"],"a":"A chance to live abroad and work part-time","e":"文章開頭定義：可在另一個國家住一年並以兼職工作支付旅費。"},{"q":"What was Kevin's job in Australia?","o":["Teaching English","Picking fruit on a farm","Working in a hotel","Driving a bus"],"a":"Picking fruit on a farm","e":"文中寫 picking fruit on a farm。"},{"q":"How did Kevin lower his living cost?","o":["He shared a house with other travelers.","He slept on a farm.","He lived with his relatives.","He moved to a small town."],"a":"He shared a house with other travelers.","e":"文中寫 he shared a house with three other travelers, which reduced his cost。"},{"q":"What advice does Kevin give?","o":["Go to the biggest city first","Find a full-time job at once","Do not work on farms","Save enough money and learn basic English before going"],"a":"Save enough money and learn basic English before going","e":"最後一句：prepare enough money and learn some basic English。"}]},{"title":"The Rise of Electric Scooters","text":"Electric scooters are becoming more and more common in Taiwan's cities. Because they are quiet, cheap to run and do not produce exhaust, many people see them as a good way to reduce air pollution. The government even offers money to people who replace their old gas scooters with electric ones.\n\nHowever, there are still some problems. First, charging can be inconvenient for people who live in apartments without parking spaces. To solve this, companies have started to build battery-swapping stations, where riders can exchange an empty battery for a full one in less than a minute. Second, electric scooters are usually more expensive to buy than gas scooters, although the running cost is lower.\n\nMany experts believe that electric scooters will continue to grow in popularity. As the technology improves and more charging stations are built, riders will find them even easier to use. If more people ride electric scooters, our cities will become quieter and cleaner.","qs":[{"q":"Why do people think electric scooters help the environment?","o":["They are quieter than cars.","They do not produce exhaust.","They have big batteries.","They are made from plastic."],"a":"They do not produce exhaust.","e":"文中寫 do not produce exhaust，可減少空氣污染。"},{"q":"What do battery-swapping stations do?","o":["Sell gas to scooter riders","Repair old scooters","Let riders exchange an empty battery for a full one","Rent scooters to tourists"],"a":"Let riders exchange an empty battery for a full one","e":"文中寫 exchange an empty battery for a full one in less than a minute。"},{"q":"Which statement is true about electric scooters?","o":["They cost less to buy than gas scooters.","They are louder than gas scooters.","They need gas from the station.","They cost more to buy but less to run."],"a":"They cost more to buy but less to run.","e":"文中說買時較貴 (more expensive to buy)，但 running cost is lower。"},{"q":"What is the writer's opinion in the last paragraph?","o":["Electric scooters will disappear.","Gas scooters are better.","Electric scooters will become more popular.","The government should stop helping."],"a":"Electric scooters will become more popular.","e":"作者認為電動機車會持續受歡迎，城市會更安靜乾淨。"}]}],"listening":[{"type":"pic","audio":[["N","A man is carrying a heavy box up the stairs."]],"qs":[{"q":"哪一個情境符合你聽到的句子？","o":["🧍📦🪜 一個男人扛著箱子上樓梯","🧍📦🚗 一個男人把箱子放進汽車","👩📦🪜 一個女人拿著空箱子下樓梯","🧍🪜 一個男人站在樓梯旁休息"],"a":"🧍📦🪜 一個男人扛著箱子上樓梯","e":"聽到 carrying a heavy box up the stairs，是男人扛著重箱子上樓梯。"}]},{"type":"pic","audio":[["N","The children are building a sandcastle on the beach."]],"qs":[{"q":"哪一個情境符合你聽到的句子？","o":["🧒🏊 孩子們在游泳池游泳","🧒🏖️🏰 孩子們在沙灘上堆沙堡","🧒🏖️☂️ 孩子們在沙灘上撐傘","🧒🏫 孩子們在學校教室上課"],"a":"🧒🏖️🏰 孩子們在沙灘上堆沙堡","e":"building a sandcastle on the beach 是在沙灘上堆沙堡。"}]},{"type":"pic","audio":[["N","A woman is paying for her groceries with a credit card."]],"qs":[{"q":"哪一個情境符合你聽到的句子？","o":["👩💵🍽️ 一個女人用現金在餐廳付款","👩🛒🏃 一個女人推著購物車奔跑","👩📱🚌 一個女人用手機搭公車","👩💳🛒 一個女人用信用卡付雜貨的錢"],"a":"👩💳🛒 一個女人用信用卡付雜貨的錢","e":"paying for her groceries with a credit card：用信用卡付雜貨的錢。"}]},{"type":"pic","audio":[["N","The plane is about to take off, and the passengers are fastening their seat belts."]],"qs":[{"q":"哪一個情境符合你聽到的句子？","o":["✈️🧑‍🤝‍🧑 飛機即將起飛，乘客正在繫安全帶","✈️🧳 乘客正在領行李","🚌🧑‍🤝‍🧑 乘客正在公車上下車","✈️🍽️ 乘客正在吃機上餐"],"a":"✈️🧑‍🤝‍🧑 飛機即將起飛，乘客正在繫安全帶","e":"take off 是起飛，fastening seat belts 是繫安全帶。"}]},{"type":"pic","audio":[["N","There are two dogs sleeping under the tree, and a girl is reading a book beside them."]],"qs":[{"q":"哪一個情境符合你聽到的句子？","o":["🌳🐕👧⚽ 一隻狗和女孩在樹下踢球","🏠🐕🐕👧 兩隻狗在屋裡，女孩在洗澡","🌳🐕🐕👧📖 兩隻狗在樹下睡覺，女孩在旁邊看書","🌳🐈🐈👧📖 兩隻貓在樹下睡覺，女孩在看書"],"a":"🌳🐕🐕👧📖 兩隻狗在樹下睡覺，女孩在旁邊看書","e":"聽到 two dogs sleeping under the tree，girl reading a book beside them。"}]},{"type":"pic","audio":[["N","The waiter is putting a plate of noodles on the table in front of the customer."]],"qs":[{"q":"哪一個情境符合你聽到的句子？","o":["🍜🧑‍🍳🚪 服務生把麵帶到門外","🍜🧑‍🍳🪑 服務生把一盤麵放到客人面前的桌上","🍚🧑‍🍳🪑 服務生上了一碗飯","🥤🧑‍🍳🪑 服務生上了一杯飲料"],"a":"🍜🧑‍🍳🪑 服務生把一盤麵放到客人面前的桌上","e":"a plate of noodles 是一盤麵，on the table in front of the customer 是客人面前的桌上。"}]},{"type":"pic","audio":[["N","A man in a raincoat is waiting for a bus, but the bus stop is empty except for him."]],"qs":[{"q":"哪一個情境符合你聽到的句子？","o":["🌧️🧥🚏 穿雨衣的男人獨自在站牌等公車","☀️🧢🚏 戴帽子的男人在陽光下等公車","🌧️🧥🚏👥 穿雨衣的男人在擁擠的站牌等公車","🌧️🧥🚗 穿雨衣的男人在開車"],"a":"🌧️🧥🚏 穿雨衣的男人獨自在站牌等公車","e":"raincoat 是雨衣，empty except for him 表示只有他一個人。"}]},{"type":"pic","audio":[["N","A nurse is checking a patient's blood pressure while the patient is sitting on a bed."]],"qs":[{"q":"哪一個情境符合你聽到的句子？","o":["💉🛏️ 護理師替躺著的病人打針","🩺🪑 護理師替坐在椅子上的孩子量體溫","💊🛏️ 護理師遞藥給站著的病人","🩺🛏️ 護理師替坐在床上的病人量血壓"],"a":"🩺🛏️ 護理師替坐在床上的病人量血壓","e":"checking blood pressure 是量血壓，patient is sitting on a bed 是坐在床上。"}]},{"type":"qa","audio":[["A","How long have you been learning English?"]],"qs":[{"q":"請選出最適當的回答。","o":["Yes, I have.","For about three years.","Since three years.","It's three o'clock."],"a":"For about three years.","e":"How long 問時間長度，For + 一段時間。Since 後面要接起點。"}]},{"type":"qa","audio":[["B","Would you mind closing the window? It's a little cold in here."]],"qs":[{"q":"請選出最適當的回答。","o":["Yes, I would. Please do.","I don't like windows.","Not at all. I'll do it right now.","It's not cold."],"a":"Not at all. I'll do it right now.","e":"Would you mind ...? 的禮貌回答，Not at all 表示「不介意」，會照做。Yes 反而變成介意。"}]},{"type":"qa","audio":[["A","What do you do for a living?"]],"qs":[{"q":"請選出最適當的回答。","o":["I'm a nurse at a local hospital.","I'm living in Taipei.","I do it every day.","Yes, I live well."],"a":"I'm a nurse at a local hospital.","e":"What do you do for a living? 是問職業。"}]},{"type":"qa","audio":[["B","I'm sorry I'm late. The traffic was terrible."]],"qs":[{"q":"請選出最適當的回答。","o":["Yes, you are very kind.","I hate traffic too much.","You are welcome.","That's OK. We've just started."],"a":"That's OK. We've just started.","e":"對方道歉並解釋，合適的回答是「沒關係，我們剛開始」。"}]},{"type":"qa","audio":[["A","Have you finished the report yet?"]],"qs":[{"q":"請選出最適當的回答。","o":["Yes, I will finish it.","Not yet. I'll send it by tonight.","No, I haven't seen it yesterday.","It was very long ago."],"a":"Not yet. I'll send it by tonight.","e":"Have you ... yet? 的回答用 Not yet / Yes, I have。"}]},{"type":"qa","audio":[["B","Do you want to eat out or cook at home tonight?"]],"qs":[{"q":"請選出最適當的回答。","o":["Yes, I want to.","I ate out yesterday, so I cook.","Let's cook at home. I'm too tired to go out.","Tonight is a good night."],"a":"Let's cook at home. I'm too tired to go out.","e":"選擇問句 A or B，要選一個並說明理由。"}]},{"type":"qa","audio":[["A","Excuse me, could you tell me how to get to the post office?"]],"qs":[{"q":"請選出最適當的回答。","o":["It opens at nine o'clock.","Go straight and turn left at the second corner.","Yes, I could tell you.","I sent a letter yesterday."],"a":"Go straight and turn left at the second corner.","e":"問路，應回答路線。"}]},{"type":"qa","audio":[["B","You look upset. What's wrong?"]],"qs":[{"q":"請選出最適當的回答。","o":["I'm very right.","It's on the table.","I failed my driving test again.","No, I don't look."],"a":"I failed my driving test again.","e":"What's wrong? 問原因，回答發生了什麼事。"}]},{"type":"qa","audio":[["A","If you had a week off, where would you go?"]],"qs":[{"q":"請選出最適當的回答。","o":["I'd go to Europe and visit some museums.","I went to Europe last week.","I will go there tomorrow.","I have a week off."],"a":"I'd go to Europe and visit some museums.","e":"問句是第二條件句（假設），回答也用 would。"}]},{"type":"qa","audio":[["B","How often do you go to the gym?"]],"qs":[{"q":"請選出最適當的回答。","o":["For about two hours.","It's very far from here.","I went there last year.","About three times a week."],"a":"About three times a week.","e":"How often 問頻率，回答 three times a week。"}]},{"type":"dlg","audio":[["A","Hi, Jack. Are you going to the company party on Friday?"],["B","I'd love to, but I have to finish a report by Monday. I might work over the weekend."],["A","That's too bad. Everyone will be there."],["B","I know. Maybe I can join you for an hour after dinner if I finish early."]],"qs":[{"q":"Why can't Jack say for sure that he will go to the party?","o":["He is sick.","He has a report to finish.","He has another party.","He doesn't like his colleagues."],"a":"He has a report to finish.","e":"Jack 說 I have to finish a report by Monday。"}]},{"type":"dlg","audio":[["B","Excuse me. I bought this shirt yesterday, but it's too small. Can I exchange it?"],["A","Of course. Do you have the receipt?"],["B","Yes, here it is."],["A","Thank you. We have the same shirt in a larger size. Would you like to try it on?"]],"qs":[{"q":"What does the man want to do?","o":["Exchange a shirt for a bigger one","Get a refund","Buy another shirt","Return a pair of shoes"],"a":"Exchange a shirt for a bigger one","e":"他說 too small，想 exchange，店員給他較大的尺寸。"}]},{"type":"dlg","audio":[["A","You don't look well. Did you catch a cold?"],["B","I think so. I've had a fever since last night, and my throat hurts."],["A","You should see a doctor. There's a clinic near the station."],["B","Good idea. I'll go after lunch."]],"qs":[{"q":"When will the man see a doctor?","o":["This evening","Tomorrow morning","Right now","After lunch"],"a":"After lunch","e":"最後他說 I'll go after lunch。"}]},{"type":"dlg","audio":[["B","Mary, did you see the news? The MRT will be closed this weekend for repairs."],["A","Oh no. I was going to go to the concert on Saturday night."],["B","You could take the bus instead, but it will take almost twice as long."],["A","Then I'll leave earlier. Thanks for telling me."]],"qs":[{"q":"What will Mary probably do on Saturday?","o":["Cancel the concert","Take the MRT","Take the bus and leave earlier","Ask the man for a ride"],"a":"Take the bus and leave earlier","e":"Mary 說 Then I'll leave earlier，表示會搭公車並提早出門。"}]},{"type":"dlg","audio":[["A","Have you decided where to go for the summer holiday?"],["B","Not yet. I want to go somewhere cool, but my wife prefers the beach."],["A","Why not go to Hokkaido? It has beautiful lakes, and it isn't as hot as Okinawa."],["B","That's a great idea. I'll talk to her tonight."]],"qs":[{"q":"What does the woman suggest?","o":["Going to Okinawa","Staying at home","Going to the beach","Going to Hokkaido"],"a":"Going to Hokkaido","e":"女子建議 Why not go to Hokkaido?"}]},{"type":"dlg","audio":[["B","How was your job interview this morning?"],["A","Not bad. The manager asked me a lot of questions, and I was a bit nervous."],["B","Do you think you'll get the job?"],["A","I'm not sure. There were more than twenty other people. I'll hear from them next week."]],"qs":[{"q":"What does the woman say about her interview?","o":["She isn't sure about the result.","She will start work tomorrow.","She was not asked anything.","She is sure she will get the job."],"a":"She isn't sure about the result.","e":"她說 I'm not sure，要下週才知道。"}]},{"type":"dlg","audio":[["A","This soup is delicious! What's in it?"],["B","Just tomatoes, onions and a little chicken. But the secret is a spoonful of honey."],["A","Honey? I would never have guessed. Can you give me the recipe?"],["B","Sure. I'll write it down for you."]],"qs":[{"q":"What is the special ingredient in the soup?","o":["Chicken","Honey","Tomatoes","Onions"],"a":"Honey","e":"男子說 the secret is a spoonful of honey。"}]},{"type":"dlg","audio":[["B","Excuse me, does this bus go to the National Museum?"],["A","No, you need to take bus number 20. This one goes to the train station."],["B","Where can I catch it?"],["A","Cross the street. The stop is just in front of the bank."]],"qs":[{"q":"Where should the man go to take the right bus?","o":["To the train station","Into the bank","Across the street","To the museum entrance"],"a":"Across the street","e":"女子說 Cross the street。"}]},{"type":"talk","audio":[["A","Good afternoon, passengers. This is your captain speaking. We are now flying at an altitude of 10,000 meters. The weather in Tokyo is sunny, and the temperature is twenty-two degrees. We expect to land in about one hour and twenty minutes. In a few minutes, our crew will serve you drinks and a light meal. Please keep your seat belts fastened when you are in your seat. Thank you for flying with us."]],"qs":[{"q":"Where is this announcement most likely heard?","o":["In a train station","On an airplane","At a hotel","In a restaurant"],"a":"On an airplane","e":"captain、flying、land、crew 表示在飛機上。"},{"q":"When will the plane land?","o":["In about one hour and twenty minutes","In ten minutes","In two hours","Right now"],"a":"In about one hour and twenty minutes","e":"We expect to land in about one hour and twenty minutes。"},{"q":"What will the crew do soon?","o":["Check tickets","Give out newspapers","Clean the seats","Serve drinks and a light meal"],"a":"Serve drinks and a light meal","e":"the crew will serve you drinks and a light meal。"}]},{"type":"talk","audio":[["B","Welcome to the City Museum. Our special exhibition on ancient tools opens at ten and closes at five. Tickets cost two hundred dollars for adults and one hundred dollars for students. Please note that you may not take photos with a flash, and food and drinks are not allowed inside the exhibition room. There is a coffee shop on the first floor if you would like a snack. A guided tour in English will start at two o'clock at the information desk."]],"qs":[{"q":"How much is a ticket for a student?","o":["Two hundred dollars","Free","One hundred dollars","Three hundred dollars"],"a":"One hundred dollars","e":"students 是 one hundred dollars。"},{"q":"What is NOT allowed in the exhibition room?","o":["Talking softly","Eating and drinking","Walking around","Reading the signs"],"a":"Eating and drinking","e":"food and drinks are not allowed inside。"},{"q":"Where can visitors join the English tour?","o":["At the coffee shop","At the front gate","At the information desk","On the second floor"],"a":"At the information desk","e":"tour will start at two o'clock at the information desk。"}]},{"type":"talk","audio":[["A","Here is the weather report for tomorrow. In the morning, northern Taiwan will be cloudy with light rain. In the afternoon, the rain will get heavier because a typhoon is coming closer. Wind speeds may reach seventy kilometers an hour on the east coast. In the south, it will be mostly sunny, but temperatures will be a little lower than today. If you live in the north, please bring an umbrella and avoid going to the mountains."]],"qs":[{"q":"What will the weather be like in northern Taiwan in the afternoon?","o":["Heavier rain","Sunny and hot","Snowy","Cloudy but dry"],"a":"Heavier rain","e":"afternoon 北部 the rain will get heavier。"},{"q":"What is the advice for people in the north?","o":["Stay in the south","Go to the east coast","Wear light clothes","Bring an umbrella and avoid the mountains"],"a":"Bring an umbrella and avoid the mountains","e":"結尾建議 bring an umbrella and avoid going to the mountains。"}]},{"type":"talk","audio":[["B","Hello, everyone. Today I'd like to talk about how to save money. First, make a monthly budget, and write down what you spend. Second, before you buy something, wait a day and ask yourself if you really need it. Third, cook at home more often, since eating out can cost a lot. Finally, try to save at least ten percent of your income every month. If you follow these steps, you will be surprised at how much you can save in a year."]],"qs":[{"q":"What is the talk mainly about?","o":["How to find a job","Ways to save money","Where to buy cheap food","How to get a loan"],"a":"Ways to save money","e":"開頭與全文都在講存錢的方法。"},{"q":"What does the speaker suggest doing before buying something?","o":["Wait a day and think about it","Ask a friend to buy it","Compare five shops","Use a credit card"],"a":"Wait a day and think about it","e":"wait a day and ask yourself if you really need it。"},{"q":"How much of your income should you save?","o":["Half","All of it","Two percent","At least ten percent"],"a":"At least ten percent","e":"save at least ten percent of your income。"}]},{"type":"talk","audio":[["A","Attention, students. Because of the typhoon warning, classes will be cancelled tomorrow. All school buses will not run. The exam that was planned for tomorrow will be held next Monday instead. Students should check the school website for further news. If you have any questions, please call the office before five o'clock this afternoon. Stay safe and stay at home."]],"qs":[{"q":"What will happen tomorrow?","o":["There will be an exam.","School buses will run.","Classes will be cancelled.","Students will visit the office."],"a":"Classes will be cancelled.","e":"classes will be cancelled tomorrow。"},{"q":"When will the exam be held?","o":["Tomorrow","Next Monday","This afternoon","Next Friday"],"a":"Next Monday","e":"exam ... will be held next Monday instead。"}]}],"translate":[{"zh":"雖然天氣很冷，但是我們還是決定去爬山。","model":"Although it was cold, we still decided to go hiking.","keys":["用 although 引導讓步子句（不要再加 but）","decide to + 原形動詞","go hiking 是「去健行、爬山」","時態一致（過去式）"]},{"zh":"我已經在這家公司工作五年了。","model":"I have worked at this company for five years.","keys":["現在完成式 have worked（或 have been working）","for + 一段時間","work at / for a company"]},{"zh":"如果我有更多時間，我就會學一種新的語言。","model":"If I had more time, I would learn a new language.","keys":["第二條件句：if + 過去式，would + 原形","a new language 冠詞 a","注意 if 子句用過去簡單式 had"]},{"zh":"這座橋是在一九九八年建造的。","model":"This bridge was built in 1998.","keys":["被動語態 was built","in + 年份","bridge 是單數，用 This"]},{"zh":"你介意幫我開一下窗戶嗎？","model":"Would you mind opening the window for me?","keys":["Would you mind + V-ing","open 改為 opening","for me 或 me 皆可表達「幫我」"]},{"zh":"他告訴我他明天會打電話給我。","model":"He told me that he would call me the next day.","keys":["間接引述：will 變 would","tomorrow 變 the next day","tell + 人 + that 子句"]},{"zh":"我很期待下週末的旅行。","model":"I am looking forward to the trip next weekend.","keys":["look forward to + 名詞或 V-ing","to 是介系詞","現在進行式表示目前的期待"]},{"zh":"那位站在門口的男人是我的英文老師。","model":"The man standing at the door is my English teacher.","keys":["現在分詞 standing 修飾 the man（或 who is standing）","at the door 介
