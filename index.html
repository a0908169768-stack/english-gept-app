oung people.","失業對年輕人來說是個嚴重的問題。"],["population","n.","人口","The population of the city is over two million.","這座城市的人口超過兩百萬。"],["society","n.","社會","Technology has greatly changed modern society.","科技大大改變了現代社會。"],["community","n.","社區，社群","Our community holds a clean-up day every month.","我們社區每個月舉辦一次清掃日。"],["volunteer","n.","志工","Many volunteers helped after the earthquake.","地震後有許多志工出手相助。"],["charity","n.","慈善機構；慈善","The concert raised money for charity.","這場音樂會為慈善募款。"],["donate","v.","捐贈","He donated a thousand dollars to the children's hospital.","他捐了一千元給兒童醫院。"],["poverty","n.","貧窮","The program aims to reduce poverty in rural areas.","這項計畫旨在減少鄉村地區的貧窮。"],["tax","n.","稅","People pay tax on the money they earn.","人們要為賺到的錢繳稅。"],["policy","n.","政策","The new policy will help small businesses.","這項新政策將幫助小型企業。"],["protest","n.","抗議","Hundreds of people joined the protest in front of the building.","數百人參加了大樓前的抗議活動。"],["announce","v.","宣布","The mayor announced a new plan to improve the park.","市長宣布了一項改善公園的新計畫。"],["report","n.","報導；報告","According to a news report, prices will rise next month.","根據一則新聞報導，物價下個月將上漲。"],["headline","n.","新聞標題","The headline said that the team won the championship.","標題寫著這支隊伍贏得了冠軍。"],["journalist","n.","記者","The journalist interviewed the mayor about the new bridge.","記者就新橋的事訪問了市長。"],["issue","n.","議題，問題","Housing prices are a hot issue in Taiwan.","房價是台灣的熱門議題。"],["rumor","n.","謠言","Don't believe every rumor you hear online.","不要相信你在網路上聽到的每一則謠言。"],["increase","v.","增加","The number of visitors increased by twenty percent.","遊客人數增加了百分之二十。"],["decrease","v.","減少","The birth rate has decreased in recent years.","近年來出生率下降了。"],["urban","adj.","都市的","More people are moving to urban areas to find jobs.","越來越多人搬到都市地區找工作。"],["rural","adj.","鄉村的","Life in rural areas is quieter than in the city.","鄉村地區的生活比城市安靜。"],["survey","n.","問卷調查","A recent survey shows that most people like the plan.","最近的一項調查顯示大多數人喜歡這個計畫。"],["generation","n.","世代","The younger generation uses smartphones every day.","年輕一代每天都使用智慧型手機。"]]},{"id":"w8","icon":"😌","zh":"情緒與個性","en":"Emotions & Personality","basic":false,"words":[["anxious","adj.","焦慮的","She felt anxious before the big exam.","她在大考前感到焦慮。"],["nervous","adj.","緊張的","I always get nervous when I speak in public.","我在公開場合說話時總是會緊張。"],["embarrassed","adj.","尷尬的","He felt embarrassed when he forgot her name.","他忘了她的名字，感到很尷尬。"],["jealous","adj.","嫉妒的","She was jealous of her sister's success.","她嫉妒姊姊的成功。"],["grateful","adj.","感激的","I am grateful for all your help.","我很感激你所有的幫助。"],["disappointed","adj.","失望的","The fans were disappointed with the result of the game.","球迷對比賽的結果感到失望。"],["frustrated","adj.","沮喪的，受挫的","He got frustrated when the computer stopped working again.","電腦又當機時，他感到很沮喪。"],["relieved","adj.","鬆一口氣的","We were relieved to hear that everyone was safe.","聽到大家都平安，我們都鬆了一口氣。"],["confident","adj.","有自信的","She is confident that she will pass the test.","她有信心自己會通過考試。"],["shy","adj.","害羞的","My little brother is too shy to talk to strangers.","我弟弟太害羞了，不敢跟陌生人說話。"],["generous","adj.","慷慨的","He is a generous man who often helps the poor.","他是個經常幫助窮人的慷慨男子。"],["honest","adj.","誠實的","An honest person always tells the truth.","誠實的人總是說實話。"],["impatient","adj.","沒耐心的","He became impatient after waiting for an hour.","他等了一個小時後變得不耐煩。"],["selfish","adj.","自私的","It is selfish to take the last piece of cake without asking.","沒問過就把最後一塊蛋糕拿走是自私的。"],["lazy","adj.","懶惰的","He is too lazy to clean his room.","他懶得打掃房間。"],["cheerful","adj.","開朗的，愉快的","The cheerful waiter made everyone smile.","那位開朗的服務生讓每個人都露出了笑容。"],["stubborn","adj.","固執的","My grandfather is stubborn and never changes his mind.","我爺爺很固執，從不改變主意。"],["polite","adj.","有禮貌的","It is polite to say thank you when someone helps you.","有人幫忙時說謝謝是有禮貌的。"],["rude","adj.","無禮的","It is rude to talk with your mouth full.","滿嘴食物說話是不禮貌的。"],["curious","adj.","好奇的","Children are curious about everything around them.","孩子們對周遭的一切都很好奇。"],["ashamed","adj.","羞愧的","He was ashamed of lying to his parents.","他為了對父母說謊而感到羞愧。"],["cope with","phr. v.","應付，處理","How do you cope with stress at work?","你如何應付工作上的壓力？"],["mood","n.","心情，情緒","He is in a bad mood today, so don't talk to him.","他今天心情不好，別去跟他說話。"],["calm","adj.","冷靜的，平靜的","Stay calm and follow the teacher outside.","保持冷靜，跟著老師到外面去。"],["furious","adj.","暴怒的","She was furious when she saw the broken window.","她看到破掉的窗戶時非常憤怒。"],["thrilled","adj.","非常興奮的","The kids were thrilled to see the fireworks.","孩子們看到煙火時非常興奮。"],["depressed","adj.","沮喪的，憂鬱的","He felt depressed after losing his job.","他失業後感到憂鬱。"],["sympathy","n.","同情","I have great sympathy for people who lost their homes.","我很同情那些失去家園的人。"],["determined","adj.","下定決心的","She is determined to win the speech contest.","她下定決心要贏得演講比賽。"]]},{"id":"w9","icon":"🤝","zh":"人際關係","en":"Relationships","basic":false,"words":[["relationship","n.","關係","He has a good relationship with his neighbors.","他和鄰居的關係很好。"],["relative","n.","親戚","We visit our relatives during the Lunar New Year.","我們在農曆新年期間拜訪親戚。"],["neighbor","n.","鄰居","Our neighbor often brings us fresh fruit.","我們的鄰居常常帶新鮮水果給我們。"],["roommate","n.","室友","My roommate and I take turns cleaning the kitchen.","我和我的室友輪流打掃廚房。"],["couple","n.","情侶，夫妻","The young couple moved into a small apartment.","這對年輕的情侶搬進了一間小公寓。"],["marry","v.","結婚，嫁娶","They plan to marry in the spring.","他們打算在春天結婚。"],["divorce","n.","離婚","Their divorce was hard on the children.","他們離婚對孩子們來說很難受。"],["argue","v.","爭論，吵架","My brother and I often argue about small things.","我哥哥和我常為小事吵架。"],["quarrel","n.","爭吵","They had a quarrel about money last night.","他們昨晚為了錢吵了一架。"],["apologize","v.","道歉","You should apologize to her for being late.","你應該為遲到向她道歉。"],["forgive","v.","原諒","I can forgive you, but I can't forget what happened.","我可以原諒你，但我忘不了發生的事。"],["trust","v.","信任","You can trust him because he always keeps his promises.","你可以信任他，因為他總是遵守承諾。"],["respect","v.","尊敬，尊重","We should respect our teachers and elders.","我們應該尊敬老師和長輩。"],["support","v.","支持","My family supported my decision to study abroad.","我的家人支持我出國讀書的決定。"],["rely on","phr. v.","依賴，依靠","You can rely on me if you need help.","如果你需要幫忙，可以依靠我。"],["get along with","phr. v.","與…相處融洽","Do you get along with your new classmates?","你和你的新同學相處得好嗎？"],["acquaintance","n.","認識的人，泛泛之交","He is just an acquaintance, not a close friend.","他只是認識的人，不是親密的朋友。"],["partner","n.","伴侶；夥伴","She started a small business with her partner.","她和她的合夥人開了一家小公司。"],["companion","n.","同伴","The old man's dog is his best companion.","老先生的狗是他最好的同伴。"],["gossip","n.","閒話，八卦","I don't like to listen to gossip about others.","我不喜歡聽關於別人的閒話。"],["misunderstand","v.","誤會，誤解","I'm sorry, I misunderstood what you said.","對不起，我誤解了你說的話。"],["compromise","n.","妥協","After a long talk, they reached a compromise.","經過長時間的討論，他們達成了妥協。"],["lose touch","phr.","失去聯絡","We lost touch after we graduated from high school.","高中畢業後我們就失去了聯絡。"],["invite","v.","邀請","She invited all her classmates to the birthday party.","她邀請所有同學參加生日派對。"],["gathering","n.","聚會","The family gathering was full of laughter.","這場家族聚會充滿了笑聲。"],["generation gap","n.","代溝","The generation gap can cause problems between parents and teenagers.","代溝可能造成父母與青少年之間的問題。"],["treat","v.","對待；請客","He always treats his employees with respect.","他總是尊重地對待員工。"],["bond","n.","情感連結，紐帶","Cooking together makes the bond between them stronger.","一起煮飯讓他們之間的情感連結更緊密。"],["care about","phr. v.","關心，在乎","She really cares about her friends' feelings.","她真的很在乎朋友的感受。"],["depend on","phr. v.","取決於；依賴","Whether we go hiking depends on the weather.","我們是否去健行取決於天氣。"]]},{"id":"w10","icon":"📈","zh":"商業與金融","en":"Business & Finance","basic":false,"words":[["customer","n.","顧客","The store gives free gifts to new customers.","這家店送贈品給新顧客。"],["product","n.","產品","The company launched a new product last month.","公司上個月推出了新產品。"],["service","n.","服務","The hotel is famous for its excellent service.","這間飯店以優質的服務聞名。"],["profit","n.","利潤","The shop made a small profit this year.","這家店今年賺了一點利潤。"],["loss","n.","虧損，損失","The company suffered a big loss last year.","這家公司去年出現重大虧損。"],["budget","n.","預算","We have a limited budget for the wedding.","我們的婚禮預算有限。"],["expense","n.","開銷，費用","Rent is our biggest monthly expense.","房租是我們每月最大的開銷。"],["invest","v.","投資","He invested his savings in a small restaurant.","他把積蓄投資在一家小餐廳。"],["bank account","n.","銀行帳戶","I opened a bank account when I got my first job.","我拿到第一份工作時開了銀行帳戶。"],["loan","n.","貸款","They took out a loan to buy the house.","他們貸款買了那棟房子。"],["interest","n.","利息；興趣","The bank pays two percent interest a year.","這家銀行一年付百分之二的利息。"],["credit card","n.","信用卡","You can pay by credit card or in cash.","你可以用信用卡或現金付款。"],["receipt","n.","收據，發票","Keep the receipt in case you want to return it.","請保留收據，以防你想退貨。"],["refund","n.","退款","The shop gave me a full refund for the broken cup.","店家為破掉的杯子給了我全額退款。"],["discount","n.","折扣","Students get a ten percent discount on all books.","學生購買所有書籍都享有九折優惠。"],["advertise","v.","做廣告，宣傳","The company advertises its products on TV.","這家公司在電視上為其產品做廣告。"],["compete","v.","競爭","Small shops find it hard to compete with large supermarkets.","小商店很難和大型超市競爭。"],["export","v.","出口","Taiwan exports many electronic products to other countries.","台灣向其他國家出口許多電子產品。"],["import","v.","進口","We import most of our oil from abroad.","我們的石油大部分從國外進口。"],["merchant","n.","商人","The merchant sold silk and tea to travelers.","這位商人向旅人販售絲綢和茶葉。"],["negotiate","v.","協商，談判","The two companies are negotiating a new contract.","兩家公司正在協商一份新合約。"],["contract","n.","合約","Please read the contract carefully before you sign it.","簽名之前請仔細閱讀合約。"],["shipment","n.","運送的貨物","The shipment will arrive in three days.","這批貨將在三天內送達。"],["stock","n.","股票；庫存","The price of the company's stock rose sharply.","這家公司的股價大漲。"],["inflation","n.","通貨膨脹","Inflation makes daily goods more expensive.","通貨膨脹讓日用品變得更貴。"],["afford","v.","負擔得起","We can't afford a new car right now.","我們現在買不起新車。"],["cost","v.","花費（金額）","The repair cost me two thousand dollars.","這次修理花了我兩千元。"],["earn","v.","賺（錢）","She earns a living by teaching piano.","她靠教鋼琴維生。"],["owe","v.","欠（錢、人情）","I owe my friend a hundred dollars.","我欠朋友一百元。"],["saving","n.","存款，儲蓄","He used his savings to start a small shop.","他用存款開了一家小店。"],["tip","n.","小費；建議","We left a ten percent tip for the waiter.","我們留了百分之十的小費給服務生。"]]},{"id":"w11","icon":"🔧","zh":"片語動詞（一）","en":"Phrasal Verbs I","basic":false,"words":[["give up","phr. v.","放棄","Don't give up, you are almost there.","不要放棄，你就快成功了。"],["look for","phr. v.","尋找","I'm looking for my keys, but I can't find them.","我在找我的鑰匙，但是找不到。"],["look after","phr. v.","照顧","She looks after her grandmother on weekends.","她週末照顧她的祖母。"],["look forward to","phr. v.","期待","I look forward to meeting you next week.","我期待下週與你見面。"],["look up","phr. v.","查（字典、資料）","If you don't know the word, look it up in the dictionary.","如果你不知道這個字，就去字典裡查。"],["turn on","phr. v.","打開（電器）","Could you turn on the light? It's too dark in here.","你可以開燈嗎？這裡太暗了。"],["turn off","phr. v.","關掉（電器）","Please turn off your phone during the movie.","電影播放期間請關掉手機。"],["turn down","phr. v.","調小；拒絕","Please turn down the music. The baby is sleeping.","請把音樂調小聲，寶寶在睡覺。"],["put off","phr. v.","延後","We had to put off the picnic because of the rain.","因為下雨，我們不得不延後野餐。"],["put on","phr. v.","穿上；戴上","Put on your coat. It's cold outside.","把外套穿上，外面很冷。"],["take off","phr. v.","脫下；起飛","The plane will take off in ten minutes.","飛機十分鐘後就要起飛了。"],["take care of","phr. v.","照顧，處理","Can you take care of my cat while I'm away?","我不在的時候，你能照顧我的貓嗎？"],["take part in","phr. v.","參加","Over one hundred students took part in the contest.","超過一百名學生參加了這場比賽。"],["pick up","phr. v.","接（人）；撿起","I'll pick you up at the station at six.","我六點會去車站接你。"],["drop off","phr. v.","送到（某處）；下車","Can you drop me off at the bus stop?","你可以載我到公車站放我下車嗎？"],["carry out","phr. v.","執行，實施","The team carried out a survey among students.","這個團隊在學生之間進行了一項調查。"],["find out","phr. v.","查出，發現","I need to find out what time the store opens.","我需要查出這家店幾點開門。"],["figure out","phr. v.","弄懂，想出","I can't figure out how to use this machine.","我搞不懂這台機器怎麼用。"],["set up","phr. v.","建立，設立","They set up a small company in 2018.","他們在二零一八年成立了一家小公司。"],["work out","phr. v.","想出；運動；順利解決","I hope everything works out for you.","我希望你一切順利。"],["break down","phr. v.","故障；崩潰","Our car broke down on the highway.","我們的車在高速公路上拋錨了。"],["break up","phr. v.","分手；結束","They broke up after going out for three years.","他們交往三年後分手了。"],["bring up","phr. v.","養育；提出（話題）","She was brought up by her grandparents.","她是由祖父母帶大的。"],["call off","phr. v.","取消","The match was called off because of the heavy rain.","比賽因為大雨被取消了。"],["come up with","phr. v.","想出（點子）","She came up with a great idea for the party.","她為派對想出了一個很棒的點子。"],["run out of","phr. v.","用完","We ran out of milk, so I went to the store.","我們的牛奶用完了，所以我去了商店。"],["get over","phr. v.","克服；從…恢復","It took him a long time to get over the flu.","他花了很長的時間才從流感中恢復。"],["hand in","phr. v.","繳交","Please hand in your homework by Friday.","請在星期五之前繳交你的作業。"],["fill out","phr. v.","填寫（表格）","Please fill out this form and give it to the clerk.","請填寫這張表格並交給店員。"]]},{"id":"w12","icon":"🔩","zh":"片語動詞（二）","en":"Phrasal Verbs II","basic":false,"words":[["show up","phr. v.","出現，到場","He didn't show up for the meeting this morning.","他沒有出席今天早上的會議。"],["end up","phr. v.","最後成為，結果是","We ended up eating at home because it was raining.","因為下雨，我們最後在家吃飯。"],["turn out","phr. v.","結果是，原來","The problem turned out to be very simple.","事實證明這個問題非常簡單。"],["get up","phr. v.","起床","I usually get up at six thirty on weekdays.","我平日通常六點半起床。"],["get on","phr. v.","上（車、船）","We got on the bus at the last stop.","我們在最後一站上了公車。"],["get off","phr. v.","下（車、船）","You should get off at the next station.","你應該在下一站下車。"],["get back","phr. v.","回來；取回","When did you get back from your trip?","你什麼時候旅行回來的？"],["go on","phr. v.","繼續；發生","Please go on with your story.","請繼續說你的故事。"],["go over","phr. v.","仔細檢查，複習","Let's go over the plan once more.","我們把計畫再檢查一遍吧。"],["hold on","phr. v.","等一下；抓緊","Hold on a second, I'll get a pen.","等一下，我去拿支筆。"],["keep up with","phr. v.","跟上","It's hard to keep up with the latest technology.","要跟上最新的科技很困難。"],["let down","phr. v.","使失望","I don't want to let my team down.","我不想讓我的團隊失望。"],["make up","phr. v.","編造；組成；和好","He made up an excuse for being late.","他編了個遲到的藉口。"],["make out","phr. v.","辨認出，看懂","I can't make out what the sign says from here.","我從這裡看不清楚標誌上寫什麼。"],["pass away","phr. v.","去世（委婉）","Her grandfather passed away last winter.","她的爺爺去年冬天去世了。"],["point out","phr. v.","指出","The teacher pointed out several mistakes in my essay.","老師指出了我作文中的幾個錯誤。"],["put up with","phr. v.","忍受","I can't put up with this noise any longer.","我再也無法忍受這種噪音了。"],["run into","phr. v.","巧遇；撞上","I ran into an old friend at the supermarket.","我在超市巧遇一位老朋友。"],["see off","phr. v.","送行","We went to the airport to see her off.","我們去機場替她送行。"],["set off","phr. v.","出發；引爆","They set off for the mountain at dawn.","他們在黎明時出發前往山區。"],["show off","phr. v.","炫耀","He likes to show off his new watch.","他喜歡炫耀他的新手錶。"],["sum up","phr. v.","總結","Can you sum up the story in one sentence?","你能用一句話總結這個故事嗎？"],["throw away","phr. v.","丟掉","Don't throw away those old newspapers. We can recycle them.","別把那些舊報紙丟掉，我們可以回收。"],["try on","phr. v.","試穿","May I try on this jacket in a larger size?","我可以試穿這件夾克的大一點的尺寸嗎？"],["try out","phr. v.","試用，試驗","I want to try out the new restaurant this weekend.","我週末想去試試那家新餐廳。"],["wake up","phr. v.","醒來，叫醒","The loud noise woke me up at midnight.","巨大的噪音在半夜把我吵醒了。"],["warm up","phr. v.","熱身；加熱","You should warm up before you run.","跑步前你應該先熱身。"],["wear out","phr. v.","穿壞，用壞；使筋疲力盡","These shoes are worn out and need replacing.","這雙鞋已經穿壞了，需要換新。"],["work on","phr. v.","致力於，從事","She is working on a new novel.","她正在寫一部新小說。"],["cut down on","phr. v.","減少（用量）","The doctor told him to cut down on sugar.","醫生告訴他要減少糖的攝取。"]]},{"id":"w13","icon":"🔗","zh":"常用搭配詞","en":"Collocations","basic":false,"words":[["make a decision","collocation","做決定","It is time to make a decision about your future.","是時候對你的未來做出決定了。"],["make progress","collocation","有進步","She is making good progress in her English.","她的英文進步很多。"],["make an effort","collocation","努力","You need to make an effort if you want to pass.","如果你想通過，就需要努力。"],["make a mistake","collocation","犯錯","Everyone makes a mistake once in a while.","每個人偶爾都會犯錯。"],["do homework","collocation","做功課","I usually do my homework right after dinner.","我通常晚飯後馬上寫功課。"],["do the dishes","collocation","洗碗","It's your turn to do the dishes tonight.","今晚輪到你洗碗了。"],["do research","collocation","做研究","He did research on sleep for two years.","他做了兩年的睡眠研究。"],["take a break","collocation","休息一下","Let's take a break and have some tea.","我們休息一下，喝點茶吧。"],["take a chance","collocation","冒險一試","Sometimes you have to take a chance to succeed.","有時候你必須冒險一試才會成功。"],["take advantage of","collocation","利用（機會）","Take advantage of the sale to buy a new coat.","趁特價買件新外套吧。"],["have a look at","collocation","看一看","Can you have a look at my essay?","你可以看一下我的作文嗎？"],["pay attention to","collocation","注意","Please pay attention to the safety rules.","請注意安全規則。"],["keep in touch","collocation","保持聯絡","Let's keep in touch after you move.","你搬家後我們保持聯絡吧。"],["catch a cold","collocation","感冒","Wear a scarf, or you will catch a cold.","圍上圍巾，不然你會感冒。"],["catch the bus","collocation","趕上公車","I ran to catch the last bus.","我跑著去趕最後一班公車。"],["break a promise","collocation","違背承諾","He never breaks a promise.","他從不違背承諾。"],["tell the truth","collocation","說實話","You must tell the truth in court.","在法庭上你必須說實話。"],["give a speech","collocation","發表演說","The mayor gave a short speech at the opening.","市長在開幕式上發表了簡短的演說。"],["save money","collocation","存錢，省錢","She saves money by cooking at home.","她在家煮飯來省錢。"],["spend time on","collocation","花時間在…上","He spends too much time on video games.","他花太多時間在電玩上。"],["pay a visit","collocation","拜訪","We paid a visit to our old teacher.","我們去拜訪了我們的老師。"],["heavy traffic","collocation","交通壅塞","I was late because of the heavy traffic.","我因為交通壅塞而遲到了。"],["strong coffee","collocation","濃咖啡","I can't sleep after drinking strong coffee.","喝了濃咖啡我就睡不著。"],["fast food","collocation","速食","Fast food is convenient but not always healthy.","速食很方便，但不一定健康。"],["in charge of","collocation","負責","Ms. Lin is in charge of the sales department.","林小姐負責業務部門。"],["in advance","collocation","事先","Please book your tickets in advance.","請事先訂票。"],["on purpose","collocation","故意地","I'm sorry. I didn't do it on purpose.","對不起，我不是故意的。"],["by accident","collocation","意外地","I broke the vase by accident.","我不小心打破了花瓶。"],["at least","collocation","至少","You should drink at least eight glasses of water a day.","你一天至少應該喝八杯水。"],["on time","collocation","準時","The train arrived on time.","火車準時抵達。"],["in time","collocation","及時","We got to the station just in time to catch the train.","我們及時趕到車站，搭上了火車。"]]},{"id":"w14","icon":"💬","zh":"慣用語與俗語","en":"Idioms & Expressions","basic":false,"words":[["a piece of cake","idiom","輕而易舉的事","The test was a piece of cake for her.","這場考試對她來說輕而易舉。"],["break the ice","idiom","打破僵局","He told a joke to break the ice.","他說了個笑話來打破僵局。"],["hit the books","idiom","用功讀書","I have to hit the books tonight for tomorrow's exam.","我今晚得用功讀書準備明天的考試。"],["under the weather","idiom","身體不舒服","I'm feeling a bit under the weather today.","我今天覺得有點不舒服。"],["once in a blue moon","idiom","千載難逢，極少","We eat out only once in a blue moon.","我們很少外出用餐。"],["cost an arm and a leg","idiom","非常昂貴","That new phone costs an arm and a leg.","那支新手機貴得嚇人。"],["spill the beans","idiom","洩漏祕密","Don't spill the beans about the surprise party.","別洩漏驚喜派對的祕密。"],["let the cat out of the bag","idiom","不小心洩漏祕密","She let the cat out of the bag about the gift.","她不小心說溜嘴，洩漏了禮物的事。"],["kill two birds with one stone","idiom","一石二鳥","Riding to work kills two birds with one stone: I save money and exercise.","騎車上班一石二鳥：我既省錢又運動。"],["the best of both worlds","idiom","兩全其美","Working from home gives you the best of both worlds.","在家工作讓你兩全其美。"],["call it a day","idiom","今天到此為止","We've done enough work. Let's call it a day.","我們做得夠多了，今天就到此為止吧。"],["get cold feet","idiom","臨陣退縮","He got cold feet just before the wedding.","他在婚禮前臨陣退縮了。"],["on the other hand","idiom","另一方面","The job pays well. On the other hand, the hours are long.","這份工作薪水很好。另一方面，工時很長。"],["in the long run","idiom","長遠來看","Saving money will help you in the long run.","長遠來看，存錢對你有幫助。"],["as a result","idiom","因此，結果","He didn't study. As a result, he failed the exam.","他沒有念書，結果考試不及格。"],["by the way","idiom","順帶一提","By the way, did you finish the report?","順帶一提，你報告寫完了嗎？"],["make ends meet","idiom","勉強維持收支平衡","With two jobs, she can barely make ends meet.","她做兩份工作，也只勉強收支平衡。"],["keep an eye on","idiom","留意，照看","Could you keep an eye on my bag for a minute?","你可以幫我看一下我的包包嗎？"],["lend a hand","idiom","幫忙","Can you lend me a hand with these boxes?","你可以幫我搬這些箱子嗎？"],["It's raining cats and dogs.","idiom","下傾盆大雨","Take an umbrella. It's raining cats and dogs.","帶把傘吧，雨下得很大。"],["beat around the bush","idiom","拐彎抹角","Stop beating around the bush and tell me the truth.","別拐彎抹角了，告訴我實話。"],["burn the midnight oil","idiom","熬夜工作或讀書","He burned the midnight oil to finish his thesis.","他熬夜趕完了他的論文。"],["in the same boat","idiom","處境相同","Don't worry. We are all in the same boat.","別擔心，我們大家處境都一樣。"],["pull someone's leg","idiom","開某人玩笑","Are you serious, or are you pulling my leg?","你是認真的，還是在開我玩笑？"],["out of the blue","idiom","突然地，出乎意料地","Her call came out of the blue.","她的電話來得很突然。"],["on the tip of my tongue","idiom","話到嘴邊卻想不起來","His name is on the tip of my tongue.","他的名字就在我嘴邊，卻想不起來。"],["sooner or later","idiom","遲早","Sooner or later, you will need to make a choice.","你遲早需要做出選擇。"],["every now and then","idiom","偶爾","We go to the beach every now and then.","我們偶爾會去海邊。"],["face the music","idiom","面對後果","He broke the window and had to face the music.","他打破了窗戶，只好面對後果。"],["learn by heart","idiom","背下來","The students learned the poem by heart.","學生們把這首詩背了下來。"],["give it a try","idiom","試一試","I've never had sushi, but I'll give it a try.","我沒吃過壽司，但我願意試試看。"]]},{"id":"w15","icon":"🧬","zh":"字首字尾與詞類變化","en":"Word Families & Affixes","basic":false,"words":[["unhappy","adj.","不快樂的（un- 表示否定）","She was unhappy with her test score.","她對自己的考試成績不滿意。"],["impossible","adj.","不可能的（im- 表示否定）","It is impossible to finish this work in one hour.","要在一小時內完成這項工作是不可能的。"],["dishonest","adj.","不誠實的（dis- 表示否定）","A dishonest person cannot be trusted.","不誠實的人不能被信任。"],["irregular","adj.","不規則的（ir- 表示否定）","He kept irregular hours and often slept late.","他作息不規律，常常很晚睡。"],["illegal","adj.","非法的（il- 表示否定）","It is illegal to park here.","在這裡停車是違法的。"],["rewrite","v.","重寫（re- 表示再次）","Please rewrite your essay and hand it in again.","請重寫你的作文並再次繳交。"],["prepay","v.","預先支付（pre- 表示預先）","You can prepay for your meal online.","你可以在線上預先付餐費。"],["overwork","v.","工作過度（over- 表示過度）","Doctors warn that you should not overwork yourself.","醫生警告你不要讓自己工作過度。"],["underestimate","v.","低估（under- 表示低於）","Don't underestimate the difficulty of the exam.","不要低估這場考試的難度。"],["international","adj.","國際的（inter- 表示之間）","She works for an international company.","她在一家國際公司工作。"],["teacher","n.","老師（-er 表示做…的人）","The teacher explained the rule again.","老師再次解釋了這個規則。"],["visitor","n.","訪客（-or 表示做…的人）","A visitor is waiting for you in the lobby.","有一位訪客在大廳等你。"],["musician","n.","音樂家（-ian 表示…的人）","The musician played the violin beautifully.","這位音樂家小提琴拉得很動聽。"],["kindness","n.","善良，親切（-ness 名詞字尾）","We will never forget your kindness.","我們永遠不會忘記你的好意。"],["happiness","n.","快樂（-ness 名詞字尾）","Money can't always buy happiness.","金錢不一定能買到快樂。"],["development","n.","發展（-ment 名詞字尾）","The development of the city has been very fast.","這座城市的發展一直很快。"],["decision","n.","決定（decide 的名詞）","It was a difficult decision for the whole family.","這對全家人來說是個困難的決定。"],["explanation","n.","解釋（explain 的名詞）","I don't understand your explanation.","我不明白你的解釋。"],["success","n.","成功（名詞）","Hard work is the key to success.","努力是成功的關鍵。"],["successful","adj.","成功的（形容詞）","She is a successful businesswoman.","她是個成功的女企業家。"],["successfully","adv.","成功地（副詞）","He successfully passed the driving test.","他成功通過了駕照考試。"],["beautiful","adj.","美麗的（-ful 表示充滿）","The garden looks beautiful in spring.","春天時這座花園看起來很美。"],["careless","adj.","粗心的（-less 表示沒有）","A careless mistake cost him ten points.","一個粗心的錯誤讓他丟了十分。"],["useful","adj.","有用的（-ful 表示充滿）","Thank you for the useful advice.","謝謝你有用的建議。"],["comfortable","adj.","舒適的（-able 表示可…的）","This sofa is very comfortable.","這張沙發非常舒適。"],["dangerous","adj.","危險的（-ous 形容詞字尾）","It is dangerous to swim in the river.","在這條河裡游泳很危險。"],["electrician","n.","電工","The electrician fixed the light in our kitchen.","電工修好了我們廚房的燈。"],["employment","n.","就業；僱用","Employment rates have gone up this year.","今年的就業率上升了。"],["strengthen","v.","加強（-en 使動詞字尾）","Swimming can strengthen your arms and legs.","游泳可以強化你的手臂和雙腿。"],["simplify","v.","簡化（-ify 使動詞字尾）","Can you simplify the instructions?","你可以簡化這些說明嗎？"]]},{"id":"w16","icon":"⚖️","zh":"易混淆字","en":"Commonly Confused Words","basic":false,"words":[["affect","v.","影響（動詞）","Lack of sleep can affect your health.","睡眠不足會影響你的健康。"],["effect","n.","效果，影響（名詞）","The medicine had a good effect on him.","這種藥對他產生了良好的效果。"],["advice","n.","建議（不可數名詞）","Let me give you some advice about your trip.","讓我給你一些關於旅行的建議。"],["advise","v.","建議，勸告（動詞）","The doctor advised him to stop smoking.","醫生勸他戒菸。"],["borrow","v.","借入","May I borrow your pen for a moment?","我可以跟你借一下筆嗎？"],["lend","v.","借出","Could you lend me some money until Friday?","你可以借我一些錢到星期五嗎？"],["rise","v.","上升（不及物）","The sun rises in the east.","太陽從東方升起。"],["raise","v.","舉起，提高（及物）","Please raise your hand if you have a question.","如果有問題，請舉手。"],["lay","v.","放置，擺放","Please lay the books on the table.","請把書放在桌上。"],["lie","v.","躺；說謊","The cat likes to lie on the sofa.","貓喜歡躺在沙發上。"],["economic","adj.","經濟（上）的","The country faces serious economic problems.","這個國家面臨嚴重的經濟問題。"],["economical","adj.","節省的，經濟實惠的","A small car is more economical than a big one.","小車比大車更省錢。"],["sensible","adj.","明智的，合理的","It is sensible to save some money every month.","每個月存一些錢是明智的。"],["sensitive","adj.","敏感的，易受傷害的","She is sensitive to noise and sleeps badly.","她對噪音很敏感，睡得不好。"],["principal","n.","校長","The principal made an announcement at the assembly.","校長在朝會上發表了宣布事項。"],["principle","n.","原則","Honesty is a basic principle of our company.","誠實是我們公司的基本原則。"],["stationary","adj.","靜止的","The car was stationary at the red light.","車子在紅燈前靜止不動。"],["stationery","n.","文具","She bought some stationery for the new school year.","她為新學年買了一些文具。"],["quiet","adj.","安靜的","Please be quiet in the library.","在圖書館裡請保持安靜。"],["quite","adv.","相當，頗","The movie was quite interesting.","這部電影相當有趣。"],["lose","v.","遺失；輸掉","Be careful not to lose your passport.","小心不要遺失你的護照。"],["loose","adj.","寬鬆的，鬆的","These pants are too loose around the waist.","這條褲子腰部太鬆了。"],["alone","adj.","單獨的","She likes to spend some time alone every day.","她喜歡每天獨處一段時間。"],["lonely","adj.","寂寞的","He felt lonely in the big empty house.","他在空蕩蕩的大房子裡覺得寂寞。"],["hear","v.","聽見","I can't hear you. The music is too loud.","我聽不到你說話，音樂太大聲了。"],["listen","v.","聆聽","Listen carefully to the instructions.","請仔細聽這些說明。"],["beside","prep.","在…旁邊","She sat beside me on the plane.","她在飛機上坐在我旁邊。"],["besides","prep.","除…之外（還有）","Besides English, he can speak French and Japanese.","除了英文，他還會說法文和日文。"],["finally","adv.","終於，最後","After a long wait, the bus finally came.","等了很久，公車終於來了。"],["especially","adv.","尤其，特別是","I love fruit, especially mangoes.","我喜歡水果，尤其是芒果。"],["maybe","adv.","也許","Maybe it will rain this afternoon.","今天下午也許會下雨。"]]},{"id":"w17","icon":"🎬","zh":"娛樂與興趣","en":"Entertainment & Hobbies","basic":false,"words":[["performance","n.","演出，表演","The dancers gave an amazing performance.","舞者們帶來了精彩的表演。"],["audience","n.","觀眾","The audience clapped for a long time.","觀眾鼓掌了很久。"],["director","n.","導演","The director won an award for his latest film.","這位導演憑最新的電影得了獎。"],["actor","n.","（男）演員","The actor is famous for his role in a TV drama.","這位演員因在一部電視劇中的角色而聞名。"],["episode","n.","（影集的）一集","I watched two episodes of the drama last night.","我昨晚看了兩集那部影集。"],["series","n.","系列；影集","This series has been popular for ten years.","這個系列已經受歡迎十年了。"],["comedy","n.","喜劇","We laughed a lot at the comedy.","我們看那部喜劇時笑得很開心。"],["documentary","n.","紀錄片","The documentary is about life under the sea.","這部紀錄片講述海底的生活。"],["exhibition","n.","展覽","The art exhibition opens next Tuesday.","這場藝術展覽下星期二開幕。"],["museum","n.","博物館","The museum is closed on Mondays.","博物館星期一休館。"],["concert","n.","演唱會，音樂會","We got tickets to the concert on Saturday.","我們拿到了星期六演唱會的票。"],["festival","n.","節慶","The lantern festival is held every year in February.","元宵燈會每年二月舉行。"],["collect","v.","收集","He collects stamps from many countries.","他收集許多國家的郵票。"],["hobby","n.","嗜好","Her hobby is taking pictures of birds.","她的嗜好是拍鳥。"],["photography","n.","攝影","He became interested in photography at the age of twelve.","他十二歲時就對攝影產生了興趣。"],["hiking","n.","健行","We go hiking in the mountains every month.","我們每個月都去山上健行。"],["camping","n.","露營","Camping under the stars is a wonderful experience.","在星空下露營是很棒的體驗。"],["gym","n.","健身房","She goes to the gym three times a week.","她一週去三次健身房。"],["championship","n.","冠軍賽；冠軍","Our team won the championship for the first time.","我們的隊伍首次贏得冠軍。"],["athlete","n.","運動員","The athlete trains for six hours every day.","這位運動員每天訓練六小時。"],["match","n.","比賽","The football match ended in a draw.","這場足球賽以平手收場。"],["fan","n.","迷，粉絲","Thousands of fans waited outside the stadium.","數千名粉絲在體育場外等待。"],["novel","n.","小說","I read a detective novel on the train.","我在火車上讀了一本偵探小說。"],["author","n.","作者","The author signed copies of her new book.","作者為她的新書簽名。"],["entertain","v.","娛樂","The clown entertained the children at the party.","小丑在派對上逗孩子們開心。"],["relax","v.","放鬆","I like to relax by listening to soft music.","我喜歡聽輕柔的音樂來放鬆。"],["amusing","adj.","有趣的，逗趣的","He told us an amusing story about his trip.","他告訴我們一個關於他旅行的有趣故事。"],["popular","adj.","受歡迎的","That singer is very popular among teenagers.","那位歌手在青少年之間非常受歡迎。"],["cast","n.","演員陣容","The film has a cast of well-known actors.","這部電影有一群知名演員陣容。"],["sequel","n.","續集","The sequel is not as good as the first movie.","續集沒有第一部電影好看。"]]},{"id":"w18","icon":"🍱","zh":"飲食與購物","en":"Food, Dining & Shopping","basic":false,"words":[["appetite","n.","食慾","I have no appetite because of the hot weather.","因為天氣熱，我沒有食慾。"],["ingredient","n.","食材，成分","Fresh ingredients make the soup taste better.","新鮮的食材讓湯更好喝。"],["recipe","n.","食譜","This recipe is easy to follow.","這份食譜很容易照著做。"],["flavor","n.","口味，風味","What flavor of ice cream do you want?","你想要什麼口味的冰淇淋？"],["spicy","adj.","辣的","I can't eat spicy food.","我不能吃辣的食物。"],["sour","adj.","酸的","The lemon juice is too sour for me.","檸檬汁對我來說太酸了。"],["bitter","adj.","苦的","Bitter melon tastes bitter, but it is healthy.","苦瓜嚐起來苦，但很健康。"],["crispy","adj.","酥脆的","The fried chicken is crispy on the outside.","這份炸雞外皮酥脆。"],["raw","adj.","生的","Many Japanese dishes are made with raw fish.","許多日本料理是用生魚製成的。"],["vegetarian","n.","素食者","My sister is a vegetarian and doesn't eat meat.","我姊姊是素食者，不吃肉。"],["menu","n.","菜單","Could we see the menu, please?","請給我們看一下菜單好嗎？"],["order","v.","點（餐）；訂購","We ordered two bowls of beef noodles.","我們點了兩碗牛肉麵。"],["waiter","n.","服務生","The waiter brought us some water.","服務生給我們拿來了一些水。"],["bill","n.","帳單","Can we have the bill, please?","請幫我們結帳好嗎？"],["takeaway","n.","外帶食物","Let's get some takeaway and eat at home.","我們買些外帶食物回家吃吧。"],["dessert","n.","甜點","I'd like a piece of cake for dessert.","我想要一塊蛋糕當甜點。"],["snack","n.","點心，零食","Don't eat too many snacks before dinner.","晚餐前不要吃太多零食。"],["grocery","n.","食品雜貨","I bought some groceries at the supermarket.","我在超市買了一些雜貨。"],["cashier","n.","收銀員","Please pay the cashier at the front of the store.","請到店前面的收銀員那裡付款。"],["bargain","n.","特價品，划算的東西","This jacket was a real bargain at half price.","這件夾克半價買真的很划算。"],["brand","n.","品牌","She only buys well-known brands.","她只買知名品牌。"],["fashion","n.","流行，時尚","Short skirts are in fashion this year.","短裙今年很流行。"],["size","n.","尺寸","Do you have this shirt in a smaller size?","這件襯衫有小一點的尺寸嗎？"],["fit","v.","合身","These shoes don't fit me. They are too small.","這雙鞋我穿不合腳，太小了。"],["suit","v.","適合","The blue dress really suits you.","這件藍色洋裝真的很適合你。"],["out of stock","phr.","缺貨","Sorry, that model is out of stock.","抱歉，那個型號缺貨了。"],["on sale","phr.","特價中","All winter clothes are on sale this week.","所有冬季衣物本週都在特價。"],["sold out","phr.","售完","The tickets were sold out in ten minutes.","票在十分鐘內就賣完了。"],["cash","n.","現金","Do you accept cash or only credit cards?","你們收現金還是只收信用卡？"],["delivery","n.","送貨，外送","The store offers free delivery on orders over 1,000 dollars.","訂單超過一千元，店家提供免運費送貨。"],["customer service","n.","客服","Please call customer service if you have any problems.","如果有任何問題，請打電話給客服。"]]},{"id":"w19","icon":"🏙️","zh":"居家與城市生活","en":"Home & City Life","basic":false,"words":[["apartment","n.","公寓","They rent a small apartment near the station.","他們在車站附近租了一間小公寓。"],["rent","n.","租金","The rent goes up every year.","租金每年都會上漲。"],["landlord","n.","房東","The landlord promised to fix the water pipe.","房東答應要修水管。"],["furniture","n.","家具（不可數）","We bought some new furniture for the living room.","我們為客廳買了一些新家具。"],["kitchen","n.","廚房","My mother is cooking in the kitchen.","我媽媽正在廚房煮飯。"],["neighborhood","n.","社區，鄰近地區","It is a quiet neighborhood with many trees.","這是個有許多樹的安靜社區。"],["downtown","n.","市中心","The bookstore is located downtown.","這家書店位於市中心。"],["suburb","n.","郊區","They moved to the suburbs to have a bigger house.","他們搬到郊區以擁有更大的房子。"],["noisy","adj.","吵雜的","The street is too noisy for me to sleep well.","這條街太吵了，我睡不好。"],["convenient","adj.","方便的","The MRT is a convenient way to travel in Taipei.","捷運是在台北旅行很方便的方式。"],["public transportation","n.","大眾運輸","Using public transportation is good for the environment.","使用大眾運輸對環境有益。"],["elevator","n.","電梯","The elevator is broken, so we have to take the stairs.","電梯壞了，所以我們得走樓梯。"],["housework","n.","家事","We share the housework equally.","我們平均分擔家事。"],["laundry","n.","待洗（洗好）的衣物","I do the laundry on Sunday mornings.","我星期日早上洗衣服。"],["vacuum","v.","用吸塵器打掃","Could you vacuum the living room today?","你今天可以用吸塵器打掃客廳嗎？"],["repair","v.","修理","He repaired the bike himself.","他自己修好了腳踏車。"],["decorate","v.","裝飾，布置","We decorated the house for the holiday.","我們為節日布置了房子。"],["cozy","adj.","溫馨舒適的","The cafe has a cozy atmosphere.","這家咖啡店有溫馨的氣氛。"],["spacious","adj.","寬敞的","The new office is bright and spacious.","新的辦公室明亮又寬敞。"],["skyscraper","n.","摩天大樓","Taipei 101 is a famous skyscraper.","台北一零一是一棟著名的摩天大樓。"],["bridge","n.","橋","A new bridge will connect the two towns.","一座新橋將連接這兩個城鎮。"],["intersection","n.","十字路口","Turn left at the next intersection.","在下一個十字路口左轉。"],["sidewalk","n.","人行道","Children should walk on the sidewalk, not on the road.","孩子們應該走在人行道上，而不是馬路上。"],["parking lot","n.","停車場","The parking lot behind the mall is free.","購物中心後面的停車場是免費的。"],["post office","n.","郵局","I need to go to the post office to send a package.","我需要去郵局寄一個包裹。"],["library","n.","圖書館","The library is a good place to study.","圖書館是個讀書的好地方。"],["facility","n.","設施","The hotel has excellent facilities, including a pool.","這家飯店有包括游泳池在內的優良設施。"],["location","n.","位置，地點","The hotel is in a great location near the beach.","這家飯店位置很好，靠近海灘。"],["security","n.","安全；保全","Security is tight at the airport.","機場的安全檢查很嚴格。"]]},{"id":"w20","icon":"🗣️","zh":"溝通與表達意見","en":"Communication & Opinions","basic":false,"words":[["opinion","n.","意見，看法","In my opinion, this is the best plan.","依我看，這是最好的計畫。"],["agree","v.","同意","I agree with you about the price.","關於價格，我同意你的看法。"],["disagree","v.","不同意","I'm afraid I disagree with your idea.","恐怕我不同意你的想法。"],["suggest","v.","建議","I suggest that we leave early to avoid the traffic.","我建議我們早點出發以避開車潮。"],["recommend","v.","推薦","Can you recommend a good restaurant near here?","你可以推薦這附近一家好餐廳嗎？"],["explain","v.","解釋","Could you explain how this machine works?","你可以解釋這台機器怎麼運作嗎？"],["describe","v.","描述","Can you describe the man you saw?","你可以描述一下你看到的那個男人嗎？"],["complain","v.","抱怨","Customers complained about the slow service.","顧客抱怨服務太慢。"],["mention","v.","提到","He didn't mention anything about the meeting.","他一點也沒提到那場會議。"],["admit","v.","承認","She admitted that she had made a mistake.","她承認自己犯了錯。"],["deny","v.","否認","He denied that he had broken the window.","他否認自己打破了窗戶。"],["promise","v.","承諾","I promise to call you when I arrive.","我保證抵達後會打電話給你。"],["warn","v.","警告","The sign warns drivers of a sharp turn ahead.","這個標誌警告駕駛人前方有急轉彎。"],["persuade","v.","說服","I tried to persuade him to see a doctor.","我試著說服他去看醫生。"],["convince","v.","使確信，說服","The evidence convinced the jury that he was guilty.","這項證據使陪審團確信他有罪。"],["discuss","v.","討論","We need to discuss the plan before we start.","我們開始之前需要討論這個計畫。"],["debate","n.","辯論","The students had a debate on school uniforms.","學生們就制服問題進行了辯論。"],["argument","n.","論點；爭論","His argument is clear and easy to follow.","他的論點清楚，很容易理解。"],["conclude","v.","下結論；結束","The report concludes that the plan is too expensive.","報告的結論是這項計畫太貴了。"],["statement","n.","聲明，陳述","The company released a statement about the accident.","公司發表了一份關於這起事故的聲明。"],["message","n.","訊息，留言","I left a message on your phone.","我在你的手機上留了訊息。"],["conversation","n.","對話","We had a long conversation about our plans.","我們針對計畫進行了很長的對話。"],["attitude","n.","態度","A positive attitude helps you deal with problems.","正面的態度幫助你處理問題。"],["similar","adj.","相似的","Your idea is similar to mine.","你的想法和我的很相似。"],["different","adj.","不同的","My brother and I have very different tastes in music.","我哥哥和我的音樂品味非常不同。"],["obvious","adj.","明顯的","It was obvious that he was not telling the truth.","很明顯他沒有說實話。"],["actually","adv.","事實上，其實","Actually, I don't like coffee very much.","其實我不太喜歡咖啡。"],["honestly","adv.","老實說","Honestly, I think the movie was too long.","老實說，我覺得這部電影太長了。"],["regarding","prep.","關於","I'm writing to you regarding your order.","我寫信給你是關於你的訂單。"]]},{"id":"w21","icon":"🫀","zh":"身體與外貌","en":"Body & Appearance","basic":false,"words":[["muscle","n.","肌肉","Regular training will build your muscles.","規律的訓練會讓你的肌肉變強壯。"],["bone","n.","骨頭","He fell off his bike and broke a bone in his arm.","他從腳踏車上摔下來，手臂骨折了。"],["skin","n.","皮膚","Use sunscreen to protect your skin.","要擦防曬乳來保護你的皮膚。"],["brain","n.","大腦","Sleep is important for a healthy brain.","睡眠對健康的大腦很重要。"],["heart","n.","心臟","Her heart beat faster when she heard the news.","她聽到消息時心跳加快了。"],["lung","n.","肺","Smoking can seriously damage your lungs.","抽菸會嚴重傷害你的肺。"],["stomach","n.","胃；肚子","I have a pain in my stomach after lunch.","我午餐後胃痛。"],["throat","n.","喉嚨","I have a sore throat and can hardly speak.","我喉嚨痛，幾乎說不出話。"],["shoulder","n.","肩膀","He carried the bag on his left shoulder.","他把袋子揹在左肩上。"],["elbow","n.","手肘","She hit her elbow on the table.","她的手肘撞到了桌子。"],["wrist","n.","手腕","He wears a watch on his left wrist.","他在左手腕上戴手錶。"],["knee","n.","膝蓋","The boy fell down and hurt his knee.","那個男孩跌倒，傷到了膝蓋。"],["ankle","n.","腳踝","She twisted her ankle while playing basketball.","她打籃球時扭傷了腳踝。"],["thumb","n.","大拇指","He gave me a thumbs up to show he was happy.","他對我豎起大拇指，表示很滿意。"],["forehead","n.","額頭","She wiped the sweat from her forehead.","她擦掉額頭上的汗。"],["cheek","n.","臉頰","The baby has soft, round cheeks.","這個寶寶有柔軟圓潤的臉頰。"],["chin","n.","下巴","He rested his chin on his hand and thought.","他用手托著下巴思考。"],["eyebrow","n.","眉毛","She raised one eyebrow in surprise.","她驚訝地挑起一邊眉毛。"],["neck","n.","脖子","A long scarf kept his neck warm.","一條長圍巾讓他的脖子保持溫暖。"],["chest","n.","胸部；胸腔","The doctor listened to his chest with a stethoscope.","醫生用聽診器聽他的胸腔。"],["waist","n.","腰部","The belt is too tight around my waist.","這條皮帶繫在我的腰上太緊了。"],["spine","n.","脊椎","Sitting badly for a long time is bad for your spine.","長時間坐姿不良對脊椎不好。"],["palm","n.","手掌","She held the little bird in the palm of her hand.","她把小鳥捧在手掌心。"],["fist","n.","拳頭","He closed his fist in anger.","他生氣地握緊了拳頭。"],["tongue","n.","舌頭","I burned my tongue on the hot soup.","我的舌頭被熱湯燙傷了。"],["lip","n.","嘴唇","In winter my lips get dry.","冬天我的嘴唇會乾裂。"],["beard","n.","鬍鬚","My father grew a beard last year.","我爸爸去年留了鬍子。"],["bald","adj.","禿頭的","He started to go bald in his thirties.","他三十幾歲就開始禿頭了。"],["wrinkle","n.","皺紋","Laughing a lot may cause wrinkles around your eyes.","常笑可能會讓眼睛周圍出現皺紋。"],["slim","adj.","苗條的","She stays slim by swimming every morning.","她每天早上游泳，保持苗條。"],["skinny","adj.","過瘦的","The skinny boy could hardly lift the box.","那個瘦巴巴的男孩幾乎搬不動箱子。"],["plump","adj.","圓潤豐滿的","The plump baby laughed happily.","那個圓嘟嘟的寶寶開心地笑著。"],["muscular","adj.","肌肉發達的","The muscular man carried the piano up the stairs.","那個肌肉發達的男子把鋼琴扛上了樓。"],["attractive","adj.","有吸引力的","Many people find her attractive and friendly.","許多人覺得她既有魅力又友善。"],["handsome","adj.","英俊的","The handsome actor smiled at the cameras.","那位英俊的演員對著鏡頭微笑。"],["elderly","adj.","年長的","Please give your seat to elderly passengers.","請把座位讓給年長的乘客。"],["height","n.","身高；高度","What is your height and weight?","你的身高和體重是多少？"],["weight","n.","體重；重量","She lost some weight after changing her diet.","她改變飲食後瘦了一些。"],["appearance","n.","外表；外貌","You should not judge people by their appearance.","你不該以外表來評斷人。"],["figure","n.","身材；人影；數字","She has a good figure because she exercises often.","她常運動，所以身材很好。"],["posture","n.","姿勢，姿態","Good posture helps prevent back pain.","良好的姿勢有助於預防背痛。"],["gesture","n.","手勢，姿態","He made a gesture for me to sit down.","他做了個手勢請我坐下。"],["blink","v.","眨眼","She blinked in the bright sunlight.","她在刺眼的陽光下眨了眨眼。"],["stare","v.","凝視，盯著看","It is rude to stare at strangers.","盯著陌生人看是不禮貌的。"],["glance","v.","瞥一眼","He glanced at his watch and stood up.","他瞥了一眼手錶，然後站了起來。"],["yawn","v.","打哈欠","The students began to yawn in the long lecture.","學生們在冗長的課堂上開始打哈欠。"],["sneeze","v.","打噴嚏","Dust makes me sneeze.","灰塵讓我打噴嚏。"],["breathe","v.","呼吸","Take a deep breath and breathe slowly.","深吸一口氣，然後慢慢呼吸。"],["swallow","v.","吞嚥","It hurts when I swallow.","我吞東西的時候會痛。"],["sweat","v.","流汗","We sweated a lot in the hot sun.","我們在大太陽下流了很多汗。"],["shiver","v.","發抖，打顫","The children shivered in the cold wind.","孩子們在寒風中發抖。"],["pulse","n.","脈搏","The nurse checked his pulse.","護理師量了他的脈搏。"],["bruise","n.","瘀青","She had a large bruise on her leg.","她腿上有一大塊瘀青。"],["scar","n.","疤痕","The accident left a scar on his face.","那場意外在他臉上留下一道疤。"],["limp","v.","跛行","He limped off the field after the fall.","他摔倒後一跛一跛地走離球場。"],["stretch","v.","伸展，拉長","Stretch your arms before you start running.","開始跑步前先伸展你的手臂。"],["bend","v.","彎曲；彎腰","Bend your knees when you lift a heavy box.","搬重物時要彎曲膝蓋。"],["kneel","v.","跪下","She knelt down to tie the child's shoes.","她蹲跪下來替孩子繫鞋帶。"],["hug","v.","擁抱","He hugged his mother at the airport.","他在機場擁抱了他的母親。"],["wave","v.","揮手","The children waved goodbye to their teacher.","孩子們向老師揮手道別。"],["nod","v.","點頭","She nodded to show that she agreed.","她點頭表示同意。"],["shrug","v.","聳肩","He shrugged and said he didn't know.","他聳聳肩說他不知道。"]]},{"id":"w22","icon":"🍳","zh":"烹飪與廚房","en":"Cooking & Kitchen","basic":false,"words":[["boil","v.","煮沸；煮","Boil the eggs for ten minutes.","把蛋煮十分鐘。"],["fry","v.","油炸，煎，炒","She fried some vegetables in a pan.","她在鍋子裡炒了一些蔬菜。"],["bake","v.","烘烤","My grandmother bakes bread every weekend.","我奶奶每個週末都烤麵包。"],["roast","v.","烤（肉、蔬菜）","We roasted a chicken for dinner.","我們晚餐烤了一隻雞。"],["steam","v.","蒸","Steam the fish for eight minutes.","把魚蒸八分鐘。"],["grill","v.","炙烤，燒烤","They grilled meat in the backyard.","他們在後院烤肉。"],["stir","v.","攪拌","Stir the soup so that it doesn't burn.","攪拌一下湯，免得燒焦。"],["chop","v.","切碎，剁","Chop the onions into small pieces.","把洋蔥切成小塊。"],["slice","v.","切片","Please slice the bread thinly.","請把麵包切成薄片。"],["peel","v.","削皮，剝皮","She peeled an orange for her son.","她替兒子剝了一顆橘子。"],["mix","v.","混合","Mix the flour and the eggs together.","把麵粉和蛋混合在一起。"],["pour","v.","倒（液體）","He poured milk into the glass.","他把牛奶倒進玻璃杯。"],["melt","v.","融化","The butter melted in the hot pan.","奶油在熱鍋裡融化了。"],["freeze","v.","冷凍；結冰","You can freeze the soup for later.","你可以把湯冷凍起來以後再吃。"],["defrost","v.","解凍","Defrost the meat before you cook it.","烹煮前先把肉解凍。"],["seasoning","n.","調味料","Add some seasoning to make it tastier.","加點調味料讓它更好吃。"],["salt","n.","鹽","Don't put too much salt in the soup.","不要在湯裡放太多鹽。"],["pepper","n.","胡椒","He added a little black pepper.","他加了一點黑胡椒。"],["sugar","n.","糖","I don't take sugar in my coffee.","我的咖啡不加糖。"],["sauce","n.","醬汁","The pasta comes with a tomato sauce.","這份義大利麵附有番茄醬汁。"],["oil","n.","油","Heat some oil in the pan first.","先在鍋裡加熱一些油。"],["vinegar","n.","醋","Add a spoonful of vinegar to the salad.","在沙拉裡加一匙醋。"],["garlic","n.","大蒜","Garlic gives the dish a strong flavor.","大蒜讓這道菜味道濃郁。"],["ginger","n.","薑","Tea with ginger is good for a cold.","加薑的茶對感冒有幫助。"],["onion","n.","洋蔥","Onions often make me cry when I cut them.","切洋蔥常常讓我流眼淚。"],["mushroom","n.","蘑菇","She added mushrooms to the soup.","她在湯裡加了蘑菇。"],["potato","n.","馬鈴薯","Mashed potato is my favorite side dish.","馬鈴薯泥是我最愛的配菜。"],["tomato","n.","番茄","Tomatoes are rich in vitamin C.","番茄富含維他命 C。"],["cabbage","n.","高麗菜","The cabbage in the market is very fresh.","市場上的高麗菜很新鮮。"],["carrot","n.","胡蘿蔔","Rabbits love carrots.","兔子喜歡胡蘿蔔。"],["pork","n.","豬肉","Pork is popular in Taiwanese cooking.","豬肉在台灣料理中很常見。"],["beef","n.","牛肉","I would like a beef noodle soup.","我想要一碗牛肉麵。"],["seafood","n.","海鮮","The restaurant serves fresh seafood.","這家餐廳供應新鮮的海鮮。"],["shrimp","n.","蝦子","Do you have an allergy to shrimp?","你對蝦子過敏嗎？"],["tofu","n.","豆腐","Tofu is a good source of protein.","豆腐是蛋白質的良好來源。"],["flour","n.","麵粉","We need two cups of flour for the cake.","做這個蛋糕需要兩杯麵粉。"],["butter","n.","奶油","Spread some butter on the toast.","在吐司上塗一些奶油。"],["cheese","n.","起司","She likes pizza with extra cheese.","她喜歡加很多起司的披薩。"],["yogurt","n.","優格","I eat yogurt with fruit for breakfast.","我早餐吃優格配水果。"],["honey","n.","蜂蜜","Add honey to the tea if it is too bitter.","如果茶太苦，就加一些蜂蜜。"],["pan","n.","平底鍋","Heat the pan before you add the eggs.","加蛋之前先把鍋子加熱。"],["pot","n.","鍋子（深鍋）","Put the noodles into the pot of hot water.","把麵條放進熱水鍋裡。"],["knife","n.","刀子","Be careful when you use the sharp knife.","使用這把鋒利的刀子時要小心。"],["fork","n.","叉子","She ate the cake with a fork.","她用叉子吃蛋糕。"],["spoon","n.","湯匙","Use a spoon to eat the soup.","用湯匙喝湯。"],["chopsticks","n.","筷子","Many foreigners are learning to use chopsticks.","許多外國人正在學習使用筷子。"],["plate","n.","盤子","He put the fish on a white plate.","他把魚放在白色的盤子上。"],["bowl","n.","碗","She filled the bowl with rice.","她把碗裝滿了飯。"],["cup","n.","杯子","Would you like a cup of tea?","你要來杯茶嗎？"],["oven","n.","烤箱","Put the cake in the oven for thirty minutes.","把蛋糕放進烤箱三十分鐘。"],["stove","n.","爐子","Turn off the stove before you leave.","離開前請關掉爐火。"],["microwave","n.","微波爐","Heat the soup in the microwave for two minutes.","把湯放進微波爐加熱兩分鐘。"],["refrigerator","n.","冰箱","Keep the milk in the refrigerator.","把牛奶放在冰箱裡。"],["sink","n.","水槽","There are dirty dishes in the sink.","水槽裡有髒碗盤。"],["cookbook","n.","食譜書","She learned to cook from an old cookbook.","她從一本舊食譜書學會了做菜。"],["portion","n.","一份，份量","The portions at this restaurant are quite large.","這家餐廳的份量相當大。"],["leftovers","n.","剩菜","We had leftovers for lunch today.","我們今天午餐吃剩菜。"],["tasty","adj.","美味的","The soup is simple but very tasty.","這道湯很簡單，但非常美味。"],["fresh","adj.","新鮮的","Fresh fruit is always better than canned fruit.","新鮮水果總是比罐頭水果好。"],["rotten","adj.","腐爛的","Throw away the rotten apples.","把爛掉的蘋果丟掉。"]]},{"id":"w23","icon":"👗","zh":"服飾與穿著","en":"Clothes & Fashion","basic":false,"words":[["jacket","n.","夾克，外套","Take a jacket with you because it may get cold.","帶件外套吧，天氣可能會變冷。"],["sweater","n.","毛衣","My grandmother knitted me a warm sweater.","我奶奶幫我織了一件溫暖的毛衣。"],["coat","n.","大衣","He put on his coat and went out into the snow.","他穿上大衣，走進雪中。"],["uniform","n.","制服","Students in Taiwan usually wear a school uniform.","台灣的學生通常穿學校制服。"],["dress","n.","洋裝","She bought a red dress for the party.","她為派對買了一件紅色洋裝。"],["skirt","n.","裙子","The skirt is a little too short for work.","這條裙子對上班來說有點太短了。"],["trousers","n.","長褲","These trousers are too long for me.","這條長褲對我來說太長了。"],["jeans","n.","牛仔褲","I like to wear jeans on weekends.","我週末喜歡穿牛仔褲。"],["shorts","n.","短褲","It is so hot that everyone is wearing shorts.","天氣太熱了，每個人都穿短褲。"],["pajamas","n.","睡衣","The children were in their pajamas at nine.","孩子們九點就穿著睡衣了。"],["scarf","n.","圍巾","She wrapped a scarf around her neck.","她把圍巾圍在脖子上。"],["glove","n.","手套","Don't forget your gloves in winter.","冬天別忘了戴手套。"],["sock","n.","襪子","I can't find my other sock.","我找不到另一隻襪子。"],["sneaker","n.","運動鞋","He bought a new pair of sneakers for running.","他買了一雙新的跑步鞋。"],["sandals","n.","涼鞋","I wear sandals in the summer.","我夏天穿涼鞋。"],["boots","n.","靴子","Wear boots when it rains heavily.","下大雨時要穿靴子。"],["belt","n.","皮帶，腰帶","He needs a new belt for his pants.","他的褲子需要一條新皮帶。"],["tie","n.","領帶","The manager always wears a tie.","經理總是打領帶。"],["button","n.","鈕扣","A button came off my shirt.","我的襯衫掉了一顆鈕扣。"],["zipper","n.","拉鍊","The zipper on my bag is broken.","我的包包拉鍊壞了。"],["pocket","n.","口袋","He put the key in his pocket.","他把鑰匙放進口袋。"],["sleeve","n.","袖子","The sleeves of this shirt are too long.","這件襯衫的袖子太長了。"],["collar","n.","衣領","She turned up the collar of her coat.","她把大衣的衣領翻起來。"],["fabric","n.","布料","This fabric feels soft and comfortable.","這種布料摸起來柔軟又舒服。"],["cotton","n.","棉花；棉布","Cotton clothes are good for summer.","棉質衣服適合夏天穿。"],["silk","n.","絲綢","The scarf is made of pure silk.","這條圍巾是純絲製成的。"],["wool","n.","羊毛","Wool keeps you warm in winter.","羊毛讓你在冬天保持溫暖。"],["leather","n.","皮革","He bought a leather wallet for his father.","他買了一個皮夾給他爸爸。"],["stripe","n.","條紋","She wore a shirt with blue and white stripes.","她穿著一件藍白條紋的襯衫。"],["plain","adj.","素色的；樸素的","I prefer plain clothes to colorful ones.","比起花俏的衣服，我比較喜歡素色的。"],["stylish","adj.","時髦的","She looks stylish in that new coat.","她穿那件新大衣看起來很時髦。"],["fashionable","adj.","流行的","Wide pants are fashionable this year.","寬褲今年很流行。"],["casual","adj.","休閒的；隨意的","Casual clothes are fine for the picnic.","野餐穿休閒服裝就可以了。"],["formal","adj.","正式的","Please wear formal clothes to the ceremony.","請穿正式服裝參加典禮。"],["tight","adj.","緊的","These shoes are too tight for me.","這雙鞋對我來說太緊了。"],["matching","adj.","搭配的，成套的","She wore a hat and matching gloves.","她戴了帽子和成套的手套。"],["outfit","n.","一套服裝","I need a new outfit for the wedding.","我需要一套新衣服參加婚禮。"],["accessory","n.","配件，飾品","A scarf is a simple accessory for winter.","圍巾是冬天簡單的配件。"],["jewelry","n.","珠寶首飾","She keeps her jewelry in a small box.","她把首飾放在一個小盒子裡。"],["necklace","n.","項鍊","He gave her a gold necklace on her birthday.","他在她生日時送她一條金項鍊。"],["earring","n.","耳環","She lost one of her earrings.","她弄丟了一隻耳環。"],["ring","n.","戒指","He gave her a ring when they got engaged.","他們訂婚時他送了她一枚戒指。"],["bracelet","n.","手鍊","The bracelet was a gift from her friend.","這條手鍊是她朋友送的禮物。"],["sunglasses","n.","太陽眼鏡","Wear sunglasses to protect your eyes.","戴太陽眼鏡來保護你的眼睛。"],["umbrella","n.","雨傘","Don't forget to take an umbrella.","別忘了帶傘。"],["handbag","n.","手提包","She carries a small handbag to work.","她帶一個小手提包去上班。"],["wallet","n.","皮夾","He lost his wallet on the train.","他把皮夾掉在火車上了。"],["hat","n.","帽子","Wear a hat to keep the sun off your face.","戴頂帽子來遮擋臉上的陽光。"],["mask","n.","口罩；面具","Please wear a mask in the hospital.","在醫院請戴口罩。"],["dry-clean","v.","乾洗","This coat has to be dry-cleaned.","這件大衣必須乾洗。"],["iron","v.","熨燙","He ironed his shirt before the interview.","他在面試前把襯衫燙好。"],["wrinkled","adj.","皺的","Your shirt is wrinkled. Let me iron it.","你的襯衫皺了，我來燙一下。"],["tailor","n.","裁縫師","The tailor made a suit for me.","裁縫師為我做了一套西裝。"],["trend","n.","潮流，趨勢","Short hair is the latest trend.","短髮是最新的潮流。"],["second-hand","adj.","二手的","I bought a second-hand jacket at the market.","我在市集買了一件二手夾克。"],["label","n.","標籤","Read the label before you wash the sweater.","洗這件毛衣前先看標籤。"]]},{"id":"w24","icon":"💰","zh":"金錢與生活開銷","en":"Money & Expenses","basic":false,"words":[["coin","n.","硬幣","I need a coin for the shopping cart.","我需要一枚硬幣來使用購物車。"],["change","n.","零錢；找零","Please keep the change.","請不用找零了。"],["deposit","n.","訂金；存款","You have to pay a deposit to rent the room.","你必須付訂金才能租這個房間。"],["withdraw","v.","提領（款）","I need to withdraw some money from the ATM.","我需要從提款機領一些錢。"],["transfer","v.","轉帳；轉移","Please transfer the money to my account.","請把錢轉到我的帳戶。"],["balance","n.","餘額；平衡","Check your account balance online.","請在網路上查看你的帳戶餘額。"],["debt","n.","債務","He worked hard to pay off his debt.","他努力工作以還清債務。"],["mortgage","n.","房貸","They are still paying the mortgage on their house.","他們仍在繳房子的貸款。"],["insurance","n.","保險","Do you have health insurance?","你有健康保險嗎？"],["pension","n.","退休金","My grandfather lives on his pension.","我爺爺靠退休金生活。"],["wage","n.","工資（按時計）","The workers asked for higher wages.","工人們要求更高的工資。"],["bonus","n.","獎金","Each employee received a bonus at the end of the year.","每位員工在年底都收到了一筆獎金。"],["fee","n.","費用","There is a small fee for using the pool.","使用游泳池要收取一小筆費用。"],["deduct","v.","扣除","The company deducted tax from his pay.","公司從他的薪水中扣除了稅金。"],["allowance","n.","零用錢；津貼","He gets a weekly allowance from his parents.","他每週從父母那裡得到零用錢。"],["pricey","adj.","昂貴的（口語）","The hotel is nice but a bit pricey.","這間飯店不錯，但有點貴。"],["cheap","adj.","便宜的","The food is cheap but very good.","這裡的食物便宜又好吃。"],["costly","adj.","花費大的","A wrong decision could be costly for the company.","錯誤的決定可能會讓公司付出高昂代價。"],["reasonable","adj.","合理的","The price is reasonable for such good quality.","品質這麼好，這個價格很合理。"],["worth","adj.","值得的","This book is worth reading twice.","這本書值得讀兩遍。"],["wealthy","adj.","富有的","The wealthy man gave money to the school.","這位富有的男士捐錢給學校。"],["poor","adj.","貧窮的","The poor family could not afford a doctor.","這個貧窮的家庭付不起看醫生的錢。"],["broke","adj.","沒錢的（口語）","I can't go out with you because I'm broke.","我沒錢，不能跟你出去。"],["thrifty","adj.","節儉的","My mother is thrifty and never wastes food.","我媽媽很節儉，從不浪費食物。"],["stingy","adj.","吝嗇的","He is too stingy to buy his friend a drink.","他小氣得不肯請朋友喝一杯。"],["spend","v.","花（錢、時間）","She spends too much money on clothes.","她花太多錢在衣服上。"],["save up","phr. v.","存錢（為了某目的）","He is saving up to buy a motorcycle.","他正在存錢想買一輛機車。"],["pay off","phr. v.","還清；有回報","Her hard work finally paid off.","她的努力終於有了回報。"],["pay back","phr. v.","償還","I will pay you back next week.","我下週會還你錢。"],["cut back","phr. v.","縮減（開支）","We need to cut back on our spending.","我們需要縮減開支。"],["rip off","phr. v.","敲竹槓","Taxi drivers there tried to rip us off.","那裡的計程車司機想敲我們竹槓。"],["donation","n.","捐款","We collected donations for the flood victims.","我們為水災受害者募集捐款。"],["fund","n.","基金，資金","The school set up a fund to help poor students.","學校成立了一個基金來幫助貧困學生。"],["sponsor","n.","贊助者","The company is the main sponsor of the event.","這家公司是這場活動的主要贊助者。"],["payment","n.","付款","The payment must be made within seven days.","款項必須在七天內付清。"],["installment","n.","分期付款","You can pay for the phone in installments.","你可以分期付款買這支手機。"],["cash machine","n.","提款機","There is a cash machine outside the bank.","銀行外面有一台提款機。"],["price tag","n.","價格標籤","He looked at the price tag and put the jacket back.","他看了看價格標籤，把夾克放了回去。"],["overspend","v.","超支","Many people overspend during the holidays.","很多人在假期中花錢超支。"],["financial","adj.","財務的","He asked the bank for financial advice.","他向銀行尋求理財建議。"],["valuable","adj.","貴重的，有價值的","Please put your valuable things in the safe.","請把你的貴重物品放進保險箱。"],["worthless","adj.","毫無價值的","Without a signature, the paper is worthless.","沒有簽名，這張紙就沒有價值。"],["purchase","v.","購買","She purchased a ticket online.","她在網路上購買了一張票。"],["lottery","n.","樂透","He dreams of winning the lottery.","他夢想中樂透。"],["gamble","v.","賭博","He lost all his savings when he gambled.","他賭博輸光了所有積蓄。"],["tax return","n.","報稅","I have to fill in my tax return before May.","我必須在五月前完成報稅。"],["income tax","n.","所得稅","Income tax is taken from your salary each month.","所得稅每個月都從你的薪水中扣除。"],["exchange rate","n.","匯率","The exchange rate changes every day.","匯率每天都在變。"],["poverty line","n.","貧窮線","Many families live below the poverty line.","許多家庭生活在貧窮線以下。"],["bankrupt","adj.","破產的","The company went bankrupt last year.","這家公司去年破產了。"]]},{"id":"w25","icon":"🌦️","zh":"天氣與季節","en":"Weather & Seasons","basic":false,"words":[["forecast","n.","預報","The weather forecast says it will rain tomorrow.","天氣預報說明天會下雨。"],["sunny","adj.","晴朗的","It was a sunny day, so we went to the beach.","那天天氣晴朗，所以我們去了海邊。"],["cloudy","adj.","多雲的","It will be cloudy in the afternoon.","下午會是多雲的天氣。"],["foggy","adj.","有霧的","The flight was delayed because it was foggy.","因為起霧，班機延誤了。"],["windy","adj.","多風的","It is too windy to fly a kite today.","今天風太大，不適合放風箏。"],["humid","adj.","潮濕的","Summer in Taiwan is hot and humid.","台灣的夏天又熱又潮濕。"],["dry","adj.","乾燥的","The air is very dry in winter.","冬天空氣很乾燥。"],["freezing","adj.","極冷的","It is freezing outside, so wear a coat.","外面冷得要命，穿件大衣吧。"],["chilly","adj.","涼颼颼的","It gets chilly in the evening.","傍晚會變得涼颼颼的。"],["mild","adj.","溫和的","The winter here is mild and comfortable.","這裡的冬天溫和舒適。"],["boiling","adj.","酷熱的","It's boiling in this room. Please open a window.","這房間熱死了，請開個窗。"],["shower","n.","陣雨","We had a heavy shower on our way home.","我們回家的路上遇到一場大陣雨。"],["drizzle","n.","毛毛雨","A light drizzle fell all morning.","整個早上都下著毛毛雨。"],["thunder","n.","雷","The thunder woke the baby up.","雷聲把寶寶吵醒了。"],["lightning","n.","閃電","Lightning struck the tall tree.","閃電擊中了那棵高大的樹。"],["storm","n.","暴風雨","The ship sailed into a terrible storm.","那艘船駛入了可怕的暴風雨中。"],["hurricane","n.","颶風","The hurricane destroyed many houses.","颶風摧毀了許多房屋。"],["tornado","n.","龍捲風","A tornado hit the small town last night.","昨晚一場龍捲風襲擊了這個小鎮。"],["snowstorm","n.","暴風雪","The snowstorm closed the highway.","暴風雪使高速公路封閉。"],["frost","n.","霜","There was frost on the grass this morning.","今天早上草地上有霜。"],["ice","n.","冰","The lake was covered with thick ice.","湖面覆蓋著厚厚的冰。"],["breeze","n.","微風","A cool breeze came in from the window.","一陣涼風從窗戶吹進來。"],["gust","n.","陣風","A sudden gust blew his hat away.","一陣突然的強風把他的帽子吹走了。"],["rainbow","n.","彩虹","We saw a rainbow after the rain stopped.","雨停後我們看到了彩虹。"],["sunrise","n.","日出","We climbed the mountain to see the sunrise.","我們爬山去看日出。"],["sunset","n.","日落","The sunset over the sea was beautiful.","海上的日落非常美麗。"],["season","n.","季節","Which season do you like best?","你最喜歡哪個季節？"],["spring","n.","春天","Cherry blossoms open in spring.","櫻花在春天盛開。"],["summer","n.","夏天","We go swimming every summer.","我們每年夏天都去游泳。"],["autumn","n.","秋天","The leaves turn red in autumn.","樹葉在秋天變紅。"],["winter","n.","冬天","It rarely snows in Taipei in winter.","台北冬天很少下雪。"],["heat wave","n.","熱浪","A heat wave hit the city this week.","這週熱浪襲擊了這座城市。"],["cold front","n.","冷鋒","A cold front will bring rain tonight.","冷鋒今晚會帶來降雨。"],["humidity","n.","濕度","High humidity makes the heat feel worse.","高濕度讓炎熱感覺更難受。"],["Celsius","n.","攝氏","Water freezes at zero degrees Celsius.","水在攝氏零度結冰。"],["rainfall","n.","降雨量","The island has heavy rainfall in summer.","這座島在夏季降雨量很大。"],["shelter","n.","遮蔽處；避難所","We ran to a small shelter to avoid the rain.","我們跑到一個小遮蔽處躲雨。"],["blow","v.","吹","The wind blew the leaves across the road.","風把樹葉吹過馬路。"],["evaporate","v.","蒸發","Water evaporates faster in hot weather.","天氣熱時水蒸發得更快。"],["shine","v.","照耀，發光","The sun shone brightly all day.","太陽整天明亮地照耀著。"],["sunburn","n.","曬傷","Put on sunscreen to avoid sunburn.","擦防曬乳以避免曬傷。"],["sunscreen","n.","防曬乳","Don't forget to bring sunscreen to the beach.","去海邊別忘了帶防曬乳。"],["raincoat","n.","雨衣","He wore a yellow raincoat to school.","他穿著黃色雨衣去上學。"],["umbrella stand","n.","傘架","Please leave your wet umbrella in the umbrella stand.","請把濕的雨傘放在傘架上。"],["weather station","n.","氣象站","The weather station recorded the highest temperature.","氣象站記錄了最高的溫度。"],["climate change","n.","氣候變遷","Climate change is causing more extreme weather.","氣候變遷正造成更多極端天氣。"],["extreme","adj.","極端的","Extreme heat can be dangerous for old people.","極端高溫對老年人可能很危險。"],["unpredictable","adj.","難以預測的","Mountain weather is often unpredictable.","山區的天氣常常難以預測。"],["gloomy","adj.","陰暗的，憂鬱的","It was a gloomy day with grey clouds.","那是個布滿灰雲的陰沉日子。"],["bright","adj.","明亮的","The room is bright in the morning.","這個房間早上很明亮。"]]},{"id":"w26","icon":"🐾","zh":"動物","en":"Animals","basic":false,"words":[["mammal","n.","哺乳動物","A whale is a mammal, not a fish.","鯨魚是哺乳動物，不是魚。"],["reptile","n.","爬蟲類","Snakes and lizards are reptiles.","蛇和蜥蜴是爬蟲類。"],["insect","n.","昆蟲","Ants are small but hard-working insects.","螞蟻是體型小但很勤勞的昆蟲。"],["bird","n.","鳥","A bird built a nest outside my window.","有一隻鳥在我的窗外築巢。"],["fish","n.","魚","We caught three fish in the river.","我們在河裡釣到三條魚。"],["tiger","n.","老虎","The tiger is a large and powerful animal.","老虎是體型龐大又強壯的動物。"],["lion","n.","獅子","The lion is often called the king of animals.","獅子常被稱為萬獸之王。"],["elephant","n.","大象","An elephant can live for more than sixty years.","大象可以活六十多年。"],["monkey","n.","猴子","The monkey climbed up the tree quickly.","猴子很快爬上了樹。"],["bear","n.","熊","Do not feed bears in the national park.","不要在國家公園餵熊。"],["wolf","n.","狼","Wolves usually live and hunt in groups.","狼通常成群生活與獵食。"],["fox","n.","狐狸","The fox is known for being clever.","狐狸以聰明聞名。"],["deer","n.","鹿","A deer ran across the road in front of us.","一隻鹿從我們前面跑過馬路。"],["rabbit","n.","兔子","The rabbit ate all the carrots in the garden.","兔子吃光了花園裡所有的胡蘿蔔。"],["squirrel","n.","松鼠","A squirrel was collecting nuts under the tree.","一隻松鼠在樹下收集堅果。"],["mouse","n.","老鼠","A mouse ran into the kitchen.","一隻老鼠跑進了廚房。"],["bat","n.","蝙蝠","Bats sleep during the day and fly at night.","蝙蝠白天睡覺，晚上飛行。"],["dolphin","n.","海豚","Dolphins are friendly and very intelligent.","海豚友善又非常聰明。"],["whale","n.","鯨魚","We went on a boat trip to watch whales.","我們搭船出海賞鯨。"],["shark","n.","鯊魚","Most sharks are not dangerous to humans.","大部分鯊魚對人類並不危險。"],["turtle","n.","海龜，烏龜","Sea turtles come to the beach to lay eggs.","海龜會到海灘上產卵。"],["crocodile","n.","鱷魚","A crocodile was lying quietly by the river.","一隻鱷魚靜靜地躺在河邊。"],["snake","n.","蛇","Some snakes are poisonous, so be careful.","有些蛇有毒，所以要小心。"],["frog","n.","青蛙","The frogs sing loudly after the rain.","雨後青蛙大聲鳴叫。"],["butterfly","n.","蝴蝶","A butterfly landed on the flower.","一隻蝴蝶停在花上。"],["bee","n.","蜜蜂","Bees make honey from flowers.","蜜蜂用花蜜製造蜂蜜。"],["mosquito","n.","蚊子","Mosquitoes were biting us all night.","蚊子整晚都在咬我們。"],["spider","n.","蜘蛛","A spider made a web in the corner.","一隻蜘蛛在角落結了網。"],["eagle","n.","老鷹","The eagle flew high above the mountains.","老鷹在山的上空高飛。"],["owl","n.","貓頭鷹","Owls hunt at night.","貓頭鷹在夜間獵食。"],["pigeon","n.","鴿子","Pigeons gather in the square to look for food.","鴿子聚集在廣場上找食物。"],["sparrow","n.","麻雀","A few sparrows were singing on the roof.","幾隻麻雀在屋頂上唱歌。"],["duck","n.","鴨子","The children fed bread to the ducks.","孩子們拿麵包餵鴨子。"],["goose","n.","鵝","A goose can be quite noisy and aggressive.","鵝可能很吵，也很有攻擊性。"],["cattle","n.","牛群（總稱）","Farmers keep cattle for milk and meat.","農夫養牛來取得牛奶和肉。"],["sheep","n.","綿羊","A flock of sheep was crossing the road.","一群綿羊正在過馬路。"],["goat","n.","山羊","The goat eats almost anything.","山羊幾乎什麼都吃。"],["pig","n.","豬","The farmer keeps two pigs.","農夫養了兩頭豬。"],["horse","n.","馬","She learned to ride a horse last summer.","她去年夏天學會騎馬。"],["donkey","n.","驢子","The donkey carried the heavy bags up the hill.","驢子把沉重的袋子運上山。"],["puppy","n.","小狗","The puppy followed the boy home.","小狗跟著男孩回家。"],["kitten","n.","小貓","The kitten is playing with a ball of wool.","小貓在玩一團毛線。"],["pet","n.","寵物","Do you have any pets at home?","你家有養寵物嗎？"],["wild","adj.","野生的","Wild animals should not be kept as pets.","野生動物不該當寵物養。"],["tame","adj.","溫馴的，馴化的","The tame bird sat on her shoulder.","那隻溫馴的鳥停在她的肩上。"],["fierce","adj.","凶猛的","The fierce dog barked at the stranger.","那隻凶猛的狗對著陌生人吠叫。"],["cute","adj.","可愛的","The baby panda looks so cute.","那隻小貓熊看起來好可愛。"],["feather","n.","羽毛","The bird has bright blue feathers.","這隻鳥有鮮豔的藍色羽毛。"],["wing","n.","翅膀","The bird spread its wings and flew away.","鳥展開翅膀飛走了。"],["tail","n.","尾巴","The dog wagged its tail happily.","狗開心地搖著尾巴。"],["paw","n.","（動物的）爪子","The cat cleaned its paw.","貓舔了舔牠的爪子。"],["claw","n.","爪","Cats have sharp claws.","貓有鋒利的爪子。"],["horn","n.","角","The animal has two long horns.","這種動物有兩支長角。"],["fur","n.","毛皮","The rabbit's fur is soft and white.","兔子的毛柔軟又雪白。"],["shell","n.","殼","The turtle hid in its shell.","烏龜躲進了牠的殼裡。"],["nest","n.","巢","The bird built a nest in the tree.","鳥在樹上築了一個巢。"],["cage","n.","籠子","The bird flew out of the open cage.","鳥從開著的籠子飛了出去。"],["herd","n.","獸群","A herd of elephants moved slowly across the field.","一群大象緩慢地穿過原野。"],["hunt","v.","獵捕","Lions hunt in the early morning.","獅子在清晨獵捕。"],["feed","v.","餵食","Please do not feed the animals in the zoo.","請不要餵食動物園裡的動物。"],["bark","v.","吠叫","The dog barked at the mailman.","那隻狗對著郵差吠叫。"],["migrate","v.","遷徙","Many birds migrate south for the winter.","許多鳥類在冬天往南遷徙。"]]},{"id":"w27","icon":"⛰️","zh":"地理與自然景觀","en":"Geography & Landscapes","basic":false,"words":[["mountain","n.","山","We climbed the mountain early in the morning.","我們一大早就爬上了那座山。"],["hill","n.","小山丘","The house is at the top of the hill.","那棟房子位於山丘頂端。"],["valley","n.","山谷","A river runs through the green valley.","一條河流過這個綠色的山谷。"],["cliff","n.","懸崖","Be careful near the edge of the cliff.","靠近懸崖邊緣時要小心。"],["cave","n.","洞穴","The bats live in a dark cave.","蝙蝠住在黑暗的洞穴裡。"],["volcano","n.","火山","The volcano erupted last month.","那座火山上個月爆發了。"],["desert","n.","沙漠","It hardly ever rains in the desert.","沙漠裡幾乎不下雨。"],["jungle","n.","叢林","Many rare animals live in the jungle.","許多稀有動物生活在叢林裡。"],["rainforest","n.","雨林","The rainforest is home to millions of species.","雨林是數百萬種物種的家。"],["grassland","n.","草原","Cattle are grazing on the grassland.","牛群正在草原上吃草。"],["plateau","n.","高原","The village lies on a high plateau.","這個村莊位於一片高原上。"],["island","n.","島嶼","Taiwan is an island in East Asia.","台灣是東亞的一座島嶼。"],["peninsula","n.","半島","Korea is on a peninsula.","韓國位於一個半島上。"],["continent","n.","大陸，洲","Asia is the largest continent in the world.","亞洲是世界上最大的洲。"],["coast","n.","海岸","We drove along the east coast.","我們沿著東海岸開車。"],["beach","n.","海灘","The children played on the beach all afternoon.","孩子們整個下午都在海灘上玩。"],["shore","n.","岸邊","The boat slowly came back to the shore.","船慢慢地回到了岸邊。"],["ocean","n.","海洋","The Pacific Ocean is the largest ocean on Earth.","太平洋是地球上最大的海洋。"],["sea","n.","海","The sea was calm and blue.","海面平靜而湛藍。"],["bay","n.","海灣","The small boats stayed in the bay.","小船停留在海灣裡。"],["harbor","n.","港口","Many ships were waiting in the harbor.","許多船隻在港口等待。"],["tide","n.","潮汐","The tide comes in twice a day.","潮水一天漲兩次。"],["river","n.","河流","The river is wide and deep here.","這裡的河又寬又深。"],["stream","n.","小溪","We crossed a small stream on the trail.","我們在山徑上越過一條小溪。"],["lake","n.","湖","They went fishing on the lake.","他們去湖上釣魚。"],["pond","n.","池塘","There are some ducks in the pond.","池塘裡有幾隻鴨子。"],["waterfall","n.","瀑布","The waterfall is over fifty meters high.","這座瀑布高達五十多公尺。"],["swamp","n.","沼澤","Crocodiles live in the swamp.","鱷魚生活在沼澤裡。"],["field","n.","田野，農地","The farmer works in the rice field.","農夫在稻田裡工作。"],["meadow","n.","草地","Flowers cover the meadow in spring.","春天時花朵覆蓋了整片草地。"],["soil","n.","土壤","Rice grows well in wet soil.","稻米在潮濕的土壤中生長良好。"],["sand","n.","沙","The sand on the beach was very hot.","海灘上的沙子非常燙。"],["rock","n.","岩石","He sat on a big rock by the river.","他坐在河邊的一塊大岩石上。"],["stone","n.","石頭","The path is made of small stones.","這條小路是用小石頭鋪成的。"],["mud","n.","泥巴","My shoes were covered in mud.","我的鞋子沾滿了泥巴。"],["dust","n.","灰塵","There is dust on all the furniture.","所有家具上都有灰塵。"],["coal","n.","煤","Coal was once the main source of energy.","煤炭曾經是主要的能源來源。"],["metal","n.","金屬","Iron is a strong metal.","鐵是一種堅固的金屬。"],["gold","n.","黃金","The ring is made of pure gold.","這枚戒指是純金做的。"],["silver","n.","銀","She wore a silver necklace.","她戴著一條銀項鍊。"],["tree","n.","樹","We planted a tree in the garden.","我們在花園裡種了一棵樹。"],["branch","n.","樹枝","A bird sat on a branch.","一隻鳥停在樹枝上。"],["leaf","n.","葉子","The leaves fall in autumn.","葉子在秋天掉落。"],["root","n.","根","Tree roots can break the pavement.","樹根可能會弄壞人行道。"],["seed","n.","種子","She planted the seeds in the garden.","她把種子種在花園裡。"],["flower","n.","花","She gave me a bunch of flowers.","她送了我一束花。"],["grass","n.","草","Don't walk on the grass.","不要踩在草地上。"],["bamboo","n.","竹子","Pandas eat bamboo.","貓熊吃竹子。"],["bush","n.","灌木叢","A cat is hiding in the bush.","一隻貓躲在灌木叢裡。"],["crop","n.","農作物","Rice is the main crop in this area.","稻米是這個地區的主要作物。"],["harvest","n.","收成；收割","The harvest was good this year.","今年的收成很好。"],["grow","v.","生長；種植","Tomatoes grow well in warm weather.","番茄在溫暖的天氣裡長得好。"],["bloom","v.","開花","Cherry trees bloom in early spring.","櫻花樹在早春開花。"],["wither","v.","枯萎","The flowers withered without water.","花朵因為缺水而枯萎了。"],["scenery","n.","風景，景色","The scenery along the coast is stunning.","沿岸的風景令人驚豔。"],["landscape","n.","地貌，風景","The landscape changes as you go north.","越往北走，地貌越是改變。"]]},{"id":"w28","icon":"🚦","zh":"交通與道路","en":"Transport & Roads","basic":false,"words":[["highway","n.","公路，高速公路","There was an accident on the highway.","高速公路上發生了車禍。"],["freeway","n.","高速公路","The freeway was crowded with cars.","高速公路上擠滿了車。"],["lane","n.","車道","Please stay in your own lane.","請留在你自己的車道上。"],["traffic jam","n.","塞車","We were stuck in a traffic jam for an hour.","我們被困在車陣裡一個小時。"],["traffic light","n.","紅綠燈","Stop when the traffic light turns red.","紅燈亮時要停下來。"],["zebra crossing","n.","斑馬線","Cars must stop at the zebra crossing.","車輛必須在斑馬線前停下。"],["roundabout","n.","圓環","Take the second exit at the roundabout.","在圓環走第二個出口。"],["tunnel","n.","隧道","The train went into a long tunnel.","火車駛入一條長隧道。"],["overpass","n.","天橋，高架橋","Use the overpass to cross the busy road.","請利用天橋穿越繁忙的馬路。"],["subway","n.","地下鐵","I take the subway to work every day.","我每天搭地鐵上班。"],["metro","n.","捷運，地鐵","The metro is faster than the bus.","捷運比公車快。"],["tram","n.","電車","The old tram runs through the city center.","老電車行駛過市中心。"],["taxi","n.","計程車","We took a taxi to the airport.","我們搭計程車去機場。"],["coach","n.","長途巴士","The coach to Taichung leaves at nine.","開往台中的長途巴士九點發車。"],["truck","n.","卡車","A truck
