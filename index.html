介系詞的受詞時，介系詞可以放在句尾 (The man (whom) I talked to) 或放在關係詞前 (to whom I talked)。"},{"h":"第四步：限定與非限定","p":"沒有逗號的是限定關係子句，用來限制先行詞是哪一個，缺少會讓意思不完整。有逗號的是非限定關係子句，只是補充說明，可以拿掉而不影響主要意思：My brother, who lives in Canada, is a chef.。非限定子句不能用 that，也不能省略關係代名詞。which 還可以指前面整個句子：He failed the test, which surprised us.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 多加一個代名詞：The man who he lives next door 應改成 The man who lives next door。2. 用 what 引導修飾名詞的子句：The book what I read 應改成 The book that I read。3. 逗號後用 that：My car, that is red 應改成 which is red。4. 地點用 which 但子句完整：This is the town which I was born 應改成 where I was born。"},"table":{"t":"關係詞的選擇","h":["先行詞","主格","受格","所有格"],"r":[["人","who / that","who(m) / that / 省略","whose"],["事物","which / that","which / that / 省略","whose / of which"],["地點","where","where","不適用"],["時間","when","when","不適用"]]},"examples":[["The woman who called you is my aunt.","打電話給你的女士是我阿姨。"],["The phone that I bought last week is very good.","我上週買的手機很好用。"],["He is a teacher whose class is always fun.","他是一位課總是很有趣的老師。"],["This is the house where I grew up.","這是我長大的房子。"],["I remember the day when we first met.","我記得我們第一次見面的那天。"],["Taipei, which is the capital of Taiwan, is very crowded.","台北是台灣的首都，非常擁擠。"],["That's the reason why I left early.","那就是我提早離開的原因。"],["Everything that he said was true.","他說的一切都是真的。"]],"key":["who = 人，which = 物，that = 人或物（限定），whose = 所有格。","where / when / why 是關係副詞，子句本身是完整句。","受詞位置的關係代名詞可省略，主詞位置不可。","逗號後的非限定子句不用 that。"],"basic":false,"ex":[{"q":"The boy ___ won the prize is my classmate.","o":["whose","who","which","where"],"a":"who","e":"先行詞是人，且在子句中當主詞，用 who。"},{"q":"This is the book ___ I told you about.","o":["that","who","whose","where"],"a":"that","e":"先行詞是物，關係詞當 about 的受詞，可用 that。"},{"q":"I have a friend ___ mother is a singer.","o":["who","which","whom","whose"],"a":"whose","e":"「他的媽媽」是所有關係，用 whose。"},{"q":"The place ___ we had lunch was very nice.","o":["which","where","who","whose"],"a":"where","e":"先行詞是地點，且子句完整，用 where。"},{"q":"The man ___ lives next door is a doctor.","o":["who","which","whose","whom"],"a":"who","e":"先行詞 the man 是人，且關係代名詞在子句中當主詞，用 who。"},{"q":"This is the book ___ I bought yesterday.","o":["who","whose","which","where"],"a":"which","e":"先行詞 the book 是事物，關係代名詞當 bought 的受詞，用 which。"},{"q":"She is the girl ___ father is a famous singer.","o":["who","whose","which","whom"],"a":"whose","e":"「她的爸爸」表示所有關係，用 whose。"},{"q":"That is the restaurant ___ we had dinner last week.","o":["which","who","where","whose"],"a":"where","e":"先行詞是地點，且子句本身完整 (we had dinner)，用關係副詞 where。"},{"q":"The woman to ___ I talked is my teacher.","o":["whom","who","which","whose"],"a":"whom","e":"介系詞 to 後面接人時，要用受格 whom。"},{"q":"I know a boy ___ can speak five languages.","o":["whom","whose","where","who"],"a":"who","e":"先行詞是人，關係代名詞當主詞（can speak 缺主詞），用 who。"}]},{"id":"m9","icon":"🗨️","zh":"間接引述","intro":"間接引述是轉述別人說過的話。通常主要動詞用過去式 (said, told, asked)，所以被引述句的時態要往後退一格，代名詞與時間、地點詞也要跟著調整。","steps":[{"h":"第一步：間接引述是「轉述別人的話」","p":"直接引述是把原話放在引號裡，間接引述是用自己的話轉述。轉述時要調整三件事：時態、代名詞，以及時間與地點詞。例如直接引述 \"I am hungry,\" she said. 轉述為 She said (that) she was hungry.。"},{"h":"第二步：時態通常退後一格","p":"當主要動詞是過去式 (said, told, asked) 時，被轉述句子的時態通常往後退：現在簡單式退為過去簡單式，現在進行式退為過去進行式，現在完成式與過去簡單式退為過去完成式，will 退為 would，can 退為 could，may 退為 might。但如果說的是仍然成立的事實，或報導動詞是現在式 (says)，可以不退。"},{"h":"第三步：時間、地點與代名詞的變化","p":"now 變 then，today 變 that day，tomorrow 變 the next day，yesterday 變 the day before，here 變 there，this 變 that。代名詞要依轉述者的角度改變：Tom said, \"I love my job.\" 轉述為 Tom said (that) he loved his job.。"},{"h":"第四步：疑問句與命令句","p":"Yes/No 問句用 if 或 whether 連接，Wh- 問句保留疑問詞，兩者都要改成直述句語序，不需要倒裝也不用 do / does：She asked where I lived.。命令句用 tell / ask + 人 + (not) to + 原形動詞：He told me not to be late.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 保留疑問句語序：He asked me where do I live. 應改成 where I lived。2. 保留問號：She asked if I was tired? 應改成句號。3. 忘記退時態：She said she is tired（過去轉述）通常應改成 was tired。4. tell 忘了接人：He told that he was ill. 應改成 He said that he was ill. 或 He told me that he was ill.。"},"table":{"t":"時態退位一覽","h":["直接引述","間接引述"],"r":[["現在簡單式 (work)","過去簡單式 (worked)"],["現在進行式 (is working)","過去進行式 (was working)"],["現在完成式 (has worked)","過去完成式 (had worked)"],["過去簡單式 (worked)","過去完成式 (had worked)"],["will / can / may","would / could / might"]]},"examples":[["\"I'm going to Japan,\" he said. → He said he was going to Japan.","他說他要去日本。"],["\"I have finished,\" she said. → She said she had finished.","她說她已經完成了。"],["\"I will help you,\" Tom said. → Tom said he would help me.","湯姆說他會幫我。"],["\"Where do you work?\" she asked. → She asked me where I worked.","她問我在哪裡工作。"],["\"Are you tired?\" he asked. → He asked me if I was tired.","他問我累不累。"],["\"Close the door,\" she said. → She told me to close the door.","她叫我把門關上。"],["\"Don't touch it,\" he said. → He told me not to touch it.","他叫我不要碰它。"],["\"I can swim,\" the boy said. → The boy said he could swim.","男孩說他會游泳。"]],"key":["轉述時態往後退一格；will → would、can → could。","疑問句改成直述句語序，Yes/No 問句用 if / whether。","命令句用 tell / ask + 人 + (not) to V。","now → then，tomorrow → the next day，yesterday → the day before。"],"basic":false,"ex":[{"q":"\"I like music,\" she said. → She said she ___ music.","o":["liked","likes","will like","has liked"],"a":"liked","e":"現在簡單式退為過去簡單式 liked。"},{"q":"\"Where are you going?\" he asked me. → He asked me where I ___ .","o":["am going","were going","was going","is going"],"a":"was going","e":"Wh- 問句改成直述語序，現在進行式退為過去進行式 was going。"},{"q":"\"Please wait here,\" he said to us. → He asked us ___ there.","o":["waiting","to wait","wait","that wait"],"a":"to wait","e":"請求句用 ask + 人 + to V。"},{"q":"\"I did it,\" Tom said. → Tom said he ___ it.","o":["did","does","has done","had done"],"a":"had done","e":"過去簡單式退為過去完成式 had done。"},{"q":"She said, 'I am tired.' → She said that she ___ tired.","o":["is","were","was","will be"],"a":"was","e":"間接引述時態往後退一格，am 變 was。"},{"q":"He asked me, 'Where do you live?' → He asked me where I ___ .","o":["do I live","I lived","am living","lived"],"a":"lived","e":"Wh- 問句改成直述句語序，且現在簡單式退為過去簡單式 lived。"},{"q":"'Do you like coffee?' she asked. → She asked me ___ I liked coffee.","o":["if","that","what","which"],"a":"if","e":"Yes/No 問句的間接引述用 if 或 whether。"},{"q":"'I will call you tomorrow,' he said. → He said he ___ call me the next day.","o":["will","would","did","has"],"a":"would","e":"will 往後退一格變 would，tomorrow 變 the next day。"},{"q":"'Don't touch it!' she said to him. → She told him ___ touch it.","o":["don't","not to","no to","didn't"],"a":"not to","e":"否定命令的間接引述用 tell + 人 + not to + 原形動詞。"},{"q":"'Open the window,' the teacher said. → The teacher told us ___ the window.","o":["opening","open","to open","that open"],"a":"to open","e":"命令句的間接引述用 tell + 人 + to + 原形動詞。"}]},{"id":"m10","icon":"🔤","zh":"動名詞與不定詞","intro":"兩個動詞連在一起時，第二個動詞要用 V-ing（動名詞）或 to + 原形（不定詞），取決於前面的動詞。要靠記憶，考試常出現。","steps":[{"h":"第一步：為什麼有的接 V-ing，有的接 to V","p":"英文中兩個動詞連在一起時，第二個動詞不能直接使用原形（除了助動詞和少數動詞之後），要改成 V-ing（動名詞）或 to V（不定詞）。選哪一個，取決於前面的動詞，沒有簡單的通用規則，必須以「動詞群組」記憶。"},{"h":"第二步：只接動名詞的動詞","p":"enjoy, avoid, finish, mind, keep, practice, suggest, consider, admit, deny, miss, give up, put off 後面只能接 V-ing。例如 I enjoy swimming. / Would you mind opening the window? / He gave up smoking.。"},{"h":"第三步：只接不定詞的動詞","p":"decide, hope, plan, want, need, agree, refuse, promise, learn, manage, afford, expect, wish, pretend 後面接 to V。例如 She decided to study abroad. / We can't afford to buy a house.。"},{"h":"第四步：兩者皆可但意思不同","p":"stop + V-ing 是「停止做某事」，stop + to V 是「停下來去做某事」。remember / forget + to V 是「記得／忘了要去做」，+ V-ing 是「記得／忘了曾經做過」。try + to V 是「努力嘗試」，try + V-ing 是「試試看」。love, like, hate, start, begin, continue 後面兩者皆可，意思差不多。另外，介系詞後面只能用 V-ing，例如 look forward to meeting、be good at swimming、without saying。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. I look forward to see you. 應改成 look forward to seeing you（to 是介系詞）。2. I enjoy to swim. 應改成 I enjoy swimming.。3. She suggested to go. 應改成 She suggested going.。4. I'm interested in learn English. 應改成 in learning English。5. I'm used to get up early. 應改成 used to getting up early。"},"table":{"t":"動詞後接什麼","h":["接法","常見動詞"],"r":[["V-ing","enjoy, avoid, finish, mind, keep, practice, suggest, consider, miss"],["to V","decide, hope, plan, want, need, agree, refuse, promise, learn, afford"],["兩者皆可（意思相同）","like, love, hate, start, begin, continue"],["兩者皆可（意思不同）","stop, remember, forget, try, regret"]]},"examples":[["She avoids eating late at night.","她避免在深夜吃東西。"],["We hope to see you again.","我們希望再見到你。"],["He stopped smoking last year.","他去年戒菸了。"],["He stopped to answer the phone.","他停下來接電話。"],["I remember locking the door.","我記得我鎖過門了。"],["Remember to lock the door.","記得要鎖門。"],["Thank you for helping me.","謝謝你幫我。"],["It's no use crying over spilt milk.","哭也沒用，覆水難收。"]],"key":["enjoy, avoid, finish, mind, suggest + V-ing。","decide, hope, plan, want, need, agree + to V。","stop / remember / forget / try：V-ing 與 to V 意思不同。","介系詞（包括 look forward to）後面接 V-ing。"],"basic":false,"ex":[{"q":"She finished ___ her homework at nine.","o":["doing","to do","do","done"],"a":"doing","e":"finish 後面接動名詞。"},{"q":"We planned ___ to Kyoto in spring.","o":["going","go","went","to go"],"a":"to go","e":"plan 後面接不定詞。"},{"q":"I'm not good at ___ in public.","o":["speak","speaking","to speak","spoke"],"a":"speaking","e":"good at 的 at 是介系詞，後面接 V-ing。"},{"q":"He tried ___ the window, but it was too heavy.","o":["opening","open","opened","to open"],"a":"to open","e":"try to V 表示努力嘗試，因為太重所以沒成功。"},{"q":"I enjoy ___ to music.","o":["to listen","listen","listening","listened"],"a":"listening","e":"enjoy 後面接動名詞，所以用 listening。"},{"q":"She decided ___ a new job.","o":["to find","finding","find","found"],"a":"to find","e":"decide 後面接不定詞，所以用 to find。"},{"q":"He avoided ___ the question.","o":["to answer","answering","answer","answered"],"a":"answering","e":"avoid 後面接動名詞，所以用 answering。"},{"q":"We hope ___ you soon.","o":["seeing","see","saw","to see"],"a":"to see","e":"hope 後面接不定詞，所以用 to see。"},{"q":"Would you mind ___ the window?","o":["opening","to open","open","opened"],"a":"opening","e":"mind 後面接動名詞，所以用 opening。"},{"q":"I forgot ___ the door, so someone came in.","o":["locking","lock","to lock","locked"],"a":"to lock","e":"forget to V 表示「忘了要做」，所以門沒鎖，用 to lock。"}]},{"id":"m11","icon":"🚦","zh":"情態助動詞：推測與義務","intro":"情態助動詞 (must, can't, might, should, have to ...) 加上原形動詞，表示推測的把握程度，或義務、建議、許可。","steps":[{"h":"第一步：情態助動詞的共同特徵","p":"can, could, may, might, must, should, will, would 等情態助動詞有三個共同特點：一，後面一定接原形動詞；二，不隨主詞變化 (he can，不是 he cans)；三，否定加 not，問句移到主詞前。它們表達說話者對事情的態度：能力、許可、義務、推測、建議。"},{"h":"第二步：推測的把握程度","p":"對「現在」的推測，把握由高到低：must be（幾乎確定，一定是）> should be（應該是）> may / might / could be（有可能）> can't be（不可能是）。這一組推測主要是依據證據。例如 He has been working all day. He must be tired.。"},{"h":"第三步：義務、建議與許可","p":"must（說話者認為必須）、have to（外在規定）、should / ought to（應該，建議）、mustn't（禁止）、don't have to / needn't（不必）。注意 mustn't 和 don't have to 完全不同：You mustn't smoke here.（不可以）與 You don't have to come.（不必來）。"},{"h":"第四步：對過去的推測","p":"情態助動詞 + have + 過去分詞，用來推測或評論過去：must have + p.p.（一定已經…），can't have + p.p.（不可能…過），might have + p.p.（可能…過），should have + p.p.（早該…卻沒有）。例如 The road is wet. It must have rained last night.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. He can swims. 應改成 He can swim.。2. She musts go. 應改成 She must go.。3. must not 與 don't have to 搞混。4. 用 can 推測肯定：It can be true 較好的說法為 It might be true，而「不可能」用 can't be。5. I should went 應改成 I should have gone。"},"table":{"t":"情態助動詞速查","h":["意思","情態助動詞","例句"],"r":[["能力","can / could","She can play the violin."],["許可","can / may","May I come in?"],["義務","must / have to","You must wear a helmet."],["禁止","mustn't","You mustn't park here."],["不必","don't have to","You don't have to pay."],["建議","should / ought to","You should rest."],["推測","must / may / might / can't","He must be at home."],["過去推測","must have / might have / can't have","She must have left."]]},"examples":[["You must be joking!","你一定是在開玩笑！"],["That can't be true.","那不可能是真的。"],["It might snow this weekend.","這個週末可能會下雪。"],["You should see a doctor about that cough.","你應該為咳嗽去看醫生。"],["Students must not use phones in class.","學生上課不可使用手機。"],["You don't have to wear a suit.","你不必穿西裝。"],["She must have forgotten our appointment.","她一定是忘了我們的約會。"],["I should have listened to your advice.","我早該聽你的建議。"]],"key":["情態助動詞 + 原形動詞，不隨人稱變化。","推測：must（幾乎確定）> may / might（可能）> can't（不可能）。","mustn't = 禁止；don't have to = 不必。","過去推測用 情態助動詞 + have + p.p.。"],"basic":false,"ex":[{"q":"He ___ be the manager. He is wearing a badge that says \"Manager\".","o":["must","can't","needn't","shouldn't"],"a":"must","e":"有證據（工作證上寫 Manager），肯定推測用 must。"},{"q":"You ___ open this letter. It is private.","o":["don't have to","needn't","mustn't","may"],"a":"mustn't","e":"私人信件不可以拆，禁止用 mustn't。"},{"q":"I lost my key. I ___ have dropped it on the bus.","o":["must","might","should","need"],"a":"might","e":"不確定的推測用 might have + p.p.。"},{"q":"You ___ be hungry already. You just had lunch!","o":["must","should","will","can't"],"a":"can't","e":"剛吃完午餐，不可能餓，用 can't be 否定推測。"},{"q":"You ___ wear a seat belt. It's the law.","o":["might","must","could","may"],"a":"must","e":"法律規定的義務，用 must（必須）。"},{"q":"He has been working all day. He ___ be tired.","o":["must","can't","needn't","shouldn't"],"a":"must","e":"根據事實（工作了一整天）做肯定的推測，用 must be。"},{"q":"That ___ be Tom. He's in Japan now.","o":["must","should","needn't","can't"],"a":"can't","e":"湯姆在日本，所以那個人不可能是他，用 can't be。"},{"q":"You ___ come with us if you don't want to.","o":["mustn't","can't","don't have to","must"],"a":"don't have to","e":"don't have to 表示「不必」，符合「如果你不想的話」。"},{"q":"You ___ smoke in the hospital.","o":["don't have to","mustn't","needn't","might not"],"a":"mustn't","e":"mustn't 表示禁止；在醫院抽菸是被禁止的。"},{"q":"Take an umbrella. It ___ rain later.","o":["must","should have","needn't","might"],"a":"might","e":"只是可能會下雨，把握不高，用 might。"}]},{"id":"m12","icon":"📊","zh":"比較級與最高級","intro":"比較兩者用比較級 (-er / more ...than)，三者以上用最高級 (the -est / the most)。等級比較用 as ... as。","steps":[{"h":"第一步：三個等級：原級、比較級、最高級","p":"形容詞和副詞有三個等級。原級用來說明或用 as…as 比較（tall）；比較級比較兩者（taller than）；最高級比較三者以上（the tallest）。中文用「比」「最」表示，英文則靠字尾變化或加 more / most。"},{"h":"第二步：怎麼變化","p":"單音節字加 -er / -est (tall, taller, tallest)；e 結尾只加 r / st (large, larger, largest)；子音加 y 去 y 加 ier / iest (easy, easier, easiest)；短母音加單子音要重複字母 (big, bigger, biggest)；兩音節以上的形容詞前面加 more / most (beautiful, more beautiful, most beautiful)。不規則要背：good / better / best，bad / worse / worst，far / farther / farthest，little / less / least。"},{"h":"第三步：句型","p":"比較級：A is taller than B. 強化比較級用 much, far, a lot, even（不能用 very）：This bag is much cheaper.。同等：A is as tall as B. / A is not as tall as B.。最高級要加 the，範圍用 in（地方、團體）或 of（一群人或物）：She is the tallest girl in our class.。倍數：This is twice as expensive as that.。"},{"h":"第四步：特殊句型","p":"「越…就越…」用 the + 比較級, the + 比較級：The more you read, the more you learn.。「越來越…」用比較級 and 比較級：It is getting colder and colder.。「其中之一」用 one of the + 最高級 + 複數名詞：Taipei is one of the biggest cities in Asia.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 雙重比較：more taller 應改成 taller；most tallest 應改成 tallest。2. 比較對象不一致：The weather in Taipei is hotter than Tokyo. 應改成 than that of Tokyo。3. 用 very 強化比較級：very better 應改成 much better。4. 忘了 the：He is best student 應改成 the best student。5. 最高級後接單數：one of the best student 應改成 students。"},"table":{"t":"比較級與最高級變化","h":["類型","原級","比較級","最高級"],"r":[["單音節","old","older","the oldest"],["e 結尾","nice","nicer","the nicest"],["子音 + y","busy","busier","the busiest"],["雙寫字母","hot","hotter","the hottest"],["多音節","interesting","more interesting","the most interesting"],["不規則","good","better","the best"]]},"examples":[["My brother is taller than my father.","我哥哥比我爸爸高。"],["This exam was much harder than the last one.","這次考試比上次難多了。"],["She speaks English as fluently as her teacher.","她說英文和她的老師一樣流利。"],["Mt. Jade is the highest mountain in Taiwan.","玉山是台灣最高的山。"],["The more you practice, the better you become.","你越練習，就變得越好。"],["It's getting hotter and hotter in summer.","夏天越來越熱。"],["She is one of the most talented singers in Asia.","她是亞洲最有才華的歌手之一。"],["This is the best movie I have ever seen.","這是我看過最棒的電影。"]],"key":["單音節加 -er / -est，多音節用 more / most。","比較兩者用 than，三者以上用 the + 最高級。","強化比較級用 much / far / a lot，不用 very。","the + 比較級, the + 比較級 = 越…就越…。"],"basic":false,"ex":[{"q":"This box is ___ than that one.","o":["heavier","more heavy","heaviest","heavyer"],"a":"heavier","e":"heavy 是子音加 y 結尾，比較級是 heavier。"},{"q":"She is ___ singer in our school.","o":["better","best","the best","the better"],"a":"the best","e":"三者以上用 the best。"},{"q":"This test is ___ easier than the last one.","o":["much","very","most","more"],"a":"much","e":"強化比較級用 much。"},{"q":"I don't run as ___ as my brother.","o":["faster","fastest","more fast","fast"],"a":"fast","e":"as…as 中間用原級 fast。"},{"q":"This bag is ___ than that one.","o":["more cheap","cheapest","cheaper","the cheaper"],"a":"cheaper","e":"cheap 是單音節形容詞，比較級加 -er：cheaper。"},{"q":"She is the ___ student in our class.","o":["smarter","smartest","most smart","more smartest"],"a":"smartest","e":"最高級前有 the，smart 是單音節，用 smartest。"},{"q":"This exam was ___ difficult than the last one.","o":["most","very","more","the more"],"a":"more","e":"difficult 是多音節，比較級用 more difficult than。"},{"q":"He runs as ___ as his brother.","o":["faster","fastest","more fast","fast"],"a":"fast","e":"as ... as 中間用形容詞或副詞原級 fast。"},{"q":"Taipei is one of the ___ cities in Asia.","o":["more crowded","most crowded","crowdedest","crowded"],"a":"most crowded","e":"one of the + 最高級 + 複數名詞，crowded 的最高級是 most crowded。"},{"q":"The ___ you study, the better grades you will get.","o":["harder","hard","hardest","more hard"],"a":"harder","e":"the + 比較級, the + 比較級：the harder ..., the better ...。"}]},{"id":"m13","icon":"💭","zh":"wish 與 if only","intro":"wish / if only 用來表達「與事實相反的願望或遺憾」。時態要往後退：現在的願望用過去式，過去的遺憾用過去完成式，對別人的抱怨或期待用 would。","steps":[{"h":"第一步：wish 表達「事實相反的願望」","p":"wish 用來說「希望…（但事實不是這樣）」，帶有遺憾或不滿。因為與事實相反，動詞時態要「往後退一格」：現在的遺憾用過去式，過去的遺憾用過去完成式。這和第二、第三條件句的思考方式一樣。"},{"h":"第二步：三種基本用法","p":"1. 與現在事實相反：wish + 過去簡單式。I wish I had a car.（事實：我沒有車）。2. 與過去事實相反：wish + had + p.p.。I wish I had studied harder.（事實：我以前沒有用功）。3. 希望某件事改變（多用來抱怨）：wish + would + 原形。I wish it would stop raining.。"},{"h":"第三步：were 與 could","p":"wish 之後的 be 動詞不論主詞是誰，正式寫法用 were：I wish I were taller.。現在的能力用 could：I wish I could fly.。過去可以做而沒有做的事，用 could have + p.p.：I wish I could have gone.。"},{"h":"第四步：if only 與 wish 的差別","p":"if only 比 wish 語氣更強烈，時態規則相同：If only I knew the answer!。如果是可能實現的願望，用 hope，不用 wish：I hope you will pass the exam.，因為參加考試的結果尚未確定，不是事實相反。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. I wish I have more money. 應改成 I wish I had more money.。2. I wish I was taller 在口語可以接受，但正式應為 were。3. 用 wish 說可能實現的願望：I wish you have a nice trip. 應改成 I hope you have a nice trip.（或 I wish you a nice trip.）。4. I wish I would be rich. 應改成 I wish I were rich.（描述自身狀態不用 would）。"},"table":{"t":"wish 的時態","h":["情況","wish 之後","例句"],"r":[["現在事實相反","過去簡單式 / were","I wish I lived near the sea."],["過去事實相反","had + p.p.","I wish I hadn't said that."],["希望改變","would + V","I wish he would call me."],["現在做不到","could + V","I wish I could speak French."]]},"examples":[["I wish I had more free time.","我希望我有更多空閒時間。"],["She wishes she lived closer to school.","她希望她住得離學校近一點。"],["I wish I were a little taller.","我希望我再高一點。"],["He wishes he hadn't lost the game.","他希望他沒有輸掉比賽。"],["I wish you would stop making so much noise.","我希望你不要製造那麼多噪音。"],["If only I could go with you!","要是我能和你去就好了！"],["I wish I could play the guitar.","我希望我會彈吉他。"],["We wish we had taken the earlier train.","我們希望當時搭了早一班火車。"]],"key":["wish + 過去式：與現在事實相反。","wish + had + p.p.：與過去事實相反。","wish + would：希望對方或事情改變。","可能實現的願望用 hope，不用 wish。"],"basic":false,"ex":[{"q":"I don't have a computer. I wish I ___ one.","o":["have","had","would have","having"],"a":"had","e":"現在沒有電腦，與事實相反，wish 之後用過去簡單式。"},{"q":"I failed the exam. I wish I ___ harder.","o":["studied","would study","had studied","study"],"a":"had studied","e":"對過去的遺憾，wish 之後用過去完成式。"},{"q":"It is too noisy. I wish the neighbors ___ quiet.","o":["would be","are","were being","be"],"a":"would be","e":"抱怨對方，希望其改變，用 wish + would。"},{"q":"I ___ you a happy birthday!","o":["hope that","would wish","am wishing","wish"],"a":"wish","e":"祝福別人用 I wish you...，後面直接接名詞。"},{"q":"I wish I ___ taller.","o":["am","will be","be","were"],"a":"were","e":"wish 表示與現在事實相反，be 動詞用 were。"},{"q":"I wish I ___ more free time.","o":["have","had","would have","having"],"a":"had","e":"現在的願望，wish 後面用過去簡單式 had。"},{"q":"If only I ___ the answer!","o":["know","will know","knew","knowing"],"a":"knew","e":"if only 表示與現在事實相反，用過去簡單式 knew。"},{"q":"I wish it ___ raining so we could go out.","o":["would stop","stop","stops","stopping"],"a":"would stop","e":"對現在不滿並期待改變，用 wish + would + 原形動詞。"},{"q":"She wishes she ___ a car, but she can't afford one.","o":["had","has","have","will have"],"a":"had","e":"現在沒有車的遺憾，wish 後用過去簡單式 had。"},{"q":"I wish I ___ to the party last night.","o":["went","go","had gone","would go"],"a":"had gone","e":"對過去事實的遺憾，wish 後面用過去完成式 had gone。"}]},{"id":"m14","icon":"🔗","zh":"連接詞與轉折詞","intro":"連接詞把句子接起來，表達因果、對比、條件、目的等關係。要注意詞性：連接詞後接子句，介系詞後接名詞，副詞則用在句子中間或前後並加逗號。","steps":[{"h":"第一步：連接詞是句子的橋樑","p":"連接詞把兩個詞、片語或句子連起來，並說明彼此的邏輯關係。GEPT 的段落填空常常考連接詞，要先讀懂前後句的關係：是原因、結果、轉折、條件、時間、目的，還是舉例。"},{"h":"第二步：對等連接詞與從屬連接詞","p":"對等連接詞 (and, but, or, so, for, yet) 連接兩個平等的部分。從屬連接詞 (because, although, if, when, while, unless, until, since) 引導的是附屬子句，不能單獨成為一個句子。例如 Although it rained, we went out.，Although it rained 不能單獨存在。"},{"h":"第三步：常見關係一覽","p":"原因：because, since, as。結果：so, therefore, as a result。轉折：but, although, though, however, whereas。條件：if, unless, as long as。時間：when, while, before, after, until, as soon as。目的：so that, in order to。舉例：for example, for instance。補充：moreover, in addition, besides。"},{"h":"第四步：連接詞與副詞的標點","p":"however, therefore, moreover 等是連接副詞，不是連接詞，所以不能單獨把兩個句子連起來，必須用句點或分號分開，並在後面加逗號：It was late; however, we kept working.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. Although it was cold, but we went out. 應刪除 but（although 與 but 不並用）。2. Because he was sick, so he stayed home. 應刪除 so。3. Despite it rained 應改成 Despite the rain 或 Although it rained。4. I was tired, however I kept working. 應改成 I was tired. However, I kept working.。"},"table":{"t":"連接詞的用法","h":["關係","連接詞（後接子句）","介系詞/片語（後接名詞或 V-ing）"],"r":[["原因","because, since, as","because of, due to"],["讓步","although, though, even though","despite, in spite of"],["時間","when, while, before, after","during, before, after"],["條件","if, unless","without, in case of"]]},"examples":[["I stayed home because I was ill.","我因為生病待在家。"],["Because of the rain, the game was cancelled.","因為下雨，比賽取消了。"],["Although he is young, he is very responsible.","雖然他年輕，卻很負責。"],["Despite the heavy traffic, we arrived on time.","儘管塞車，我們仍準時抵達。"],["She studied hard, so she passed the exam.","她用功讀書，所以通過了考試。"],["I like tea, whereas my sister prefers coffee.","我喜歡茶，而我妹妹比較喜歡咖啡。"],["Turn off the lights before you leave.","離開前請關燈。"],["He didn't come; however, he sent a gift.","他沒有來，但他送了禮物。"]],"key":["because / so、although / but 不能並用。","although + 子句，despite + 名詞或 V-ing。","however, therefore 是副詞，前面用句點或分號，後面加逗號。","先判斷前後句的邏輯關係，再選連接詞。"],"basic":false,"ex":[{"q":"___ he was tired, he went to the party.","o":["Because","So","If","Although"],"a":"Although","e":"前後語意對比（累了卻去派對），用 Although。"},{"q":"He missed the train ___ he got up late.","o":["although","because","unless","so that"],"a":"because","e":"睡過頭是錯過火車的原因，用 because。"},{"q":"___ his poor health, he continued to work.","o":["Although","Despite","Because","Since"],"a":"Despite","e":"his poor health 是名詞片語，前面用介系詞 Despite。"},{"q":"You will be late ___ you leave now.","o":["if","because","unless","although"],"a":"unless","e":"「除非現在出發，否則會遲到」，用 unless。"},{"q":"___ it was raining, we went out.","o":["Although","Because","So","But"],"a":"Although","e":"前後語意相反（下雨卻出門），用 Although；Because 和 So 是因果，But 不能放在句首連接這句。"},{"q":"He was tired, ___ he kept working.","o":["because","so","unless","but"],"a":"but","e":"前後語意轉折（累了卻繼續工作），用 but。"},{"q":"I missed the bus, ___ I was late.","o":["unless","but","so","although"],"a":"so","e":"前面是原因，後面是結果，用 so。"},{"q":"She stayed home ___ she was sick.","o":["because","so","but","although"],"a":"because","e":"生病是留在家的原因，用 because。"},{"q":"___ the heavy traffic, we arrived on time.","o":["Although","Despite","Because","However"],"a":"Despite","e":"the heavy traffic 是名詞片語，前面用介系詞 Despite。"},{"q":"I like tea. ___, my sister prefers coffee.","o":["Because","Although","Unless","However"],"a":"However","e":"前後語意對比，句首副詞用 However 並加逗號。"}]},{"id":"m15","icon":"🤝","zh":"主詞與動詞一致","intro":"動詞的單複數要與主詞一致。找出真正的主詞（不是靠近動詞的那個名詞），再判斷單數或複數。","steps":[{"h":"第一步：主詞決定動詞","p":"英文的動詞必須和主詞在「數」上一致：單數主詞搭配單數動詞 (is, has, goes)，複數主詞搭配複數動詞 (are, have, go)。中文沒有這種變化，所以是台灣學習者最容易出錯的地方之一。關鍵是找出真正的主詞。"},{"h":"第二步：修飾語不影響主詞","p":"主詞和動詞之間如果有介系詞片語或關係子句，動詞仍然要跟主詞一致，不是跟靠近的名詞一致。The box of chocolates is on the table.（主詞是 box）。The students who study hard get good grades.（主詞是 students）。"},{"h":"第三步：常見的單數與複數主詞","p":"視為單數：each, every, everyone, someone, nobody, 不可數名詞 (news, information, advice)，學科名 (mathematics, physics)，the number of，距離、金額、時間的整體 (Ten dollars is enough.)。視為複數：a number of, both, many, few, the police, people。A and B 用複數，但 A and B 若是同一個人或物則單數：Bread and butter is my breakfast.。"},{"h":"第四步：就近一致與 there be","p":"either…or, neither…nor, not only…but also 連接兩個主詞時，動詞與靠近的那個主詞一致：Neither he nor I am ready.。there is / there are 也是同樣道理，動詞與後面的第一個名詞一致：There is a book and two pens on the desk.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. Everyone are here. 應改成 Everyone is here.。2. The news are good. 應改成 The news is good.。3. A number of student is 應改成 A number of students are。4. One of my friends are 應改成 One of my friends is（主詞是 one）。5. The list of names are 應改成 The list of names is。"},"table":{"t":"單數與複數主詞","h":["視為單數","視為複數"],"r":[["each, every, everyone, nobody","both, many, few, several"],["news, information, advice, homework","police, people, cattle"],["mathematics, physics, economics","scissors, glasses, trousers"],["the number of + 複數","a number of + 複數"]]},"examples":[["Every student has a locker.","每位學生都有一個置物櫃。"],["The news about the accident is shocking.","關於這起意外的新聞令人震驚。"],["A number of guests were late.","有些客人遲到了。"],["The number of tourists is growing.","遊客的數量正在增加。"],["Neither my parents nor my brother likes spicy food.","我的父母和哥哥都不喜歡吃辣。"],["The teacher, along with his students, is going to the museum.","老師和他的學生要去博物館。"],["There are three books on the desk.","桌上有三本書。"],["Ten kilometers is a long way to walk.","十公里是很長的一段路程。"]],"key":["先找真正的主詞，再決定動詞單複數。","介系詞片語、關係子句不影響動詞的單複數。","each / every / everyone / news / 學科名稱 視為單數。","neither…nor、either…or 動詞與靠近的主詞一致。"],"basic":false,"ex":[{"q":"Each of the boys ___ a bike.","o":["have","has","are having","having"],"a":"has","e":"each of 視為單數，動詞用 has。"},{"q":"The information you gave me ___ very useful.","o":["was","were","are","have been"],"a":"was","e":"information 是不可數名詞，視為單數，且題意為過去，用 was。"},{"q":"The police ___ investigating the case.","o":["is","has","was","are"],"a":"are","e":"police 視為複數，動詞用 are。"},{"q":"Neither Tom nor his parents ___ at home.","o":["is","was","are","has been"],"a":"are","e":"就近一致，靠近動詞的是複數 his parents，用 are。"},{"q":"Each of the students ___ a book.","o":["have","has","are having","having"],"a":"has","e":"each 視為單數，動詞用 has。"},{"q":"The news ___ good.","o":["is","are","were","be"],"a":"is","e":"news 是不可數名詞，視為單數，用 is。"},{"q":"Neither Tom nor his friends ___ here.","o":["is","am","are","was"],"a":"are","e":"neither...nor 就近一致，較近的 his friends 是複數，用 are。"},{"q":"A number of people ___ waiting outside.","o":["is","has been","was","are"],"a":"are","e":"a number of 意思是「許多」，後接複數名詞，動詞用複數 are。"},{"q":"The number of students ___ increasing.","o":["are","were","have been","is"],"a":"is","e":"the number of 是「…的數目」，主詞是 number（單數），用 is。"},{"q":"Mathematics ___ my favorite subject.","o":["are","is","were","have"],"a":"is","e":"學科名稱視為單數，用 is。"}]},{"id":"m16","icon":"🧩","zh":"分詞：-ing 與 -ed","intro":"現在分詞 (V-ing) 表示「主動、進行」或「令人…」；過去分詞 (V-ed / p.p.) 表示「被動、完成」或「感到…」。分詞可以當形容詞，也可以組成分詞構句。","steps":[{"h":"第一步：分詞有兩種：-ing 與 -ed","p":"現在分詞 (V-ing) 帶有「主動」或「進行」的意思，過去分詞 (p.p.，多為 -ed) 帶有「被動」或「完成」的意思。分詞可以當形容詞修飾名詞、當補語，也可以組成分詞構句取代連接詞與主詞。"},{"h":"第二步：-ing 與 -ed 形容詞","p":"描述人的感受用 -ed（感到…的），描述引起感受的事物用 -ing（令人…的）：The movie was boring, so I was bored.。常見成對：interesting / interested, exciting / excited, surprising / surprised, tiring / tired, confusing / confused。"},{"h":"第三步：分詞修飾名詞","p":"分詞放在名詞前面（a sleeping baby 睡著的嬰兒、a broken window 破掉的窗戶），單獨的分詞放前面，帶有其他成分的分詞片語放後面：The girl sitting on the bench is my sister.（= who is sitting）。The window broken by the boy was expensive.（= which was broken）。"},{"h":"第四步：分詞構句","p":"兩個子句主詞相同時，可以省略連接詞與主詞，把動詞改成分詞：Because she felt tired, she went to bed early. → Feeling tired, she went to bed early.。若語意是被動，用過去分詞：Given more time, I could do better.（= If I were given more time）。分詞的意義主詞必須與主要子句的主詞相同，否則會變成「懸垂分詞」的錯誤。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. I am boring. 想說「我很無聊」應為 I am bored.；I am boring 是「我這個人很無聊」。2. The book is very interested. 應改成 interesting。3. Walking on the street, a car hit me. 應改成 Walking on the street, I was hit by a car.（分詞的主詞必須是 I）。4. Speaking of the tall man 是慣用語，可用。"},"table":{"t":"現在分詞與過去分詞","h":["形式","意義","例句"],"r":[["V-ing","主動、進行、令人…","an exciting game / a running boy"],["p.p. (V-ed)","被動、完成、感到…","an excited fan / a broken cup"]]},"examples":[["The lecture was so boring that many students fell asleep.","這場演講太無聊，許多學生睡著了。"],["I was surprised to see him there.","在那裡看到他我很驚訝。"],["The girl playing the piano is my cousin.","正在彈鋼琴的女孩是我表妹。"],["The car parked outside belongs to my boss.","停在外面的車是我老闆的。"],["Not knowing what to say, he kept silent.","不知道說什麼，他保持沉默。"],["Written in simple English, the book is easy to read.","這本書用簡單的英文寫成，很容易讀。"],["She sat there, waiting for the bus.","她坐在那裡等公車。"],["Exhausted after work, he fell asleep at once.","工作後精疲力盡，他立刻睡著了。"]],"key":["-ing：主動、進行、令人…；-ed：被動、完成、感到…。","人感到…用 -ed，事物令人…用 -ing。","分詞構句的意義主詞必須與主要子句主詞相同。","被動的分詞構句用過去分詞。"],"basic":false,"ex":[{"q":"The exam results were ___ .","o":["disappointing","disappointed","disappoint","disappoints"],"a":"disappointing","e":"results 是事物，令人失望，用 -ing 形容詞。"},{"q":"The students were ___ by the long speech.","o":["boring","bore","bored","bores"],"a":"bored","e":"人被無聊到，用 -ed 形容詞 bored。"},{"q":"___ in 1920, the hotel is still popular today.","o":["Building","Build","Having build","Built"],"a":"Built","e":"旅館是被建造的，被動用過去分詞 Built。"},{"q":"___ the road, I saw an old friend.","o":["Crossing","Crossed","Cross","To crossed"],"a":"Crossing","e":"「我」主動過馬路，用現在分詞 Crossing。"},{"q":"The movie was ___ .","o":["bored","boring","bore","bores"],"a":"boring","e":"電影是「令人無聊的」，事物用 -ing 形容詞 boring。"},{"q":"I was ___ by the news.","o":["shocking","shock","shocked","shocks"],"a":"shocked","e":"人「感到震驚」用 -ed 形容詞 shocked。"},{"q":"The girl ___ on the bench is my sister.","o":["sat","sits","sitting","sit"],"a":"sitting","e":"女孩正在坐著，主動含意，用現在分詞 sitting 修飾。"},{"q":"The window ___ by the boy was expensive.","o":["breaking","broken","broke","breaks"],"a":"broken","e":"窗戶是被打破的，被動含意，用過去分詞 broken。"},{"q":"___ tired, she went to bed early.","o":["Feeling","Felt","Feel","To feel"],"a":"Feeling","e":"分詞構句，主詞 she 是主動，用現在分詞 Feeling。"},{"q":"I have an ___ story to tell you.","o":["interested","interest","interests","interesting"],"a":"interesting","e":"故事是「有趣的」，事物用 -ing 形容詞 interesting，且 an 後接母音開頭。"}]},{"id":"m17","icon":"🔠","zh":"詞類總覽","intro":"","steps":[{"h":"第一步：八大詞類是句子的「零件」","p":"英文單字依功能分成八大詞類：名詞 (noun) 說人事物，代名詞 (pronoun) 代替名詞，動詞 (verb) 說動作或狀態，形容詞 (adjective) 修飾名詞，副詞 (adverb) 修飾動詞、形容詞或整句，介系詞 (preposition) 表示位置與關係，連接詞 (conjunction) 連接句子，感嘆詞 (interjection) 表達情緒。GEPT 的詞彙文法題常常考「這個空格需要哪一種詞類」，所以先判斷詞性，再選字，是最有效率的解題方式。"},{"h":"第二步：用位置判斷詞性","p":"在 a / an / the / my / this 之後，通常是名詞或「形容詞 + 名詞」；在 be 動詞或 seem, look, become 之後，可能是形容詞（She is happy.）或名詞（She is a teacher.）；在動詞後面修飾動詞的，通常是副詞（He runs quickly.）；在 very, so, too, quite 之後，要接形容詞或副詞（very beautiful, very quickly）。"},{"h":"第三步：同一個字根，不同詞類","p":"很多字根可以變成不同詞類，字尾是重要線索。名詞字尾：-tion, -ment, -ness, -ity, -er, -ist, -ance；形容詞字尾：-ful, -less, -ous, -able, -ive, -al, -ic, -y；副詞字尾：-ly；動詞字尾：-ize, -en, -ify。例如 decide（動詞）、decision（名詞）、decisive（形容詞）、decisively（副詞）。"},{"h":"第四步：名詞、形容詞、副詞的辨別","p":"形容詞修飾名詞：a careful driver。副詞修飾動詞：He drives carefully.。注意有些副詞和形容詞同形：fast, hard, late, early。例如 He works hard.（hard 是副詞，努力地）；hardly 意思是「幾乎不」，完全不同。同樣 late 是「晚」，lately 是「最近」。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 用形容詞修飾動詞：He speaks English good. 應改成 well。2. 用名詞代替形容詞：It is a danger place. 應改成 dangerous。3. 副詞放錯位置：She very likes music. 應改成 She likes music very much.。4. 混淆 -ed / -ing、-ful / -less：hopeful（有希望的）與 hopeless（絕望的）。"},"table":{"t":"常見詞類字尾","h":["詞類","常見字尾","例子"],"r":[["名詞","-tion, -ment, -ness, -ity, -er","education, development, kindness"],["形容詞","-ful, -less, -ous, -able, -al","useful, careless, famous"],["副詞","-ly","quickly, carefully"],["動詞","-ize, -en, -ify","modernize, widen, simplify"]]},"examples":[["She is a careful driver.","她是個小心的駕駛。"],["She drives carefully.","她開車很小心。"],["His decision surprised everyone.","他的決定讓每個人都很驚訝。"],["It was a difficult decision to make.","這是個很難做的決定。"],["He works hard and rarely complains.","他工作努力，很少抱怨。"],["I can hardly believe it.","我幾乎不敢相信。"],["The teacher explained the rule clearly.","老師清楚地解釋了規則。"],["A healthy diet helps you stay healthy.","健康的飲食幫助你保持健康。"]],"key":["先判斷空格需要名詞、動詞、形容詞還是副詞。","形容詞修飾名詞，副詞修飾動詞、形容詞、副詞。","利用字尾判斷詞性：-tion 名詞、-ful 形容詞、-ly 副詞。","hard / hardly、late / lately 意思不同。"],"basic":false,"ex":[{"q":"She sings very ___ .","o":["beautiful","beauty","beautifully","beautify"],"a":"beautifully","e":"修飾動詞 sings 要用副詞 beautifully。"},{"q":"His ___ surprised all of us.","o":["decide","decision","decisive","decisively"],"a":"decision","e":"his 之後、動詞 surprised 之前需要名詞當主詞，用 decision。"},{"q":"It is a ___ city.","o":["dangerous","danger","dangerously","endanger"],"a":"dangerous","e":"a 與名詞 city 之間需要形容詞 dangerous。"},{"q":"He worked ___ to pass the exam.","o":["hardly","harder than","hardy","hard"],"a":"hard","e":"work hard 是「努力工作」，hard 在此是副詞。"},{"q":"The weather has been very cold ___ .","o":["late","lately","latest","lateness"],"a":"lately","e":"lately 是副詞，意思是「最近」。"},{"q":"The ___ of the bridge took three years.","o":["construct","constructive","construction","constructively"],"a":"construction","e":"The 之後需要名詞，construction 是「建造」。"},{"q":"This medicine is very ___ for colds.","o":["useful","use","usefully","user"],"a":"useful","e":"be 動詞之後需要形容詞 useful。"},{"q":"Please drive ___ in the rain.","o":["careful","care","carefulness","carefully"],"a":"carefully","e":"修飾動詞 drive 要用副詞。"}]},{"id":"m18","icon":"🏗️","zh":"五大基本句型","intro":"","steps":[{"h":"第一步：英文句子有五種基本骨架","p":"所有英文句子都建立在五種基本句型上，看懂它們，就能拆解長句，也能避免寫出結構不完整的句子。五大句型是：SV（主詞 + 動詞）、SVC（主詞 + 動詞 + 補語）、SVO（主詞 + 動詞 + 受詞）、SVOO（主詞 + 動詞 + 間接受詞 + 直接受詞）、SVOC（主詞 + 動詞 + 受詞 + 受詞補語）。"},{"h":"第二步：SV 與 SVC","p":"SV 句型的動詞不需要受詞，稱為不及物動詞：The sun rises. / Birds fly.。SVC 的動詞是連綴動詞 (be, become, seem, look, sound, feel, taste, smell, get)，後面接補語，說明主詞的狀態：She looks tired. / The soup tastes good.。注意連綴動詞之後要用形容詞，不用副詞：It sounds great，不是 sounds greatly。"},{"h":"第三步：SVO 與 SVOO","p":"SVO 的動詞是及物動詞，後面直接接受詞：I love music.。SVOO 的動詞有 give, send, show, tell, teach, buy, lend 等，可以接兩個受詞：She gave me a gift. 也可以改成 SVO + to / for 的形式：She gave a gift to me. / He bought a book for me.。to 用於 give, send, show, tell, lend；for 用於 buy, make, cook, find。"},{"h":"第四步：SVOC","p":"SVOC 的受詞補語說明受詞的狀態或動作：They elected him president. / The news made her happy. / I found the movie boring. / She heard him sing.。常見動詞：make, keep, find, call, consider, let, have, see, hear。中文很容易把「令我很開心」直接翻成 It makes me happily，其實補語要用形容詞：makes me happy。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 缺少動詞：She very kind. 應改成 She is very kind.。2. 及物動詞沒有受詞：I like. 需要 I like it.。3. 連綴動詞後用副詞：It smells well 應改成 It smells good。4. 兩個受詞的順序或介系詞錯誤：He gave to me a book 應改成 He gave me a book / He gave a book to me。5. explain, suggest, describe 不能直接接「人 + 事」的雙受詞：He explained me the rule 應改成 He explained the rule to me。"},"table":{"t":"五大句型","h":["句型","結構","例句"],"r":[["SV","主詞 + 動詞","Birds sing."],["SVC","主詞 + 連綴動詞 + 補語","The cake tastes sweet."],["SVO","主詞 + 動詞 + 受詞","She reads books."],["SVOO","主詞 + 動詞 + 間接受詞 + 直接受詞","He sent me a card."],["SVOC","主詞 + 動詞 + 受詞 + 補語","We call him Tom."]]},"examples":[["The baby smiled.","寶寶笑了。"],["The soup smells delicious.","這碗湯聞起來很香。"],["He became a doctor.","他成了醫生。"],["She wrote a letter to her friend.","她寫了一封信給她的朋友。"],["My uncle bought me a new bicycle.","我叔叔買了一輛新腳踏車給我。"],["The noise made the baby cry.","噪音讓寶寶哭了。"],["I found the exam difficult.","我覺得這場考試很難。"],["We elected her class leader.","我們選她當班長。"]],"key":["五大句型：SV、SVC、SVO、SVOO、SVOC。","連綴動詞 (be, look, feel, sound, taste, become) 之後接形容詞。","give, send, show 用 to；buy, make, cook 用 for。","explain, suggest 不能直接接人當受詞。"],"basic":false,"ex":[{"q":"The cake tastes ___ .","o":["sweetly","sweetness","sweet","sweeten"],"a":"sweet","e":"taste 是連綴動詞，後面接形容詞 sweet。"},{"q":"She gave ___ a beautiful scarf.","o":["to me","for me","I","me"],"a":"me","e":"give 可接雙受詞，me 是間接受詞，直接放在 gave 之後。"},{"q":"He bought a gift ___ his mother.","o":["for","to","at","with"],"a":"for","e":"buy 的間接受詞前面用 for。"},{"q":"The news made her ___ .","o":["happily","happy","happiness","to happy"],"a":"happy","e":"make + 受詞 + 形容詞，表示「使她快樂」。"},{"q":"The teacher explained the rule ___ us.","o":["to","for","at","by"],"a":"to","e":"explain 不能接雙受詞，人的前面用 to。"},{"q":"I heard the baby ___ in the next room.","o":["to cry","cried","cries","cry"],"a":"cry","e":"hear + 受詞 + 原形動詞，表示聽見寶寶哭。"},{"q":"The noise kept me ___ all night.","o":["awaken","awakely","awake","to awake"],"a":"awake","e":"keep + 受詞 + 形容詞，表示「使我保持清醒」。"},{"q":"They named their dog ___ .","o":["to Lucky","Lucky","as Lucky","for Lucky"],"a":"Lucky","e":"name + 受詞 + 名字（受詞補語）。"}]},{"id":"m19","icon":"📦","zh":"可數與不可數名詞","intro":"","steps":[{"h":"第一步：可數與不可數是英文的重要概念","p":"中文說「三本書」「一杯水」都要有量詞，英文也有類似的區分：可數名詞 (book, student, idea) 可以數，有單數與複數；不可數名詞 (water, rice, information, advice, furniture) 不能直接數，沒有複數形，前面不能加 a / an，也不能直接加數字。中文學習者最容易出錯的，就是把 information, advice, homework, furniture 當成可數。"},{"h":"第二步：可數名詞的複數規則","p":"一般加 s (book, books)；s, x, ch, sh 結尾加 es (box, boxes)；子音加 y 去 y 加 ies (city, cities)；f / fe 結尾多數變 ves (leaf, leaves; knife, knives)；o 結尾有些加 es (tomato, tomatoes; potato, potatoes)，也有加 s 的 (photo, photos; piano, pianos)。不規則變化必須記憶：man / men，woman / women，child / children，foot / feet，tooth / teeth，mouse / mice，person / people。有些單複數同形：sheep, fish, deer。"},{"h":"第三步：不可數名詞怎麼「數」","p":"不可數名詞要用量詞片語來數：a glass of water, two pieces of advice, a loaf of bread, a bottle of milk, a piece of furniture, a bowl of rice, a cup of tea, a pair of shoes。修飾不可數名詞用 much, a little, some，修飾可數複數用 many, a few, several。"},{"h":"第四步：容易混淆的名詞","p":"以下名詞是不可數：advice, information, news, homework, furniture, luggage, equipment, traffic, weather, knowledge, progress, money。它們沒有複數，動詞用單數。有些名詞兩用，意思不同：paper（紙）／a paper（報紙、論文），glass（玻璃）／a glass（玻璃杯），time（時間）／three times（三次），experience（經驗）／an experience（一次經歷）。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. informations, advices, furnitures, homeworks 都是錯的。2. Give me some advices. 應改成 some advice。3. I have a homework. 應改成 I have some homework. 或 a piece of homework。4. peoples 通常不加 s（people 已是複數；peoples 是「民族」）。5. many money 應改成 much money。"},"table":{"t":"可數與不可數","h":["類型","可搭配","例子"],"r":[["可數單數","a / an, one, each","a book, one idea"],["可數複數","many, a few, several, two","many books"],["不可數","much, a little, some, a piece of","much water, some advice"]]},"examples":[["I need some information about the trip.","我需要一些關於旅行的資訊。"],["She gave me a piece of good advice.","她給了我一個很好的建議。"],["There are many children in the park.","公園裡有很多孩子。"],["He drank two glasses of water.","他喝了兩杯水。"],["The news is very interesting.","這個消息很有趣。"],["We bought some new furniture for the living room.","我們為客廳買了一些新家具。"],["How much luggage do you have?","你有多少行李？"],["Wolves are wild animals.","狼是野生動物。"]],"key":["information, advice, homework, furniture, luggage, news 不可數。","不可數名詞用 a piece of / a cup of 等量詞來數。","much 修飾不可數，many 修飾可數複數。","注意不規則複數：man / men、child / children、person / people。"],"basic":false,"ex":[{"q":"Could you give me some ___ about hotels?","o":["informations","an information","informing","information"],"a":"information","e":"information 是不可數名詞，沒有複數。"},{"q":"There are three ___ in the room.","o":["women","womans","womens","woman"],"a":"women","e":"woman 的複數是 women，three 之後要複數。"},{"q":"I don't have ___ money.","o":["many","a few","much","several"],"a":"much","e":"money 是不可數名詞，否定句用 much。"},{"q":"Would you like a ___ of tea?","o":["piece","cup","pair","group"],"a":"cup","e":"tea 用 cup 來數，a cup of tea。"},{"q":"The ___ are playing in the garden.","o":["children","childs","childrens","child"],"a":"children","e":"child 的複數是 children。"},{"q":"He gave me two ___ of advice.","o":["piece","pairs","advices","pieces"],"a":"pieces","e":"advice 不可數，要用量詞來數：two pieces of advice。"},{"q":"She bought a new pair of ___ .","o":["shoe","shoing","shoes","shoes'"],"a":"shoes","e":"a pair of 之後接複數名詞 shoes。"},{"q":"Most ___ in this city are friendly.","o":["peoples","people","person","a people"],"a":"people","e":"people 是複數名詞，不加 s。"}]},{"id":"m20","icon":"📰","zh":"冠詞 a / an / the","intro":"","steps":[{"h":"第一步：冠詞 a / an / the 的基本角色","p":"冠詞放在名詞前面，說明名詞是「不特定的」還是「特定的」。中文沒有冠詞，所以這是台灣學習者最難掌握的項目之一。不過只要用三個問題逐步判斷，就能大幅降低錯誤：一、這個名詞可數嗎？二、說話的雙方知道是哪一個嗎？三、是泛指還是特指？"},{"h":"第二步：a / an：第一次提到，或泛指「一個」","p":"a / an 只用在可數單數名詞前，表示「一個」，並且是第一次提到或不特定：I saw a dog in the park.。a 用在子音「發音」前 (a book, a university)，an 用在母音「發音」前 (an apple, an hour)。注意看發音，不是看拼字。"},{"h":"第三步：the：雙方都知道是哪一個","p":"the 用在「特定的」名詞前：一，前面提過 (I saw a dog. The dog was big.)；二，說話者與聽者都知道 (Please close the door.)；三，世界上獨一無二的東西 (the sun, the moon, the Earth)；四，最高級與序數 (the best, the first)；五，樂器 (play the piano)；六，方位與部分地理名稱 (the north, the Pacific Ocean, the United States)。"},{"h":"第四步：零冠詞（不加冠詞）","p":"複數名詞或不可數名詞「泛指」時不加冠詞：Dogs are friendly. / Water is important.。三餐、運動、球類、多數語言不加冠詞：have breakfast, play basketball, speak English。抽象概念與表示身分的地點也常省略：go to school（去上學）、go to bed（睡覺）；但 go to the school 是去學校這個地點辦別的事。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 該加冠詞沒加：I have dog. 應改成 I have a dog.。2. 不可數名詞加 a：a music 應改成 some music。3. 泛指卻加了 the：The life is short. 應改成 Life is short.。4. 樂器忘了 the：He plays guitar. 應改成 He plays the guitar.。5. 職業前漏了 a：She is teacher. 應改成 She is a teacher.。"},"table":{"t":"冠詞選擇","h":["情況","冠詞","例句"],"r":[["第一次提到（可數單數）","a / an","I bought a bag."],["再次提到，特定","the","The bag is red."],["獨一無二","the","The sun is bright."],["泛指複數或不可數","不加","Cats like fish."]]},"examples":[["I have a cat. The cat is black.","我有一隻貓，那隻貓是黑色的。"],["She is an honest girl.","她是個誠實的女孩。"],["The moon goes around the Earth.","月亮繞著地球轉。"],["Please turn off the light.","請把燈關掉。"],["He plays the guitar very well.","他吉他彈得很好。"],["My sister goes to school by bus.","我妹妹搭公車上學。"],["Life is not always easy.","人生並不總是容易的。"],["What is the tallest building in Taiwan?","台灣最高的建築是什麼？"]],"key":["第一次提到用 a / an，再次提到或特定用 the。","獨一無二、最高級、序數、樂器前用 the。","泛指複數或不可數名詞、三餐、球類、語言不加冠詞。","a / an 看發音：an hour、a university。"],"basic":false,"ex":[{"q":"She is ___ engineer.","o":["a","the","不加冠詞","an"],"a":"an","e":"engineer 以母音發音開頭，單數職業用 an。"},{"q":"I bought ___ new phone yesterday. The phone works very well.","o":["the","an","a","不加冠詞"],"a":"a","e":"第一次提到的可數單數名詞用 a，下一句再提到才用 the；new 以子音開頭，所以不用 an。"},{"q":"___ sun rises in the east.","o":["A","The","An","不加冠詞"],"a":"The","e":"太陽獨一無二，用 The。"},{"q":"He is learning to play ___ violin.","o":["the","a","an","不加冠詞"],"a":"the","e":"樂器前用 the。"},{"q":"I usually have ___ at seven.","o":["breakfast","the breakfast","a breakfast","an breakfast"],"a":"breakfast","e":"三餐前不加冠詞。"},{"q":"Please pass me ___ salt on the table.","o":["a","an","the","不加冠詞"],"a":"the","e":"特定的（桌上的）鹽，雙方都知道，用 the。"},{"q":"___ elephants are the largest land animals.","o":["The","A","An","不加冠詞"],"a":"不加冠詞","e":"泛指所有大象，複數泛指不加冠詞。"},{"q":"She is ___ tallest girl in our class.","o":["a","the","an","不加冠詞"],"a":"the","e":"最高級前用 the。"}]},{"id":"m21","icon":"👤","zh":"代名詞","intro":"","steps":[{"h":"第一步：代名詞的種類","p":"代名詞用來代替名詞，避免重複。常見有五種：人稱代名詞（主格 I / you / he / she / it / we / they；受格 me / you / him / her / it / us / them）、所有格（形容詞性 my / your / his / her / its / our / their；名詞性 mine / yours / his / hers / ours / theirs）、反身代名詞（myself, yourself, himself, herself, itself, ourselves, themselves）、指示代名詞（this, that, these, those）、不定代名詞（someone, anyone, everybody, nothing, one, another, others）。"},{"h":"第二步：主格、受格與所有格","p":"主格用在動詞前當主詞 (She loves music.)；受格用在動詞或介系詞之後當受詞 (I love her. / Give it to him.)；所有格形容詞後面一定要接名詞 (my book)；名詞性所有格自己就可以當名詞，相當於「所有格 + 名詞」：This book is mine.（= my book）。"},{"h":"第三步：反身代名詞與 each other","p":"當動作的執行者和接受者是同一人，用反身代名詞：He cut himself.。也可以用來強調：I made the cake myself.。by oneself 是「獨自」：She lives by herself.。「彼此」用 each other (兩者) 或 one another (三者以上)，不用反身代名詞：They love each other.（他們彼此相愛，而不是 They love themselves.）。"},{"h":"第四步：不定代名詞","p":"someone / somebody / something 用在肯定句；anyone / anything 用在否定句與疑問句；everyone / everybody / everything 視為單數；no one / nobody / nothing 表示沒有。它們都是單數，動詞用單數，並且後面的形容詞要放在後面：something delicious（不是 delicious something）。one 用來代替前面提過的可數名詞：I lost my pen, so I bought a new one.。another 是「另一個（不限定）」，the other 是「（兩者中）另一個」，others 是「其他的（不限定）」。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 主格與受格搞混：Me and my friend went shopping. 應改成 My friend and I went...。2. 所有格與 it's 混淆：The cat licked it's paw. 應改成 its paw（it's = it is）。3. 不定代名詞當複數：Everyone are here. 應改成 is。4. enjoy 之後漏了反身代名詞：Did you enjoy yourself? 是對的，而 Did you enjoy? 缺受詞。5. 用 he 指代不明確：Tom told John that he was late. 讓人不知道 he 是誰。"},"table":{"t":"人稱代名詞","h":["主格","受格","所有格形容詞","名詞性所有格","反身代名詞"],"r":[["I","me","my","mine","myself"],["you","you","your","yours","yourself"],["he","him","his","his","himself"],["she","her","her","hers","herself"],["we","us","our","ours","ourselves"],["they","them","their","theirs","themselves"]]},"examples":[["She loves him, but he doesn't love her.","她愛他，但他不愛她。"],["This is my umbrella. That one is yours.","這是我的傘，那把是你的。"],["The dog wagged its tail.","狗搖著牠的尾巴。"],["He hurt himself while playing basketball.","他打籃球時傷到自己。"],["They have known each other for ten years.","他們認識彼此十年了。"],["Someone is knocking on the door.","有人在敲門。"],["I don't have any pen. Can I borrow one?","我沒有筆，可以借一支嗎？"],["There is nothing interesting on TV tonight.","今晚電視上沒有有趣的節目。"]],"key":["主格作主詞，受格作受詞，所有格形容詞後接名詞。","its（所屬）與 it's（it is）不同。","彼此用 each other，不用反身代名詞。","everyone, something, nobody 等視為單數，形容詞放後面。"],"basic":false,"ex":[{"q":"My brother and ___ went to the movies.","o":["I","me","myself","mine"],"a":"I","e":"作主詞用主格 I。"},{"q":"The book is not ___ . It belongs to Tom.","o":["my","mine","me","myself"],"a":"mine","e":"後面沒有名詞，用名詞性所有格 mine。"},{"q":"She made the cake ___ .","o":["her","she","herself","hers"],"a":"herself","e":"強調「親手」做的，用反身代名詞 herself。"},{"q":"The two brothers help ___ .","o":["each others","them","their own","each other"],"a":"each other","e":"表示彼此幫忙，用 each other。"},{"q":"I didn't see ___ in the room.","o":["no one","anyone","nobody","noone"],"a":"anyone","e":"否定句用 anyone；no one 與 nobody 本身已含否定，不能再與 didn't 並用，noone 拼字錯誤。"},{"q":"The cat cleaned ___ paws.","o":["it's","it","itself","its"],"a":"its","e":"貓的爪子，所有格形容詞用 its，it's 是 it is 的縮寫。"},{"q":"Everybody ___ happy today.","o":["are","were","is","be"],"a":"is","e":"everybody 視為單數，動詞用 is。"},{"q":"I'd like something ___ to drink.","o":["cold","coldly","colder than","a cold"],"a":"cold","e":"不定代名詞後面的形容詞放在後面：something cold。"}]},{"id":"m22","icon":"🔢","zh":"數量詞","intro":"","steps":[{"h":"第一步：量詞的功能是「表示多少」","p":"量詞 (quantifiers) 放在名詞前面說明數量，例如 some, any, many, much, a lot of, a few, a little, few, little, plenty of, enough。使用時要看兩件事：名詞是可數還是不可數，句子是肯定、否定還是疑問。"},{"h":"第二步：some 與 any","p":"some 用於肯定句 (I have some questions.) 和期待對方回答 yes 的疑問句 (Would you like some tea?)；any 用於否定句和一般疑問句 (I don't have any money. / Do you have any brothers?)。any 在肯定句中表示「任何一個」：You can choose any book.。"},{"h":"第三步：many、much 與 a lot of","p":"many + 可數複數，much + 不可數。many 和 much 主要用在否定句與疑問句 (How many people came? / I don't have much time.)。肯定句更常用 a lot of 或 lots of，可數與不可數皆可 (I have a lot of friends. / She has a lot of work.)。"},{"h":"第四步：a few / few 與 a little / little","p":"a few + 可數複數 = 有一些（正面）；few = 幾乎沒有（負面）。a little + 不可數 = 有一點（正面）；little = 幾乎沒有（負面）。比較：I have a few friends here.（有幾個朋友，不寂寞）與 I have few friends here.（幾乎沒朋友，很孤單）。其他：enough（足夠）放名詞前，也可放形容詞後；plenty of（很多）；both（兩者都）、either（兩者任一）、neither（兩者皆非）、all（全部）、none（沒有任何一個）；each 與 every 後面用單數名詞。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. many water 應改成 much water。2. a few money 應改成 a little money。3. a lot of 之後動詞看名詞：A lot of students are 與 A lot of water is。4. 把 few 當成 a few：中文都翻成「一些」，但意思相反。5. every 後面接複數：every students 應改成 every student。6. enough 的位置：enough money（放名詞前），rich enough（放形容詞後）。"},"table":{"t":"量詞速查","h":["量詞","搭配名詞","肯定/否定"],"r":[["many","可數複數","多用於否定、疑問"],["much","不可數","多用於否定、疑問"],["a lot of / lots of","可數 / 不可數","肯定句"],["a few","可數複數","有一些（正面）"],["few","可數複數","幾乎沒有（負面）"],["a little","不可數","有一點（正面）"],["little","不可數","幾乎沒有（負面）"]]},"examples":[["I have some questions for you.","我有一些問題要問你。"],["Do you have any plans for the weekend?","你週末有任何計畫嗎？"],["There isn't much milk left.","剩下的牛奶不多了。"],["How many people are coming to the party?","有多少人要來派對？"],["She has a lot of friends in Taipei.","她在台北有很多朋友。"],["I have a little time, so I can help you.","我有一點時間，可以幫你。"],["He has few friends, so he often feels lonely.","他幾乎沒有朋友，所以常覺得孤單。"],["Every student needs to bring a pen.","每位學生都需要帶一支筆。"]],"key":["some 用於肯定，any 用於否定與疑問。","many + 可數，much + 不可數，肯定句多用 a lot of。","a few / a little = 有一些；few / little = 幾乎沒有。","every / each 後面接單數名詞。"],"basic":false,"ex":[{"q":"I don't have ___ money with me.","o":["some","any","a few","many"],"a":"any","e":"否定句用 any，money 是不可數。"},{"q":"How ___ time do we have?","o":["much","many","few","a few"],"a":"much","e":"time 是不可數，疑問句用 much。"},{"q":"There are ___ students in the library. It is nearly empty.","o":["a few","a little","few","much"],"a":"few","e":"nearly empty 表示幾乎沒有人，用 few。"},{"q":"Could I have ___ milk in my coffee?","o":["a few","many","few","a little"],"a":"a little","e":"milk 不可數，「一點點」用 a little。"},{"q":"___ of the students passed. Only two failed.","o":["Every","Much","Most","A little"],"a":"Most","e":"「只有兩個沒過」，所以是大部分通過，用 Most。"},{"q":"She has ___ experience to do this job.","o":["enough of","enoughly","too enough","enough"],"a":"enough","e":"enough 放在名詞前面。"},{"q":"Could I have ___ water, please?","o":["some","any","many","few"],"a":"some","e":"提出請求，期待肯定回答，疑問句中用 some；water 不可數，所以不用 many 或 few。"},{"q":"There are ___ apples in the basket.","o":["much","a lot of","a little","little"],"a":"a lot of","e":"apples 可數複數，肯定句用 a lot of。"}]},{"id":"m23","icon":"🎨","zh":"形容詞與副詞","intro":"","steps":[{"h":"第一步：形容詞與副詞的分工","p":"形容詞修飾名詞或代名詞（回答「什麼樣的？」）：a tall boy、She is happy.。副詞修飾動詞、形容詞、其他副詞或整個句子（回答「如何？何時？何地？多少？」）：He runs quickly.、very tall、quite slowly。分辨方法：看它修飾什麼。"},{"h":"第二步：副詞的形成與特殊形式","p":"多數副詞由形容詞加 -ly 而成：quick / quickly、careful / carefully；子音加 y 的去 y 加 ily (happy / happily)；-le 結尾的去 e 加 y (gentle / gently)。特殊：good 的副詞是 well；有些字兩種詞性同形：fast, hard, early, late, high, low。注意 hardly（幾乎不）、lately（最近）、highly（高度地）與原字意思不同。"},{"h":"第三步：多個形容詞的順序","p":"名詞前有多個形容詞時，一般順序是：意見 → 大小 → 年齡 → 形狀 → 顏色 → 來源 → 材質 → 用途 + 名詞。例如 a beautiful small old round red Chinese wooden table。實務上不會堆疊這麼多，只要記住「意見在前、材質在後」：a lovely little house / a big black dog / a nice old wooden chair。"},{"h":"第四步：副詞的位置與頻率副詞","p":"方式副詞常放在動詞（或受詞）之後：She speaks English fluently.。頻率副詞 (always, usually, often, sometimes, never) 放在一般動詞前、be 動詞和助動詞後：He always gets up early. / She is never late. / I have often seen him.。程度副詞 (very, quite, extremely, too, enough) 放在形容詞或副詞前，enough 例外，放在後面：old enough。too 表示「太…（不好的）」，very 只是「很」：It's too hot to sleep.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 形容詞當副詞用：He plays the piano good. 應改成 well。2. 把 -ly 副詞當形容詞：She looked happily. 應改成 looked happy（連綴動詞之後用形容詞）。3. 頻率副詞位置：He goes always to school by bus. 應改成 He always goes...。4. very 修飾比較級：very better 應改成 much better。5. too 與 very 搞混：It's too delicious! 若只是稱讚應為 very / so delicious。"},"table":{"t":"形容詞變副詞","h":["規則","形容詞","副詞"],"r":[["加 -ly","quick, slow","quickly, slowly"],["y 變 ily","happy, easy","happily, easily"],["le 變 ly","gentle, simple","gently, simply"],["不規則","good","well"],["同形","fast, hard, late, early","fast, hard, late, early"]]},"examples":[["She is a fast runner. She runs fast.","她是個跑得快的人，她跑得很快。"],["He speaks English well.","他英文說得很好。"],["The teacher spoke slowly so that everyone could understand.","老師說得很慢，讓每個人都聽得懂。"],["I usually take the MRT to work.","我通常搭捷運上班。"],["She is always ready to help others.","她總是樂於幫助別人。"],["It was such a lovely small old house.","那是一棟可愛的小舊房子。"],["He is old enough to drive.","他已經夠大可以開車了。"],["It's too cold to go swimming.","天氣太冷，不能去游泳。"]],"key":["形容詞修飾名詞，副詞修飾動詞、形容詞與副詞。","good → well；hard / late / fast 形容詞與副詞同形。","頻率副詞：一般動詞前，be 動詞與助動詞後。","enough 放在形容詞或副詞後面；too = 太…。"],"basic":false,"ex":[{"q":"She dances ___ .","o":["beautiful","beautifully","beauty","beautify"],"a":"beautifully","e":"修飾動詞 dances 用副詞。"},{"q":"He is a ___ driver.","o":["carefully","care","careful","carefulness"],"a":"careful","e":"修飾名詞 driver 用形容詞。"},{"q":"My brother ___ plays computer games after dinner.","o":["plays often","ofter","oftenly","often"],"a":"often","e":"頻率副詞放在一般動詞之前。"},{"q":"The food smells ___ .","o":["delicious","deliciously","deliciousness","delicately"],"a":"delicious","e":"smell 是連綴動詞，之後用形容詞。"},{"q":"She is ___ to carry the box by herself.","o":["enough strong","strong enough","too strong","strongly enough"],"a":"strong enough","e":"enough 放在形容詞後面。"},{"q":"He drives so ___ that everybody is afraid.","o":["fast","fastly","fasting","faster than"],"a":"fast","e":"fast 是副詞，沒有 fastly。"},{"q":"I ___ see my grandparents because they live far away.","o":["hard ever","ever hardly","hardly never","hardly ever"],"a":"hardly ever","e":"hardly ever 表示「幾乎從不」，符合住得遠的語意。"},{"q":"It's ___ dark to see anything.","o":["very","enough","too","so"],"a":"too","e":"too...to V 表示太…而不能，語意是太暗而看不見。"}]},{"id":"m24","icon":"📍","zh":"介系詞：時間與地點","intro":"","steps":[{"h":"第一步：介系詞用來表示位置、時間與關係","p":"介系詞放在名詞、代名詞或 V-ing 之前，形成介系詞片語。中文的「在」可以翻成 at, in, on 三個字，容易搞混，需要用「空間大小」或「時間長短」的概念來記憶。"},{"h":"第二步：時間介系詞 at / on / in","p":"at 用於「時間點」：at 7:30, at noon, at night, at the weekend（英式）。on 用於「日子」：on Monday, on May 5th, on Christmas Day, on my birthday, on the morning of May 5th。in 用於「較長的時間」：in July, in 2025, in spring, in the morning / afternoon / evening。其他：for + 一段時間，since + 起點，during + 事件期間，by + 期限（在…之前），until + 持續到某時：I will finish it by Friday.（星期五以前完成）；I will stay until Friday.（待到星期五）。"},{"h":"第三步：地點介系詞 at / in / on","p":"at 用於「地點的一個點」：at the bus stop, at school, at the door。in 用於「空間之內」：in the room, in Taipei, in Taiwan。on 用於「表面」：on the table, on the wall, on the second floor。另外：under（正下方）、above（上方）、below（下方）、over（覆蓋或越過）、between（兩者之間）、among（三者以上之間）、next to / beside（旁邊）、in front of（前面）、behind（後面）、opposite（對面）。"},{"h":"第四步：方向與常用搭配","p":"方向：to（到）、from（從）、into（進入）、out of（出來）、through（穿越）、across（橫越）、along（沿著）、up / down（上、下）。很多動詞、形容詞和名詞有固定的介系詞搭配，必須整體記憶：depend on, good at, interested in, afraid of, on time（準時）、in time（來得及）、at least, by mistake, in fact。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. in Sunday 應改成 on Sunday。2. on the morning 應改成 in the morning。3. I arrived to Taipei. 應改成 arrived in Taipei（大地點用 in，小地點用 at）。4. discuss about the plan 應改成 discuss the plan（discuss 是及物動詞，不加 about）。5. married with 應改成 married to。6. since three years 應改成 for three years。"},"table":{"t":"at / on / in 的比較","h":["介系詞","時間","地點"],"r":[["at","時間點 (at 6:00)","一個點 (at the station)"],["on","日期與星期 (on Monday)","表面 (on the desk)"],["in","月、年、季節、一天中的時段 (in June)","空間之內 (in the box)"]]},"examples":[["The class starts at nine o'clock.","課九點開始。"],["My birthday is on March 3rd.","我的生日是三月三日。"],["We usually go on a trip in summer.","我們通常在夏天去旅行。"],["The book is on the table under the lamp.","書在檯燈下的桌上。"],["He lives in Kaohsiung, near the harbor.","他住在高雄，靠近港口。"],["The bank is between the post office and the school.","銀行在郵局和學校之間。"],["Please finish the report by Friday.","請在星期五前完成報告。"],["I have lived here for ten years, since 2015.","我住在這裡十年了，從二零一五年開始。"]],"key":["時間：at 點、on 日、in 長時間。","地點：at 一點、in 空間內、on 表面。","by = 在…之前，until = 持續到。","discuss, enter, marry 等及物動詞後不加介系詞。"],"basic":false,"ex":[{"q":"The movie starts ___ 8 p.m.","o":["on","in","by","at"],"a":"at","e":"具體時間點用 at。"},{"q":"I was born ___ April.","o":["in","on","at","by"],"a":"in","e":"月份用 in。"},{"q":"Our English class is ___ Wednesday.","o":["in","at","on","by"],"a":"on","e":"星期幾用 on。"},{"q":"She has worked here ___ 2019.","o":["for","since","in","during"],"a":"since","e":"since 加起點時間。"},{"q":"Please hand in your homework ___ Monday.","o":["until","at","by","since"],"a":"by","e":"「在星期一之前繳交」用 by。"},{"q":"The keys are ___ the table.","o":["on","in","at","between"],"a":"on","e":"鑰匙放在桌面上，用 on。"},{"q":"The store is ___ the bank and the school.","o":["among","between","in","at"],"a":"between","e":"兩者之間用 between。"},{"q":"We must discuss ___ today.","o":["about the plan","on the plan","for the plan","the plan"],"a":"the plan","e":"discuss 是及物動詞，後面直接接受詞。"}]},{"id":"m25","icon":"🧱","zh":"名詞子句","intro":"","steps":[{"h":"第一步：名詞子句可以當主詞、受詞或補語","p":"名詞子句是一個完整的子句，功能相當於一個名詞，可以放在主詞、受詞或補語的位置。常見引導詞有三類：that（引導事實陳述）、whether / if（引導是非問句，意思是「是否」）、疑問詞 what, who, where, when, why, how（引導 Wh- 問句）。"},{"h":"第二步：that 子句","p":"that 子句表示陳述句的內容，常放在 think, know, believe, say, hope, be sure, be glad 之後。I think that he is right.。that 常可以省略：I think he is right.。但 that 子句當主詞或位於介系詞之後時不省略：That he lied surprised me. / It is a fact that he lied.。"},{"h":"第三步：whether / if 子句","p":"表示「是否」，用 whether 或 if：I don't know whether he will come.。以下情況只能用 whether：當主詞 (Whether he will come is not clear.)、在介系詞之後 (It depends on whether he agrees.)、與 or not 緊鄰 (whether or not)、在不定詞之前 (I don't know whether to go.)。"},{"h":"第四步：疑問詞引導的名詞子句，語序是重點","p":"疑問詞引導名詞子句時，要用直述句語序（主詞 + 動詞），不能用問句語序，也不需要 do / does / did：Where does he live?（直接問句）→ I don't know where he lives.。如果直接問句本身沒有助動詞，改成名詞子句時要恢復動詞形態：What did you say? → Tell me what you said.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. I don't know where does he live. 應改成 where he lives。2. Do you know what is his name? 應改成 what his name is。3. I don't know that he will come or not. 應改成 whether he will come or not。4. What he said are true 應改成 is true（名詞子句當主詞視為單數）。5. I'm not sure if or not... 應改成 whether or not...。"},"table":{"t":"名詞子句的引導詞","h":["引導詞","意思","例句"],"r":[["that","事實","I know that she is honest."],["whether / if","是否","I wonder whether he is at home."],["who / whom / whose","誰","Tell me who called you."],["what / which","什麼","I don't know what he wants."],["where / when / why / how","哪裡 / 何時 / 為何 / 如何","Do you know how she did it?"]]},"examples":[["I believe that honesty is important.","我相信誠實很重要。"],["We didn't know whether the shop was open.","我們不知道那間店有沒有開。"],["What she said made me happy.","她說的話讓我很開心。"],["Do you know where the station is?","你知道車站在哪裡嗎？"],["I wonder why he was late.","我想知道他為什麼遲到。"],["The question is how we can solve the problem.","問題是我們該如何解決這個問題。"],["It is true that she won the prize.","她得獎是真的。"],["Please tell me what time the meeting starts.","請告訴我會議幾點開始。"]],"key":["名詞子句可當主詞、受詞、補語。","that 表事實；whether / if 表是否；疑問詞引導 Wh- 子句。","名詞子句用直述句語序，不加 do / does / did。","whether 可以搭配 or not，if 不行緊接 or not。"],"basic":false,"ex":[{"q":"I don't know where ___ .","o":["does he live","lives he","he lives","he live"],"a":"he lives","e":"名詞子句用直述句語序，he 是第三人稱，用 lives。"},{"q":"Do you know ___ she is?","o":["who","who is","that","whether who"],"a":"who","e":"名詞子句 who she is，語序為主詞 + be 動詞。"},{"q":"I wonder ___ he will come to the party.","o":["what","that","which","whether"],"a":"whether","e":"「是否會來」用 whether。"},{"q":"___ he said surprised everyone.","o":["That what","What","Which","Whom"],"a":"What","e":"What he said 是名詞子句當主詞，意思是「他所說的話」。"},{"q":"Can you tell me ___ ?","o":["how much this costs","how much does this cost","how much cost this","how much costs this"],"a":"how much this costs","e":"間接問句用直述句語序：how much this costs。"},{"q":"It is certain ___ he will win.","o":["whether that","what","that","when"],"a":"that","e":"It is certain that... 是虛主詞句型。"},{"q":"The question is ___ we can finish on time.","o":["which","whether","what","weather"],"a":"whether","e":"is 之後的補語子句，表示「是否」，用 whether。"},{"q":"She asked me ___ I liked the movie.","o":["that","what","where","if"],"a":"if","e":"Yes/No 問句的間接引述用 if。"}]},{"id":"m26","icon":"⏳","zh":"副詞子句","intro":"","steps":[{"h":"第一步：副詞子句說明「何時、為何、如何」","p":"副詞子句由從屬連接詞引導，作用像副詞，修飾主要子句的動詞，說明時間、原因、條件、讓步、目的、結果或方式。副詞子句不能單獨成為句子，必須依附在主要子句上。放在句首時，後面要加逗號。"},{"h":"第二步：時間與原因子句","p":"時間：when, while, as, before, after, until, since, as soon as, by the time, whenever。原因：because, since, as。時間子句表示未來時，用現在簡單式，不用 will：I'll call you as soon as I arrive.。because 用來說明「真正的原因」，since 和 as 的原因已是對方知道的事，因此常放句首：Since it's raining, let's stay at home.。"},{"h":"第三步：讓步、目的與結果子句","p":"讓步：although, though, even though, while, whereas。目的：so that, in order that（後面通常有 can, could, will, would）：He spoke slowly so that everyone could understand.。結果：so + 形容詞 / 副詞 + that；such + (a) + 形容詞 + 名詞 + that：It was so hot that we stayed inside. / It was such a hot day that we stayed inside.。注意 so 與 such 的區別：so 之後直接接形容詞，such 之後接名詞。"},{"h":"第四步：方式與比較子句","p":"方式：as, as if / as though。as if 後面表示與事實相反時，用過去式（be 動詞用 were）：He talks as if he were the boss.。比較：than, as...as。條件子句 (if, unless, as long as, provided that) 在前面的條件句課程中已經講解。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. Although..., but... 同時使用，應二選一。2. Because..., so... 同時使用，應二選一。3. 時間子句用 will：When I will arrive, I'll call you. 應改成 When I arrive。4. so 與 such 混用：It was so a nice day. 應改成 such a nice day 或 so nice a day。5. so that 之後的目的子句少了情態助動詞。"},"table":{"t":"副詞子句的類型","h":["類型","連接詞","例句"],"r":[["時間","when, while, before, after, until","Wait until I come back."],["原因","because, since, as","I stayed home because I was sick."],["讓步","although, though, even though","Although he is rich, he is unhappy."],["目的","so that, in order that","Study hard so that you can pass."],["結果","so...that, such...that","It was so cold that the lake froze."],["方式","as if, as though","He acts as if he knew everything."]]},"examples":[["I'll tell her as soon as she comes back.","她一回來我就告訴她。"],["While I was cooking, my son was doing his homework.","我煮飯時，兒子在寫功課。"],["Since you are tired, you should take a rest.","既然你累了，就該休息一下。"],["Even though he studied hard, he failed the test.","即使他很用功，還是沒有通過考試。"],["Speak louder so that everyone can hear you.","大聲一點，好讓每個人都聽得到你。"],["The bag was so heavy that I couldn't lift it.","這個袋子太重，我提不起來。"],["It was such a hard test that nobody finished it.","這場考試太難，沒有人做完。"],["She talks as if she were the teacher.","她說話的樣子好像她是老師。"]],"key":["時間子句表示未來時用現在式。","although 與 but、because 與 so 不並用。","so + adj / adv + that；such + (a) + adj + N + that。","so that 表示目的，常搭配 can / could。"],"basic":false,"ex":[{"q":"___ it was raining, we went out.","o":["Because","Although","So that","Unless"],"a":"Although","e":"下雨卻出門，語意讓步，用 Although。"},{"q":"Call me as soon as you ___ .","o":["arrive","will arrive","arrived","are arriving"],"a":"arrive","e":"時間子句用現在式表示未來。"},{"q":"It was ___ a nice day that we went to the beach.","o":["so","too","very","such"],"a":"such","e":"such + a + 形容詞 + 名詞 + that。"},{"q":"He spoke slowly ___ everyone could understand him.","o":["because of","although","so that","unless"],"a":"so that","e":"表示目的，用 so that。"},{"q":"The soup was ___ hot that I couldn't drink it.","o":["so","such","too","very"],"a":"so","e":"so + 形容詞 + that。"},{"q":"___ you are here, could you help me?","o":["Although","Since","Unless","Until"],"a":"Since","e":"既然你在這裡，表示已知的原因，用 Since。"},{"q":"He speaks English ___ he were a native speaker.","o":["so that","even","as if","unless"],"a":"as if","e":"as if + 假設語氣，用 were。"},{"q":"She was tired; ___ , she kept working.","o":["because","since","so that","however"],"a":"however","e":"兩句之間表示轉折，用連接副詞 however。"}]},{"id":"m27","icon":"❓","zh":"附加問句","intro":"","steps":[{"h":"第一步：附加問句是「確認」而不是「發問」","p":"附加問句 (question tag) 是放在陳述句後面的簡短問句，用來確認資訊或尋求對方同意，像中文的「對吧？」「不是嗎？」。結構是：陳述句 + 逗號 + 助動詞 + 代名詞？例如 You like coffee, don't you?。"},{"h":"第二步：正反相反原則","p":"前面是肯定句，附加問句用否定：She is a teacher, isn't she?。前面是否定句，附加問句用肯定：They can't swim, can they?。助動詞要和前句相同：有 be 動詞用 be，有助動詞 (have, will, can) 用該助動詞，一般動詞則依時態用 do / does / did：He plays tennis, doesn't he? / You went there, didn't you?。主詞一律換成代名詞：Tom and Mary are late, aren't they?。"},{"h":"第三步：特殊情形","p":"1. I am 的附加問句是 aren't I：I am late, aren't I?。2. Let's 的附加問句是 shall we：Let's go, shall we?。3. 命令句用 will you / won't you：Close the door, will you?。4. 含有 never, hardly, nobody, nothing 等否定詞的句子視為否定句：He never smokes, does he?。5. There is 的附加問句用 there：There is a problem, isn't there?。6. everyone, somebody 用 they：Everyone is here, aren't they?。"},{"h":"第四步：語調的意義","p":"附加問句語調上升，表示真的不確定，等待回答；語調下降，表示幾乎確定，只是尋求同意。回答時，要看事實：You don't like fish, do you? 若不喜歡，回答 No, I don't.；若喜歡，回答 Yes, I do.。這與中文「對，我不喜歡」的回答方式不同，要特別注意。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 前後都是肯定或都是否定 (You are a student, are you?)，應改成 aren't you。2. 主詞沒有換成代名詞 (Tom is late, isn't Tom?)。3. 用 don't 對所有句子 (She is happy, don't she?)，應改成 isn't she。4. 回答否定附加問句時被中文影響：You aren't tired, are you? 若真的不累，答 No, I'm not。5. I am 的附加問句誤用 amn't I。"},"table":{"t":"附加問句配對","h":["前句","附加問句","例句"],"r":[["肯定 be","isn't / aren't","He is kind, isn't he?"],["否定 be","is / are","He isn't rude, is he?"],["肯定一般動詞","don't / doesn't / didn't","You like it, don't you?"],["否定情態","can / will 等","He can't drive, can he?"],["I am","aren't I","I am right, aren't I?"],["Let's","shall we","Let's begin, shall we?"]]},"examples":[["It's a nice day, isn't it?","今天天氣真好，不是嗎？"],["You haven't finished your homework, have you?","你還沒寫完功課，對吧？"],["She speaks French, doesn't she?","她會說法文，對吧？"],["They went to Japan last year, didn't they?","他們去年去了日本，不是嗎？"],["Let's have lunch together, shall we?","我們一起吃午餐吧，好嗎？"],["Open the window, will you?","把窗戶打開，好嗎？"],["He never lies, does he?","他從不說謊，對吧？"],["I'm late again, aren't I?","我又遲到了，對吧？"]],"key":["前肯後否，前否後肯，助動詞前後一致。","主詞用代名詞，I am 用 aren't I，Let's 用 shall we。","never, hardly, nobody 視為否定，附加問句用肯定。","回答時依事實說 Yes / No，不看問句形式。"],"basic":false,"ex":[{"q":"You live in Taipei, ___ ?","o":["do you","aren't you","isn't it","don't you"],"a":"don't you","e":"一般動詞現在式肯定句，附加問句用 don't you。"},{"q":"She can't speak Japanese, ___ ?","o":["can't she","does she","can she","is she"],"a":"can she","e":"前句否定，附加問句用肯定 can she。"},{"q":"Tom and Ken are late, ___ ?","o":["aren't they","isn't he","are they","don't they"],"a":"aren't they","e":"主詞複數換成 they，前肯後否。"},{"q":"Let's go home, ___ ?","o":["will we","shall we","don't we","do we"],"a":"shall we","e":"Let's 的附加問句是 shall we。"},{"q":"He has never been abroad, ___ ?","o":["hasn't he","does he","is he","has he"],"a":"has he","e":"never 是否定詞，附加問句用肯定 has he。"},{"q":"She finished the report yesterday, ___ ?","o":["doesn't she","wasn't she","didn't she","hasn't she"],"a":"didn't she","e":"過去式的一般動詞，用 didn't she。"},{"q":"I am your best friend, ___ ?","o":["am I","aren't I","amn't I","don't I"],"a":"aren't I","e":"I am 的附加問句是 aren't I。"},{"q":"Close the door, ___ ?","o":["will you","do you","are you","shall we"],"a":"will you","e":"命令句常用 will you。"}]},{"id":"m28","icon":"🗣️","zh":"疑問句與間接問句","intro":"","steps":[{"h":"第一步：直接問句的三種基本形式","p":"英文問句有 Yes/No 問句、Wh- 問句與選擇問句。Yes/No 問句把助動詞或 be 動詞移到主詞前：Are you ready? / Do you like tea?。Wh- 問句在最前面加疑問詞，其後仍用倒裝語序：Where do you live? / What is he doing?。當疑問詞本身是主詞，就不用倒裝：Who called you? / What happened?。"},{"h":"第二步：疑問詞的用法","p":"who（誰）、whom（誰，受詞）、whose（誰的）、what（什麼）、which（哪一個，範圍有限）、when、where、why、how。how 可以搭配其他字：how many, how much, how long, how often, how far, how old。例如 How often do you exercise?（多常運動）與 How long does it take?（要花多久）。"},{"h":"第三步：間接問句，用直述語序","p":"間接問句把問句嵌入另一個句子，語序變成直述句：Where is the station? → Could you tell me where the station is?。常用引導語：Could you tell me...?, Do you know...?, I wonder..., I'd like to know..., Can you show me...?。沒有 do / does / did：What time does the store close? → Do you know what time the store closes?。"},{"h":"第四步：Yes/No 問句的間接形式","p":"Yes/No 問句變成間接問句時，用 if 或 whether 引導：Is he at home? → I wonder if he is at home.。否定問句與提議可用 Why don't you...? 或 How about...?。如果疑問詞是主詞，語序不變：Who lives next door? → I don't know who lives next door.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. Where you live? 漏了助動詞，應改成 Where do you live?。2. Do you know where is the bank? 應改成 where the bank is。3. I don't know what does he want. 應改成 what he wants。4. She asked me where did I go. 應改成 where I had gone / where I went。5. 直接翻中文「你去哪裡了？」寫成 You went where?，應改成 Where did you go?。"},"table":{"t":"直接問句與間接問句","h":["直接問句","間接問句"],"r":[["Where is the museum?","Do you know where the museum is?"],["What does she want?","I wonder what she wants."],["Is he married?","Could you tell me if he is married?"],["Who broke the window?","Do you know who broke the window?"]]},"examples":[["Where do you usually have lunch?","你通常在哪裡吃午餐？"],["Who wrote this letter?","誰寫了這封信？"],["How often do you go to the gym?","你多久去一次健身房？"],["How long does it take to get to the airport?","到機場要花多久？"],["Could you tell me where the post office is?","你可以告訴我郵局在哪裡嗎？"],["Do you know what time the movie starts?","你知道電影幾點開始嗎？"],["I wonder if she will come to the party.","我不知道她會不會來派對。"],["I'd like to know how much this bag costs.","我想知道這個包包多少錢。"]],"key":["Wh- 問句用倒裝語序，但疑問詞當主詞時不倒裝。","間接問句用直述語序，不加 do / does / did。","Yes/No 問句變間接問句用 if 或 whether。","Could you tell me...? 比直接問更有禮貌。"],"basic":false,"ex":[{"q":"___ do you go to work?","o":["How","Who","Whose","Which"],"a":"How","e":"問交通方式，用 How。"},{"q":"Do you know where ___ ?","o":["does she live","lives she","she live","she lives"],"a":"she lives","e":"間接問句用直述語序，she lives。"},{"q":"Could you tell me ___ the bank is?","o":["where is","where","is where","that"],"a":"where","e":"間接問句 where the bank is，直述語序。"},{"q":"___ opened the door?","o":["Whom","Whose","Who","What do"],"a":"Who","e":"疑問詞當主詞，不倒裝，用 Who。"},{"q":"I wonder ___ he likes pizza.","o":["do","so","of","if"],"a":"if","e":"「是否」用 if，其他選項語意或結構不通。"},{"q":"___ does it take to get there?","o":["How far","How often","How long","How many"],"a":"How long","e":"問時間長度，用 How long。"},{"q":"Do you know what time the store ___ ?","o":["does close","closes","close","closing"],"a":"closes","e":"間接問句用直述語序，主詞 the store 是第三人稱單數。"},{"q":"I wonder ___ she is coming today.","o":["whether","what","which","who"],"a":"whether","e":"「是否」用 whether。"}]},{"id":"m29","icon":"👉","zh":"It 的各種句型","intro":"","steps":[{"h":"第一步：it 不只是「它」","p":"it 除了代替前面提過的東西，還有許多固定用法：一、表示天氣、時間、距離、明暗：It is raining. / It is 5 o'clock. / It is two miles to the station.。二、當虛主詞 (dummy subject)，代替後面較長的真主詞：It is important to study hard.。三、強調句型：It was Tom who broke the window.。"},{"h":"第二步：虛主詞 it + to V / that 子句","p":"英文不喜歡頭重腳輕的句子，所以把長主詞放後面，用 it 當形式主詞。To learn English is fun. → It is fun to learn English.。That he passed the exam is amazing. → It is amazing that he passed the exam.。常見句型：It is + 形容詞 + (for 人) + to V (It is easy for me to answer.)、It is + 形容詞 + that + 子句、It takes + 人 + 時間 + to V (It takes me an hour to get to school.)、It is no use + V-ing (It is no use crying.)。"},{"h":"第三步：虛受詞 it","p":"在 make, find, think, consider 等動詞的 SVOC 句型，如果受詞是不定詞或子句，要放 it 當虛受詞：I find it hard to wake up early. / He made it clear that he would quit.。不能寫成 I find hard to wake up early，那樣受詞的位置是空的。"},{"h":"第四步：it 強調句型","p":"強調句型：It is / was + 被強調的部分 + that / who + 其餘部分。原句：Tom broke the window yesterday.。強調主詞：It was Tom who broke the window yesterday.。強調受詞：It was the window that Tom broke yesterday.。強調時間：It was yesterday that Tom broke the window.。這個句型可以用來對比，中文近似「就是…（做的）」。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. 缺少主詞：Is important to study. 應改成 It is important to study.。2. for 與 of 搞混：It is kind of you to help me.（形容人的品格用 of），It is easy for me to swim.（其他形容詞用 for）。3. 用人當主詞：I am difficult to learn English. 應改成 It is difficult for me to learn English.。4. It takes 的用法：I spent an hour to get there 應改成 It took me an hour to get there 或 I spent an hour getting there。"},"table":{"t":"it 的用法","h":["用法","句型","例句"],"r":[["天氣、時間","It is + 名詞 / 形容詞","It is snowing."],["虛主詞","It is + adj + to V / that","It is hard to say goodbye."],["花費時間","It takes + 人 + 時間 + to V","It takes me ten minutes to walk."],["虛受詞","find / make it + adj + to V","I find it useful to keep a diary."],["強調","It is + 強調部分 + that","It was Mary who called."]]},"examples":[["It is getting dark. Let's go home.","天漸漸黑了，我們回家吧。"],["It is important to drink enough water every day.","每天喝足夠的水很重要。"],["It is kind of you to help me.","你人真好，肯幫我。"],["It takes about thirty minutes to get to the airport.","到機場大約要花三十分鐘。"],["It is possible that he forgot the meeting.","他有可能忘了會議。"],["I find it difficult to speak in public.","我覺得在公眾面前說話很難。"],["It was my sister who cooked dinner last night.","昨晚煮晚餐的是我姊姊。"],["It is no use worrying about it.","擔心這件事沒有用。"]],"key":["it 可表示天氣、時間、距離，也可以當虛主詞或虛受詞。","It is + adj + to V / that 子句。","形容人的品格用 of，其他用 for。","find / make + it + adj + to V。"],"basic":false,"ex":[{"q":"___ is important to sleep well.","o":["This","That","It","There"],"a":"It","e":"虛主詞 It 代替後面的 to sleep well。"},{"q":"It is kind ___ you to help me.","o":["for","of","to","with"],"a":"of","e":"kind 形容人的品格，用 of。"},{"q":"It is easy ___ me to solve the problem.","o":["of","to","with","for"],"a":"for","e":"easy 不是形容人品格，用 for。"},{"q":"It ___ me two hours to finish the report.","o":["took","spent","paid","made"],"a":"took","e":"It takes / took + 人 + 時間 + to V。"},{"q":"I find ___ hard to get up early.","o":["that","it","this","them"],"a":"it","e":"find + it + adj + to V，it 是虛受詞。"},{"q":"It was Tom ___ broke the window.","o":["whom","which","what","who"],"a":"who","e":"強調人作主詞，用 who 或 that。"},{"q":"It is no ___ crying over spilt milk.","o":["useful","using","use","used"],"a":"use","e":"It is no use + V-ing。"},{"q":"It is surprising ___ he didn't come.","o":["that","what","whether","which"],"a":"that","e":"It is surprising that + 子句。"}]},{"id":"m30","icon":"🔃","zh":"倒裝句","intro":"","steps":[{"h":"第一步：什麼是倒裝","p":"正常英文語序是「主詞 + 動詞」，倒裝 (inversion) 則是把助動詞或 be 動詞放到主詞前面，用來造問句、強調語氣或表示特定意思。GEPT 中級不要求太複雜的文學式倒裝，但有幾個常見的類型必須熟悉。"},{"h":"第二步：否定副詞開頭的倒裝","p":"當 never, seldom, rarely, hardly, little, not only, no sooner, not until 等否定字詞放在句首，後面要倒裝：Never have I seen such a beautiful view.。Hardly had he arrived when it began to rain.。Not only did she sing well, but she also danced well.。倒裝時要有助動詞，一般動詞要加 do / does / did，動詞恢復原形。"},{"h":"第三步：So / Neither / Nor 與 Only 開頭","p":"表示「也一樣」：肯定用 so + 助動詞 + 主詞：I like pizza. So do I.。否定用 neither / nor + 助動詞 + 主詞：I can't swim. Neither can she.。Only + 副詞片語放在句首，也要倒裝：Only then did I understand.。注意：助動詞要和前句對應。"},{"h":"第四步：地點副詞與條件句倒裝","p":"地點副詞開頭 (Here, There, In the box, Down) 且主詞是名詞時，動詞放在主詞前：Here comes the bus.。但主詞是代名詞時不倒裝：Here it comes.。條件句可省略 if 並倒裝：Had I known, I would have told you. (= If I had known...)、Should you need help, call me. (= If you should need help...)、Were I you, I would accept. (= If I were you...)。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. Never I have seen it. 應改成 Never have I seen it.。2. Not only she sang... 應改成 Not only did she sing...。3. So I do. 用錯位置，「我也是」是 So do I.。4. 倒裝後的動詞沒有恢復原形：Not only did she sang 應改成 did she sing。5. 附和句的助動詞不一致：I am tired. So do I. 應改成 So am I.。"},"table":{"t":"常見倒裝類型","h":["類型","句型","例句"],"r":[["否定副詞","Never / Seldom + 助動詞 + 主詞","Seldom does he complain."],["Not only","Not only + 助動詞 + 主詞...","Not only is she smart, but also kind."],["So / Neither","So + 助動詞 + 主詞","So do I. / Neither can he."],["Only","Only + 副詞 + 倒裝","Only later did I notice it."],["條件省略 if","Had / Were / Should + 主詞","Had I known, I would have called."]]},"examples":[["Never have I seen such a big fish.","我從沒看過這麼大的魚。"],["Seldom does he eat out.","他很少外食。"],["Not only did he lose his keys, but he also lost his wallet.","他不只弄丟鑰匙，還弄丟了錢包。"],["I love this song. So does my sister.","我喜歡這首歌，我姊姊也是。"],["I can't swim. Neither can my brother.","我不會游泳，我哥哥也不會。"],["Only after the meeting did I hear the news.","直到會議結束後我才聽到消息。"],["Here comes the bus!","公車來了！"],["Had I known the truth, I would have told you.","如果我當時知道真相，我就會告訴你了。"]],"key":["否定副詞放句首，後面接倒裝：助動詞 + 主詞。","So + 助動詞 + 主詞 表示肯定的「也一樣」，Neither 表示否定。","倒裝時一般動詞要加 do / does / did，並用原形。","Had / Were / Should 可以取代 if 引導條件句。"],"basic":false,"ex":[{"q":"Never ___ such a beautiful place.","o":["I have seen","I saw","have I seen","did I saw"],"a":"have I seen","e":"Never 開頭要倒裝，助動詞 have 在主詞 I 前面。"},{"q":"Not only ___ sing well, but she also dances well.","o":["she does","does she","she","is she"],"a":"does she","e":"Not only 之後倒裝，一般動詞加 does。"},{"q":"I like coffee. ___ my brother.","o":["So does","So is","Neither does","So do"],"a":"So does","e":"前句是一般動詞、第三人稱單數（my brother），用 So does。"},{"q":"She can't drive. ___ can I.","o":["So","Either","Nor do","Neither"],"a":"Neither","e":"前句否定，「我也不會」用 Neither can I。"},{"q":"Seldom ___ to the cinema.","o":["he goes","goes he","he does go","does he go"],"a":"does he go","e":"Seldom 開頭要倒裝，does 之後動詞用原形 go。"},{"q":"___ I known the answer, I would have told you.","o":["Had","Have","If","Did"],"a":"Had","e":"省略 if 的過去完成條件句，Had I known。"},{"q":"Here ___ the bus!","o":["come","comes","is coming","coming"],"a":"comes","e":"Here 開頭，主詞是名詞 the bus，動詞在主詞前，comes。"},{"q":"Only then ___ realize my mistake.","o":["I did","do I","did I","I do"],"a":"did I","e":"Only then 開頭，倒裝，過去式用 did I。"}]},{"id":"m31","icon":"🎭","zh":"假設語氣與 should","intro":"","steps":[{"h":"第一步：什麼是假設語氣","p":"假設語氣 (subjunctive mood) 用來表示與事實相反的假設、願望、建議或要求。它的特色是動詞形式與時間不一致：說現在的事實相反，用過去式；說過去的事實相反，用過去完成式。前面課程學過的 if 條件句與 wish 也屬於假設語氣。這一課補充另外兩種：建議與要求後的 that 子句，以及 as if / as though。"},{"h":"第二步：建議、要求、命令後的 that 子句","p":"表示建議 (suggest, recommend, propose, advise)、要求 (demand, insist, require, request, ask)、命令 (order, command) 的動詞，後面的 that 子句用「(should) + 原形動詞」：The doctor suggested that he (should) quit smoking.。即使主詞是第三人稱單數，也不加 s；過去式的語境中也不改變動詞形式：She demanded that he apologize.。"},{"h":"第三步：形容詞與名詞的相同規則","p":"表示「必要、重要、適當」的形容詞，後面的 that 子句也用 (should) + 原形：It is important that everyone be on time.、It is necessary that he see a doctor.、It is essential that...、It is vital that...、It is a good idea that...。名詞如 suggestion, demand, requirement, recommendation 之後的同位語子句也遵循這個規則：His suggestion that we leave early was accepted.。"},{"h":"第四步：as if / as though 與 It's time","p":"as if / as though 之後，如果與事實相反，現在用過去式，過去用過去完成式：He talks as if he knew everything.（其實不知道）、She looked as if she had seen a ghost.。如果與事實可能相符，就用直說法：It looks as if it is going to rain.。It's (high) time + 過去式，表示「早該…了」：It's time we went home.。would rather + 子句用過去式，表示「寧願別人...」：I'd rather you stayed here.。"}],"pit":{"h":"台灣學習者常見錯誤","p":"1. suggest 之後用 to V：He suggested me to go. 應改成 He suggested that I (should) go.。2. 動詞加 s：The teacher demanded that he hands in the report. 應改成 hand in。3. It is important that he is careful. 若表示建議，應改成 be careful。4. as if 之後用 is：He talks as if he is a boss. 若事實不是，應改成 were。5. wish 與 hope 搞混：I hope I were rich. 應改成 I wish I were rich.。"},"table":{"t":"假設語氣重點","h":["情境","句型","例句"],"r":[["建議、要求、命令","V + that + (should) + 原形","She insisted that he go."],["重要、必要","It is + adj + that + (should) + 原形","It is vital that we act now."],["與現在事實相反","as if + 過去式","He acts as if he were rich."],["與過去事實相反","as if + 過去完成式","He talked as if he had been there."],["早該做","It's time + 過去式","It's time we left."]]},"examples":[["The doctor suggested that she rest for a week.","醫生建議她休息一個星期。"],["I insist that he apologize to her.","我堅持要他向她道歉。"],["The teacher demanded that everyone be quiet.","老師要求每個人安靜。"],["It is essential that you arrive on time.","你準時到達是很重要的。"],["He talks as if he knew everything about music.","他說起話來好像什麼都懂音樂。"],["She looked as if she had seen a ghost.","她看起來好像見到了鬼。"],["It's time we went to bed.","我們早該去睡覺了。"],["I'd rather you didn't smoke here.","我寧願你不要在這裡抽菸。"]],"key":["suggest, insist, demand, order 後的 that 子句用 (should) + 原形。","It is important / necessary / essential that + (should) + 原形。","as if 與事實相反：現在用過去式，過去用過去完成式。","It's time + 過去式；would rather + 過去式。"],"basic":false,"ex":[{"q":"The doctor suggested that he ___ more vegetables.","o":["eat","eats","ate","to eat"],"a":"eat","e":"suggest 之後的 that 子句用原形動詞。"},{"q":"She demanded that he ___ the truth.","o":["tells","told","tell","telling"],
